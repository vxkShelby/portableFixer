name: Release build

# Research G32: the release key's private half exists only as the Actions
# secret PORTABLEFIX_RELEASE_SIGNING_KEY, so a signed release can only be
# built here. Run it by hand (Actions > Release build > Run workflow) on the
# release commit, with the tag; it runs scripts/build.ps1 -Tag exactly as a
# maintainer would, then puts the four assets on a DRAFT release. Nothing
# reaches users until the maintainer has tested the draft's zip and
# published it (README.md, "Release proces").
#
# Three jobs, so that each holds only what it needs:
#   build   - the only job with the signing key (one step) and the only one
#             that runs third-party code (pip, Inno Setup); uploads the four
#             assets as a workflow artifact.
#   attest  - build provenance for the zip and Setup.exe (id-token and
#             attestations: write, nothing else). Runs no build code.
#   publish - downloads the artifact and drafts the release (contents: write).
#             Has no secret and runs nothing but gh and sha256sum.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v1.15.0 (must match portablefix/version.py)"
        required: true

# Nothing by default; every job asks for exactly what it uses.
permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    # Releases come from main only (README.md, "Release proces").
    if: github.ref == 'refs/heads/main'
    runs-on: windows-2025
    timeout-minutes: 60
    permissions:
      # contents: write only so that "The tag is new" sees DRAFT releases
      # (the list hides them from a read-only token); nothing in this job
      # pushes or creates a release.
      contents: write
      # "Tests passed for this commit" reads the Tests workflow's runs.
      actions: read
    # Everything below runs on the machine that later holds the signing key
    # - the single trust root of every client - so third-party code is
    # pinned to what was reviewed: actions by commit SHA (a tag can be moved),
    # Inno Setup by version, the build requirements by version and hash
    # (requirements-build.lock), the runner image and Python by exact label.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          # The job holds the signing key and a contents: write token; no
          # step needs git to push, so the token stays out of .git/config.
          persist-credentials: false

      - name: Tests passed for this commit
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $green = gh run list --repo $env:GITHUB_REPOSITORY --workflow tests.yml --commit $env:GITHUB_SHA --status success --json conclusion --jq length
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::could not list the Tests runs for $env:GITHUB_SHA"; exit 1 }
          if ([int]$green -lt 1) { Write-Host "::error::no successful Tests run for $env:GITHUB_SHA - wait for CI to pass on main"; exit 1 }

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12.10"

      # Every package, transitive ones included, by exact version and hash
      # (requirements-build.lock; how to regenerate it is in its header).
      - name: Install build dependencies
        run: pip install --require-hashes -r requirements-build.lock

      - name: Make sure Inno Setup is installed
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --version=6.7.1 -y --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: The tag is new
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        # Fails closed: an API or network error stops the build instead of
        # reading as "new". The git tag is checked too - gh release create
        # ignores --target for an existing tag, so a stale tag would point
        # at another commit than the one built here.
        run: |
          git ls-remote --exit-code --tags origin "refs/tags/$env:TAG" *> $null
          $code = $LASTEXITCODE
          if ($code -eq 0) { Write-Host "::error::tag $env:TAG already exists"; exit 1 }
          if ($code -ne 2) { Write-Host "::error::git ls-remote failed (exit $code)"; exit 1 }
          # The list, not "gh release view": the by-tag lookup does not see drafts.
          $tags = @(gh api --paginate "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" --jq '.[].tag_name')
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::could not list the releases"; exit 1 }
          if ($tags -contains $env:TAG) { Write-Host "::error::release $env:TAG already exists"; exit 1 }
          exit 0

      # The key is handed to build.ps1 (and so to scripts/sign_release.py)
      # only through the environment; neither ever prints it.
      - name: Build and sign
        shell: powershell
        env:
          PORTABLEFIX_RELEASE_SIGNING_KEY: ${{ secrets.PORTABLEFIX_RELEASE_SIGNING_KEY }}
          TAG: ${{ inputs.tag }}
        run: .\scripts\build.ps1 -Tag $env:TAG

      # Informational, for people: not signed, not read by any client (the
      # updater trusts only the zip's signed .sha256). Same format as that
      # file's first line: lowercase hex, two spaces, name, one LF.
      - name: Checksum the installer
        shell: pwsh
        run: |
          $exe = "Output\PortableFix-Setup.exe"
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $exe).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText("$PWD\$exe.sha256", "$hash  PortableFix-Setup.exe`n")
          python scripts/verify_release.py --setup $exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Only the four release assets leave this job. They share a directory,
      # so the artifact holds them under their bare names.
      - name: Keep the release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: release-assets
          path: |
            Output/PortableFix-Portable.zip
            Output/PortableFix-Portable.zip.sha256
            Output/PortableFix-Setup.exe
            Output/PortableFix-Setup.exe.sha256
          if-no-files-found: error
          retention-days: 7

  attest:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      id-token: write
      attestations: write
    steps:
      - name: Get the release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: release-assets
          path: Output

      # Signed provenance (Sigstore) of the two files people run, tied to this
      # workflow run and commit: verify with
      #   gh attestation verify <file> --repo vxkShelby/portableFixer
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: |
            Output/PortableFix-Portable.zip
            Output/PortableFix-Setup.exe

  publish:
    # A failed attestation stops the draft.
    needs: [build, attest]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Get the release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: release-assets
          path: Output

      - name: Draft the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          cd Output
          # What was built is what is released: the checksums written in the
          # build job must still match the files that crossed the artifact (the
          # zip's is written by PowerShell, hence the CR strip).
          head -n 1 PortableFix-Portable.zip.sha256 | tr -d '\r' | sha256sum -c -
          head -n 1 PortableFix-Setup.exe.sha256 | tr -d '\r' | sha256sum -c -
          [ "$(ls | wc -l)" -eq 4 ]
          gh release create "$TAG" --draft --target "$GITHUB_SHA" --title "$TAG" \
            --notes "Draft - test before publishing (README.md, Release proces)." \
            PortableFix-Portable.zip PortableFix-Portable.zip.sha256 PortableFix-Setup.exe PortableFix-Setup.exe.sha256
