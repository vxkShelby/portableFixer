name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A newer push to the same branch/PR makes the older run moot - cancel it
# instead of letting it hold a runner.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    # The GUI step used to hang until GitHub's 6h job limit (every run on
    # main in Sept 2026 ended "cancelled"), with no hint which test hung.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run non-GUI test suite
        run: python -m pytest tests/ --deselect tests/test_gui_main_window.py --deselect tests/test_executor.py --deselect tests/test_update_spawn_windows.py -q --timeout=300

      # Runs the real powershell.exe under the updater's old and new spawn
      # flags; -s prints each launch's exit code, output size and timing, the
      # evidence behind the auto-update root cause (DETACHED_PROCESS).
      - name: Characterize PowerShell spawn flags
        run: python -m pytest tests/test_update_spawn_windows.py -s -q --timeout=180

      # test_gui_main_window.py and test_executor.py spawn real powershell.exe
      # processes through the same QThread mechanism (portablefix/executor.py).
      # Running many of them in one pytest invocation intermittently crashes
      # with a transient native error (STATUS_STACK_BUFFER_OVERRUN) - not a
      # code defect (see README.md "Vývoj"). Mirror the local workaround: run
      # each test in its own process, retry once if the process crashed
      # instead of reporting a normal pass/fail.
      - name: Run GUI/executor tests individually (crash-workaround)
        shell: pwsh
        run: |
          $ids = python -m pytest tests/test_gui_main_window.py tests/test_executor.py --collect-only -q |
            Select-String "::" | ForEach-Object { $_.Line.Trim() }

          # --timeout: a hung test is killed after 90s and pytest-timeout
          # dumps every thread's stack, so the log shows where it hung
          # instead of the whole job silently running into the 6h limit.
          $failed = @()
          $i = 0
          foreach ($id in $ids) {
            $i++
            $ok = $false
            $lastOutput = ""
            for ($attempt = 1; $attempt -le 2; $attempt++) {
              $lastOutput = python -m pytest $id -q --timeout=90 --timeout-method=thread 2>&1 | Out-String
              # Exit code, not just the text: "1 passed, 1 error" (test body
              # passed, teardown raised - e.g. conftest's unexpected-dialog
              # guard) still matched "1 passed" and was counted as green.
              if ($LASTEXITCODE -eq 0 -and $lastOutput -match "1 passed") {
                $ok = $true
                break
              }
            }
            $status = if ($ok) { "PASS" } else { "FAIL" }
            Write-Host "[$i/$($ids.Count)] $status $id"
            if (-not $ok) {
              Write-Host $lastOutput
              $failed += $id
            }
          }

          if ($failed.Count -gt 0) {
            Write-Host "::error::$($failed.Count) test(s) failed after retry: $($failed -join ', ')"
            exit 1
          }
          Write-Host "All $($ids.Count) GUI/executor tests passed."
