name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A newer push to the same branch/PR makes the older run moot - cancel it
# instead of letting it hold a runner.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

# Unbuffered: pytest-timeout ends a hung run with os._exit, which skips the
# flush, so a buffered stack dump never reached the log.
env:
  PYTHONUNBUFFERED: "1"
  PYTHONFAULTHANDLER: "1"

jobs:
  test:
    runs-on: windows-latest
    # The GUI step used to hang until GitHub's 6h job limit (every run on
    # main in Sept 2026 ended "cancelled"), with no hint which test hung.
    timeout-minutes: 120
    # Pinned by commit SHA like release.yml, so the same reviewed code runs.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run non-GUI test suite
        run: python -m pytest tests/ --deselect tests/test_gui_main_window.py --deselect tests/test_gui_target_user.py --deselect tests/test_executor.py --deselect tests/test_update_spawn_windows.py --deselect tests/test_frozen_update_e2e.py -q --timeout=300

      # Runs the real powershell.exe under the updater's old and new spawn
      # flags; -s prints each launch's exit code, output size and timing, the
      # evidence behind the auto-update root cause (DETACHED_PROCESS). Then
      # the real hand-off end to end: hostile paths, an app started in App\,
      # and a kill-on-close Job Object.
      - name: Real PowerShell spawn and update hand-off
        run: python -m pytest tests/test_update_spawn_windows.py -s -q --timeout=180

      # test_gui_main_window.py, test_gui_target_user.py and test_executor.py
      # spawn real powershell.exe processes through the same QThread
      # mechanism (portablefix/executor.py).
      # Running many of them in one pytest invocation intermittently crashes
      # with a transient native error (STATUS_STACK_BUFFER_OVERRUN) - not a
      # code defect (see README.md "Vývoj"). Mirror the local workaround: run
      # each test in its own process, retry once only if the process crashed
      # (a plain test failure fails on its first try).
      - name: Run GUI/executor tests individually (crash-workaround)
        shell: pwsh
        run: |
          $collect = python -m pytest tests/test_gui_main_window.py tests/test_gui_target_user.py tests/test_executor.py --collect-only -q 2>&1
          if ($LASTEXITCODE -ne 0) {
            Write-Host ($collect | Out-String)
            Write-Host "::error::collecting the GUI/executor tests failed (exit $LASTEXITCODE)"
            exit 1
          }
          $ids = @($collect | ForEach-Object { "$_".Trim() } | Where-Object { $_ -match '^tests/.+\.py::' })
          # 90% of the 336 collected when this was set: a broken or partial
          # collection must not pass as "All 0 tests passed". Raise it as
          # tests are added.
          $minIds = 302
          if ($ids.Count -lt $minIds) {
            Write-Host "::error::only $($ids.Count) GUI/executor tests collected, expected at least $minIds"
            exit 1
          }

          # --timeout: a hung test is killed after 90s and pytest-timeout
          # dumps every thread's stack, so the log shows where it hung
          # instead of the whole job silently running into the 6h limit.
          $failed = @()
          $i = 0
          foreach ($id in $ids) {
            $i++
            $ok = $false
            $firstOutput = ""
            $firstCode = 0
            for ($attempt = 1; $attempt -le 2; $attempt++) {
              $lastOutput = python -m pytest $id -q --timeout=90 --timeout-method=thread -o faulthandler_timeout=80 2>&1 | Out-String
              $code = $LASTEXITCODE
              # Exit code, not just the text: "1 passed, 1 error" (test body
              # passed, teardown raised - e.g. conftest's unexpected-dialog
              # guard) still matched "1 passed" and was counted as green.
              if ($code -eq 0 -and $lastOutput -match "1 passed") {
                $ok = $true
                break
              }
              if ($attempt -eq 1) { $firstOutput = $lastOutput; $firstCode = $code }
              # pytest's own codes are 0-5 (1 = failed, also a hang that
              # pytest-timeout killed); anything else is a native crash, the
              # only case worth a second try.
              if ($code -ge 0 -and $code -le 5) { break }
            }
            $status = if ($ok) { "PASS" } else { "FAIL" }
            Write-Host "[$i/$($ids.Count)] $status $id"
            if (-not $ok) {
              Write-Host $lastOutput
              $failed += $id
            } elseif ($attempt -gt 1) {
              Write-Host "::warning title=Passed only on retry::$id crashed on its first attempt (exit $firstCode); output below"
              Write-Host $firstOutput
            }
          }

          if ($failed.Count -gt 0) {
            Write-Host "::error::$($failed.Count) test(s) failed:$($failed -join ', ')"
            exit 1
          }
          Write-Host "All $($ids.Count) GUI/executor tests passed."

  # A PyInstaller-built probe (tests/frozen/probe_app.py) updates itself from
  # v1 to v2 and v2 relaunches - the one test that covers the frozen app's
  # side of the update: the onefile bootloader parent, the inherited _PYI_*
  # environment and the working directory. A separate job, so its two
  # PyInstaller builds run next to the unit tests instead of after them.
  frozen-update-e2e:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-build.txt -r requirements-dev.txt

      - name: Build probe v1 and v2
        shell: pwsh
        run: |
          foreach ($v in 1, 2) {
            Set-Content -LiteralPath probe_version.txt -Value $v -NoNewline -Encoding ascii
            # Absolute paths: with --specpath, PyInstaller resolves relative
            # --add-data sources against the spec folder.
            python -m PyInstaller --onefile --noconsole --noconfirm --name PortableFix `
              --paths "$PWD" --add-data "$PWD\probe_version.txt;." --hidden-import _cffi_backend `
              --distpath "$PWD\dist$v" --workpath "$PWD\build\probe$v" --specpath "$PWD\build\probe$v" `
              "$PWD\tests\frozen\probe_app.py"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      # The installs go to runner.temp (the work drive, D: on GitHub's
      # Windows images) while TEMP, where the updater's script and logs
      # live, stays on the system drive.
      - name: Frozen self-update end to end
        env:
          PF_E2E_V1: ${{ github.workspace }}\dist1\PortableFix.exe
          PF_E2E_V2: ${{ github.workspace }}\dist2\PortableFix.exe
          PF_E2E_WORKDIR: ${{ runner.temp }}\frozen-e2e
        run: python -m pytest tests/test_frozen_update_e2e.py -m frozen_e2e -s -q --timeout=300
