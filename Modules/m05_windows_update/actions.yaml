module_id: m05_windows_update
category: REPAIR
actions:
  - id: wu_check_services
    label_sk: "Kontrola stavu služieb Windows Update"
    label_en: "Check Windows Update service status"
    risk: SAFE
    command: "Get-Service -Name wuauserv,bits,cryptsvc,msiserver | Select-Object Name,Status,StartType | Format-Table -AutoSize"
    description_sk: "Zobrazí aktuálny stav služieb potrebných pre Windows Update, nič nemení."
    description_en: "Shows the current status of services required by Windows Update, changes nothing."
  - id: wu_stop_services
    label_sk: "Zastavenie služieb Windows Update"
    label_en: "Stop Windows Update services"
    risk: MODERATE
    command: "Stop-Service -Name wuauserv,bits,cryptsvc,msiserver -Force -ErrorAction SilentlyContinue"
    undo_command: "foreach ($svc in 'wuauserv','bits','cryptsvc','msiserver') { try { Start-Service -Name $svc -EA Stop } catch { Write-Output ('Could not restart ' + $svc + ': ' + $_.Exception.Message) } }"
    description_sk: "Dočasne zastaví služby Windows Update pred resetom cache. Potrebné pred ďalším krokom."
    description_en: "Temporarily stops Windows Update services before resetting the cache. Required before the next step."
  - id: wu_reset_cache
    label_sk: "Reset cache Windows Update"
    label_en: "Reset Windows Update cache"
    risk: MODERATE
    command: "function Remove-PfSafe([string]$Path) { $n = 0; $i = Get-Item -LiteralPath $Path -Force -EA SilentlyContinue; if (-not $i) { return $n }; $ro = [IO.FileAttributes]::ReadOnly; $rp = [IO.FileAttributes]::ReparsePoint; $dir = [IO.FileAttributes]::Directory; $dirs = New-Object System.Collections.Generic.List[string]; $todo = New-Object System.Collections.Generic.Stack[string]; $todo.Push($i.FullName); while ($todo.Count -gt 0) { $p = $todo.Pop(); try { $a = [IO.File]::GetAttributes($p) } catch [IO.FileNotFoundException], [IO.DirectoryNotFoundException] { continue } catch { $n++; continue }; if (($a -band $dir) -and -not ($a -band $rp)) { $dirs.Add($p); try { foreach ($c in [IO.Directory]::GetFileSystemEntries($p)) { $todo.Push($c) } } catch { $n++ }; continue }; try { if ($a -band $rp) { if ($a -band $dir) { [IO.Directory]::Delete($p) } else { [IO.File]::Delete($p) } } else { if ($a -band $ro) { [IO.File]::SetAttributes($p, ($a -bxor $ro)) }; [IO.File]::Delete($p) } } catch { $n++ } }; for ($k = $dirs.Count - 1; $k -ge 0; $k--) { $d = $dirs[$k]; try { $a = [IO.File]::GetAttributes($d); if (($a -band $ro) -and -not ($a -band $rp)) { [IO.File]::SetAttributes($d, ($a -bxor $ro)) }; [IO.Directory]::Delete($d) } catch [IO.FileNotFoundException], [IO.DirectoryNotFoundException] { } catch { $left = 1; try { $left = @([IO.Directory]::GetFileSystemEntries($d)).Count } catch { }; if ($left -eq 0) { $n++ } } }; return $n }; if (Test-Path \"$env:WINDIR\\SoftwareDistribution\") { if (Test-Path \"$env:WINDIR\\SoftwareDistribution.bak\") { $null = Remove-PfSafe \"$env:WINDIR\\SoftwareDistribution.bak\" }; Rename-Item -Path \"$env:WINDIR\\SoftwareDistribution\" -NewName \"SoftwareDistribution.bak\" -Force -ErrorAction SilentlyContinue }; if (Test-Path \"$env:WINDIR\\System32\\catroot2\") { if (Test-Path \"$env:WINDIR\\System32\\catroot2.bak\") { $null = Remove-PfSafe \"$env:WINDIR\\System32\\catroot2.bak\" }; Rename-Item -Path \"$env:WINDIR\\System32\\catroot2\" -NewName \"catroot2.bak\" -Force -ErrorAction SilentlyContinue }; $sdOk = -not (Test-Path \"$env:WINDIR\\SoftwareDistribution\"); $crOk = -not (Test-Path \"$env:WINDIR\\System32\\catroot2\"); if ($sdOk -and $crOk) { Write-Output 'SoftwareDistribution and catroot2 reset.' } else { Write-Output ('WARNING: ' + $(if (-not $sdOk) { 'SoftwareDistribution still in use, not reset. ' } else { '' }) + $(if (-not $crOk) { 'catroot2 still in use, not reset. ' } else { '' }) + 'Run \"Stop Windows Update services\" first (needs administrator), then retry.'); exit 1 }"
    undo_command: "if ((Test-Path \"$env:WINDIR\\SoftwareDistribution.bak\") -and -not (Test-Path \"$env:WINDIR\\SoftwareDistribution\")) { Rename-Item -Path \"$env:WINDIR\\SoftwareDistribution.bak\" -NewName \"SoftwareDistribution\" -Force }; if ((Test-Path \"$env:WINDIR\\System32\\catroot2.bak\") -and -not (Test-Path \"$env:WINDIR\\System32\\catroot2\")) { Rename-Item -Path \"$env:WINDIR\\System32\\catroot2.bak\" -NewName \"catroot2\" -Force }"
    description_sk: "Premenuje priečinky SoftwareDistribution a catroot2 na .bak; Windows si pri ďalšom spustení služieb vytvorí nové. Undo funguje spoľahlivo, len ak sa medzitým nespustil krok 'Reštart služieb Windows Update'."
    description_en: "Renames the SoftwareDistribution and catroot2 folders to .bak; Windows recreates them fresh when services restart. Undo only works reliably if the Restart Windows Update services step hasn't run yet."
  - id: wu_restart_services
    label_sk: "Reštart služieb Windows Update"
    label_en: "Restart Windows Update services"
    risk: SAFE
    command: "Start-Service -Name wuauserv,bits,cryptsvc,msiserver -ErrorAction SilentlyContinue"
    description_sk: "Po resete cache znovu spustí služby Windows Update."
    description_en: "Starts Windows Update services back up after the cache reset."
  - id: wu_reregister_dlls
    label_sk: "Opätovná registrácia DLL knižníc Windows Update"
    label_en: "Re-register Windows Update DLL libraries"
    risk: MODERATE
    command: "$dlls = @('atl.dll','urlmon.dll','mshtml.dll','shdocvw.dll','browseui.dll','jscript.dll','vbscript.dll','scrrun.dll','msxml.dll','msxml3.dll','msxml6.dll','actxprxy.dll','softpub.dll','wintrust.dll','dssenh.dll','rsaenh.dll','gpkcsp.dll','sccbase.dll','slbcsp.dll','cryptdlg.dll','oleaut32.dll','ole32.dll','shell32.dll','initpki.dll','wuapi.dll','wuaueng.dll','wucltui.dll','wups.dll','wups2.dll','wuwebv.dll'); $ok = 0; $missing = 0; $noEntry = 0; $failed = @(); foreach ($dll in $dlls) { $p = \"$env:WINDIR\\System32\\$dll\"; if (-not (Test-Path $p)) { $missing++; continue }; $r = Start-Process -FilePath \"$env:WINDIR\\System32\\regsvr32.exe\" -ArgumentList '/s', ('\"' + $p + '\"') -Wait -PassThru -WindowStyle Hidden; if ($r.ExitCode -eq 0) { $ok++ } elseif ($r.ExitCode -eq 4) { $noEntry++ } else { $failed += ($dll + ' (exit ' + $r.ExitCode + ')') } }; Write-Output ('Re-registered: ' + $ok + '; not present on this Windows (skipped): ' + $missing + '; no DllRegisterServer entry point (skipped): ' + $noEntry + '; failed: ' + $failed.Count); if ($failed.Count -gt 0) { Write-Output ('Failed: ' + ($failed -join ', ')); exit 1 }"
    description_sk: "Znovu zaregistruje systémové DLL knižnice súvisiace s Windows Update. V novších verziách Windows často nie je potrebné, pomáha pri starších/poškodených inštaláciách."
    description_en: "Re-registers system DLLs related to Windows Update. Often unnecessary on modern Windows, helps with older/corrupted installations."
  - id: wu_trigger_detection
    label_sk: "Spustenie detekcie aktualizácií"
    label_en: "Trigger update detection"
    risk: SAFE
    command: "UsoClient.exe StartScan"
    description_sk: "Spustí kontrolu dostupných aktualizácií na pozadí."
    description_en: "Starts a background scan for available updates."
  - id: wu_driver_updates_report
    label_sk: "Kontrola aktualizácií ovládačov (Windows Update)"
    label_en: "Check for driver updates (Windows Update)"
    risk: SAFE
    command: "try { $session = New-Object -ComObject Microsoft.Update.Session; $searcher = $session.CreateUpdateSearcher(); $result = $searcher.Search(\"IsInstalled=0 and Type='Driver'\"); if ($result.Updates.Count -eq 0) { Write-Output 'No pending driver updates found via Windows Update.' } else { foreach ($u in $result.Updates) { Write-Output $u.Title } } } catch { Write-Output ('Could not check for driver updates: ' + $_.Exception.Message); exit 1 }"
    inactivity_timeout_sec: 600
    description_sk: "Cez Windows Update Agent (COM API) skontroluje, či sú k dispozícii aktualizácie typu Driver. Vyhľadávanie v Microsoft Update môže trvať niekoľko minút. Nič nemení."
    description_en: "Uses the Windows Update Agent (COM API) to check for pending Driver-type updates. Searching against Microsoft Update can take several minutes. Changes nothing."
  # G29 (docs/research/research-competitors-2026.md). Consumer ESU state:
  # ESUEligibility / ESUEligibilityResult under ...\Windows NT\CurrentVersion\
  # Windows\ConsumerESU, value names as decoded by abbodi1406/ConsumerESU
  # (Consumer_ESU_Enrollment.ps1, branch master) - the only public decoding,
  # anything outside it prints as Unknown. That script reads HKCU only; the
  # same names under HKLM are not publicly documented, so they are only
  # shown (decoded the same way) and count when present. The last
  # cumulative update is dated from the servicing stack
  # (Package_for_RollupFix* with CurrentState 112 = installed,
  # InstallTimeHigh/Low FILETIME) - no KB titles or Get-HotFix dates, which
  # are localized or often empty; the fallback is the WUA
  # history filtered by the Security Updates category GUID. HKCU is the hive
  # of the user PortableFix runs as, so a console user different from
  # whoami is called out. The ESU end date is printed as data.
  - id: os_win10_esu_status
    label_sk: "Windows 10 ESU - stav a verdikt"
    label_en: "Windows 10 ESU - status and verdict"
    risk: SAFE
    command: "$cvk = 'HKLM:\\SOFTWARE\\Microsoft\\Windows NT\\CurrentVersion'; $cv = Get-ItemProperty -LiteralPath $cvk -EA SilentlyContinue; if (-not $cv) { Write-Output ('Could not read ' + $cvk + ' - the Windows build is unknown.'); exit 1 }; $build = 0; [void][int]::TryParse([string]$cv.CurrentBuildNumber, [ref]$build); $ed = [string]$cv.EditionID; Write-Output ('Windows build: ' + $build + '.' + [string]$cv.UBR + ' (EditionID ' + $ed + ', DisplayVersion ' + [string]$cv.DisplayVersion + ', InstallationType ' + [string]$cv.InstallationType + ')'); $now = [DateTime]::UtcNow; $cu = $null; $cuSrc = ''; $pk = 'HKLM:\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Component Based Servicing\\Packages'; foreach ($p in @(Get-ChildItem -LiteralPath $pk -EA SilentlyContinue | Where-Object { $_.PSChildName -like 'Package_for_RollupFix*' })) { $pp = Get-ItemProperty -LiteralPath $p.PSPath -EA SilentlyContinue; if ($pp -and ([string]$pp.CurrentState -eq '112') -and ($null -ne $pp.InstallTimeHigh) -and ($null -ne $pp.InstallTimeLow)) { $t = [DateTime]::FromFileTimeUtc(([int64]$pp.InstallTimeHigh -shl 32) -bor ([int64]$pp.InstallTimeLow -band 4294967295)); if (($null -eq $cu) -or ($t -gt $cu)) { $cu = $t; $cuSrc = 'servicing package ' + $p.PSChildName } } }; if ($null -eq $cu) { try { $s = (New-Object -ComObject Microsoft.Update.Session).CreateUpdateSearcher(); $hc = $s.GetTotalHistoryCount(); if ($hc -gt 0) { foreach ($h in @($s.QueryHistory(0, $hc))) { if (($h.Operation -eq 1) -and (($h.ResultCode -eq 2) -or ($h.ResultCode -eq 3))) { $sec = $false; foreach ($c in @($h.Categories)) { if ([string]$c.CategoryID -eq '0fa1201d-4330-4fa8-8ae9-b877473b6441') { $sec = $true } }; if ($sec) { $t = [DateTime]$h.Date; if (($null -eq $cu) -or ($t -gt $cu)) { $cu = $t; $cuSrc = 'Windows Update history (security update)' } } } } } } catch { } }; $age = $null; $patch = 'unknown'; if ($null -ne $cu) { $age = [int][Math]::Floor(($now - $cu).TotalDays); if ($age -gt 45) { $patch = 'unpatched' } else { $patch = 'patched' }; Write-Output ('Last cumulative update installed: ' + $cu.ToString('yyyy-MM-dd', [Globalization.CultureInfo]::InvariantCulture) + ' (' + $age + ' days ago; source: ' + $cuSrc + '; more than 45 days = unpatched)') } else { Write-Output 'Last cumulative update installed: unknown (no installed RollupFix servicing package and no security update in the Windows Update history).' }; $op = @(); $svc = Get-Service -Name '0patchservice' -EA SilentlyContinue; if ($svc) { $op += ('service 0patchservice (' + [string]$svc.Status + ')') }; foreach ($uk in 'HKLM:\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Uninstall', 'HKLM:\\SOFTWARE\\WOW6432Node\\Microsoft\\Windows\\CurrentVersion\\Uninstall') { foreach ($u in @(Get-ChildItem -LiteralPath $uk -EA SilentlyContinue)) { $dn = [string](Get-ItemProperty -LiteralPath $u.PSPath -EA SilentlyContinue).DisplayName; if ($dn -like '0patch*') { $op += ('installed program ' + $dn) } } }; if ($op.Count) { Write-Output ('0patch agent: installed - ' + ($op -join ', ') + '. Its micropatches cover selected vulnerabilities only; they do not replace Windows updates.') } else { Write-Output '0patch agent: not installed.' }; if ([string]$cv.InstallationType -eq 'Server') { Write-Output 'VERDICT: NOT APPLICABLE - Windows Server: Windows 10 Consumer ESU does not apply (servers follow their own lifecycle).'; exit 0 }; if ($build -ge 22000) { Write-Output ('VERDICT: NOT APPLICABLE - Windows 11 (build ' + $build + '): Windows 10 ESU does not apply.' + $(if ($patch -eq 'unpatched') { ' WARNING: the last cumulative update is ' + $age + ' days old - run Windows Update.' } else { '' })); exit 0 }; if ($build -lt 10240) { Write-Output ('VERDICT: NOT APPLICABLE - build ' + $build + ' is not Windows 10.'); exit 0 }; if ($ed -match '^(IoT)?EnterpriseS') { Write-Output ('VERDICT: NOT APPLICABLE - Windows 10 LTSC/LTSB edition (' + $ed + ') follows its own support lifecycle; Consumer ESU does not apply.' + $(if ($patch -eq 'unpatched') { ' WARNING: the last cumulative update is ' + $age + ' days old - run Windows Update.' } else { '' })); exit 0 }; $wu = $null; try { $wu = @(whoami /user /fo csv /nh 2>$null | ConvertFrom-Csv -Header Name, Sid)[0] } catch { }; $ia = ''; try { $ia = [string](Get-CimInstance -ClassName Win32_ComputerSystem -EA Stop).UserName } catch { }; if ($wu -and $wu.Sid) { Write-Output ('HKCU = registry hive of ' + $wu.Name + ' (' + $wu.Sid + ') - the user PortableFix runs as.') } else { Write-Output 'HKCU = registry hive of the user PortableFix runs as (whoami failed, name unknown).' }; if ($ia -and $wu -and $wu.Name -and ($ia -ne $wu.Name)) { Write-Output ('WARNING: the signed-in user is ' + $ia + ', but PortableFix runs as ' + $wu.Name + ' (elevated with another account) - HKCU here is NOT the signed-in user''s hive.') }; $dll = Join-Path $env:SystemRoot 'System32\\ConsumerESUMgr.dll'; if (Test-Path -LiteralPath $dll) { Write-Output 'Consumer ESU component (ConsumerESUMgr.dll): present.' } else { Write-Output 'Consumer ESU component (ConsumerESUMgr.dll): missing - the enrollment wizard arrives with a current Windows 10 22H2 cumulative update.' }; $eeN = @{ 0 = 'Unknown'; 1 = 'Ineligible'; 2 = 'Eligible (not enrolled)'; 3 = 'DeviceEnrolled'; 4 = 'ReEnrollReq (enrollment must be renewed)'; 5 = 'MSAEnrolled (enrolled with a Microsoft account)'; 6 = 'ConsumerESUInactive'; 7 = 'CommercialMigratedDevice'; 8 = 'LoginWithPrimaryAccountToEnroll'; 9 = 'LoginWithPrimaryAccountToCompletePreOrder'; 10 = 'ComingSoon'; 11 = 'EEAFreeMSAEnrolled'; 12 = 'EEAPaidMSAEnrolled'; 13 = 'WarnInactiveMSA (Microsoft account inactive)'; 14 = 'ReEnrollReqInactiveMSA (renew, Microsoft account inactive)' }; $erN = @{ 1 = 'SUCCESS'; 2 = 'CONSUMER_ESU_PROGRAM_NOT_ACTIVE'; 3 = 'NON_CONSUMER_DEVICE'; 4 = 'COMMERCIAL_DEVICE'; 5 = 'NON_ADMIN'; 6 = 'CHILD_ACCOUNT'; 7 = 'REGION_IN_EMBARGOED_COUNTRY'; 8 = 'AZURE_DEVICE'; 9 = 'COMMERCIAL_MIGRATED_DEVICE'; 10 = 'LOGIN_WITH_PRIMARY_ACCOUNT_TO_COMPLETE_PREORDER'; 11 = 'CONSUMER_ESU_FEATURE_DISABLED'; 12 = 'KEY_BASED_ESU'; 13 = 'EEA_REGION_POLICY_ENABLED'; 14 = 'WARN_INACTIVE_MSA'; 15 = 'REENROLL_REQ_INACTIVE_MSA' }; $enrolled = $false; $renew = $false; $keyBased = $false; foreach ($hk in 'HKCU:\\Software\\Microsoft\\Windows NT\\CurrentVersion\\Windows\\ConsumerESU', 'HKLM:\\SOFTWARE\\Microsoft\\Windows NT\\CurrentVersion\\Windows\\ConsumerESU') { $v = Get-ItemProperty -LiteralPath $hk -EA SilentlyContinue; $txt = @(); foreach ($pair in @(@('ESUEligibility', $eeN), @('ESUEligibilityResult', $erN))) { $raw = $null; if ($v) { $raw = $v.($pair[0]) }; $n = -1; if ($null -eq $raw) { $txt += ($pair[0] + ' = not set') } elseif ([int]::TryParse([string]$raw, [ref]$n) -and $pair[1].ContainsKey($n)) { $txt += ($pair[0] + ' = ' + $n + ' ' + $pair[1][$n]) } else { $txt += ($pair[0] + ' = ' + [string]$raw + ' Unknown') }; if ($pair[0] -eq 'ESUEligibility') { if (@(3, 5, 11, 12) -contains $n) { $enrolled = $true }; if (@(4, 14) -contains $n) { $renew = $true } } elseif ($n -eq 12) { $keyBased = $true } }; Write-Output ($hk + ': ' + ($txt -join ', ')) }; $ageTxt = $(if ($null -ne $age) { [string]$age + ' days' } else { 'an unknown time' }); if ($renew -and -not $enrolled) { $vd = 'ACTION NEEDED - the Consumer ESU enrollment must be renewed: sign in with the Microsoft account used for enrollment and open Settings > Windows Update. Last cumulative update: ' + $ageTxt + ' ago.' } elseif ($enrolled -and ($patch -eq 'patched')) { $vd = 'OK - enrolled in Consumer ESU and patched (last cumulative update ' + $ageTxt + ' ago).' } elseif ($enrolled -and ($patch -eq 'unpatched')) { $vd = 'ACTION NEEDED - enrolled in Consumer ESU, but the last cumulative update is ' + $ageTxt + ' old: run Windows Update.' } elseif ($enrolled) { $vd = 'CHECK - enrolled in Consumer ESU, but the date of the last cumulative update could not be read.' } elseif ($patch -eq 'patched') { $vd = 'PATCHED - no Consumer ESU enrollment recorded here, yet the last cumulative update is only ' + $ageTxt + ' old' + $(if ($keyBased) { ' (key-based ESU reported).' } else { ' (commercial/key-based ESU, or the state is stored for another user).' }) } elseif ($patch -eq 'unpatched') { $vd = 'UNPATCHED - Windows 10 without an ESU enrollment and the last cumulative update is ' + $ageTxt + ' old: this PC no longer gets security fixes.' } else { $vd = 'UNKNOWN - no Consumer ESU enrollment recorded here and the date of the last cumulative update could not be read.' }; Write-Output ('VERDICT: ' + $vd); if ($build -lt 19045) { Write-Output ('Note: ESU needs Windows 10 22H2 (build 19045); this PC runs build ' + $build + ' - install the 22H2 feature update first.') }; Write-Output 'Consumer ESU end date (Microsoft): 2026-10-13.'; Write-Output 'Options: 1) upgrade to Windows 11 if the hardware qualifies (TPM 2.0, Secure Boot, supported CPU); 2) Extended Security Updates - Consumer ESU until 2026-10-13, commercial ESU for organisations; 3) a new PC.'"
    description_sk: "Na Windows 10 zistí stav zápisu do programu Consumer ESU (rozšírené bezpečnostné aktualizácie - hodnoty ESUEligibility a ESUEligibilityResult v HKCU aj HKLM), vek poslednej kumulatívnej aktualizácie (viac ako 45 dní = nezáplatované), či je nainštalovaný agent 0patch a presný build s UBR. Na konci vypíše verdikt a možnosti: upgrade na Windows 11, ESU (Consumer ESU podľa Microsoftu končí 13. 10. 2026) alebo nový počítač. Na Windows 11 oznámi, že ESU sa ho netýka. HKCU patrí používateľovi, pod ktorým PortableFix beží - ak sa technik prihlásil ako administrátor vlastným účtom, akcia upozorní, že hodnoty nie sú zákazníkove. Nič nemení."
    description_en: "On Windows 10, reads the Consumer ESU (Extended Security Updates) enrollment state - the ESUEligibility and ESUEligibilityResult values in both HKCU and HKLM - the age of the last cumulative update (more than 45 days = unpatched), whether the 0patch agent is installed, and the exact build with UBR. Ends with a verdict and the options: upgrade to Windows 11, ESU (Consumer ESU ends on 2026-10-13 per Microsoft) or a new PC. On Windows 11 it says that ESU does not apply. HKCU belongs to the user PortableFix runs as - if the technician elevated with their own admin account, the action warns that the values are not the customer's. Changes nothing."
  - id: wu_uninstall_last_update
    label_sk: "Odinštalovanie poslednej aktualizácie"
    label_en: "Uninstall last update"
    risk: REQUIRES_REBOOT
    # The uninstall is pending until a restart - DISM/SFC/WU work after it
    # would run against a half-removed update (CBS "pending" errors).
    restart_before_next: true
    command: "try { $session = New-Object -ComObject Microsoft.Update.Session; $searcher = $session.CreateUpdateSearcher(); $count = $searcher.GetTotalHistoryCount(); if ($count -eq 0) { Write-Output 'No Windows Update history found.'; exit 1 }; $latest = $searcher.QueryHistory(0, $count) | Where-Object { $_.Operation -eq 1 -and $_.ResultCode -eq 2 } | Sort-Object Date -Descending | Select-Object -First 1; if (-not $latest) { Write-Output 'No successful update installs found in history.'; exit 1 }; if ($latest.Title -notmatch 'KB(\\d+)') { Write-Output ('Most recent update (' + $latest.Title + ') has no KB number - cannot uninstall via wusa.'); exit 1 }; $kb = $matches[1]; $out = & wusa.exe /uninstall /kb:$kb /quiet /norestart 2>&1; $exitCode = $LASTEXITCODE; if ($exitCode -eq 0 -or $exitCode -eq 3010) { Write-Output ('Uninstall of KB' + $kb + ' started (exit code ' + $exitCode + '). Restart required to finish.') } else { Write-Output ('Failed to uninstall KB' + $kb + ' - exit code ' + $exitCode); exit 1 } } catch { Write-Output ('Could not determine most recent update: ' + $_.Exception.Message); exit 1 }"
    inactivity_timeout_sec: 300
    description_sk: "Nájde naposledy nainštalovaný hotfix (KB) a odinštaluje ho cez wusa.exe /uninstall - štandardný krok, ak nedávna aktualizácia niečo pokazila. Na dokončenie vyžaduje reštart. Bez undo (konkrétnu aktualizáciu KB nemožno automaticky znovu nainštalovať)."
    description_en: "Finds the most recently installed hotfix (KB) and uninstalls it via wusa.exe /uninstall - a standard troubleshooting step when a recent update broke something. Requires a restart to finish. No undo (can't automatically reinstall a specific KB)."
