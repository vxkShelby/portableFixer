module_id: m23_antivirus
category: ANTIVIRUS
actions:
  - id: sec_defender_status
    label_sk: "Stav Windows Defender"
    label_en: "Windows Defender status"
    risk: SAFE
    command: "Get-MpComputerStatus | Select-Object AMServiceEnabled,RealTimeProtectionEnabled,AntivirusEnabled,AntivirusSignatureLastUpdated,QuickScanAge,FullScanAge | Format-List"
    description_sk: "Zobrazí stav ochrany Defenderu a vek definícií, nič nemení. Podrobnejší prehľad s históriou hrozieb a verdiktom dáva akcia „História hrozieb Defenderu“."
    description_en: "Shows Defender protection status and signature age, changes nothing. \"Defender threat history\" gives a fuller view with past detections and a verdict."

  # G08. Every Defender action below reads Get-MpComputerStatus first and
  # decides from AMRunningMode (a fixed value such as "Normal" or "Passive
  # Mode", not display text) plus the AMServiceEnabled/AntivirusEnabled
  # flags. When another antivirus has switched Defender off the cmdlets
  # throw instead - reported with the error id and HRESULT, exit 2. The
  # scans and the PUA change refuse a Defender that is only passive (exit
  # 3); the history still reports it, with a NOT ACTIVE verdict. Exception
  # messages are printed for the technician but never matched.
  - id: sec_defender_threat_history
    label_sk: "História hrozieb Defenderu"
    label_en: "Defender threat history"
    risk: SAFE
    command: "try { $st = Get-MpComputerStatus -EA Stop } catch { Write-Output ('Microsoft Defender is not available: Get-MpComputerStatus failed (' + $_.FullyQualifiedErrorId + ', HRESULT 0x' + ('{0:X8}' -f $_.Exception.HResult) + '). Another antivirus has most likely taken over and switched Defender off, or the Defender service is disabled.'); Write-Output 'VERDICT: NOT AVAILABLE - Microsoft Defender does not answer; another antivirus should be protecting this PC - check that one instead.'; exit 2 }; $mode = [string]$st.AMRunningMode; $active = [bool]$st.AMServiceEnabled -and [bool]$st.AntivirusEnabled -and (($mode -eq '') -or ($mode -eq 'Normal')); $modeText = $(if ($mode) { $mode } else { 'not reported by this Windows version' }); $inv = [Globalization.CultureInfo]::InvariantCulture; function Get-PfName($map, $id) { if ($null -eq $id) { return 'unknown' }; if ($map.ContainsKey([int]$id)) { return $map[[int]$id] }; return ('ID ' + $id) }; function Get-PfAge($days) { if ($null -eq $days -or [double]$days -ge 65535) { return 'never' }; return ([string]$days + ' day(s) ago') }; $sevMap = @{ 0 = 'unknown'; 1 = 'low'; 2 = 'moderate'; 4 = 'high'; 5 = 'severe' }; $statusMap = @{ 0 = 'unknown'; 1 = 'detected'; 2 = 'cleaned'; 3 = 'quarantined'; 4 = 'removed'; 5 = 'allowed'; 6 = 'blocked'; 102 = 'quarantine failed'; 103 = 'remove failed'; 104 = 'allow failed'; 105 = 'abandoned'; 107 = 'block failed' }; $actionMap = @{ 0 = 'unknown'; 1 = 'clean'; 2 = 'quarantine'; 3 = 'remove'; 6 = 'allow'; 8 = 'user defined'; 9 = 'no action'; 10 = 'block' }; $unresolvedIds = @(1, 102, 103, 104, 105, 107); Write-Output '--- Protection state ---'; Write-Output ('Running mode (AMRunningMode): ' + $modeText); Write-Output ('Defender service / antivirus enabled: ' + [bool]$st.AMServiceEnabled + ' / ' + [bool]$st.AntivirusEnabled); Write-Output ('Real-time protection: ' + $(if ($st.RealTimeProtectionEnabled) { 'on' } else { 'OFF' })); Write-Output ('Tamper protection: ' + $(if ($null -eq $st.IsTamperProtected) { 'not reported by this Windows version' } elseif ($st.IsTamperProtected) { 'on' } else { 'OFF' })); $sigAge = $st.AntivirusSignatureAge; Write-Output ('Signatures: ' + $st.AntivirusSignatureVersion + ', updated ' + (Get-PfAge $sigAge) + $(if ($st.AntivirusSignatureLastUpdated) { ' (' + ([datetime]$st.AntivirusSignatureLastUpdated).ToString('yyyy-MM-dd HH:mm', $inv) + ')' } else { '' })); Write-Output ('Engine / product version: ' + $st.AMEngineVersion + ' / ' + $st.AMProductVersion); Write-Output ('Last quick scan: ' + (Get-PfAge $st.QuickScanAge) + '; last full scan: ' + (Get-PfAge $st.FullScanAge)); $now = Get-Date; $since90 = $now.AddDays(-90); $since30 = $now.AddDays(-30); $threats = @{}; $historyError = ''; try { foreach ($t in @(Get-MpThreat -EA Stop)) { if ($null -ne $t) { $threats[[string]$t.ThreatID] = $t } } } catch { $historyError = 'Get-MpThreat: ' + $_.FullyQualifiedErrorId + ', HRESULT 0x' + ('{0:X8}' -f $_.Exception.HResult) }; $det = @(); try { $det = @(Get-MpThreatDetection -EA Stop | Where-Object { $null -ne $_ -and $_.InitialDetectionTime -ge $since90 } | Sort-Object InitialDetectionTime -Descending) } catch { $historyError = 'Get-MpThreatDetection: ' + $_.FullyQualifiedErrorId + ', HRESULT 0x' + ('{0:X8}' -f $_.Exception.HResult) }; $count30 = @($det | Where-Object { $_.InitialDetectionTime -ge $since30 }).Count; $unresolved = @($det | Where-Object { $unresolvedIds -contains [int]$_.ThreatStatusID }); $activeThreats = @($threats.Values | Where-Object { $_.IsActive }); Write-Output ''; Write-Output ('--- Threat history (last 90 days): ' + $det.Count + ' detection(s), ' + $count30 + ' in the last 30 days ---'); if ($historyError) { Write-Output ('Could not read the threat history (' + $historyError + ').') } elseif ($det.Count -eq 0) { Write-Output 'No detections in the last 90 days.' }; foreach ($d in @($det | Select-Object -First 50)) { $t = $threats[[string]$d.ThreatID]; $name = $(if ($t -and $t.ThreatName) { $t.ThreatName } else { 'ThreatID ' + $d.ThreatID }); $sev = $(if ($t) { Get-PfName $sevMap $t.SeverityID } else { 'unknown' }); Write-Output (([datetime]$d.InitialDetectionTime).ToString('yyyy-MM-dd HH:mm', $inv) + ' | ' + $name + ' | severity: ' + $sev + ' | status: ' + (Get-PfName $statusMap $d.ThreatStatusID) + ' | action: ' + (Get-PfName $actionMap $d.CleaningActionID) + ' | action succeeded: ' + [bool]$d.ActionSuccess); $res = @($d.Resources | Where-Object { $_ }); foreach ($r in @($res | Select-Object -First 5)) { Write-Output ('    ' + $r) }; if ($res.Count -gt 5) { Write-Output ('    ... and ' + ($res.Count - 5) + ' more') } }; if ($det.Count -gt 50) { Write-Output ('... ' + ($det.Count - 50) + ' older detection(s) not listed.') }; $warnings = @(); if (-not $st.RealTimeProtectionEnabled) { $warnings += 'real-time protection is off' }; if ($null -eq $sigAge -or [double]$sigAge -gt 7) { $warnings += ('signatures are ' + $(if ($null -eq $sigAge -or [double]$sigAge -ge 65535) { 'missing' } else { [string]$sigAge + ' days old' }) + ' (run the signature update)') }; if ($st.IsTamperProtected -eq $false) { $warnings += 'tamper protection is off' }; if ($historyError) { $warnings += 'the threat history could not be read' }; Write-Output ''; $bad = $unresolved.Count + $activeThreats.Count; if (-not $active) { Write-Output ('VERDICT: NOT ACTIVE - Microsoft Defender is not the active antivirus on this PC (AMRunningMode: ' + $modeText + '). Another antivirus should be protecting it - check that one instead.') } elseif ($bad -gt 0) { Write-Output ('VERDICT: ATTENTION - ' + $unresolved.Count + ' detection(s) not remediated and ' + $activeThreats.Count + ' threat(s) still active - run a full scan, or the offline scan for anything that keeps coming back.') } elseif ($warnings.Count -gt 0) { Write-Output ('VERDICT: WARNING - ' + ($warnings -join '; ') + '.') } else { Write-Output ('VERDICT: OK - Defender is active, real-time protection on, signatures current, ' + $det.Count + ' detection(s) in 90 days, all remediated.') }"
    description_sk: "Vypíše, čo Defender našiel za posledných 90 dní (počet aj za 30 dní): názov hrozby, závažnosť, stav, vykonaný zásah, dotknuté súbory a čas. K tomu aktuálny stav ochrany - ochrana v reálnom čase, ochrana pred zmenami (tamper protection), vek definícií, verzie enginu a produktu, posledný rýchly a úplný sken - a verdikt v jednom riadku. Nič nemení."
    description_en: "Lists what Defender found in the last 90 days (with a 30-day count): threat name, severity, status, action taken, affected files and time. Adds the current protection state - real-time protection, tamper protection, signature age, engine and product versions, last quick and full scan - and a one-line verdict. Changes nothing."

  - id: sec_defender_update
    label_sk: "Aktualizácia definícií Defenderu"
    label_en: "Update Defender signatures"
    risk: MODERATE
    changes_system: false  # signatures - Defender keeps its own rollback (MpCmdRun -RemoveDefinitions)
    command: "Update-MpSignature"
    description_sk: "Stiahne najnovšie definície hrozieb pre Windows Defender. Vyžaduje internet."
    description_en: "Downloads the latest threat definitions for Windows Defender. Requires internet access."

  - id: sec_defender_quickscan
    label_sk: "Rýchly sken Defenderom"
    label_en: "Defender quick scan"
    risk: MODERATE
    changes_system: false  # a scan; anything it removes goes to Defender quarantine, restorable there
    command: "Start-MpScan -ScanType QuickScan"
    description_sk: "Spustí rýchly antivírusový sken. Môže trvať niekoľko minút; nájdené hrozby sa presunú do karantény."
    description_en: "Runs a quick antivirus scan. May take several minutes; detected threats are moved to quarantine."

  - id: sec_defender_fullscan
    label_sk: "Úplný sken Defenderom"
    label_en: "Defender full scan"
    risk: MODERATE
    changes_system: false  # a scan; anything it removes goes to Defender quarantine, restorable there
    command: "try { $st = Get-MpComputerStatus -EA Stop } catch { Write-Output ('Microsoft Defender is not available: Get-MpComputerStatus failed (' + $_.FullyQualifiedErrorId + ', HRESULT 0x' + ('{0:X8}' -f $_.Exception.HResult) + '). Another antivirus has most likely taken over and switched Defender off, or the Defender service is disabled.'); exit 2 }; $mode = [string]$st.AMRunningMode; $active = [bool]$st.AMServiceEnabled -and [bool]$st.AntivirusEnabled -and (($mode -eq '') -or ($mode -eq 'Normal')); $modeText = $(if ($mode) { $mode } else { 'not reported by this Windows version' }); if (-not $active) { Write-Output ('Microsoft Defender is not the active antivirus on this PC (AMRunningMode: ' + $modeText + ') - a Defender full scan would not clean anything. Run a full scan with the installed antivirus instead. Nothing was started.'); exit 3 }; $start = Get-Date; Write-Output 'Starting a Microsoft Defender full scan of every file on all fixed drives. It usually takes 1-3 hours, longer on large or slow disks; the PC stays usable meanwhile. Progress is printed every minute.'; try { $job = Start-MpScan -ScanType FullScan -AsJob -EA Stop } catch { Write-Output ('Could not start the full scan (' + $_.FullyQualifiedErrorId + ', HRESULT 0x' + ('{0:X8}' -f $_.Exception.HResult) + '): ' + $_.Exception.Message); exit 1 }; while ($job.State -eq 'NotStarted' -or $job.State -eq 'Running') { Wait-Job -Job $job -Timeout 60 | Out-Null; if ($job.State -eq 'NotStarted' -or $job.State -eq 'Running') { Write-Output ('Full scan still running - ' + [int]((Get-Date) - $start).TotalMinutes + ' min elapsed...') } }; $state = [string]$job.State; $jobError = ''; try { Receive-Job -Job $job -EA Stop | Out-Null } catch { $jobError = ' (' + $_.FullyQualifiedErrorId + ', HRESULT 0x' + ('{0:X8}' -f $_.Exception.HResult) + '): ' + $_.Exception.Message }; Remove-Job -Job $job -Force -EA SilentlyContinue; $minutes = [int]((Get-Date) - $start).TotalMinutes; if ($state -ne 'Completed' -or $jobError) { Write-Output ('The full scan did not finish (job state: ' + $state + ', after ' + $minutes + ' min)' + $jobError); exit 1 }; $found = @(Get-MpThreatDetection -EA SilentlyContinue | Where-Object { $null -ne $_ -and ($_.InitialDetectionTime -ge $start -or $_.LastThreatStatusChangeTime -ge $start) }); $failed = @($found | Where-Object { -not $_.ActionSuccess }); Write-Output ('Full scan finished in ' + $minutes + ' min. Detections during the scan: ' + $found.Count + '.'); if ($failed.Count -gt 0) { Write-Output ('WARNING: ' + $failed.Count + ' detection(s) were NOT remediated - open \"Defender threat history\" for details and consider the Defender Offline scan.') } elseif ($found.Count -gt 0) { Write-Output 'All detections were remediated (quarantined items can be restored in Windows Security > Protection history).' }"
    preview_command: "try { $st = Get-MpComputerStatus -EA Stop } catch { Write-Output ('Microsoft Defender is not available: Get-MpComputerStatus failed (' + $_.FullyQualifiedErrorId + ', HRESULT 0x' + ('{0:X8}' -f $_.Exception.HResult) + '). Another antivirus has most likely taken over and switched Defender off, or the Defender service is disabled.'); exit 2 }; $mode = [string]$st.AMRunningMode; $active = [bool]$st.AMServiceEnabled -and [bool]$st.AntivirusEnabled -and (($mode -eq '') -or ($mode -eq 'Normal')); $modeText = $(if ($mode) { $mode } else { 'not reported by this Windows version' }); $full = $st.FullScanAge; Write-Output ('Last full scan: ' + $(if ($null -eq $full -or [double]$full -ge 65535) { 'never' } else { [string]$full + ' day(s) ago' }) + '.'); if ($active) { Write-Output 'Would start a Microsoft Defender full scan (Start-MpScan -ScanType FullScan) in the background and print progress every minute until it finishes - usually 1-3 hours. Nothing is deleted outright: detections go to Defender quarantine.' } else { Write-Output ('Would refuse: Microsoft Defender is not the active antivirus on this PC (AMRunningMode: ' + $modeText + ').') }"
    # The scan runs as a background job (Start-MpScan -AsJob) and the command
    # prints a heartbeat every 60 s while it waits, so the batch stays alive
    # and the log shows progress. 10 missed heartbeats = hung; a full scan of
    # a large, slow disk can take many hours, hence the 8 h ceiling.
    inactivity_timeout_sec: 600
    hard_cap_sec: 28800
    description_sk: "Spustí úplný sken všetkých súborov na všetkých pevných diskoch. Trvá zvyčajne 1 - 3 hodiny, na veľkých alebo pomalých diskoch aj dlhšie; počítač sa dá medzitým používať a PortableFix každú minútu vypíše priebeh. Nájdené hrozby sa presunú do karantény Defenderu. Ak Defender nie je aktívny antivírus (nahradil ho iný), akcia nič nespustí a skončí chybou."
    description_en: "Runs a full scan of every file on all fixed drives. Usually takes 1-3 hours, longer on large or slow disks; the PC stays usable meanwhile and PortableFix prints progress every minute. Detected threats go to Defender quarantine. If Defender is not the active antivirus (another one replaced it), nothing is started and the action fails."

  - id: sec_defender_exclusions_list
    label_sk: "Výnimky Windows Defenderu"
    label_en: "Windows Defender exclusions"
    risk: SAFE
    command: "try { Get-MpPreference -EA Stop | Select-Object ExclusionPath,ExclusionExtension,ExclusionProcess,ExclusionIpAddress | Format-List } catch { Write-Output 'Could not read Defender preferences (Defender may be disabled by another antivirus).' }"
    description_sk: "Vypíše výnimky Defenderu (cesty, procesy, prípony). Malware sa tam často sám pridáva, aby unikol detekcii. Nič nemení."
    description_en: "Lists Defender exclusions (paths, processes, extensions). Malware often adds itself here to evade detection. Changes nothing."

  - id: hard_defender_clear_exclusions
    label_sk: "Vyčistenie výnimiek Defenderu"
    label_en: "Clear Defender exclusions"
    risk: MODERATE
    command: "$saved = $false; try { $p = Get-MpPreference -EA Stop; $masked = @(@($p.ExclusionPath) + @($p.ExclusionExtension) + @($p.ExclusionProcess) + @($p.ExclusionIpAddress) | Where-Object { $_ -like 'N/A:*' }); if ($masked.Count -gt 0) { Write-Output 'Defender hides the exclusion list from non-administrators (N/A) - this action needs administrator. Nothing was changed and the existing backup was kept.'; exit 1 }; $bk = \"$env:ProgramData\\PortableFix\\defender_exclusions_backup.json\"; New-Item -ItemType Directory -Force -Path (Split-Path $bk) -EA Stop | Out-Null; [PSCustomObject]@{ Path = $p.ExclusionPath; Extension = $p.ExclusionExtension; Process = $p.ExclusionProcess; IpAddress = $p.ExclusionIpAddress } | ConvertTo-Json | Set-Content -Path $bk -Encoding UTF8 -EA Stop; $saved = $true; if ($p.ExclusionPath) { Remove-MpPreference -ExclusionPath $p.ExclusionPath -EA Stop }; if ($p.ExclusionExtension) { Remove-MpPreference -ExclusionExtension $p.ExclusionExtension -EA Stop }; if ($p.ExclusionProcess) { Remove-MpPreference -ExclusionProcess $p.ExclusionProcess -EA Stop }; if ($p.ExclusionIpAddress) { Remove-MpPreference -ExclusionIpAddress $p.ExclusionIpAddress -EA Stop }; $q = Get-MpPreference -EA Stop; $left = @(@($q.ExclusionPath) + @($q.ExclusionExtension) + @($q.ExclusionProcess) + @($q.ExclusionIpAddress) | Where-Object { $_ }); if ($left.Count -gt 0) { Write-Output ('Backup saved to ' + $bk + ', but ' + $left.Count + ' exclusion(s) are still in place (likely enforced by Group Policy/Intune): ' + ($left -join ', ')); exit 1 }; Write-Output 'Defender exclusions cleared (backup saved).' } catch { $msg = 'Could not modify Defender exclusions (Defender may be disabled by another antivirus): ' + $_.Exception.Message; if ($saved) { $msg += ' Backup of the previous exclusions: ' + $bk }; Write-Output $msg; exit 1 }"
    undo_command: "$bk = \"$env:ProgramData\\PortableFix\\defender_exclusions_backup.json\"; if (Test-Path $bk) { try { $b = Get-Content $bk -Raw -EA Stop | ConvertFrom-Json; if ($b.Path) { Add-MpPreference -ExclusionPath $b.Path -EA Stop }; if ($b.Extension) { Add-MpPreference -ExclusionExtension $b.Extension -EA Stop }; if ($b.Process) { Add-MpPreference -ExclusionProcess $b.Process -EA Stop }; if ($b.IpAddress) { Add-MpPreference -ExclusionIpAddress $b.IpAddress -EA Stop }; Write-Output 'Defender exclusions restored from backup.' } catch { Write-Output ('Could not restore Defender exclusions from ' + $bk + ': ' + $_.Exception.Message); exit 1 } } else { Write-Output 'No backup found - nothing to restore.' }"
    description_sk: "Odstráni všetky výnimky Defenderu (možné úkryty malware) po zálohovaní aktuálneho stavu do PortableFix\\defender_exclusions_backup.json - záloha sa prepíše pri každom behu s právami administrátora, takže vždy odráža stav tesne pred posledným vyčistením a undo obnoví práve tento stav. Vyžaduje administrátora (bez neho Defender výnimky skrýva a nič sa nezmení). Výnimky vynútené skupinovou politikou zostanú a akcia sa vtedy ukáže ako neúspešná."
    description_en: "Removes all Defender exclusions (a common malware hiding spot) after backing up the current state to PortableFix\\defender_exclusions_backup.json - the backup is overwritten on every run with administrator rights, so it always reflects the state right before the most recent clear, and undo restores exactly that. Needs administrator (without it Defender hides the exclusions and nothing is changed). Exclusions enforced by Group Policy stay in place and the action is reported as failed."

  - id: hard_defender_pua_enable
    label_sk: "Zapnutie ochrany pred PUA"
    label_en: "Enable PUA protection"
    risk: MODERATE
    # Same backup/undo pattern as the m08 hardening actions: the backup folder
    # is locked down to Administrators/SYSTEM/the current admin first, so a
    # standard user cannot plant a backup the elevated undo would apply. The
    # backup is written only when the value really changes - a second run on
    # an already enabled PC keeps the first run's backup, and undo deletes it
    # once applied so an older backup is never replayed later.
    command: "$me = \"$env:USERDOMAIN\\$env:USERNAME\"; $root = \"$env:ProgramData\\PortableFix\"; New-Item -ItemType Directory -Force -Path $root | Out-Null; icacls $root /inheritance:r /grant:r \"*S-1-5-32-544:(OI)(CI)F\" /grant:r \"*S-1-5-18:(OI)(CI)F\" /grant:r \"${me}:(OI)(CI)F\" | Out-Null; $bk = \"$root\\hard_defender_pua_enable_backup.json\"; $names = @{ 0 = 'Disabled'; 1 = 'Enabled'; 2 = 'AuditMode' }; try { $st = Get-MpComputerStatus -EA Stop } catch { Write-Output ('Microsoft Defender is not available: Get-MpComputerStatus failed (' + $_.FullyQualifiedErrorId + ', HRESULT 0x' + ('{0:X8}' -f $_.Exception.HResult) + '). Another antivirus has most likely taken over and switched Defender off, or the Defender service is disabled.'); exit 2 }; $mode = [string]$st.AMRunningMode; $active = [bool]$st.AMServiceEnabled -and [bool]$st.AntivirusEnabled -and (($mode -eq '') -or ($mode -eq 'Normal')); $modeText = $(if ($mode) { $mode } else { 'not reported by this Windows version' }); if (-not $active) { Write-Output ('Microsoft Defender is not the active antivirus on this PC (AMRunningMode: ' + $modeText + ') - its PUA setting would have no effect. Nothing was changed.'); exit 3 }; try { $prior = [int](Get-MpPreference -EA Stop).PUAProtection; $priorName = $(if ($names.ContainsKey($prior)) { $names[$prior] } else { 'value ' + $prior }); if ($prior -eq 1) { Write-Output 'PUA protection is already enabled - nothing changed (a backup from an earlier PortableFix run, if any, is kept for undo).'; exit 0 }; [PSCustomObject]@{ PUAProtection = $prior } | ConvertTo-Json | Set-Content -Path $bk -Encoding UTF8 -EA Stop; Set-MpPreference -PUAProtection Enabled -EA Stop; $after = [int](Get-MpPreference -EA Stop).PUAProtection; if ($after -ne 1) { Write-Output ('PUA protection is still ' + $(if ($names.ContainsKey($after)) { $names[$after] } else { 'value ' + $after }) + ' after the change - most likely enforced by Group Policy/Intune. Backup of the previous value: ' + $bk); exit 1 }; Write-Output ('PUA protection enabled (was: ' + $priorName + '). Defender now blocks potentially unwanted apps - adware, bundled installers, crypto miners - when they are downloaded or installed.') } catch { Write-Output ('Could not enable PUA protection (needs administrator; ' + $_.FullyQualifiedErrorId + ', HRESULT 0x' + ('{0:X8}' -f $_.Exception.HResult) + '): ' + $_.Exception.Message); exit 1 }"
    undo_command: "$bk = \"$env:ProgramData\\PortableFix\\hard_defender_pua_enable_backup.json\"; $names = @{ 0 = 'Disabled'; 1 = 'Enabled'; 2 = 'AuditMode' }; if (Test-Path $bk) { try { $b = Get-Content $bk -Raw -EA Stop | ConvertFrom-Json; $v = $b.PUAProtection; if (-not ($v -is [int] -or $v -is [long]) -or -not $names.ContainsKey([int]$v)) { Write-Output ('Backup ' + $bk + ' holds no valid PUAProtection value - nothing changed.'); exit 1 }; Set-MpPreference -PUAProtection $names[[int]$v] -EA Stop; Remove-Item -LiteralPath $bk -Force -EA SilentlyContinue; Write-Output ('PUA protection restored to its value before PortableFix enabled it (' + $names[[int]$v] + ').') } catch { Write-Output ('Could not restore PUA protection (needs administrator; ' + $_.FullyQualifiedErrorId + ', HRESULT 0x' + ('{0:X8}' -f $_.Exception.HResult) + '): ' + $_.Exception.Message); exit 1 } } else { Write-Output 'No backup found - nothing changed.' }"
    preview_command: "$names = @{ 0 = 'Disabled'; 1 = 'Enabled'; 2 = 'AuditMode' }; try { $st = Get-MpComputerStatus -EA Stop } catch { Write-Output ('Microsoft Defender is not available: Get-MpComputerStatus failed (' + $_.FullyQualifiedErrorId + ', HRESULT 0x' + ('{0:X8}' -f $_.Exception.HResult) + '). Another antivirus has most likely taken over and switched Defender off, or the Defender service is disabled.'); exit 2 }; $mode = [string]$st.AMRunningMode; $active = [bool]$st.AMServiceEnabled -and [bool]$st.AntivirusEnabled -and (($mode -eq '') -or ($mode -eq 'Normal')); $modeText = $(if ($mode) { $mode } else { 'not reported by this Windows version' }); if (-not $active) { Write-Output ('Would refuse: Microsoft Defender is not the active antivirus on this PC (AMRunningMode: ' + $modeText + ').'); exit 0 }; try { $cur = [int](Get-MpPreference -EA Stop).PUAProtection; $curName = $(if ($names.ContainsKey($cur)) { $names[$cur] } else { 'value ' + $cur }); if ($cur -eq 1) { Write-Output 'PUA protection is already enabled - would change nothing.' } else { Write-Output ('PUA protection is now ' + $curName + ' - would back it up to %ProgramData%\\PortableFix\\hard_defender_pua_enable_backup.json and set it to Enabled (undo restores ' + $curName + ').') } } catch { Write-Output ('Could not read the Defender preferences (' + $_.FullyQualifiedErrorId + ', HRESULT 0x' + ('{0:X8}' -f $_.Exception.HResult) + ').') }"
    description_sk: "Zapne v Defenderi blokovanie potenciálne nechcených aplikácií (PUA - adware, inštalátory s pribalenými programami, ťažiaci softvér). Predošlú hodnotu uloží do PortableFix\\hard_defender_pua_enable_backup.json v %ProgramData% (priečinok prístupný len administrátorom) a undo ju obnoví. Ak bola ochrana už zapnutá, nič nemení. Ak hodnotu vynucuje skupinová politika/Intune, akcia sa ukáže ako neúspešná. Vyžaduje administrátora a aktívny Defender."
    description_en: "Turns on Defender blocking of potentially unwanted applications (PUA - adware, bundled installers, crypto miners). Saves the previous value to PortableFix\\hard_defender_pua_enable_backup.json in %ProgramData% (a folder only administrators can write) and undo restores it. Changes nothing if it was already on. If Group Policy/Intune enforces the value, the action is reported as failed. Needs administrator and Defender as the active antivirus."

  # Last in the catalog on purpose: the batch runs in catalog order, and this
  # one restarts Windows the moment it succeeds - whatever comes after it in
  # the same batch may never run.
  - id: sec_defender_offline_scan
    label_sk: "Offline sken Defenderom (reštart)"
    label_en: "Defender Offline scan (restart)"
    risk: REQUIRES_REBOOT
    exclude_from_select_all: true
    changes_system: false  # a one-time boot into Windows RE for a scan - no lasting change a restore point could undo
    command: "try { $st = Get-MpComputerStatus -EA Stop } catch { Write-Output ('Microsoft Defender is not available: Get-MpComputerStatus failed (' + $_.FullyQualifiedErrorId + ', HRESULT 0x' + ('{0:X8}' -f $_.Exception.HResult) + '). Another antivirus has most likely taken over and switched Defender off, or the Defender service is disabled.'); exit 2 }; $mode = [string]$st.AMRunningMode; $active = [bool]$st.AMServiceEnabled -and [bool]$st.AntivirusEnabled -and (($mode -eq '') -or ($mode -eq 'Normal')); $modeText = $(if ($mode) { $mode } else { 'not reported by this Windows version' }); if (-not $active) { Write-Output ('Microsoft Defender is not the active antivirus on this PC (AMRunningMode: ' + $modeText + ') - Defender Offline needs Defender as the active antivirus. Nothing was started and the PC was not restarted.'); exit 3 }; $arch = $(if ($env:PROCESSOR_ARCHITEW6432) { $env:PROCESSOR_ARCHITEW6432 } else { $env:PROCESSOR_ARCHITECTURE }); if ($arch -eq 'ARM64') { Write-Output 'Microsoft Defender Offline is not supported on ARM64 PCs. Nothing was started and the PC was not restarted.'; exit 4 }; try { Update-MpSignature -EA Stop; Write-Output 'Signatures updated.' } catch { Write-Output ('WARNING: could not update signatures (' + $_.FullyQualifiedErrorId + ', HRESULT 0x' + ('{0:X8}' -f $_.Exception.HResult) + ') - the offline scan uses the ones already installed.') }; try { $bv = Get-BitLockerVolume -MountPoint $env:SystemDrive -EA Stop; if ([int]$bv.ProtectionStatus -eq 1) { $ids = @($bv.KeyProtector | Where-Object { [string]$_.KeyProtectorType -eq 'RecoveryPassword' } | ForEach-Object { [string]$_.KeyProtectorId }); Write-Output ('BitLocker protects ' + $env:SystemDrive + ' - have the recovery key at hand in case the PC asks for it. Recovery key ID: ' + $(if ($ids.Count) { $ids -join ', ' } else { 'no recovery password protector' })) } } catch { }; Write-Output 'WARNING: Windows restarts IMMEDIATELY into Microsoft Defender Offline - unsaved work in open programs is lost. The scan takes about 15 minutes, then Windows starts normally; results are in Windows Security > Protection history (or \"Defender threat history\" in PortableFix).'; try { Start-MpWDOScan -EA Stop } catch { Write-Output ('Could not start Microsoft Defender Offline (' + $_.FullyQualifiedErrorId + ', HRESULT 0x' + ('{0:X8}' -f $_.Exception.HResult) + '): ' + $_.Exception.Message + ' - the PC was not restarted. Defender Offline boots into Windows RE: check \"Recovery environment (WinRE) readiness\" in M15.'); exit 1 }; Write-Output 'Defender Offline scan started - Windows is restarting now.'"
    preview_command: "try { $st = Get-MpComputerStatus -EA Stop } catch { Write-Output ('Microsoft Defender is not available: Get-MpComputerStatus failed (' + $_.FullyQualifiedErrorId + ', HRESULT 0x' + ('{0:X8}' -f $_.Exception.HResult) + '). Another antivirus has most likely taken over and switched Defender off, or the Defender service is disabled.'); exit 2 }; $mode = [string]$st.AMRunningMode; $active = [bool]$st.AMServiceEnabled -and [bool]$st.AntivirusEnabled -and (($mode -eq '') -or ($mode -eq 'Normal')); $modeText = $(if ($mode) { $mode } else { 'not reported by this Windows version' }); $arch = $(if ($env:PROCESSOR_ARCHITEW6432) { $env:PROCESSOR_ARCHITEW6432 } else { $env:PROCESSOR_ARCHITECTURE }); if (-not $active) { Write-Output ('Would refuse: Microsoft Defender is not the active antivirus on this PC (AMRunningMode: ' + $modeText + ').') } elseif ($arch -eq 'ARM64') { Write-Output 'Would refuse: Microsoft Defender Offline is not supported on ARM64 PCs.' } else { Write-Output 'Would update Defender signatures, then RESTART THE PC IMMEDIATELY into Microsoft Defender Offline (about 15 minutes, then Windows starts normally). Save all work before running it for real.' }; try { $bv = Get-BitLockerVolume -MountPoint $env:SystemDrive -EA Stop; if ([int]$bv.ProtectionStatus -eq 1) { Write-Output ('BitLocker protects ' + $env:SystemDrive + ' - have the recovery key at hand.') } } catch { }"
    description_sk: "POZOR: počítač sa OKAMŽITE reštartuje - najprv ulož všetku rozrobenú prácu a zavri programy. Aktualizuje definície a spustí Microsoft Defender Offline: sken mimo bežiaceho Windows (cez Windows RE, asi 15 minút), ktorý nájde aj rootkity skryté pred bežným skenom. Potom sa Windows spustí normálne a výsledky sú v Zabezpečení Windows > História ochrany. Spúšťaj ako poslednú akciu - akcie po nej v tej istej dávke sa už nemusia vykonať a HTML report sa nemusí stihnúť vytvoriť. Ak je disk chránený BitLockerom, vypíše ID kľúča na obnovenie. Potrebuje zapnuté Windows RE (overí to „Pripravenosť prostredia obnovy (WinRE)“ v M15); nefunguje na ARM64 a keď Defender nie je aktívny antivírus. Nie je súčasťou „Vybrať všetko“."
    description_en: "WARNING: the PC restarts IMMEDIATELY - save all open work and close programs first. Updates signatures and starts Microsoft Defender Offline: a scan outside the running Windows (via Windows RE, about 15 minutes) that also finds rootkits hidden from a normal scan. Windows then starts normally and the results are in Windows Security > Protection history. Run it as the last action - actions after it in the same batch may never run and the HTML report may not get written. If the drive is BitLocker-protected, the recovery key ID is printed. Needs Windows RE enabled (checked by \"Recovery environment (WinRE) readiness\" in M15); does not work on ARM64 or when Defender is not the active antivirus. Not included in \"Select all\"."
