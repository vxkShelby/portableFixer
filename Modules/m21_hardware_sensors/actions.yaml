module_id: m21_hardware_sensors
category: REPAIR
actions:
  - id: pawnio_status_report
    label_sk: "Stav ovládača senzorov PawnIO"
    label_en: "PawnIO sensor driver status"
    risk: SAFE
    command: "$k = Get-ItemProperty 'HKLM:\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Uninstall\\PawnIO' -EA SilentlyContinue; if (-not $k) { $k = Get-ItemProperty 'HKLM:\\SOFTWARE\\WOW6432Node\\Microsoft\\Windows\\CurrentVersion\\Uninstall\\PawnIO' -EA SilentlyContinue }; if ($k) { Write-Output ('PawnIO installed, version ' + $k.DisplayVersion) } else { Write-Output 'PawnIO not installed - CPU temperature/clock speed sensors are unavailable until it is installed.' }"
    problem_keywords:
      - "PawnIO not installed"
    recommended_action_ids:
      - pawnio_install
    description_sk: "Zistí, či je nainštalovaný PawnIO (potrebný na zobrazenie teploty/frekvencie CPU v paneli System info tejto aplikácie). Nič nemení."
    description_en: "Checks whether PawnIO is installed (needed for CPU temperature/clock speed in the app's system info panel). Changes nothing."

  - id: pawnio_install
    label_sk: "Inštalácia ovládača senzorov PawnIO"
    label_en: "Install PawnIO sensor driver"
    risk: MODERATE
    command: "$dest = \"$env:TEMP\\PawnIO_setup.exe\"; try { Invoke-WebRequest -Uri 'https://github.com/namazso/PawnIO.Setup/releases/latest/download/PawnIO_setup.exe' -OutFile $dest -UseBasicParsing -EA Stop } catch { Write-Output ('Download failed: ' + $_.Exception.Message); exit 1 }; $sig = Get-AuthenticodeSignature $dest; if ($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -notmatch 'CN=namazso\\.eu') { Write-Output ('Signature verification failed (' + $sig.Status + ') - aborting install.'); Remove-Item $dest -Force -EA SilentlyContinue; exit 1 }; $p = Start-Process -FilePath $dest -ArgumentList '-install','-silent' -Wait -PassThru; Remove-Item $dest -Force -EA SilentlyContinue; if ($p.ExitCode -eq 0 -or $p.ExitCode -eq 3010) { Write-Output 'PawnIO installed. CPU temperature/clock sensors will appear next time the system info panel refreshes.' } else { Write-Output ('PawnIO installer exited with code ' + $p.ExitCode); exit 1 }"
    undo_command: "$k = Get-ItemProperty 'HKLM:\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Uninstall\\PawnIO' -EA SilentlyContinue; if (-not $k) { $k = Get-ItemProperty 'HKLM:\\SOFTWARE\\WOW6432Node\\Microsoft\\Windows\\CurrentVersion\\Uninstall\\PawnIO' -EA SilentlyContinue }; if (-not $k) { Write-Output 'PawnIO is not installed.' } else { $cmd = if ($k.QuietUninstallString) { $k.QuietUninstallString } else { $k.UninstallString }; if ($cmd) { cmd.exe /c $cmd | Out-Null; Write-Output 'PawnIO uninstalled.' } else { Write-Output 'No uninstall command found in registry - remove PawnIO via Windows Settings > Apps.' } }"
    description_sk: "Stiahne a potichu nainštaluje PawnIO (github.com/namazso/PawnIO, podpísaný, GPL/MIT) - ovládač jadra, cez ktorý teplotu/frekvenciu CPU čítajú nástroje ako HWiNFO/LibreHardwareMonitor aj panel System info tejto aplikácie. Vyžaduje internet a administrátora. Undo sa pokúsi o odinštaláciu cez registrovaný odinštalátor."
    description_en: "Downloads and silently installs PawnIO (github.com/namazso/PawnIO, signed, GPL/MIT) - the kernel driver tools like HWiNFO/LibreHardwareMonitor (and this app's own system info panel) use to read CPU temperature/clock speed. Needs internet and administrator. Undo attempts uninstall via the registered uninstaller."

  # G17 (a): the battery report as XML, not the HTML battery_health_report
  # leaves on the client PC - its element names are fixed, its text is not
  # translated, so the wear verdict works on every Windows language. The
  # XPath uses local-name() so it does not depend on the report's namespace
  # URI. Win32_Battery answers "no battery" before powercfg runs, because on
  # a desktop powercfg may fail instead of writing an empty report.
  - id: battery_wear
    label_sk: "Opotrebenie batérie (verdikt)"
    label_en: "Battery wear (verdict)"
    risk: SAFE
    command: "$inv = [Globalization.CultureInfo]::InvariantCulture; $n = $null; try { $n = @(Get-CimInstance -ClassName Win32_Battery -EA Stop).Count } catch { $n = $null }; if ($n -eq 0) { Write-Output 'VERDICT: NO BATTERY - Win32_Battery lists no battery (a desktop, or the battery is removed).'; exit 0 }; $xmlPath = Join-Path $env:TEMP ('pf_battery_' + [guid]::NewGuid().ToString('N') + '.xml'); try { & powercfg.exe /batteryreport /XML /OUTPUT $xmlPath | Out-Null; $code = $LASTEXITCODE; if ($code -ne 0 -or -not (Test-Path -LiteralPath $xmlPath)) { Write-Output ('powercfg /batteryreport failed (exit code ' + $code + ').'); exit 1 }; try { $x = New-Object System.Xml.XmlDocument; $x.Load($xmlPath) } catch { Write-Output ('The battery report XML could not be read: ' + $_.Exception.GetType().Name); exit 1 }; $bats = @($x.SelectNodes(\"//*[local-name()='Batteries']/*[local-name()='Battery']\")); if ($bats.Count -eq 0) { Write-Output 'VERDICT: NO BATTERY - the battery report lists no battery.'; exit 0 }; $rank = @{ 'GOOD' = 0; 'UNKNOWN' = 1; 'CAUTION' = 2; 'REPLACE' = 3 }; $worst = 'GOOD'; $i = 0; foreach ($b in $bats) { $i++; $f = @{}; foreach ($name in 'Id', 'Manufacturer', 'RelativeCapacity', 'DesignCapacity', 'FullChargeCapacity', 'CycleCount') { $node = $b.SelectSingleNode(\"*[local-name()='\" + $name + \"']\"); $f[$name] = if ($node) { $node.InnerText.Trim() } else { '' } }; $design = [int64]0; $full = [int64]0; $cycles = [int64]0; $hasDesign = [int64]::TryParse($f.DesignCapacity, [Globalization.NumberStyles]::Integer, $inv, [ref]$design); $hasFull = [int64]::TryParse($f.FullChargeCapacity, [Globalization.NumberStyles]::Integer, $inv, [ref]$full); $cycleText = if ([int64]::TryParse($f.CycleCount, [Globalization.NumberStyles]::Integer, $inv, [ref]$cycles) -and $cycles -gt 0) { [string]$cycles } else { 'unknown' }; $unit = if ($f.RelativeCapacity -eq '1') { ' (relative units)' } else { ' mWh' }; $who = (@($f.Manufacturer, $f.Id) | Where-Object { $_ }) -join ' '; $label = 'Battery ' + $i + $(if ($who) { ' (' + $who + ')' } else { '' }); if (-not $hasDesign -or -not $hasFull -or $design -le 0 -or $full -le 0) { $v = 'UNKNOWN'; Write-Output ($label + ': design capacity ' + $(if ($f.DesignCapacity) { $f.DesignCapacity } else { 'missing' }) + ', full charge capacity ' + $(if ($f.FullChargeCapacity) { $f.FullChargeCapacity } else { 'missing' }) + ', cycles ' + $cycleText + ' - no usable capacities from the firmware -> UNKNOWN') } else { $pct = 100.0 * $full / $design; $v = if ($pct -gt 80) { 'GOOD' } elseif ($pct -ge 60) { 'CAUTION' } else { 'REPLACE' }; Write-Output ($label + ': design capacity ' + $design + $unit + ', full charge capacity ' + $full + $unit + ', health ' + [math]::Round($pct, 1).ToString($inv) + ' % (wear ' + [math]::Round([math]::Max(0.0, 100 - $pct), 1).ToString($inv) + ' %), cycles ' + $cycleText + ' -> ' + $v) }; if ($rank[$v] -gt $rank[$worst]) { $worst = $v } }; $why = @{ 'GOOD' = 'every battery holds more than 80 % of its design capacity.'; 'CAUTION' = 'a battery holds 60-80 % of its design capacity - shorter runtime, plan a replacement.'; 'REPLACE' = 'a battery holds less than 60 % of its design capacity - replace it.'; 'UNKNOWN' = 'the firmware reports no usable design/full charge capacity - the wear cannot be judged.' }; Write-Output ('VERDICT: ' + $worst + ' - ' + $why[$worst]) } finally { Remove-Item -LiteralPath $xmlPath -Force -EA SilentlyContinue }"
    description_sk: "Pre každú batériu porovná menovitú kapacitu (DesignCapacity) so skutočnou plnou kapacitou (FullChargeCapacity) z powercfg /batteryreport /XML a vypíše aj počet nabíjacích cyklov. Verdikt: GOOD nad 80 %, CAUTION 60 - 80 %, REPLACE pod 60 %; pri viacerých batériách rozhoduje najhoršia. Stolný počítač dostane NO BATTERY, firmvér bez kapacít UNKNOWN. Dočasný XML súbor z %TEMP% hneď zmaže. Nič nemení."
    description_en: "For each battery compares the design capacity (DesignCapacity) with the actual full charge capacity (FullChargeCapacity) from powercfg /batteryreport /XML and lists the charge cycle count. Verdict: GOOD above 80 %, CAUTION 60 - 80 %, REPLACE below 60 %; with several batteries the worst one decides. A desktop gets NO BATTERY, firmware without capacities UNKNOWN. Deletes the temporary XML file from %TEMP% right away. Changes nothing."

  # G17 (c): what mdsched.exe "Check for problems the next time I start my
  # computer" does, without its dialog: a one-time boot sequence to the
  # Windows Memory Diagnostic entry, {memdiag}. Nothing restarts now - no
  # restarts_pc (the technician restarts when it suits the client) and no
  # restart_before_next (nothing else in the batch depends on the test).
  # Success is judged by bcdedit's exit codes and, when the BCD hive is
  # readable, by the bootsequence element (0x24000002) of {bootmgr} holding
  # the well-known {memdiag} GUID - never by bcdedit's translated output.
  # changes_system: false - a one-time boot entry a restore point cannot
  # cover; undo cancels a still pending run instead.
  - id: mem_test_schedule
    label_sk: "Naplánovanie testu pamäte RAM pri reštarte"
    label_en: "Schedule RAM test at next restart"
    risk: REQUIRES_REBOOT
    exclude_from_select_all: true
    changes_system: false
    command: "$seqKey = 'HKLM:\\BCD00000000\\Objects\\{9dea862c-5cdd-4e70-acc1-f32b344d4795}\\Elements'; $memdiag = '{b2721d73-1db4-4c62-bf78-c548a880142d}'; & bcdedit.exe /enum '{memdiag}' | Out-Null; $code = $LASTEXITCODE; if ($code -ne 0) { Write-Output ('The Windows Memory Diagnostic boot entry {memdiag} was not found in the boot configuration (bcdedit exit code ' + $code + ') - nothing was scheduled.'); exit 1 }; & bcdedit.exe /bootsequence '{memdiag}' | Out-Null; $code = $LASTEXITCODE; if ($code -ne 0) { Write-Output ('Scheduling the memory test failed (bcdedit exit code ' + $code + ', needs administrator) - nothing was scheduled.'); exit 1 }; $state = 'not verifiable (the boot configuration hive is not readable)'; $landed = $null; if (Test-Path -LiteralPath $seqKey) { if (Test-Path -LiteralPath ($seqKey + '\\24000002')) { try { $landed = @((Get-ItemProperty -LiteralPath ($seqKey + '\\24000002') -Name Element -EA Stop).Element) -contains $memdiag } catch { $landed = $null } } else { $landed = $false } }; if ($landed -eq $true) { $state = 'verified' } elseif ($landed -eq $false) { Write-Output 'bcdedit reported success, but the one-time boot sequence does not contain {memdiag} - nothing will run at the next restart.'; exit 1 }; Write-Output ('Windows Memory Diagnostic scheduled for the next restart only (one-time boot sequence, ' + $state + '). The PC is NOT restarted now - restart it when convenient; the standard test takes about 15-30 minutes, then Windows starts normally. Read the outcome afterwards with the memory test result action.')"
    preview_command: "$seqKey = 'HKLM:\\BCD00000000\\Objects\\{9dea862c-5cdd-4e70-acc1-f32b344d4795}\\Elements'; $memdiag = '{b2721d73-1db4-4c62-bf78-c548a880142d}'; & bcdedit.exe /enum '{memdiag}' | Out-Null; $code = $LASTEXITCODE; if ($code -ne 0) { Write-Output ('The Windows Memory Diagnostic boot entry {memdiag} was not found (bcdedit exit code ' + $code + ') - the action would fail and schedule nothing.'); exit 0 }; $pending = 'unknown (the boot configuration hive is not readable)'; if (Test-Path -LiteralPath $seqKey) { if (-not (Test-Path -LiteralPath ($seqKey + '\\24000002'))) { $pending = 'no' } else { try { $pending = if (@((Get-ItemProperty -LiteralPath ($seqKey + '\\24000002') -Name Element -EA Stop).Element) -contains $memdiag) { 'yes' } else { 'no' } } catch { } } }; Write-Output ('Memory test already scheduled for the next restart: ' + $pending); Write-Output 'Would run: bcdedit /bootsequence {memdiag} - the Windows Memory Diagnostic runs once at the next restart. The PC would NOT be restarted now.'"
    undo_command: "$seqKey = 'HKLM:\\BCD00000000\\Objects\\{9dea862c-5cdd-4e70-acc1-f32b344d4795}\\Elements'; $memdiag = '{b2721d73-1db4-4c62-bf78-c548a880142d}'; $skip = $false; if (Test-Path -LiteralPath $seqKey) { if (-not (Test-Path -LiteralPath ($seqKey + '\\24000002'))) { $skip = $true } else { try { $skip = -not (@((Get-ItemProperty -LiteralPath ($seqKey + '\\24000002') -Name Element -EA Stop).Element) -contains $memdiag) } catch { $skip = $false } } }; if ($skip) { Write-Output 'No memory test is pending (it already ran, or was never scheduled) - nothing to cancel.'; exit 0 }; & bcdedit.exe /deletevalue '{bootmgr}' bootsequence | Out-Null; $code = $LASTEXITCODE; if ($code -ne 0) { Write-Output ('Cancelling the pending memory test failed (bcdedit exit code ' + $code + ', needs administrator).'); exit 1 }; Write-Output 'The pending memory test was cancelled - the next restart boots Windows directly.'"
    description_sk: "Naplánuje Windows Memory Diagnostic (to isté ako mdsched.exe) na jednorazový beh pri najbližšom reštarte cez bcdedit /bootsequence {memdiag}. Počítač sa TERAZ NEREŠTARTUJE - reštartuj ho, keď sa to hodí; štandardný test trvá asi 15 - 30 minút, potom sa Windows spustí normálne a výsledok ukáže akcia Výsledok testu pamäte RAM. Úspech hlási, len ak bcdedit uspel a (ak sa dá overiť) jednorazová zavádzacia sekvencia naozaj obsahuje {memdiag}. Undo zruší test, ktorý ešte nebežal. Vyžaduje administrátora; nie je vo „Vybrať všetko“."
    description_en: "Schedules the Windows Memory Diagnostic (the same as mdsched.exe) to run once at the next restart via bcdedit /bootsequence {memdiag}. The PC is NOT restarted now - restart it when convenient; the standard test takes about 15 - 30 minutes, then Windows starts normally and the RAM test result action shows the outcome. Reports success only when bcdedit succeeded and (when it can be verified) the one-time boot sequence really holds {memdiag}. Undo cancels a test that has not run yet. Needs administrator; not in \"Select all\"."

  # G17 (c): the outcome by event ID of Microsoft-Windows-MemoryDiagnostics-
  # Results in the System log (checked against the provider's manifest):
  # 1101/1201 no errors, 1102/1202 hardware errors, 1103 cancelled, 1104
  # could not complete. The newest one wins; the message text is never read.
  - id: mem_test_result
    label_sk: "Výsledok testu pamäte RAM"
    label_en: "RAM test result"
    risk: SAFE
    command: "$seqKey = 'HKLM:\\BCD00000000\\Objects\\{9dea862c-5cdd-4e70-acc1-f32b344d4795}\\Elements'; $memdiag = '{b2721d73-1db4-4c62-bf78-c548a880142d}'; $pending = $false; if (Test-Path -LiteralPath $seqKey) { $pending = @((Get-ItemProperty -LiteralPath ($seqKey + '\\24000002') -Name Element -EA SilentlyContinue).Element) -contains $memdiag }; if ($pending) { Write-Output 'A memory test is scheduled for the next restart and has not run yet.' }; $ev = $null; try { $ev = Get-WinEvent -FilterHashtable @{ LogName = 'System'; ProviderName = 'Microsoft-Windows-MemoryDiagnostics-Results'; Id = 1101, 1102, 1103, 1104, 1201, 1202 } -MaxEvents 1 -EA Stop } catch { if ($_.FullyQualifiedErrorId -notlike 'NoMatchingEventsFound*') { Write-Output ('The System event log could not be read: ' + $_.FullyQualifiedErrorId + ' (HRESULT 0x' + ('{0:X8}' -f $_.Exception.HResult) + ').'); exit 1 } }; if (-not $ev) { Write-Output ('VERDICT: NEVER RUN - no Windows Memory Diagnostic result in the System event log (the test never ran, or the log was cleared since).' + $(if ($pending) { ' The scheduled test runs at the next restart.' } else { '' })); exit 0 }; $when = $ev.TimeCreated.ToString('yyyy-MM-dd HH:mm', [Globalization.CultureInfo]::InvariantCulture); $bad = ''; if ($ev.Id -eq 1101 -or $ev.Id -eq 1102) { $p = @($ev.Properties); if ($p.Count -gt 8) { $bad = ', bad pages: ' + $p[8].Value } }; Write-Output ('Last result: event ' + $ev.Id + ' from ' + $when + $bad); $verdict = switch ($ev.Id) { 1101 { 'PASS - the memory test found no errors' } 1201 { 'PASS - the memory test found no errors' } 1102 { 'FAIL - the memory test found hardware errors: faulty RAM, reseat or replace the modules' } 1202 { 'FAIL - the memory test found hardware errors: faulty RAM, reseat or replace the modules' } 1103 { 'INCOMPLETE - the memory test was cancelled' } default { 'INCOMPLETE - the memory test could not complete' } }; Write-Output ('VERDICT: ' + $verdict + ' (' + $when + ').')"
    description_sk: "Prečíta posledný výsledok Windows Memory Diagnostic zo systémového denníka (udalosti Microsoft-Windows-MemoryDiagnostics-Results) s dátumom a riadkom VERDICT: PASS (bez chýb), FAIL (chybná RAM - preusadiť alebo vymeniť moduly), INCOMPLETE (test zrušený alebo nedokončený) alebo NEVER RUN (test nebežal alebo bol denník vymazaný). Upozorní aj na test naplánovaný na najbližší reštart. Nič nemení."
    description_en: "Reads the last Windows Memory Diagnostic result from the System event log (Microsoft-Windows-MemoryDiagnostics-Results events) with its date and a VERDICT line: PASS (no errors), FAIL (faulty RAM - reseat or replace the modules), INCOMPLETE (test cancelled or not finished) or NEVER RUN (the test never ran or the log was cleared). Also mentions a test scheduled for the next restart. Changes nothing."
