module_id: m15_boot_platform
category: REPAIR
actions:
  - id: boot_bcd_report
    label_sk: "Prehľad zavádzacej konfigurácie (BCD)"
    label_en: "Boot configuration (BCD) report"
    risk: SAFE
    command: "$out = & bcdedit.exe /enum all 2>&1; Write-Output ($out -join \"`n\")"
    description_sk: "Vypíše zavádzacie položky, predvolený OS, timeout a prípadné zabudnuté príznaky safeboot/testsigning z predchádzajúcej diagnostiky. Nič nemení."
    description_en: "Lists boot entries, default OS, timeout, and any leftover safeboot/testsigning flags from a prior troubleshooting session. Changes nothing."

  - id: boot_tpm_status
    label_sk: "Stav TPM a Secure Boot"
    label_en: "TPM and Secure Boot status"
    risk: SAFE
    command: "Get-Tpm | Select-Object TpmPresent,TpmReady,TpmEnabled,TpmActivated | Format-List; try { Write-Output ('SecureBoot enabled: ' + (Confirm-SecureBootUEFI)) } catch { Write-Output 'SecureBoot: not supported (Legacy BIOS/CSM or firmware does not expose this check)' }"
    description_sk: "Zobrazí stav čipu TPM a to, či je zapnutý Secure Boot. Nič nemení."
    description_en: "Shows TPM chip status and whether Secure Boot is enabled. Changes nothing."

  - id: boot_bitlocker_status
    label_sk: "Stav šifrovania disku (BitLocker)"
    label_en: "Disk encryption (BitLocker) status"
    risk: SAFE
    command: "try { Get-BitLockerVolume -EA Stop | Select-Object MountPoint,VolumeStatus,ProtectionStatus,EncryptionPercentage | Format-Table -AutoSize } catch { $v = Get-CimInstance -Namespace 'root/cimv2/security/MicrosoftVolumeEncryption' -ClassName Win32_EncryptableVolume -EA SilentlyContinue; if ($v) { $v | Select-Object DriveLetter,ProtectionStatus,ConversionStatus | Format-Table -AutoSize } else { Write-Output 'BitLocker/Device Encryption not available on this Windows edition.' } }"
    description_sk: "Zobrazí stav šifrovania diskových zväzkov (BitLocker alebo Device Encryption v edícii Home). Nič nemení."
    description_en: "Shows volume encryption status (BitLocker, or Device Encryption on Home edition). Changes nothing."

  - id: boot_safe_mode_status
    label_sk: "Kontrola zavádzania do núdzového režimu"
    label_en: "Safe Mode boot check"
    risk: SAFE
    command: "$out = & bcdedit.exe /enum '{current}' 2>&1 | Select-String -Pattern 'safeboot'; if ($out) { Write-Output ('Machine is currently configured to boot into SAFE MODE: ' + ($out -join '; ')) } else { Write-Output 'Normal boot (no safeboot flag set).' }"
    problem_keywords:
      - "Machine is currently configured to boot into SAFE MODE"
    recommended_action_ids:
      - boot_clear_safe_mode_flag
    description_sk: "Zistí, či je počítač nastavený na zavádzanie do núdzového režimu (Safe Mode) - často zabudnutý príznak po predchádzajúcej diagnostike. Nič nemení."
    description_en: "Checks whether the machine is set to boot into Safe Mode (a commonly forgotten leftover flag from earlier troubleshooting). Changes nothing."

  - id: boot_clear_safe_mode_flag
    label_sk: "Vypnutie zavádzania do núdzového režimu"
    label_en: "Clear Safe Mode boot flag"
    risk: MODERATE
    command: "$me = \"$env:USERDOMAIN\\$env:USERNAME\"; $root = \"$env:ProgramData\\PortableFix\"; New-Item -ItemType Directory -Force -Path $root | Out-Null; icacls $root /inheritance:r /grant:r \"*S-1-5-32-544:(OI)(CI)F\" /grant:r \"*S-1-5-18:(OI)(CI)F\" /grant:r \"${me}:(OI)(CI)F\" | Out-Null; $safebootMatch = & bcdedit.exe /enum '{current}' 2>&1 | Select-String -Pattern '^safeboot\\s+(\\S+)'; $bk = \"$root\\safe_mode_backup.json\"; if (-not (Test-Path $bk)) { $prior = if ($safebootMatch) { $safebootMatch.Matches[0].Groups[1].Value } else { $null }; [PSCustomObject]@{ SafeBoot = $prior } | ConvertTo-Json | Set-Content -Path $bk -Encoding UTF8 }; & bcdedit.exe /deletevalue '{current}' safeboot | Out-Null; if ($LASTEXITCODE -eq 0) { Write-Output 'Safe Mode flag cleared - next restart boots normally.' } else { Write-Output 'Failed to clear safeboot flag (needs administrator).' ; exit 1 }"
    undo_command: "$bk = \"$env:ProgramData\\PortableFix\\safe_mode_backup.json\"; if (Test-Path $bk) { $b = Get-Content $bk -Raw | ConvertFrom-Json; if ($b.SafeBoot) { & bcdedit.exe /set '{current}' safeboot $b.SafeBoot.ToLower() | Out-Null; if ($LASTEXITCODE -eq 0) { Write-Output ('Safe Mode flag restored (' + $b.SafeBoot + ').') } else { Write-Output 'Failed to restore safeboot flag (needs administrator).'; exit 1 } } else { Write-Output 'No safeboot flag was set before - nothing to restore.' } } else { Write-Output 'No backup found - nothing to restore.' }"
    description_sk: "Odstráni príznak safeboot (po zálohe pôvodnej hodnoty, len pri prvom behu), aby sa počítač pri ďalšom štarte spustil normálne."
    description_en: "Removes the safeboot flag (after backing up the original value, only on first run) so the machine boots normally next time."

  - id: boot_enable_f8_legacy_recovery
    label_sk: "Zapnutie ponuky F8 (pokročilé možnosti spustenia)"
    label_en: "Enable F8 Advanced Boot Options menu"
    risk: MODERATE
    command: "& bcdedit.exe /set '{current}' bootmenupolicy legacy | Out-Null; if ($LASTEXITCODE -eq 0) { Write-Output 'Legacy F8 boot recovery enabled - hold F8 during boot to reach Advanced Boot Options.' } else { Write-Output 'Failed to set bootmenupolicy (needs administrator).'; exit 1 }"
    undo_command: "& bcdedit.exe /set '{current}' bootmenupolicy standard | Out-Null; if ($LASTEXITCODE -eq 0) { Write-Output 'Boot menu policy restored to standard (Windows 11 default).' } else { Write-Output 'Failed to restore bootmenupolicy (needs administrator).'; exit 1 }"
    description_sk: "Zapne starý zavádzací mechanizmus F8 (Pokročilé možnosti spustenia), odstránený od Windows 8. Užitočné pri opakovaných problémoch so spúšťaním, keď sa Windows sám spoľahlivo nedostane do WinRE. Undo vráti štandardné správanie (predvolené vo Windows 11)."
    description_en: "Enables the legacy F8 boot mechanism (Advanced Boot Options) removed since Windows 8. Useful for recurring startup problems where Windows doesn't reliably drop into WinRE on its own. Undo restores the standard (Windows 11 default) behavior."

  # G07. Sources: Microsoft's "Windows Secure Boot certificate expiration and
  # CA updates" guidance and the CheckCA2023 README
  # (github.com/claude-boucher/CheckCA2023) for the SecureBoot and
  # SecureBoot\Servicing registry values (AvailableUpdates, UEFICA2023Status,
  # UEFICA2023Error/ErrorEvent, WindowsUEFICA2023Capable 2 = booting the
  # 2023-signed boot manager) and for Confirm-SecureBootUEFI throwing
  # PlatformNotSupportedException on legacy BIOS. The certificate names are
  # X.509 subject strings inside the firmware db/KEK, not localized text.
  # Deadline (Windows Production PCA 2011 expires 2026-10-19):
  # docs/research/research-competitors-2026.md, G07. Exits 1 only when the
  # state cannot be read at all.
  - id: boot_secureboot_ca2023_status
    label_sk: "Secure Boot certifikáty 2023 - stav a verdikt"
    label_en: "Secure Boot 2023 certificates - status and verdict"
    risk: SAFE
    command: "$sbKey = 'HKLM:\\SYSTEM\\CurrentControlSet\\Control\\SecureBoot'; $sb = 'unknown'; try { if (Confirm-SecureBootUEFI -EA Stop) { $sb = 'on' } else { $sb = 'off' } } catch { if ($_.Exception -is [System.PlatformNotSupportedException] -or [string]$_.FullyQualifiedErrorId -match 'NotSupported') { $sb = 'unsupported' } else { $st = Get-ItemProperty -Path ($sbKey + '\\State') -EA SilentlyContinue; if ($st -and $st.UEFISecureBootEnabled -eq 1) { $sb = 'on' } elseif ($st -and $st.UEFISecureBootEnabled -eq 0) { $sb = 'off' } } }; Write-Output ('Secure Boot: ' + $sb); if ($sb -eq 'unknown') { Write-Output 'Could not determine the Secure Boot state - run PortableFix as administrator.'; exit 1 }; if ($sb -eq 'unsupported') { Write-Output 'VERDICT: NOT APPLICABLE - legacy BIOS/CSM boot, UEFI Secure Boot is not available, so the 2011/2023 Secure Boot certificates do not matter here.'; exit 0 }; if ($sb -eq 'off') { Write-Output 'VERDICT: NOT APPLICABLE - Secure Boot is turned off, the firmware does not check the 2011/2023 certificates. Run this check again if Secure Boot is turned on later.'; exit 0 }; $names = @('Windows UEFI CA 2023', 'Microsoft UEFI CA 2023', 'Microsoft Option ROM UEFI CA 2023', 'Microsoft Corporation KEK 2K CA 2023'); $found = @{}; $readOk = $true; foreach ($v in 'db', 'KEK') { try { $b = [byte[]](Get-SecureBootUEFI -Name $v -EA Stop).Bytes; $txt = [Text.Encoding]::ASCII.GetString($b) + '|' + [Text.Encoding]::Unicode.GetString($b); if ($b.Length -gt 1) { $txt += '|' + [Text.Encoding]::Unicode.GetString($b, 1, $b.Length - 1) }; foreach ($n in $names) { if ($txt.Contains($n)) { $found[$v + ':' + $n] = $true } } } catch { $readOk = $false } }; if ($readOk) { foreach ($c in @('db:Windows UEFI CA 2023', 'db:Microsoft UEFI CA 2023', 'db:Microsoft Option ROM UEFI CA 2023', 'KEK:Microsoft Corporation KEK 2K CA 2023')) { Write-Output ($c.Replace(':', ' - ') + ': ' + $(if ($found[$c]) { 'present' } else { 'MISSING' })) } } else { Write-Output 'db/KEK: cannot be read (needs administrator) - the verdict relies on the servicing registry only.' }; $root = Get-ItemProperty -Path $sbKey -EA SilentlyContinue; $svc = Get-ItemProperty -Path ($sbKey + '\\Servicing') -EA SilentlyContinue; $status = ''; $errCode = 0; $errEvent = 0; $capable = $null; $avail = $null; if ($svc) { $status = [string]$svc.UEFICA2023Status; if ($svc.UEFICA2023Error) { $errCode = $svc.UEFICA2023Error }; if ($svc.UEFICA2023ErrorEvent) { $errEvent = $svc.UEFICA2023ErrorEvent }; $capable = $svc.WindowsUEFICA2023Capable }; if ($root -and $null -ne $root.AvailableUpdates) { $avail = $root.AvailableUpdates } elseif ($svc -and $null -ne $svc.AvailableUpdates) { $avail = $svc.AvailableUpdates }; Write-Output ('UEFICA2023Status: ' + $(if ($status) { $status } else { '(not reported - Windows older than the October 2025 update)' })); Write-Output ('WindowsUEFICA2023Capable: ' + $(if ($null -ne $capable) { [string]$capable } else { '(not reported)' })); Write-Output ('AvailableUpdates: ' + $(if ($null -ne $avail) { '0x{0:X4}' -f $avail } else { '(not set)' })); if ($errCode -ne 0 -or $errEvent -ne 0) { Write-Output ('UEFICA2023Error: 0x{0:X8}, UEFICA2023ErrorEvent: {1}' -f $errCode, $errEvent) }; if ($svc -and $svc.ConfidenceLevel) { Write-Output ('ConfidenceLevel: ' + $svc.ConfidenceLevel) }; try { $sig = Get-AuthenticodeSignature -FilePath (Join-Path $env:SystemRoot 'Boot\\EFI\\bootmgfw.efi') -EA Stop; if ($sig.SignerCertificate) { Write-Output ('Boot manager (copy in Windows\\Boot\\EFI) signed by: ' + $sig.SignerCertificate.Issuer) } } catch { }; $db23 = [bool]$found['db:Windows UEFI CA 2023']; $kek23 = [bool]$found['KEK:Microsoft Corporation KEK 2K CA 2023']; $switched = ($status -eq 'Updated') -or ($capable -eq 2); if ($readOk) { $ok = $db23 -and $kek23 -and $switched } else { if (-not $status -and $null -eq $capable) { Write-Output 'Could not read db/KEK and Windows reports no servicing state - run PortableFix as administrator.'; exit 1 }; $ok = ($status -eq 'Updated') }; if ($ok) { Write-Output 'VERDICT: OK - the 2023 Secure Boot certificates are in place and Windows boots with the 2023-signed boot manager; the Windows Production PCA 2011 expiry on 2026-10-19 does not affect this PC.'; exit 0 }; $days = ([datetime]::new(2026, 10, 19) - (Get-Date).Date).Days; if ($days -gt 0) { Write-Output ('VERDICT: ACTION NEEDED before 2026-10-19 (' + $days + ' days left) - the Windows Production PCA 2011 certificate expires then and this PC has not finished moving to the 2023 certificates:') } else { Write-Output 'VERDICT: ACTION NEEDED - the Windows Production PCA 2011 certificate expired on 2026-10-19 and this PC has not finished moving to the 2023 certificates:' }; if ($readOk -and -not $db23) { Write-Output ' - Windows UEFI CA 2023 is missing from the firmware db.' }; if ($readOk -and -not $kek23) { Write-Output ' - Microsoft Corporation KEK 2K CA 2023 is missing from KEK; if Windows Update cannot add it, the PC maker has to supply a BIOS/UEFI update with the new KEK.' }; if (-not $readOk) { Write-Output ' - db/KEK could not be checked without administrator rights, so the KEK 2023 certificate is unconfirmed; run PortableFix as administrator for a full verdict.' }; if (-not $switched) { Write-Output ' - Windows is not yet booting with the 2023-signed boot manager (UEFICA2023Status is not Updated).' }; if ($errCode -ne 0 -or $errEvent -ne 0) { Write-Output ' - The certificate update reported an error (see UEFICA2023Error / TPM-WMI events in the System log); a firmware update from the PC maker is usually required.' }; if ($null -ne $avail -and $avail -ne 0) { Write-Output ' - Certificate updates are queued (AvailableUpdates is not 0): restart the PC, then let the scheduled task \\Microsoft\\Windows\\PI\\Secure-Boot-Update run.' }; Write-Output 'Next step: install the latest Windows cumulative update and the latest BIOS/UEFI firmware from the PC maker, restart twice and run this check again.'; exit 0"
    description_sk: "Zistí, či je Secure Boot zapnutý, či firmvér už má nové certifikáty Windows UEFI CA 2023 a Microsoft KEK 2K CA 2023 a ako ďaleko je Windows s ich nasadením. Na konci vypíše jednoznačný verdikt: OK, ACTION NEEDED (treba zasiahnuť do 19. 10. 2026, keď vyprší certifikát Windows Production PCA 2011) alebo NOT APPLICABLE (netýka sa - starý BIOS alebo vypnutý Secure Boot). Nič nemení."
    description_en: "Checks whether Secure Boot is on, whether the firmware already holds the new Windows UEFI CA 2023 and Microsoft KEK 2K CA 2023 certificates, and how far Windows has got with rolling them out. Ends with a single verdict: OK, ACTION NEEDED before 2026-10-19 (when the Windows Production PCA 2011 certificate expires) or NOT APPLICABLE (legacy BIOS or Secure Boot off). Changes nothing."

  # G18. Sources: ReAgent.xml in %WINDIR%\System32\Recovery (InstallState
  # state=1/0, read the same way by OSDeploy/OSD Get-ReAgentXml) and
  # reagentc /info, of which only the exit code, the
  # \\?\GLOBALROOT\device\harddiskN\partitionM path and a non-zero BCD GUID
  # are used - its labels are localized. Quick Machine Recovery: Microsoft's
  # QMR docs - "reagentc /getrecoverysettings" prints XML that includes the
  # Wi-Fi password, so it goes to a temp file (piping it fails with error
  # 57), only the CloudRemediation/AutoRemediation state attributes are read
  # and the file is deleted. 250 MB free on the WinRE partition: KB5028997.
  # Its resize script maps reagentc's harddiskN\partitionM straight to
  # Get-Partition -DiskNumber/-PartitionNumber, as done here; the low-space
  # note is still limited to recovery-type partitions (GPT de94bba4-...,
  # MBR 0x27) so a mismatch cannot flag, say, the small EFI partition.
  - id: boot_winre_status
    label_sk: "Pripravenosť prostredia obnovy (WinRE)"
    label_en: "Recovery environment (WinRE) readiness"
    risk: SAFE
    command: "$rp = Join-Path $env:SystemRoot 'System32\\Recovery'; $xmlState = ''; $xp = Join-Path $rp 'ReAgent.xml'; if (Test-Path -LiteralPath $xp) { try { $x = [xml](Get-Content -LiteralPath $xp -Raw -EA Stop); $xmlState = [string]$x.WindowsRE.InstallState.state; Write-Output ('ReAgent.xml: InstallState=' + $xmlState + ', WinreBCD=' + $x.WindowsRE.WinreBCD.id + ', WinreLocation=' + $x.WindowsRE.WinreLocation.path) } catch { Write-Output 'ReAgent.xml: present but unreadable or damaged.' } } else { Write-Output 'ReAgent.xml: not found (or not readable without administrator rights).' }; $ro = ''; $rc = -1; try { $ro = (@(& reagentc.exe /info 2>&1) | ForEach-Object { [string]$_ }) -join \"`n\"; if ($null -ne $LASTEXITCODE) { $rc = $LASTEXITCODE } } catch { }; $loc = [regex]::Match($ro, '(?i)\\\\\\\\\\?\\\\GLOBALROOT\\\\device\\\\harddisk(\\d+)\\\\partition(\\d+)\\\\[^\\s]*'); $bcd = [regex]::Match($ro, '(?!\\{?0{8}-0{4}-0{4}-0{4}-0{12})\\{?[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}\\}?'); if ($rc -eq 0) { $enabled = $loc.Success -and $bcd.Success; Write-Output ('reagentc /info: exit 0, WinRE location ' + $(if ($loc.Success) { $loc.Value } else { '(none)' })) } elseif ($xmlState -eq '1' -or $xmlState -eq '0') { $enabled = ($xmlState -eq '1'); Write-Output ('reagentc /info failed (exit ' + $rc + ') - using ReAgent.xml InstallState.') } else { Write-Output ('Could not determine the WinRE state: reagentc /info failed (exit ' + $rc + ') and ReAgent.xml is not readable - run PortableFix as administrator.'); exit 1 }; $lowFree = $false; if ($enabled -and $loc.Success) { try { $part = Get-Partition -DiskNumber ([int]$loc.Groups[1].Value) -PartitionNumber ([int]$loc.Groups[2].Value) -EA Stop; $isRe = ([string]$part.GptType -match 'de94bba4-06d1-4d40-a16a-bfd50179d6ac') -or ($part.MbrType -eq 39); $line = 'WinRE partition: disk ' + $loc.Groups[1].Value + ', partition ' + $loc.Groups[2].Value + ', type ' + $part.Type + ', size ' + [math]::Round($part.Size / 1MB) + ' MB'; try { $vol = $part | Get-Volume -EA Stop; $line += ', free ' + [math]::Round($vol.SizeRemaining / 1MB) + ' MB'; if ($isRe -and $vol.SizeRemaining -lt 250MB) { $lowFree = $true } } catch { }; if (-not $isRe) { $line += ' (not a recovery-type partition - partition number as reported by reagentc)' }; Write-Output $line } catch { Write-Output 'WinRE partition size: could not be determined.' } }; $wim = Test-Path -LiteralPath (Join-Path $rp 'Winre.wim'); if (-not $enabled) { Write-Output ('Winre.wim in ' + $rp + ': ' + $(if ($wim) { 'present' } else { 'MISSING' })) }; $qf = Join-Path ([IO.Path]::GetTempPath()) ('pf_qmr_' + [guid]::NewGuid().ToString('N') + '.txt'); try { $p = Start-Process -FilePath 'reagentc.exe' -ArgumentList '/getrecoverysettings' -RedirectStandardOutput $qf -NoNewWindow -Wait -PassThru -EA Stop; $q = ''; if (Test-Path -LiteralPath $qf) { $q = [string](Get-Content -LiteralPath $qf -Raw) }; $cr = [regex]::Match($q, '<CloudRemediation\\s[^>]*state=\"(\\d+)\"'); $ar = [regex]::Match($q, '<AutoRemediation\\s[^>]*state=\"(\\d+)\"'); if ($p.ExitCode -eq 0 -and ($cr.Success -or $ar.Success)) { Write-Output ('Quick Machine Recovery: cloud remediation ' + $(if ($cr.Groups[1].Value -eq '1') { 'on' } else { 'off' }) + ', auto remediation ' + $(if ($ar.Groups[1].Value -eq '1') { 'on' } else { 'off' })) } else { Write-Output 'Quick Machine Recovery: not available on this Windows build.' } } catch { Write-Output 'Quick Machine Recovery: not available on this Windows build.' } finally { Remove-Item -LiteralPath $qf -Force -EA SilentlyContinue }; if ($enabled -and $lowFree) { Write-Output 'VERDICT: OK - WinRE is enabled, but its partition has less than 250 MB free, so WinRE updates from Windows Update can fail.' } elseif ($enabled) { Write-Output 'VERDICT: OK - WinRE is enabled; Reset this PC, Startup Repair and offline repairs are available.' } elseif ($wim) { Write-Output 'VERDICT: ACTION NEEDED - WinRE is disabled but Winre.wim is present; run \"reagentc /enable\" as administrator to turn it back on.' } else { Write-Output 'VERDICT: ACTION NEEDED - WinRE is disabled and Winre.wim is missing; Reset this PC and Startup Repair will not work until Winre.wim from install media of the same Windows build is copied back and \"reagentc /enable\" is run.' }; exit 0"
    description_sk: "Zistí, či je zapnuté prostredie obnovy Windows (WinRE), na ktorom závisí Obnovenie počítača, Oprava pri spustení aj offline kontrola Defendera. Ukáže veľkosť a voľné miesto oddielu WinRE, či je k dispozícii súbor Winre.wim a stav Quick Machine Recovery (ak ho systém má). Na konci vypíše verdikt OK alebo ACTION NEEDED (treba zasiahnuť) s ďalším krokom. Nič nemení."
    description_en: "Checks whether the Windows Recovery Environment (WinRE) is enabled - Reset this PC, Startup Repair and Defender Offline all depend on it. Shows the WinRE partition size and free space, whether Winre.wim is available and the Quick Machine Recovery state (where the system has it). Ends with an OK or ACTION NEEDED verdict and the next step. Changes nothing."
