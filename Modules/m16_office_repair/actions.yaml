module_id: m16_office_repair
category: REPAIR
actions:
  - id: office_version_channel_report
    label_sk: "Verzia a kanál Office"
    label_en: "Office version and channel report"
    risk: SAFE
    command: "$c = Get-ItemProperty 'HKCU:\\Software\\Microsoft\\Office\\ClickToRun\\Configuration' -EA SilentlyContinue; if ($c) { $c | Select-Object VersionToReport,ClientCulture,Platform,UpdateChannel | Format-List } else { Write-Output 'Click-to-Run Office configuration not found (Office not installed, or an MSI-based/volume-license install).' }"
    description_sk: "Zobrazí verziu Office a kanál aktualizácií (inštalácie Click-to-Run). Nič nemení."
    description_en: "Shows Office version and update channel (Click-to-Run installs). Changes nothing."

  - id: office_addins_report
    label_sk: "Prehľad doplnkov Outlooku"
    label_en: "Outlook add-ins report"
    risk: SAFE
    command: "$r = Get-ItemProperty 'HKCU:\\Software\\Microsoft\\Office\\Outlook\\Addins\\*','HKLM:\\Software\\Microsoft\\Office\\Outlook\\Addins\\*','HKLM:\\Software\\WOW6432Node\\Microsoft\\Office\\Outlook\\Addins\\*' -EA SilentlyContinue | Select-Object PSChildName,FriendlyName,Description,LoadBehavior; if ($r) { $r | Format-Table -AutoSize -Wrap } else { Write-Output 'No Outlook add-ins found.' }"
    description_sk: "Vypíše nainštalované doplnky Outlooku (častý zdroj pádov/spomalenia). Nič nemení."
    description_en: "Lists installed Outlook add-ins (a common source of crashes/slowness). Changes nothing."

  - id: office_ost_pst_report
    label_sk: "Veľkosť OST/PST súborov"
    label_en: "OST/PST file size report"
    risk: SAFE
    command: "Write-Output '--- OST files ---'; Get-ChildItem \"$env:LOCALAPPDATA\\Microsoft\\Outlook\" -Filter *.ost -Recurse -EA SilentlyContinue | Select-Object Name,@{N='SizeGB';E={[math]::Round($_.Length/1GB,2)}},LastWriteTime | Format-Table -AutoSize; Write-Output '--- PST files ---'; Get-ChildItem \"$env:USERPROFILE\\Documents\\Outlook Files\",\"$env:LOCALAPPDATA\\Microsoft\\Outlook\" -Filter *.pst -Recurse -EA SilentlyContinue | Select-Object Name,@{N='SizeGB';E={[math]::Round($_.Length/1GB,2)}} | Format-Table -AutoSize"
    description_sk: "Zobrazí veľkosť OST/PST súborov Outlooku - príliš veľký súbor je častou (a ľahko zistiteľnou) príčinou spomalenia. Nič nemení."
    description_en: "Shows the size of Outlook OST/PST files - an oversized file is a frequent, easily-spotted cause of slowness. Changes nothing."

  - id: office_com_addin_disable_all_thirdparty
    label_sk: "Vypnutie všetkých doplnkov Outlooku tretích strán"
    label_en: "Disable all third-party Outlook add-ins"
    risk: MODERATE
    # Backup only when absent (a second run would record all zeros and undo
    # would re-disable everything); -EA Stop per add-in with a failed list;
    # refuses while Outlook runs (it rewrites LoadBehavior on exit); $uh so
    # the signed-in user's Outlook is edited, not the technician's.
    command: "$uh = if ($__pfUserHive) { $__pfUserHive } else { 'HKCU:' }; if (-not (Test-Path -Path $uh)) { Write-Output ('Profile hive not loaded, skipped: ' + $uh + ' (did the user sign out?)'); exit 1 }; if (Get-Process -Name OUTLOOK -EA SilentlyContinue) { Write-Output 'Outlook is running - refusing to change add-ins (Outlook rewrites LoadBehavior when it exits, undoing the change). Close Outlook and run the action again. Nothing was changed.'; exit 1 }; $bk = \"$env:ProgramData\\PortableFix\\office_addins_backup.json\"; New-Item -ItemType Directory -Force -Path (Split-Path $bk) | Out-Null; $keys = @(Get-ChildItem -Path ($uh + '\\Software\\Microsoft\\Office\\Outlook\\Addins') -EA SilentlyContinue | Where-Object { $_.PSChildName -notmatch '^Microsoft\\.' }); $state = @(); foreach ($k in $keys) { $state += [PSCustomObject]@{ Key = $k.PSChildName; LoadBehavior = (Get-ItemProperty -Path $k.PSPath -Name LoadBehavior -EA SilentlyContinue).LoadBehavior } }; if (Test-Path $bk) { Write-Output ('Earlier backup kept: ' + $bk + ' (the state before PortableFix first changed it; undo restores that).') } else { ConvertTo-Json -InputObject @($state) | Set-Content -Path $bk -Encoding UTF8 }; $done = 0; $failed = @(); foreach ($k in $keys) { try { Set-ItemProperty -Path $k.PSPath -Name LoadBehavior -Value 0 -Type DWord -EA Stop; $done++ } catch { $failed += ($k.PSChildName + ' (' + $_.Exception.Message + ')') } }; Write-Output ('Disabled ' + $done + ' of ' + $keys.Count + ' third-party Outlook add-in(s).'); if ($failed.Count) { Write-Output ('Failed: ' + ($failed -join '; ')); exit 1 }"
    undo_command: "$uh = if ($__pfUserHive) { $__pfUserHive } else { 'HKCU:' }; if (-not (Test-Path -Path $uh)) { Write-Output ('Profile hive not loaded, skipped: ' + $uh + ' (did the user sign out?)') } else { $bk = \"$env:ProgramData\\PortableFix\\office_addins_backup.json\"; if (Test-Path $bk) { $b = Get-Content $bk -Raw | ConvertFrom-Json; foreach ($e in $b) { $k = ($uh + '\\Software\\Microsoft\\Office\\Outlook\\Addins\\' + $e.Key); if ($null -eq $e.LoadBehavior) { Remove-ItemProperty -Path $k -Name LoadBehavior -EA SilentlyContinue } else { Set-ItemProperty -Path $k -Name LoadBehavior -Value $e.LoadBehavior -Type DWord -EA SilentlyContinue } }; Write-Output 'Outlook add-in LoadBehavior values restored from backup.' } else { Write-Output 'No backup found.' } }"
    description_sk: "Vypne každý doplnok Outlooku prihláseného používateľa, ktorý nie je od Microsoftu (štandardný prvý krok pri pádoch/spomalení pri štarte) - aj keď PortableFix beží pod účtom technika. Ak Outlook beží, akcia odmietne pokračovať (Outlook pri ukončení LoadBehavior prepíše). Pôvodný stav sa zálohuje len pri prvom behu (opakovaný beh prvú zálohu ponechá), každé zlyhanie zápisu sa vypíše a akcia skončí chybou; undo zálohu obnoví."
    description_en: "Disables every non-Microsoft Outlook add-in of the signed-in user (a standard first step for startup crashes/slowness) - even when PortableFix runs as the technician's account. Refuses while Outlook is running (it rewrites LoadBehavior on exit). The original state is backed up on the first run only (a re-run keeps the first backup), every failed write is listed and fails the action; undo restores the backup."

  - id: office_com_addin_disable_machine_wide
    label_sk: "Vypnutie doplnkov Office tretích strán pre celý počítač"
    label_en: "Disable third-party Office add-ins machine-wide"
    risk: MODERATE
    exclude_from_select_all: true
    # Machine-wide counterpart of office_com_addin_disable_all_thirdparty (which
    # only edits the signed-in user's HKCU add-ins): HKLM and WOW6432Node
    # Addins of Outlook/Word/Excel/PowerPoint. Per-key first-run backup keyed
    # by full registry path (a 64- and 32-bit add-in can share a name); no
    # backup => no change; refuses while any Office app runs; -EA Stop with a
    # failed list. Needs administrator (HKLM writes fail otherwise and are
    # listed). Defence in depth: the backup is untrusted input to the elevated
    # undo - entries are accepted only for add-in keys this action can create
    # (anchored regex) with a known LoadBehavior, and -LiteralPath is used.
    # Same Microsoft filter as the per-user action, plus the few
    # Microsoft add-ins that do not use the Microsoft.* prefix.
    command: "$rx = '^(HKLM:|Microsoft\\.PowerShell\\.Core\\\\Registry::HKEY_LOCAL_MACHINE)\\\\SOFTWARE(\\\\WOW6432Node)?\\\\Microsoft\\\\Office\\\\(Outlook|Word|Excel|PowerPoint)\\\\Addins\\\\(?!\\.{1,2}\\z)[^\\\\*?\\[\\]\\r\\n]+\\z'; $okLb = 0,1,2,3,8,9,16; function Test-PfEntry($e) { $lv = $e.LoadBehavior; ($e.Path -is [string]) -and ($e.Path -match $rx) -and (($null -eq $lv) -or ((($lv -is [int]) -or ($lv -is [long])) -and ($okLb -contains [int]$lv))) }; if (Get-Process -Name OUTLOOK,WINWORD,EXCEL,POWERPNT -EA SilentlyContinue) { Write-Output 'An Office app (Outlook, Word, Excel or PowerPoint) is running - refusing to change add-ins (Office rewrites LoadBehavior when it exits, undoing the change). Close the Office apps and run the action again. Nothing was changed.'; exit 1 }; $bk = \"$env:ProgramData\\PortableFix\\office_addins_machine_backup.json\"; $all = @(); foreach ($app in 'Outlook','Word','Excel','PowerPoint') { foreach ($root in 'SOFTWARE','SOFTWARE\\WOW6432Node') { $all += @(Get-ChildItem -LiteralPath ('HKLM:\\' + $root + '\\Microsoft\\Office\\' + $app + '\\Addins') -EA SilentlyContinue | Where-Object { $_.PSChildName -notmatch '^(Microsoft\\.|UCAddin\\.|TeamsAddin\\.|OneNote\\.|OcOffice\\.)' }) } }; if (-not $all.Count) { Write-Output 'No third-party machine-wide Office add-ins found. Nothing was changed.'; exit 0 }; $state = @(); if (Test-Path $bk) { try { $j = Get-Content $bk -Raw -EA Stop | ConvertFrom-Json -EA Stop; foreach ($x in $j) { $state += $x } } catch { Write-Output ('Earlier backup is unreadable (' + $bk + '): ' + $_.Exception.Message + ' - refusing to change add-ins without a valid backup. Nothing was changed.'); exit 1 }; foreach ($x in $state) { if (-not (Test-PfEntry $x)) { Write-Output ('Earlier backup contains an entry that is not a machine-wide Office add-in key or has an unexpected LoadBehavior (' + $bk + ') - refusing to change add-ins until it is checked. Nothing was changed.'); exit 1 } } }; $known = @($state | ForEach-Object { $_.Path }); $keys = @(); $new = @(); $failed = @(); foreach ($k in $all) { $e = [PSCustomObject]@{ Path = $k.PSPath; LoadBehavior = (Get-ItemProperty -LiteralPath $k.PSPath -Name LoadBehavior -EA SilentlyContinue).LoadBehavior }; if ($known -contains $k.PSPath) { $keys += $k } elseif (Test-PfEntry $e) { $keys += $k; $new += $e } else { $failed += ($k.PSPath + ' (unsupported key name or LoadBehavior, skipped)') } }; if ($new.Count) { try { New-Item -ItemType Directory -Force -Path (Split-Path $bk) -EA Stop | Out-Null; ConvertTo-Json -InputObject @($state + $new) | Set-Content -Path $bk -Encoding UTF8 -EA Stop } catch { Write-Output ('Could not write the backup (' + $_.Exception.Message + ') - nothing was changed.'); exit 1 } } elseif ($state.Count) { Write-Output ('Earlier backup kept: ' + $bk + ' (the state before PortableFix first changed these add-ins; undo restores that).') }; $done = 0; foreach ($k in $keys) { try { Set-ItemProperty -LiteralPath $k.PSPath -Name LoadBehavior -Value 0 -Type DWord -EA Stop; $done++ } catch { $failed += ($k.PSPath + ' (' + $_.Exception.Message + ')') } }; Write-Output ('Disabled ' + $done + ' of ' + $all.Count + ' third-party machine-wide Office add-in(s), failed ' + $failed.Count + '.'); if ($failed.Count) { Write-Output ('Failed: ' + ($failed -join '; ')); exit 1 }"
    undo_command: "$rx = '^(HKLM:|Microsoft\\.PowerShell\\.Core\\\\Registry::HKEY_LOCAL_MACHINE)\\\\SOFTWARE(\\\\WOW6432Node)?\\\\Microsoft\\\\Office\\\\(Outlook|Word|Excel|PowerPoint)\\\\Addins\\\\(?!\\.{1,2}\\z)[^\\\\*?\\[\\]\\r\\n]+\\z'; $okLb = 0,1,2,3,8,9,16; function Test-PfEntry($e) { $lv = $e.LoadBehavior; ($e.Path -is [string]) -and ($e.Path -match $rx) -and (($null -eq $lv) -or ((($lv -is [int]) -or ($lv -is [long])) -and ($okLb -contains [int]$lv))) }; $bk = \"$env:ProgramData\\PortableFix\\office_addins_machine_backup.json\"; if (-not (Test-Path $bk)) { Write-Output 'No backup found.'; exit 0 }; $b = @(); try { $j = Get-Content $bk -Raw -EA Stop | ConvertFrom-Json -EA Stop; foreach ($x in $j) { $b += $x } } catch { Write-Output ('Backup is unreadable (' + $bk + '): ' + $_.Exception.Message); exit 1 }; $ok = 0; $gone = 0; $failed = @(); foreach ($e in $b) { if (-not (Test-PfEntry $e)) { $failed += ([string]$e.Path + ' (rejected: not a machine-wide Office add-in key or unexpected LoadBehavior)'); continue }; if (-not (Test-Path -LiteralPath $e.Path)) { $gone++; continue }; try { if ($null -eq $e.LoadBehavior) { if ($null -ne (Get-ItemProperty -LiteralPath $e.Path -Name LoadBehavior -EA SilentlyContinue).LoadBehavior) { Remove-ItemProperty -LiteralPath $e.Path -Name LoadBehavior -EA Stop } } else { Set-ItemProperty -LiteralPath $e.Path -Name LoadBehavior -Value ([int]$e.LoadBehavior) -Type DWord -EA Stop }; $ok++ } catch { $failed += ($e.Path + ' (' + $_.Exception.Message + ')') } }; Write-Output ('Restored ' + $ok + ' of ' + $b.Count + ' machine-wide Office add-in LoadBehavior value(s), failed ' + $failed.Count + ', no longer installed ' + $gone + '.'); if ($failed.Count) { Write-Output ('Failed: ' + ($failed -join '; ')); exit 1 }"
    description_sk: "Vypne doplnky Outlooku, Wordu, Excelu a PowerPointu tretích strán, ktoré sú nainštalované pre celý počítač (HKLM aj 32-bitová vetva WOW6432Node) - práve tie bývajú častou príčinou pádov Outlooku. Zmena sa týka VŠETKÝCH používateľov tohto PC, nielen prihláseného. Doplnky od Microsoftu (názov Microsoft.*, Teams, Skype for Business, OneNote) preskočí. Vyžaduje správcu; ak niektorý zápis zlyhá, vypíše sa a akcia skončí chybou (výstup: Disabled N of M, failed K). Ak beží Outlook alebo iná aplikácia Office, akcia odmietne pokračovať (Office pri ukončení LoadBehavior prepíše). Pôvodná hodnota každého kľúča sa zálohuje len pri prvom behu do PortableFix\\office_addins_machine_backup.json (opakovaný beh ju neprepíše); undo ju obnoví. Doplnky nainštalované len pre jedného používateľa rieši akcia „Vypnutie všetkých doplnkov Outlooku tretích strán“."
    description_en: "Disables third-party Outlook, Word, Excel and PowerPoint add-ins installed for the whole PC (HKLM and the 32-bit WOW6432Node branch) - the usual source of Outlook crashes. It affects EVERY user of this PC, not just the signed-in one. Microsoft add-ins (Microsoft.* names, Teams, Skype for Business, OneNote) are skipped. Needs administrator; a failed write is listed and fails the action (output: Disabled N of M, failed K). Refuses while Outlook or any other Office app is running (Office rewrites LoadBehavior on exit). The original value of each key is backed up on the first run only to PortableFix\\office_addins_machine_backup.json (a re-run does not overwrite it); undo restores it. Add-ins installed for a single user are handled by the \"Disable all third-party Outlook add-ins\" action."

  - id: office_quick_repair
    label_sk: "Rýchla oprava Office (offline)"
    label_en: "Office Quick Repair (offline)"
    risk: MODERATE
    command: "$c2r = \"$env:ProgramFiles\\Common Files\\Microsoft Shared\\ClickToRun\\OfficeC2RClient.exe\"; if (Test-Path $c2r) { & $c2r scenario=Repair RepairType=QuickRepair DisplayLevel=False; Write-Output 'Quick Repair started (offline, ~2-5 min).' } else { Write-Output 'Click-to-Run client not found - Office is not installed, or is an MSI-based/volume-license install that needs Control Panel > Programs repair instead.' }"
    inactivity_timeout_sec: 600
    description_sk: "Spustí rýchlu (offline) opravu Click-to-Run Office. Nevyžaduje internet, cca 2-5 min. Poznámka: nie je spoľahlivo overené, či príkaz čaká na dokončenie opravy, alebo hlási dokončenie skôr - ak nástroj ohlási úspech krátko po spustení, oprava môže ešte bežať na pozadí."
    description_en: "Runs a quick (offline) Click-to-Run Office repair. No internet needed, ~2-5 min. Note: it's not fully confirmed whether the command blocks until the repair actually finishes or reports done early - if this reports success very quickly, the repair may still be running in the background."

  - id: office_online_repair
    label_sk: "Úplná oprava Office (online)"
    label_en: "Office Online Repair"
    risk: MODERATE
    command: "$c2r = \"$env:ProgramFiles\\Common Files\\Microsoft Shared\\ClickToRun\\OfficeC2RClient.exe\"; if (Test-Path $c2r) { & $c2r scenario=Repair RepairType=FullRepair DisplayLevel=False; Write-Output 'Online Repair started (needs internet, re-downloads the Office payload, can take 15-30+ min).' } else { Write-Output 'Click-to-Run client not found.' }"
    inactivity_timeout_sec: 2400
    description_sk: "Spustí úplnú opravu Click-to-Run Office (znovu stiahne Office cez internet, 15-30+ min). Platí rovnaké upozornenie o neoverenom čase dokončenia ako pri rýchlej oprave, len s dlhším behom. Táto akcia má predĺžený watchdog (40 min) namiesto štandardných 300s."
    description_en: "Runs a full Click-to-Run Office repair (re-downloads Office over the internet, 15-30+ min). Same unconfirmed caveat about completion timing as Quick Repair, with a longer run. This action has an extended watchdog (40 min) instead of the standard 300s."

  - id: office_reset_outlook_profile
    label_sk: "Reset profilu Outlooku"
    label_en: "Reset Outlook profile"
    risk: MODERATE
    command: "if ($__pfUserSid -and ($__pfUserSid -ne [Security.Principal.WindowsIdentity]::GetCurrent().User.Value)) { Write-Output ('The signed-in user (' + $__pfUserSid + ') is not the account PortableFix runs as - the Outlook profile lives in the signed-in user''s hive and Outlook runs in their session. Run PortableFix from the user''s own administrator prompt. Nothing was changed.'); exit 1 }; $found = $false; foreach ($v in '16.0','15.0','14.0') { $profilesKey = \"HKCU:\\Software\\Microsoft\\Office\\$v\\Outlook\\Profiles\"; if (Test-Path $profilesKey) { $found = $true; $proc = Get-Process -Name OUTLOOK -EA SilentlyContinue; if ($proc) { $proc.CloseMainWindow() | Out-Null; Start-Sleep -Seconds 3; $proc = Get-Process -Name OUTLOOK -EA SilentlyContinue; if ($proc) { Stop-Process -Name OUTLOOK -Force -EA SilentlyContinue; Start-Sleep -Seconds 2 } }; $ts = Get-Date -Format 'yyyyMMdd_HHmmss'; try { Rename-Item -Path $profilesKey -NewName (\"Profiles.bak-$ts\") -EA Stop; Write-Output (\"Outlook profile reset (Office $v). Old profile backed up under registry key 'Profiles.bak-$ts' - Outlook creates a fresh default profile on next launch.\") } catch { Write-Output (\"Failed to rename Outlook profile (registry key may still be in use): \" + $_.Exception.Message); exit 1 }; break } }; if (-not $found) { Write-Output 'No Outlook profile registry key found (Outlook not configured on this account, or an unsupported version).' }"
    description_sk: "Najprv sa pokúsi Outlook korektne zatvoriť (jeho vlastný dialóg tak môže ponúknuť uloženie rozpísaného e-mailu, ak nejaký je) a až keď sa do 3 sekúnd sám nezatvorí, ukončí ho nasilu. Potom jeho profil (kontá, nastavenia synchronizácie) v registri odloží premenovaním a Outlook si pri ďalšom štarte vytvorí nový predvolený profil. Štandardný prvý krok pri opakovaných pádoch/zamŕzaní Outlooku. Pôvodný profil ostane v registri, ale bez automatického undo (rovnaký princíp ako reset profilu Chrome/Edge). Ak sa technik prihlásil vlastným účtom nad prihláseným používateľom, akcia odmietne pokračovať (profil je v hive prihláseného používateľa)."
    description_en: "Tries to close Outlook gracefully first (giving its own dialog a chance to offer saving an unfinished email, if there is one) and only force-kills it if it hasn't closed on its own within 3 seconds - then renames its profile (accounts, sync settings) aside in the registry, Outlook creates a fresh default profile on next launch. A standard first step for recurring Outlook crashes/freezes. The old profile stays in the registry but there's no automatic undo (same approach as the Chrome/Edge profile reset). When the technician elevated with their own account over the signed-in user, the action refuses (the profile lives in the signed-in user's hive)."
