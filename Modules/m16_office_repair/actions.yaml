module_id: m16_office_repair
category: REPAIR
actions:
  - id: office_version_channel_report
    label_sk: "Verzia a kanal Office"
    label_en: "Office version and channel report"
    risk: SAFE
    command: "$c = Get-ItemProperty 'HKCU:\\Software\\Microsoft\\Office\\ClickToRun\\Configuration' -EA SilentlyContinue; if ($c) { $c | Select-Object VersionToReport,ClientCulture,Platform,UpdateChannel | Format-List } else { Write-Output 'Click-to-Run Office configuration not found (Office not installed, or an MSI-based/volume-license install).' }"
    description_sk: "Zobrazi verziu a update kanal Office (Click-to-Run instalacie). Nic nemeni."
    description_en: "Shows Office version and update channel (Click-to-Run installs). Changes nothing."

  - id: office_addins_report
    label_sk: "Prehlad doplnkov Outlooku"
    label_en: "Outlook add-ins report"
    risk: SAFE
    command: "$r = Get-ItemProperty 'HKCU:\\Software\\Microsoft\\Office\\Outlook\\Addins\\*','HKLM:\\Software\\Microsoft\\Office\\Outlook\\Addins\\*','HKLM:\\Software\\WOW6432Node\\Microsoft\\Office\\Outlook\\Addins\\*' -EA SilentlyContinue | Select-Object PSChildName,FriendlyName,Description,LoadBehavior; if ($r) { $r | Format-Table -AutoSize -Wrap } else { Write-Output 'No Outlook add-ins found.' }"
    description_sk: "Vypise nainstalovane doplnky Outlooku (caste zdroje padov/spomalenia). Nic nemeni."
    description_en: "Lists installed Outlook add-ins (a common source of crashes/slowness). Changes nothing."

  - id: office_ost_pst_report
    label_sk: "Velkost OST/PST suborov"
    label_en: "OST/PST file size report"
    risk: SAFE
    command: "Write-Output '--- OST files ---'; Get-ChildItem \"$env:LOCALAPPDATA\\Microsoft\\Outlook\" -Filter *.ost -Recurse -EA SilentlyContinue | Select-Object Name,@{N='SizeGB';E={[math]::Round($_.Length/1GB,2)}},LastWriteTime | Format-Table -AutoSize; Write-Output '--- PST files ---'; Get-ChildItem \"$env:USERPROFILE\\Documents\\Outlook Files\",\"$env:LOCALAPPDATA\\Microsoft\\Outlook\" -Filter *.pst -Recurse -EA SilentlyContinue | Select-Object Name,@{N='SizeGB';E={[math]::Round($_.Length/1GB,2)}} | Format-Table -AutoSize"
    description_sk: "Zobrazi velkost OST/PST suborov Outlooku - predimenzovany subor je caste (a lahko zistitelne) zdroj spomalenia. Nic nemeni."
    description_en: "Shows the size of Outlook OST/PST files - an oversized file is a frequent, easily-spotted cause of slowness. Changes nothing."

  - id: office_com_addin_disable_all_thirdparty
    label_sk: "Vypnutie vsetkych doplnkov Outlooku tretich stran"
    label_en: "Disable all third-party Outlook add-ins"
    risk: MODERATE
    command: "$bk = \"$env:ProgramData\\PortableFix\\office_addins_backup.json\"; New-Item -ItemType Directory -Force -Path (Split-Path $bk) | Out-Null; $keys = Get-ChildItem 'HKCU:\\Software\\Microsoft\\Office\\Outlook\\Addins' -EA SilentlyContinue; $state = @(); foreach ($k in $keys) { if ($k.PSChildName -notmatch '^Microsoft\\.') { $lb = (Get-ItemProperty $k.PSPath -Name LoadBehavior -EA SilentlyContinue).LoadBehavior; $state += [PSCustomObject]@{ Key = $k.PSChildName; LoadBehavior = $lb }; Set-ItemProperty -Path $k.PSPath -Name LoadBehavior -Value 0 -Type DWord -EA SilentlyContinue } }; $state | ConvertTo-Json | Set-Content -Path $bk -Encoding UTF8; Write-Output ('Disabled ' + $state.Count + ' third-party Outlook add-in(s), backup saved.')"
    undo_command: "$bk = \"$env:ProgramData\\PortableFix\\office_addins_backup.json\"; if (Test-Path $bk) { Get-Content $bk -Raw | ConvertFrom-Json | ForEach-Object { Set-ItemProperty -Path \"HKCU:\\Software\\Microsoft\\Office\\Outlook\\Addins\\$($_.Key)\" -Name LoadBehavior -Value $_.LoadBehavior -Type DWord -EA SilentlyContinue } } else { Write-Output 'No backup found.' }"
    description_sk: "Vypne kazdy doplnok Outlooku, ktory nie je od Microsoftu (zaklad pri riešeni padu/spomalenia pri starte). Zaloha povodneho stavu sa uklada, undo ho vrati."
    description_en: "Disables every non-Microsoft Outlook add-in (a standard first step for startup crashes/slowness). The original state is backed up; undo restores it."

  - id: office_quick_repair
    label_sk: "Rychla oprava Office (offline)"
    label_en: "Office Quick Repair (offline)"
    risk: MODERATE
    command: "$c2r = \"$env:ProgramFiles\\Common Files\\Microsoft Shared\\ClickToRun\\OfficeC2RClient.exe\"; if (Test-Path $c2r) { & $c2r scenario=Repair RepairType=QuickRepair DisplayLevel=False; Write-Output 'Quick Repair started (offline, ~2-5 min).' } else { Write-Output 'Click-to-Run client not found - Office is not installed, or is an MSI-based/volume-license install that needs Control Panel > Programs repair instead.' }"
    inactivity_timeout_sec: 600
    description_sk: "Spusti rychlu (offline) opravu Click-to-Run Office. Nevyzaduje internet, cca 2-5 min. Poznamka: nie je isto overene, ci prikaz caka na dokoncenie opravy alebo sa hlasi hotovy skor - ak nastroj ohlasi uspech skoro po spusteni, oprava mohla pokracovat na pozadi."
    description_en: "Runs a quick (offline) Click-to-Run Office repair. No internet needed, ~2-5 min. Note: it's not fully confirmed whether the command blocks until the repair actually finishes or reports done early - if this reports success very quickly, the repair may still be running in the background."

  - id: office_online_repair
    label_sk: "Uplna oprava Office (online)"
    label_en: "Office Online Repair"
    risk: MODERATE
    command: "$c2r = \"$env:ProgramFiles\\Common Files\\Microsoft Shared\\ClickToRun\\OfficeC2RClient.exe\"; if (Test-Path $c2r) { & $c2r scenario=Repair RepairType=FullRepair DisplayLevel=False; Write-Output 'Online Repair started (needs internet, re-downloads the Office payload, can take 15-30+ min).' } else { Write-Output 'Click-to-Run client not found.' }"
    inactivity_timeout_sec: 2400
    description_sk: "Spusti uplnu opravu Click-to-Run Office (znovu stiahne Office cez internet, 15-30+ min). Rovnaka nezistena poznamka o dokonceni ako pri rychlej oprave, tu s dlhsim behom. Tato akcia ma predlzeny watchdog (40 min) namiesto standardnych 300s."
    description_en: "Runs a full Click-to-Run Office repair (re-downloads Office over the internet, 15-30+ min). Same unconfirmed caveat about completion timing as Quick Repair, with a longer run. This action has an extended watchdog (40 min) instead of the standard 300s."

  - id: office_reset_outlook_profile
    label_sk: "Reset profilu Outlooku"
    label_en: "Reset Outlook profile"
    risk: MODERATE
    command: "$found = $false; foreach ($v in '16.0','15.0','14.0') { $profilesKey = \"HKCU:\\Software\\Microsoft\\Office\\$v\\Outlook\\Profiles\"; if (Test-Path $profilesKey) { $found = $true; Stop-Process -Name OUTLOOK -Force -EA SilentlyContinue; Start-Sleep -Seconds 2; $ts = Get-Date -Format 'yyyyMMdd_HHmmss'; Rename-Item -Path $profilesKey -NewName (\"Profiles.bak-$ts\"); Write-Output (\"Outlook profile reset (Office $v). Old profile backed up under registry key 'Profiles.bak-$ts' - Outlook creates a fresh default profile on next launch.\"); break } }; if (-not $found) { Write-Output 'No Outlook profile registry key found (Outlook not configured on this account, or an unsupported version).' }"
    description_sk: "Zatvori Outlook bez varovania a premenuje jeho profil (kontá, nastavenia synchronizacie) nabok v registri - Outlook si pri dalsom starte vytvori novy predvoleny profil. Standardny prvy krok pri opakovanych padoch/zaseknuti Outlooku. Zaloha ostane v registri, ale bez automatickeho undo (rovnaky princip ako reset profilu Chrome/Edge)."
    description_en: "Closes Outlook without asking and renames its profile (accounts, sync settings) aside in the registry - Outlook creates a fresh default profile on next launch. A standard first step for recurring Outlook crashes/freezes. The old profile stays in the registry but there's no automatic undo (same approach as the Chrome/Edge profile reset)."
