module_id: m02_cleanup
category: CLEANUP
actions:
  - id: user_temp
    label_sk: "Dočasné súbory používateľa"
    label_en: "User temp files"
    risk: SAFE
    command: "function Remove-PfSafe([string]$Path) { $n = 0; $i = Get-Item -LiteralPath $Path -Force -EA SilentlyContinue; if (-not $i) { return $n }; $ro = [IO.FileAttributes]::ReadOnly; $rp = [IO.FileAttributes]::ReparsePoint; $dir = [IO.FileAttributes]::Directory; $dirs = New-Object System.Collections.Generic.List[string]; $todo = New-Object System.Collections.Generic.Stack[string]; $todo.Push($i.FullName); while ($todo.Count -gt 0) { $p = $todo.Pop(); try { $a = [IO.File]::GetAttributes($p) } catch [IO.FileNotFoundException], [IO.DirectoryNotFoundException] { continue } catch { $n++; continue }; if (($a -band $dir) -and -not ($a -band $rp)) { $dirs.Add($p); try { foreach ($c in [IO.Directory]::GetFileSystemEntries($p)) { $todo.Push($c) } } catch { $n++ }; continue }; try { if ($a -band $rp) { if ($a -band $dir) { [IO.Directory]::Delete($p) } else { [IO.File]::Delete($p) } } else { if ($a -band $ro) { [IO.File]::SetAttributes($p, ($a -bxor $ro)) }; [IO.File]::Delete($p) } } catch { $n++ } }; for ($k = $dirs.Count - 1; $k -ge 0; $k--) { $d = $dirs[$k]; try { $a = [IO.File]::GetAttributes($d); if (($a -band $ro) -and -not ($a -band $rp)) { [IO.File]::SetAttributes($d, ($a -bxor $ro)) }; [IO.Directory]::Delete($d) } catch [IO.FileNotFoundException], [IO.DirectoryNotFoundException] { } catch { $left = 1; try { $left = @([IO.Directory]::GetFileSystemEntries($d)).Count } catch { }; if ($left -eq 0) { $n++ } } }; return $n }; $excludePattern = '^_MEI|^PortableFix$|^PortableFixUpdate|^portablefix_update_.*\\.ps1$|^claude$|^copilot-cli$|^codex(-cli)?$|^context-mode-guidance-s-'; $cutoff = (Get-Date).AddDays(-3); $skipped = 0; $runningNames = @(Get-Process -EA SilentlyContinue | ForEach-Object { try { $_.Path } catch { $null } } | Where-Object { $_ -and $_.StartsWith($env:TEMP, [StringComparison]::OrdinalIgnoreCase) } | ForEach-Object { $_.Substring($env:TEMP.Length).TrimStart('\\').Split('\\')[0] } | Select-Object -Unique); Get-ChildItem \"$env:TEMP\" -Force -EA SilentlyContinue | Where-Object { $_.Name -notmatch $excludePattern -and $runningNames -notcontains $_.Name -and $_.LastWriteTime -lt $cutoff -and -not (($__pfProtect) -and $_.FullName.Equals($__pfProtect, [StringComparison]::OrdinalIgnoreCase)) } | ForEach-Object { $skipped += Remove-PfSafe $_.FullName }; Write-Output (\"Skipped locked/in-use items: \" + $skipped)"
    preview_command: "$excludePattern = '^_MEI|^PortableFix$|^PortableFixUpdate|^portablefix_update_.*\\.ps1$|^claude$|^copilot-cli$|^codex(-cli)?$|^context-mode-guidance-s-'; $cutoff = (Get-Date).AddDays(-3); $runningNames = @(Get-Process -EA SilentlyContinue | ForEach-Object { try { $_.Path } catch { $null } } | Where-Object { $_ -and $_.StartsWith($env:TEMP, [StringComparison]::OrdinalIgnoreCase) } | ForEach-Object { $_.Substring($env:TEMP.Length).TrimStart('\\').Split('\\')[0] } | Select-Object -Unique); $f = Get-ChildItem \"$env:TEMP\" -Force -EA SilentlyContinue | Where-Object { $_.Name -notmatch $excludePattern -and $runningNames -notcontains $_.Name -and $_.LastWriteTime -lt $cutoff -and -not (($__pfProtect) -and $_.FullName.Equals($__pfProtect, [StringComparison]::OrdinalIgnoreCase)) } | Get-ChildItem -Recurse -File -Force -EA SilentlyContinue; $c = $f.Count; $mb = [math]::Round((($f | Measure-Object Length -Sum).Sum)/1MB,2); Write-Output \"Would delete $c files, $mb MB from $env:TEMP (items modified in the last 3 days, or belonging to a currently running program, are skipped)\""
    description_sk: "Vyčistí položky v $env:TEMP, ktoré sa nezmenili aspoň 3 dni (čerstvo nainštalované/rozbalené portable aplikácie sa často nachádzajú priamo v TEMP a okamžité vyčistenie by ich pripravilo o dáta). Vynecháva aj samotnú bežiacu aplikáciu, priečinky práve bežiacich programov, záložné dáta PortableFix, prebiehajúcu aktualizáciu a pracovné dáta AI agentov na programovanie (Claude Code, Copilot CLI, Codex CLI, context-mode)."
    description_en: "Clears items in $env:TEMP untouched for at least 3 days (freshly installed/extracted portable apps often live directly in TEMP and would be wiped out by an immediate cleanup). Also excludes the running app itself, folders belonging to currently running programs, PortableFix fallback data, an in-progress update, and scratch data used by AI coding agents (Claude Code, Copilot CLI, Codex CLI, context-mode)."

  - id: system_temp
    label_sk: "Systémové dočasné súbory"
    label_en: "System temp files"
    risk: SAFE
    command: "function Remove-PfSafe([string]$Path) { $n = 0; $i = Get-Item -LiteralPath $Path -Force -EA SilentlyContinue; if (-not $i) { return $n }; $ro = [IO.FileAttributes]::ReadOnly; $rp = [IO.FileAttributes]::ReparsePoint; $dir = [IO.FileAttributes]::Directory; $dirs = New-Object System.Collections.Generic.List[string]; $todo = New-Object System.Collections.Generic.Stack[string]; $todo.Push($i.FullName); while ($todo.Count -gt 0) { $p = $todo.Pop(); try { $a = [IO.File]::GetAttributes($p) } catch [IO.FileNotFoundException], [IO.DirectoryNotFoundException] { continue } catch { $n++; continue }; if (($a -band $dir) -and -not ($a -band $rp)) { $dirs.Add($p); try { foreach ($c in [IO.Directory]::GetFileSystemEntries($p)) { $todo.Push($c) } } catch { $n++ }; continue }; try { if ($a -band $rp) { if ($a -band $dir) { [IO.Directory]::Delete($p) } else { [IO.File]::Delete($p) } } else { if ($a -band $ro) { [IO.File]::SetAttributes($p, ($a -bxor $ro)) }; [IO.File]::Delete($p) } } catch { $n++ } }; for ($k = $dirs.Count - 1; $k -ge 0; $k--) { $d = $dirs[$k]; try { $a = [IO.File]::GetAttributes($d); if (($a -band $ro) -and -not ($a -band $rp)) { [IO.File]::SetAttributes($d, ($a -bxor $ro)) }; [IO.Directory]::Delete($d) } catch [IO.FileNotFoundException], [IO.DirectoryNotFoundException] { } catch { $left = 1; try { $left = @([IO.Directory]::GetFileSystemEntries($d)).Count } catch { }; if ($left -eq 0) { $n++ } } }; return $n }; $cutoff = (Get-Date).AddDays(-3); $skipped = 0; $runningNames = @(Get-Process -EA SilentlyContinue | ForEach-Object { try { $_.Path } catch { $null } } | Where-Object { $_ -and $_.StartsWith(\"$env:WINDIR\\Temp\", [StringComparison]::OrdinalIgnoreCase) } | ForEach-Object { $_.Substring(\"$env:WINDIR\\Temp\".Length).TrimStart('\\').Split('\\')[0] } | Select-Object -Unique); Get-ChildItem \"$env:WINDIR\\Temp\" -Force -EA SilentlyContinue | Where-Object { $runningNames -notcontains $_.Name -and $_.LastWriteTime -lt $cutoff -and -not (($__pfProtect) -and $_.FullName.Equals($__pfProtect, [StringComparison]::OrdinalIgnoreCase)) } | ForEach-Object { $skipped += Remove-PfSafe $_.FullName }; Write-Output (\"Skipped locked/in-use items: \" + $skipped)"
    preview_command: "$cutoff = (Get-Date).AddDays(-3); $runningNames = @(Get-Process -EA SilentlyContinue | ForEach-Object { try { $_.Path } catch { $null } } | Where-Object { $_ -and $_.StartsWith(\"$env:WINDIR\\Temp\", [StringComparison]::OrdinalIgnoreCase) } | ForEach-Object { $_.Substring(\"$env:WINDIR\\Temp\".Length).TrimStart('\\').Split('\\')[0] } | Select-Object -Unique); $f = Get-ChildItem \"$env:WINDIR\\Temp\" -Force -EA SilentlyContinue | Where-Object { $runningNames -notcontains $_.Name -and $_.LastWriteTime -lt $cutoff -and -not (($__pfProtect) -and $_.FullName.Equals($__pfProtect, [StringComparison]::OrdinalIgnoreCase)) } | Get-ChildItem -Recurse -File -Force -EA SilentlyContinue; $c = $f.Count; $mb = [math]::Round((($f | Measure-Object Length -Sum).Sum)/1MB,2); Write-Output \"Would delete $c files, $mb MB from $env:WINDIR\\Temp (items modified in the last 3 days, or belonging to a currently running program, are skipped)\""
    description_sk: "Vyčistí položky v $env:WINDIR\\Temp, ktoré sa nezmenili aspoň 3 dni. Vynecháva priečinky práve bežiacich programov a priečinok, z ktorého práve beží táto aplikácia, ak by sa tam náhodou nachádzal."
    description_en: "Clears items in $env:WINDIR\\Temp untouched for at least 3 days. Excludes folders belonging to currently running programs and the folder the app is currently running from, on the rare chance it's there."

  - id: recycle_bin
    label_sk: "Kôš"
    label_en: "Recycle Bin"
    risk: MODERATE
    changes_system: false  # user files - a restore point never covers them
    command: "Clear-RecycleBin -Force -EA SilentlyContinue -ErrorVariable errs; Write-Output (\"Recycle Bin cleared (suppressed errors: \" + $errs.Count + \")\")"
    preview_command: "$sh = New-Object -ComObject Shell.Application; $items = $sh.Namespace(0xA).Items(); Write-Output \"Recycle Bin: $($items.Count) item(s)\""
    description_sk: "Vyprázdni Kôš."
    description_en: "Empties the Recycle Bin."

  - id: prefetch
    label_sk: "Cache Prefetch"
    label_en: "Prefetch cache"
    risk: SAFE
    command: "Remove-Item \"$env:WINDIR\\Prefetch\\*\" -Force -EA SilentlyContinue -ErrorVariable errs; Write-Output (\"Skipped locked/in-use items: \" + $errs.Count)"
    preview_command: "$f = Get-ChildItem \"$env:WINDIR\\Prefetch\" -File -Force -EA SilentlyContinue; $c = $f.Count; $mb = [math]::Round((($f | Measure-Object Length -Sum).Sum)/1MB,2); Write-Output \"Would delete $c files, $mb MB from Prefetch\""
    description_sk: "Vymaže súbory Prefetch (dočasne spomalí nasledujúci štart systému)."
    description_en: "Removes Prefetch files (temporarily slows next boot)."

  - id: wer_reports
    label_sk: "Hlásenia o chybách (WER)"
    label_en: "Error reports (WER)"
    risk: SAFE
    command: "function Remove-PfSafe([string]$Path) { $n = 0; $i = Get-Item -LiteralPath $Path -Force -EA SilentlyContinue; if (-not $i) { return $n }; $ro = [IO.FileAttributes]::ReadOnly; $rp = [IO.FileAttributes]::ReparsePoint; $dir = [IO.FileAttributes]::Directory; $dirs = New-Object System.Collections.Generic.List[string]; $todo = New-Object System.Collections.Generic.Stack[string]; $todo.Push($i.FullName); while ($todo.Count -gt 0) { $p = $todo.Pop(); try { $a = [IO.File]::GetAttributes($p) } catch [IO.FileNotFoundException], [IO.DirectoryNotFoundException] { continue } catch { $n++; continue }; if (($a -band $dir) -and -not ($a -band $rp)) { $dirs.Add($p); try { foreach ($c in [IO.Directory]::GetFileSystemEntries($p)) { $todo.Push($c) } } catch { $n++ }; continue }; try { if ($a -band $rp) { if ($a -band $dir) { [IO.Directory]::Delete($p) } else { [IO.File]::Delete($p) } } else { if ($a -band $ro) { [IO.File]::SetAttributes($p, ($a -bxor $ro)) }; [IO.File]::Delete($p) } } catch { $n++ } }; for ($k = $dirs.Count - 1; $k -ge 0; $k--) { $d = $dirs[$k]; try { $a = [IO.File]::GetAttributes($d); if (($a -band $ro) -and -not ($a -band $rp)) { [IO.File]::SetAttributes($d, ($a -bxor $ro)) }; [IO.Directory]::Delete($d) } catch [IO.FileNotFoundException], [IO.DirectoryNotFoundException] { } catch { $left = 1; try { $left = @([IO.Directory]::GetFileSystemEntries($d)).Count } catch { }; if ($left -eq 0) { $n++ } } }; return $n }; $skipped = 0; foreach ($p in @(\"C:\\ProgramData\\Microsoft\\Windows\\WER\\ReportQueue\",\"C:\\ProgramData\\Microsoft\\Windows\\WER\\ReportArchive\",\"$env:LOCALAPPDATA\\Microsoft\\Windows\\WER\\ReportQueue\",\"$env:LOCALAPPDATA\\Microsoft\\Windows\\WER\\ReportArchive\")) { $skipped += Remove-PfSafe $p }; Write-Output (\"Skipped locked/in-use items: \" + $skipped)"
    preview_command: "$f = Get-ChildItem \"C:\\ProgramData\\Microsoft\\Windows\\WER\\ReportQueue\",\"C:\\ProgramData\\Microsoft\\Windows\\WER\\ReportArchive\",\"$env:LOCALAPPDATA\\Microsoft\\Windows\\WER\\ReportQueue\",\"$env:LOCALAPPDATA\\Microsoft\\Windows\\WER\\ReportArchive\" -Recurse -File -Force -EA SilentlyContinue; $c = $f.Count; $mb = [math]::Round((($f | Measure-Object Length -Sum).Sum)/1MB,2); Write-Output \"Would delete $c files, $mb MB from WER report queues\""
    description_sk: "Vymaže frontu a archív hlásení o chybách (pre celý systém aj pre jednotlivých používateľov)."
    description_en: "Clears the WER report queue and archive (both machine-wide and per-user)."

  - id: cbs_logs
    label_sk: "Staré CBS logy"
    label_en: "Old CBS logs"
    risk: SAFE
    command: "$logs = Get-ChildItem \"$env:WINDIR\\Logs\\CBS\\CBS*.log\" -EA SilentlyContinue | Sort-Object LastWriteTime -Descending | Select-Object -Skip 1; $cabs = Get-ChildItem \"$env:WINDIR\\Logs\\CBS\\CbsPersist_*.cab\" -EA SilentlyContinue; $targets = @($logs) + @($cabs); $targets | Remove-Item -Force -EA SilentlyContinue -ErrorVariable errs; Write-Output (\"Removed \" + $targets.Count + \" old CBS file(s), skipped/locked: \" + $errs.Count)"
    preview_command: "$logs = Get-ChildItem \"$env:WINDIR\\Logs\\CBS\\CBS*.log\" -EA SilentlyContinue | Sort-Object LastWriteTime -Descending | Select-Object -Skip 1; $cabs = Get-ChildItem \"$env:WINDIR\\Logs\\CBS\\CbsPersist_*.cab\" -EA SilentlyContinue; $f = @($logs) + @($cabs); $c = $f.Count; $mb = [math]::Round((($f | Measure-Object Length -Sum).Sum)/1MB,2); Write-Output \"Would delete $c old CBS file(s), $mb MB (keeping newest .log)\""
    description_sk: "Vymaže staré CBS logy a archívy (CbsPersist_*.cab), ponechá najnovší log."
    description_en: "Removes old CBS logs and archives (CbsPersist_*.cab), keeps the newest log."

  - id: thumbnail_cache
    label_sk: "Cache náhľadov"
    label_en: "Thumbnail cache"
    risk: SAFE
    command: "Stop-Process -Name explorer -Force -EA SilentlyContinue; for ($i = 0; $i -lt 20; $i++) { if (-not (Get-Process -Name explorer -EA SilentlyContinue)) { break }; Start-Sleep -Milliseconds 200 }; try { Remove-Item \"$env:LOCALAPPDATA\\Microsoft\\Windows\\Explorer\\thumbcache_*.db\" -Force -EA SilentlyContinue -ErrorVariable errs } finally { Start-Process explorer.exe; for ($i = 0; $i -lt 20; $i++) { if (Get-Process -Name explorer -EA SilentlyContinue) { break }; Start-Sleep -Milliseconds 200 } }; $restarted = [bool](Get-Process -Name explorer -EA SilentlyContinue); $msg = \"Skipped locked/in-use items: \" + $errs.Count + \"; Explorer restart: \"; if (-not $restarted) { Write-Output ($msg + \"FAILED\"); exit 1 }; Write-Output ($msg + \"OK\")"
    preview_command: "$f = Get-ChildItem \"$env:LOCALAPPDATA\\Microsoft\\Windows\\Explorer\\thumbcache_*.db\" -EA SilentlyContinue; $c = $f.Count; $mb = [math]::Round((($f | Measure-Object Length -Sum).Sum)/1MB,2); Write-Output \"Would delete $c thumbnail cache file(s), $mb MB, and restart Explorer\""
    description_sk: "Vymaže cache náhľadov a reštartuje Explorer (najprv počká, kým sa pôvodný proces úplne ukončí, aby reštart nezlyhal)."
    description_en: "Clears the thumbnail cache and restarts Explorer (waits for the old process to fully exit first, so the restart doesn't crash)."

  - id: font_cache
    label_sk: "Cache písiem"
    label_en: "Font cache"
    risk: MODERATE
    changes_system: false  # a cache Windows rebuilds - nothing a restore point would roll back
    command: "Stop-Service FontCache -Force -EA SilentlyContinue; Remove-Item \"$env:WINDIR\\ServiceProfiles\\LocalService\\AppData\\Local\\FontCache\\*\" -Force -EA SilentlyContinue -ErrorVariable errs; Start-Service FontCache -EA SilentlyContinue -ErrorVariable startErrs; $msg = \"Skipped locked/in-use items: \" + $errs.Count + \"; FontCache service restart: \"; if ($startErrs.Count -gt 0) { Write-Output ($msg + \"FAILED\"); exit 1 }; Write-Output ($msg + \"OK\")"
    preview_command: "$f = Get-ChildItem \"$env:WINDIR\\ServiceProfiles\\LocalService\\AppData\\Local\\FontCache\" -File -EA SilentlyContinue; $c = $f.Count; $mb = [math]::Round((($f | Measure-Object Length -Sum).Sum)/1MB,2); Write-Output \"Would clear $c font cache file(s), $mb MB, restarting FontCache service\""
    description_sk: "Reštartuje službu FontCache a vymaže jej cache."
    description_en: "Restarts the FontCache service and clears its cache."

  - id: delivery_optimization
    label_sk: "Cache Delivery Optimization"
    label_en: "Delivery Optimization cache"
    risk: SAFE
    command: "try { Delete-DeliveryOptimizationCache -Force -EA Stop; Write-Output 'Delivery Optimization cache cleared.' } catch { Write-Output ('Delivery Optimization cache clear skipped: ' + $_.Exception.Message) }"
    preview_command: "$f = Get-ChildItem \"$env:WINDIR\\SoftwareDistribution\\DeliveryOptimization\" -Recurse -File -Force -EA SilentlyContinue; $c = $f.Count; $mb = [math]::Round((($f | Measure-Object Length -Sum).Sum)/1MB,2); Write-Output \"Would clear $c files, $mb MB of Delivery Optimization cache\""
    description_sk: "Vymaže cache Delivery Optimization."
    description_en: "Clears the Delivery Optimization cache."

  - id: windows_update_cache
    label_sk: "Cache Windows Update"
    label_en: "Windows Update cache"
    risk: MODERATE
    changes_system: false  # downloaded update files only - re-downloaded on demand
    command: "function Remove-PfSafe([string]$Path) { $n = 0; $i = Get-Item -LiteralPath $Path -Force -EA SilentlyContinue; if (-not $i) { return $n }; $ro = [IO.FileAttributes]::ReadOnly; $rp = [IO.FileAttributes]::ReparsePoint; $dir = [IO.FileAttributes]::Directory; $dirs = New-Object System.Collections.Generic.List[string]; $todo = New-Object System.Collections.Generic.Stack[string]; $todo.Push($i.FullName); while ($todo.Count -gt 0) { $p = $todo.Pop(); try { $a = [IO.File]::GetAttributes($p) } catch [IO.FileNotFoundException], [IO.DirectoryNotFoundException] { continue } catch { $n++; continue }; if (($a -band $dir) -and -not ($a -band $rp)) { $dirs.Add($p); try { foreach ($c in [IO.Directory]::GetFileSystemEntries($p)) { $todo.Push($c) } } catch { $n++ }; continue }; try { if ($a -band $rp) { if ($a -band $dir) { [IO.Directory]::Delete($p) } else { [IO.File]::Delete($p) } } else { if ($a -band $ro) { [IO.File]::SetAttributes($p, ($a -bxor $ro)) }; [IO.File]::Delete($p) } } catch { $n++ } }; for ($k = $dirs.Count - 1; $k -ge 0; $k--) { $d = $dirs[$k]; try { $a = [IO.File]::GetAttributes($d); if (($a -band $ro) -and -not ($a -band $rp)) { [IO.File]::SetAttributes($d, ($a -bxor $ro)) }; [IO.Directory]::Delete($d) } catch [IO.FileNotFoundException], [IO.DirectoryNotFoundException] { } catch { $left = 1; try { $left = @([IO.Directory]::GetFileSystemEntries($d)).Count } catch { }; if ($left -eq 0) { $n++ } } }; return $n }; Stop-Service wuauserv,bits -Force -EA SilentlyContinue; $skipped = 0; Get-ChildItem -LiteralPath \"$env:WINDIR\\SoftwareDistribution\\Download\" -Force -EA SilentlyContinue | ForEach-Object { $skipped += Remove-PfSafe $_.FullName }; Start-Service wuauserv,bits -EA SilentlyContinue -ErrorVariable startErrs; $msg = \"Skipped locked/in-use items: \" + $skipped + \"; service restart: \"; if ($startErrs.Count -gt 0) { Write-Output ($msg + \"FAILED\"); exit 1 }; Write-Output ($msg + \"OK\")"
    preview_command: "$f = Get-ChildItem \"$env:WINDIR\\SoftwareDistribution\\Download\" -Recurse -File -EA SilentlyContinue; $c = $f.Count; $mb = [math]::Round((($f | Measure-Object Length -Sum).Sum)/1MB,2); Write-Output \"Would delete $c files, $mb MB from Windows Update cache\""
    description_sk: "Zastaví služby, vymaže stiahnuté aktualizácie a služby znova spustí."
    description_en: "Stops services, clears downloaded updates, restarts services."

  - id: component_store_cleanup
    label_sk: "Čistenie úložiska komponentov"
    label_en: "Component store cleanup"
    risk: MODERATE
    changes_system: false  # superseded WinSxS versions - a restore point cannot bring them back
    command: "Dism.exe /Online /Cleanup-Image /StartComponentCleanup; if ($LASTEXITCODE -eq 3010) { Write-Output 'Component store cleaned - restart required.'; exit 0 } else { exit $LASTEXITCODE }"
    preview_command: "Dism.exe /Online /Cleanup-Image /AnalyzeComponentStore"
    description_sk: "Vyčistí úložisko komponentov (bez ResetBase)."
    description_en: "Cleans the component store (no ResetBase)."

  - id: component_store_resetbase
    label_sk: "Úložisko komponentov - ResetBase"
    label_en: "Component store - ResetBase"
    risk: DESTRUCTIVE
    command: "Dism.exe /Online /Cleanup-Image /StartComponentCleanup /ResetBase; if ($LASTEXITCODE -eq 3010) { Write-Output 'Component store reset - restart required.'; exit 0 } else { exit $LASTEXITCODE }"
    preview_command: "Write-Output \"ResetBase permanently removes the ability to uninstall currently installed Windows updates. This cannot be undone.\"; Dism.exe /Online /Cleanup-Image /AnalyzeComponentStore"
    description_sk: "Znemožní odinštalovanie aktuálne nainštalovaných aktualizácií. Nevratné."
    description_en: "Prevents uninstalling currently installed updates. Irreversible."

  - id: windows_old_removal
    label_sk: "Odstránenie Windows.old"
    label_en: "Remove Windows.old"
    risk: DESTRUCTIVE
    command: "function Remove-PfSafe([string]$Path) { $n = 0; $i = Get-Item -LiteralPath $Path -Force -EA SilentlyContinue; if (-not $i) { return $n }; $ro = [IO.FileAttributes]::ReadOnly; $rp = [IO.FileAttributes]::ReparsePoint; $dir = [IO.FileAttributes]::Directory; $dirs = New-Object System.Collections.Generic.List[string]; $todo = New-Object System.Collections.Generic.Stack[string]; $todo.Push($i.FullName); while ($todo.Count -gt 0) { $p = $todo.Pop(); try { $a = [IO.File]::GetAttributes($p) } catch [IO.FileNotFoundException], [IO.DirectoryNotFoundException] { continue } catch { $n++; continue }; if (($a -band $dir) -and -not ($a -band $rp)) { $dirs.Add($p); try { foreach ($c in [IO.Directory]::GetFileSystemEntries($p)) { $todo.Push($c) } } catch { $n++ }; continue }; try { if ($a -band $rp) { if ($a -band $dir) { [IO.Directory]::Delete($p) } else { [IO.File]::Delete($p) } } else { if ($a -band $ro) { [IO.File]::SetAttributes($p, ($a -bxor $ro)) }; [IO.File]::Delete($p) } } catch { $n++ } }; for ($k = $dirs.Count - 1; $k -ge 0; $k--) { $d = $dirs[$k]; try { $a = [IO.File]::GetAttributes($d); if (($a -band $ro) -and -not ($a -band $rp)) { [IO.File]::SetAttributes($d, ($a -bxor $ro)) }; [IO.Directory]::Delete($d) } catch [IO.FileNotFoundException], [IO.DirectoryNotFoundException] { } catch { $left = 1; try { $left = @([IO.Directory]::GetFileSystemEntries($d)).Count } catch { }; if ($left -eq 0) { $n++ } } }; return $n }; $p = 'C:\\Windows.old'; $skipped = 0; if (Test-Path -LiteralPath $p) { if (-not ((Get-Item -LiteralPath $p -Force).Attributes -band [IO.FileAttributes]::ReparsePoint)) { takeown /F $p /R /A /D Y | Out-Null; icacls $p /reset /T /C | Out-Null }; $skipped = Remove-PfSafe $p }; Write-Output (\"Skipped locked/in-use items: \" + $skipped)"
    preview_command: "if (Test-Path C:\\Windows.old) { $f = Get-ChildItem C:\\Windows.old -Recurse -File -Force -EA SilentlyContinue; $c = $f.Count; $gb = [math]::Round((($f | Measure-Object Length -Sum).Sum)/1GB,2); Write-Output \"Would delete $c files, $gb GB from C:\\Windows.old (ownership/ACL reset may take several minutes on large Windows.old folders)\" } else { Write-Output \"C:\\Windows.old not present\" }"
    description_sk: "Odstráni C:\\Windows.old. Nevratné."
    description_en: "Removes C:\\Windows.old. Irreversible."

  - id: shadow_copies_oldest
    label_sk: "Najstaršia shadow copy"
    label_en: "Oldest shadow copy"
    risk: DESTRUCTIVE
    command: "try { $vol = (Get-CimInstance Win32_Volume -Filter \"DriveLetter='C:'\" -EA Stop).DeviceID; $shadows = @(Get-CimInstance Win32_ShadowCopy -EA Stop | Where-Object { $_.VolumeName -eq $vol } | Sort-Object InstallDate) } catch { Write-Output ('Could not query shadow copies on C: (needs administrator): ' + $_.Exception.Message); exit 1 }; if ($shadows.Count -eq 0) { Write-Output 'No shadow copies on C: - nothing to delete.'; exit 0 }; $oldest = $shadows[0]; if (-not $oldest.InstallDate -or $oldest.InstallDate -gt (Get-Date).AddHours(-24)) { Write-Output ('Skipped: the oldest shadow copy on C: (created ' + $oldest.InstallDate + ') is less than 24 h old and may be the restore point just created for this session - nothing deleted.'); exit 0 }; Write-Output ('Deleting the oldest shadow copy on C: (created ' + $oldest.InstallDate + ').'); $out = vssadmin delete shadows /for=C: /oldest /quiet 2>&1 | Out-String; Write-Output $out; exit $LASTEXITCODE"
    preview_command: "$vol = (Get-CimInstance Win32_Volume -Filter \"DriveLetter='C:'\" -EA SilentlyContinue).DeviceID; $shadows = @(Get-CimInstance Win32_ShadowCopy -EA SilentlyContinue | Where-Object { $_.VolumeName -eq $vol } | Sort-Object InstallDate); if ($shadows.Count -gt 0) { $shadows | Select-Object ID,InstallDate,VolumeName | Format-Table -AutoSize | Out-String -Width 250; if (-not $shadows[0].InstallDate -or $shadows[0].InstallDate -gt (Get-Date).AddHours(-24)) { Write-Output 'Would delete nothing: the oldest shadow copy on C: is less than 24 h old.' } else { Write-Output ('Would delete only the oldest one, created ' + $shadows[0].InstallDate + '.') } } else { Write-Output 'No shadow copies exist on C: (or insufficient privileges to query them).' }; Write-Output 'Protection: a shadow copy younger than 24 h - including the restore point PortableFix creates right before this batch - is never deleted.'"
    description_sk: "Zmaže najstaršiu shadow copy na disku C:, no iba ak je staršia ako 24 hodín - body obnovenia mladšie ako 24 h (vrátane toho, ktorý tento beh práve vytvoril) sa nikdy nezmažú. Ak na C: nie je žiadna shadow copy, nič nerobí. Nevratné."
    description_en: "Deletes the oldest shadow copy on drive C:, but only if it is older than 24 hours - restore points younger than 24 h (including the one this run just created) are never deleted. Does nothing if C: has no shadow copies. Irreversible."

  - id: hibernation_off
    label_sk: "Vypnutie hibernácie"
    label_en: "Disable hibernation"
    risk: MODERATE
    command: "powercfg /h off"
    preview_command: "if (Test-Path \"$env:SystemDrive\\hiberfil.sys\") { $mb = [math]::Round((Get-Item \"$env:SystemDrive\\hiberfil.sys\" -Force).Length/1MB,2); Write-Output \"Would free approximately $mb MB by disabling hibernation\" } else { Write-Output \"Hibernation already disabled\" }"
    description_sk: "Vypne hibernáciu a uvoľní miesto, ktoré zaberá hiberfil.sys. Vypne aj rýchle spustenie (Fast Startup), keďže od hibernácie závisí."
    description_en: "Disables hibernation and frees the space used by hiberfil.sys. Also disables Fast Startup, since it depends on hibernation."

  - id: stale_user_profiles
    label_sk: "Staré používateľské profily"
    label_en: "Stale user profiles"
    risk: DESTRUCTIVE
    command: "$stale = @(Get-CimInstance Win32_UserProfile | Where-Object {-not $_.Special -and -not $_.Loaded -and $_.LastUseTime -ne $null -and $_.LastUseTime -lt (Get-Date).AddDays(-180)}); $stale | Remove-CimInstance -EA SilentlyContinue -ErrorVariable errs; Write-Output (\"Removed profiles: \" + $stale.Count + \", errors: \" + $errs.Count)"
    preview_command: "Get-CimInstance Win32_UserProfile | Where-Object {-not $_.Special -and -not $_.Loaded -and $_.LastUseTime -ne $null -and $_.LastUseTime -lt (Get-Date).AddDays(-180)} | Select-Object LocalPath,LastUseTime | Format-Table"
    description_sk: "Odstráni neaktívne používateľské profily staršie ako 180 dní. Nevratné. Poznámka: pri roamingových profiloch alebo rýchlom prepínaní používateľov nemusí byť hodnota LastUseTime vždy presná."
    description_en: "Removes inactive user profiles older than 180 days. Irreversible. Note: LastUseTime may not always be accurate for roaming profiles/fast user switching."

  - id: browser_cache_sweep
    label_sk: "Cache prehliadačov (Chrome/Edge/Firefox)"
    label_en: "Browser caches (Chrome/Edge/Firefox)"
    risk: MODERATE
    changes_system: false  # browser caches - rebuilt on use
    command: "function Remove-PfSafe([string]$Path) { $n = 0; $i = Get-Item -LiteralPath $Path -Force -EA SilentlyContinue; if (-not $i) { return $n }; $ro = [IO.FileAttributes]::ReadOnly; $rp = [IO.FileAttributes]::ReparsePoint; $dir = [IO.FileAttributes]::Directory; $dirs = New-Object System.Collections.Generic.List[string]; $todo = New-Object System.Collections.Generic.Stack[string]; $todo.Push($i.FullName); while ($todo.Count -gt 0) { $p = $todo.Pop(); try { $a = [IO.File]::GetAttributes($p) } catch [IO.FileNotFoundException], [IO.DirectoryNotFoundException] { continue } catch { $n++; continue }; if (($a -band $dir) -and -not ($a -band $rp)) { $dirs.Add($p); try { foreach ($c in [IO.Directory]::GetFileSystemEntries($p)) { $todo.Push($c) } } catch { $n++ }; continue }; try { if ($a -band $rp) { if ($a -band $dir) { [IO.Directory]::Delete($p) } else { [IO.File]::Delete($p) } } else { if ($a -band $ro) { [IO.File]::SetAttributes($p, ($a -bxor $ro)) }; [IO.File]::Delete($p) } } catch { $n++ } }; for ($k = $dirs.Count - 1; $k -ge 0; $k--) { $d = $dirs[$k]; try { $a = [IO.File]::GetAttributes($d); if (($a -band $ro) -and -not ($a -band $rp)) { [IO.File]::SetAttributes($d, ($a -bxor $ro)) }; [IO.Directory]::Delete($d) } catch [IO.FileNotFoundException], [IO.DirectoryNotFoundException] { } catch { $left = 1; try { $left = @([IO.Directory]::GetFileSystemEntries($d)).Count } catch { }; if ($left -eq 0) { $n++ } } }; return $n }; $paths = @(\"$env:LOCALAPPDATA\\Google\\Chrome\\User Data\\Default\\Cache\",\"$env:LOCALAPPDATA\\Google\\Chrome\\User Data\\Default\\Code Cache\",\"$env:LOCALAPPDATA\\Google\\Chrome\\User Data\\Default\\GPUCache\",\"$env:LOCALAPPDATA\\Microsoft\\Edge\\User Data\\Default\\Cache\",\"$env:LOCALAPPDATA\\Microsoft\\Edge\\User Data\\Default\\Code Cache\",\"$env:LOCALAPPDATA\\Microsoft\\Edge\\User Data\\Default\\GPUCache\"); $fx = Get-ChildItem \"$env:LOCALAPPDATA\\Mozilla\\Firefox\\Profiles\\*\\cache2\" -Directory -EA SilentlyContinue; $targets = @($paths | Where-Object { Test-Path $_ }) + @($fx.FullName); $swept = 0; $skipped = 0; foreach ($t in $targets) { Get-ChildItem $t -Force -EA SilentlyContinue | ForEach-Object { $skipped += Remove-PfSafe $_.FullName }; $swept++ }; Write-Output (\"Swept \" + $swept + \" cache folder(s), skipped/locked: \" + $skipped)"
    preview_command: "$paths = @(\"$env:LOCALAPPDATA\\Google\\Chrome\\User Data\\Default\\Cache\",\"$env:LOCALAPPDATA\\Google\\Chrome\\User Data\\Default\\Code Cache\",\"$env:LOCALAPPDATA\\Google\\Chrome\\User Data\\Default\\GPUCache\",\"$env:LOCALAPPDATA\\Microsoft\\Edge\\User Data\\Default\\Cache\",\"$env:LOCALAPPDATA\\Microsoft\\Edge\\User Data\\Default\\Code Cache\",\"$env:LOCALAPPDATA\\Microsoft\\Edge\\User Data\\Default\\GPUCache\"); $fx = Get-ChildItem \"$env:LOCALAPPDATA\\Mozilla\\Firefox\\Profiles\\*\\cache2\" -Directory -EA SilentlyContinue; $targets = @($paths | Where-Object { Test-Path $_ }) + @($fx.FullName); $f = $targets | ForEach-Object { Get-ChildItem $_ -Recurse -File -Force -EA SilentlyContinue }; $c = $f.Count; $mb = [math]::Round((($f | Measure-Object Length -Sum).Sum)/1MB,2); Write-Output \"Would delete $c files, $mb MB from browser caches (Chrome/Edge/Firefox)\""
    description_sk: "Vyčistí priečinky cache prehliadačov Chrome, Edge a Firefox pre aktuálneho používateľa (cookies ani históriu nemaže)."
    description_en: "Clears Chrome, Edge and Firefox cache folders (not cookies or history) for the current user."

  - id: windows_upgrade_leftovers
    label_sk: "Pozostatky inovácie Windows"
    label_en: "Windows upgrade leftovers"
    risk: DESTRUCTIVE
    command: "function Remove-PfSafe([string]$Path) { $n = 0; $i = Get-Item -LiteralPath $Path -Force -EA SilentlyContinue; if (-not $i) { return $n }; $ro = [IO.FileAttributes]::ReadOnly; $rp = [IO.FileAttributes]::ReparsePoint; $dir = [IO.FileAttributes]::Directory; $dirs = New-Object System.Collections.Generic.List[string]; $todo = New-Object System.Collections.Generic.Stack[string]; $todo.Push($i.FullName); while ($todo.Count -gt 0) { $p = $todo.Pop(); try { $a = [IO.File]::GetAttributes($p) } catch [IO.FileNotFoundException], [IO.DirectoryNotFoundException] { continue } catch { $n++; continue }; if (($a -band $dir) -and -not ($a -band $rp)) { $dirs.Add($p); try { foreach ($c in [IO.Directory]::GetFileSystemEntries($p)) { $todo.Push($c) } } catch { $n++ }; continue }; try { if ($a -band $rp) { if ($a -band $dir) { [IO.Directory]::Delete($p) } else { [IO.File]::Delete($p) } } else { if ($a -band $ro) { [IO.File]::SetAttributes($p, ($a -bxor $ro)) }; [IO.File]::Delete($p) } } catch { $n++ } }; for ($k = $dirs.Count - 1; $k -ge 0; $k--) { $d = $dirs[$k]; try { $a = [IO.File]::GetAttributes($d); if (($a -band $ro) -and -not ($a -band $rp)) { [IO.File]::SetAttributes($d, ($a -bxor $ro)) }; [IO.Directory]::Delete($d) } catch [IO.FileNotFoundException], [IO.DirectoryNotFoundException] { } catch { $left = 1; try { $left = @([IO.Directory]::GetFileSystemEntries($d)).Count } catch { }; if ($left -eq 0) { $n++ } } }; return $n }; $paths = @('C:\\$WINDOWS.~BT','C:\\$WINDOWS.~WS',\"$env:WINDIR\\WinREAgent\"); $processed = 0; $skipped = 0; foreach ($p in $paths) { if (Test-Path -LiteralPath $p) { if (-not ((Get-Item -LiteralPath $p -Force).Attributes -band [IO.FileAttributes]::ReparsePoint)) { takeown /F $p /R /A /D Y | Out-Null; icacls $p /reset /T /C | Out-Null }; $skipped += Remove-PfSafe $p; $processed++ } }; Write-Output (\"Processed \" + $processed + \" leftover folder(s), skipped/locked: \" + $skipped)"
    preview_command: "$paths = @('C:\\$WINDOWS.~BT','C:\\$WINDOWS.~WS',\"$env:WINDIR\\WinREAgent\"); $existing = $paths | Where-Object { Test-Path $_ }; if ($existing) { $f = $existing | ForEach-Object { Get-ChildItem $_ -Recurse -File -Force -EA SilentlyContinue }; $c = $f.Count; $gb = [math]::Round((($f | Measure-Object Length -Sum).Sum)/1GB,2); Write-Output \"Would delete $c files, $gb GB from Windows upgrade leftovers\" } else { Write-Output \"No Windows upgrade leftovers found\" }"
    description_sk: "Odstráni pozostatky po inovácii Windows ($WINDOWS.~BT, $WINDOWS.~WS, WinREAgent). Nevratné - znemožní návrat na predošlú verziu."
    description_en: "Removes Windows upgrade leftovers ($WINDOWS.~BT, $WINDOWS.~WS, WinREAgent). Irreversible - prevents rolling back to the previous version."

  - id: gpu_driver_install_leftovers
    label_sk: "Pozostatky inštalácie GPU ovládačov"
