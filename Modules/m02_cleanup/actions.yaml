  - id: largest_files_report
    label_sk: "Najväčšie súbory (Plocha/Dokumenty/Stiahnuté...)"
    label_en: "Largest files (Desktop/Documents/Downloads...)"
    risk: SAFE
    command: "$folders = @('Desktop','Documents','Downloads','Pictures','Videos','Music') | ForEach-Object { Join-Path $env:USERPROFILE $_ } | Where-Object { Test-Path $_ }; $files = Get-ChildItem $folders -Recurse -File -Force -EA SilentlyContinue; if ($files) { $files | Sort-Object Length -Descending | Select-Object -First 25 FullName,@{N='SizeMB';E={[math]::Round($_.Length/1MB,2)}} | Format-Table -AutoSize } else { Write-Output 'No files found.' }"
    preview_command: "$folders = @('Desktop','Documents','Downloads','Pictures','Videos','Music') | ForEach-Object { Join-Path $env:USERPROFILE $_ } | Where-Object { Test-Path $_ }; $files = Get-ChildItem $folders -Recurse -File -Force -EA SilentlyContinue; if ($files) { $files | Sort-Object Length -Descending | Select-Object -First 25 FullName,@{N='SizeMB';E={[math]::Round($_.Length/1MB,2)}} | Format-Table -AutoSize } else { Write-Output 'No files found.' }"
    description_sk: "Vypíše 25 najväčších súborov v priečinkoch Plocha/Dokumenty/Stiahnuté/Obrázky/Videá/Hudba. Nič nemaže, slúži len na prehľad."
    description_en: "Lists the 25 largest files in Desktop/Documents/Downloads/Pictures/Videos/Music. Deletes nothing, report only."

  - id: largest_folders_report
    label_sk: "Najväčšie priečinky (Plocha/Dokumenty/Stiahnuté...)"
    label_en: "Largest folders (Desktop/Documents/Downloads...)"
    risk: SAFE
    command: "$folders = @('Desktop','Documents','Downloads','Pictures','Videos','Music') | ForEach-Object { Join-Path $env:USERPROFILE $_ } | Where-Object { Test-Path $_ }; $result = foreach ($base in $folders) { Get-ChildItem $base -Directory -Force -EA SilentlyContinue | ForEach-Object { $size = (Get-ChildItem $_.FullName -Recurse -File -Force -EA SilentlyContinue | Measure-Object Length -Sum).Sum; [PSCustomObject]@{ FullName = $_.FullName; SizeMB = [math]::Round(($size / 1MB), 2) } } }; if ($result) { $result | Sort-Object SizeMB -Descending | Select-Object -First 25 | Format-Table -AutoSize } else { Write-Output 'No subfolders found.' }"
    preview_command: "$folders = @('Desktop','Documents','Downloads','Pictures','Videos','Music') | ForEach-Object { Join-Path $env:USERPROFILE $_ } | Where-Object { Test-Path $_ }; $result = foreach ($base in $folders) { Get-ChildItem $base -Directory -Force -EA SilentlyContinue | ForEach-Object { $size = (Get-ChildItem $_.FullName -Recurse -File -Force -EA SilentlyContinue | Measure-Object Length -Sum).Sum; [PSCustomObject]@{ FullName = $_.FullName; SizeMB = [math]::Round(($size / 1MB), 2) } } }; if ($result) { $result | Sort-Object SizeMB -Descending | Select-Object -First 25 | Format-Table -AutoSize } else { Write-Output 'No subfolders found.' }"
    description_sk: "Vypíše 25 najväčších podpriečinkov (podľa celkovej veľkosti obsahu) v priečinkoch Plocha/Dokumenty/Stiahnuté/Obrázky/Videá/Hudba - doplnok k zoznamu najväčších súborov pre prípady, keď miesto zaberá veľa malých súborov v jednom priečinku. Nič nemaže, slúži len na prehľad."
    description_en: "Lists the 25 largest subfolders (by total contents) in Desktop/Documents/Downloads/Pictures/Videos/Music - complements the largest-files list for cases where space is eaten by many small files in one folder. Deletes nothing, report only."

  - id: crash_dumps
    label_sk: "Výpisy pádov systému (Minidump/MEMORY.DMP/LiveKernelReports)"
    label_en: "System crash dumps (Minidump/MEMORY.DMP/LiveKernelReports)"
    risk: MODERATE
    changes_system: false  # dump files - a restore point never covers them
    command: "function Remove-PfSafe([string]$Path) { $n = 0; $i = Get-Item -LiteralPath $Path -Force -EA SilentlyContinue; if (-not $i) { return $n }; $ro = [IO.FileAttributes]::ReadOnly; $rp = [IO.FileAttributes]::ReparsePoint; $dir = [IO.FileAttributes]::Directory; $dirs = New-Object System.Collections.Generic.List[string]; $todo = New-Object System.Collections.Generic.Stack[string]; $todo.Push($i.FullName); while ($todo.Count -gt 0) { $p = $todo.Pop(); try { $a = [IO.File]::GetAttributes($p) } catch [IO.FileNotFoundException], [IO.DirectoryNotFoundException] { continue } catch { $n++; continue }; if (($a -band $dir) -and -not ($a -band $rp)) { $dirs.Add($p); try { foreach ($c in [IO.Directory]::GetFileSystemEntries($p)) { $todo.Push($c) } } catch { $n++ }; continue }; try { if ($a -band $rp) { if ($a -band $dir) { [IO.Directory]::Delete($p) } else { [IO.File]::Delete($p) } } else { if ($a -band $ro) { [IO.File]::SetAttributes($p, ($a -bxor $ro)) }; [IO.File]::Delete($p) } } catch { $n++ } }; for ($k = $dirs.Count - 1; $k -ge 0; $k--) { $d = $dirs[$k]; try { $a = [IO.File]::GetAttributes($d); if (($a -band $ro) -and -not ($a -band $rp)) { [IO.File]::SetAttributes($d, ($a -bxor $ro)) }; [IO.Directory]::Delete($d) } catch [IO.FileNotFoundException], [IO.DirectoryNotFoundException] { } catch { $left = 1; try { $left = @([IO.Directory]::GetFileSystemEntries($d)).Count } catch { }; if ($left -eq 0) { $n++ } } }; return $n }; $targets = @(\"$env:SystemRoot\\Minidump\\*.dmp\",\"$env:SystemRoot\\MEMORY.DMP\",\"$env:SystemRoot\\LiveKernelReports\\*\") | Where-Object { Test-Path -Path $_ }; $skipped = 0; if ($targets) { Get-Item -Path $targets -Force -EA SilentlyContinue | ForEach-Object { $skipped += Remove-PfSafe $_.FullName } }; Write-Output (\"Skipped locked/in-use items: \" + $skipped)"
    preview_command: "$f = Get-ChildItem -Path \"$env:SystemRoot\\Minidump\\*.dmp\",\"$env:SystemRoot\\MEMORY.DMP\",\"$env:SystemRoot\\LiveKernelReports\" -Recurse -File -Force -EA SilentlyContinue; $c = $f.Count; $mb = [math]::Round((($f | Measure-Object Length -Sum).Sum)/1MB,2); Write-Output \"Would delete $c crash dump file(s), $mb MB (Minidump / MEMORY.DMP / LiveKernelReports)\""
    description_sk: "Vymaže výpisy pamäte po pádoch systému (BSOD) a hlásenia LiveKernelReports - od desiatok MB až po niekoľko GB. Zničí tým podklady na analýzu pádov, preto najprv spustite 'Prehľad pádov systému (BSOD)'; akcia nie je súčasťou 'Vybrať všetko'. Vyžaduje administrátora. Bez undo."
    description_en: "Deletes memory dumps left by system crashes (BSOD) and LiveKernelReports - from tens of MB up to several GB. This destroys the evidence needed for crash analysis, so run 'System crash (BSOD) summary' first; the action is not included in 'Select all'. Needs administrator. No undo."
    exclude_from_select_all: true

  - id: hidden_large_data_report
    label_sk: "Veľké skryté dáta (zálohy iPhone, disky WSL/Docker)"
    label_en: "Large hidden data (iPhone backups, WSL/Docker disks)"
    risk: SAFE
    command: "Write-Output '--- iPhone/iPad backups (iTunes / Apple Devices) ---'; $ios = @(\"$env:APPDATA\\Apple Computer\\MobileSync\\Backup\",\"$env:USERPROFILE\\Apple\\MobileSync\\Backup\") | Where-Object { Test-Path -LiteralPath $_ }; $rows = @(foreach ($p in $ios) { Get-ChildItem -LiteralPath $p -Directory -Force -EA SilentlyContinue | ForEach-Object { [PSCustomObject]@{ Backup = $_.Name; GB = [math]::Round(((Get-ChildItem -LiteralPath $_.FullName -Recurse -File -Force -EA SilentlyContinue | Measure-Object Length -Sum).Sum)/1GB,2); LastWrite = $_.LastWriteTime.ToString('yyyy-MM-dd'); Folder = $p } } }); if ($rows) { $rows | Format-Table -AutoSize | Out-String -Width 250; Write-Output ('Total: ' + [math]::Round((($rows | Measure-Object GB -Sum).Sum),2) + ' GB. Delete old backups only from iTunes / Apple Devices (Manage Backups) - a backup may be the only copy of a phone.') } else { Write-Output 'None found.' }; Write-Output '--- WSL / Docker virtual disks (.vhdx) ---'; $vhdx = @(Get-ChildItem -Path \"$env:LOCALAPPDATA\\Packages\\*\\LocalState\\*.vhdx\" -File -Force -EA SilentlyContinue) + @(Get-ChildItem -Path \"$env:LOCALAPPDATA\\Docker\\wsl\",\"$env:LOCALAPPDATA\\wsl\" -Recurse -Filter *.vhdx -File -Force -EA SilentlyContinue); if ($vhdx) { $vhdx | Select-Object FullName,@{N='GB';E={[math]::Round($_.Length/1GB,2)}},LastWriteTime | Format-Table -AutoSize | Out-String -Width 250; Write-Output ('Total: ' + [math]::Round((($vhdx | Measure-Object Length -Sum).Sum)/1GB,2) + ' GB. These disks grow but never shrink on their own: run wsl --shutdown, then compact them with Optimize-VHD (Hyper-V tools) or Docker Desktop > Troubleshoot > Clean / Purge data.') } else { Write-Output 'None found.' }"
    preview_command: "Write-Output '--- iPhone/iPad backups (iTunes / Apple Devices) ---'; $ios = @(\"$env:APPDATA\\Apple Computer\\MobileSync\\Backup\",\"$env:USERPROFILE\\Apple\\MobileSync\\Backup\") | Where-Object { Test-Path -LiteralPath $_ }; $rows = @(foreach ($p in $ios) { Get-ChildItem -LiteralPath $p -Directory -Force -EA SilentlyContinue | ForEach-Object { [PSCustomObject]@{ Backup = $_.Name; GB = [math]::Round(((Get-ChildItem -LiteralPath $_.FullName -Recurse -File -Force -EA SilentlyContinue | Measure-Object Length -Sum).Sum)/1GB,2); LastWrite = $_.LastWriteTime.ToString('yyyy-MM-dd'); Folder = $p } } }); if ($rows) { $rows | Format-Table -AutoSize | Out-String -Width 250; Write-Output ('Total: ' + [math]::Round((($rows | Measure-Object GB -Sum).Sum),2) + ' GB. Delete old backups only from iTunes / Apple Devices (Manage Backups) - a backup may be the only copy of a phone.') } else { Write-Output 'None found.' }; Write-Output '--- WSL / Docker virtual disks (.vhdx) ---'; $vhdx = @(Get-ChildItem -Path \"$env:LOCALAPPDATA\\Packages\\*\\LocalState\\*.vhdx\" -File -Force -EA SilentlyContinue) + @(Get-ChildItem -Path \"$env:LOCALAPPDATA\\Docker\\wsl\",\"$env:LOCALAPPDATA\\wsl\" -Recurse -Filter *.vhdx -File -Force -EA SilentlyContinue); if ($vhdx) { $vhdx | Select-Object FullName,@{N='GB';E={[math]::Round($_.Length/1GB,2)}},LastWriteTime | Format-Table -AutoSize | Out-String -Width 250; Write-Output ('Total: ' + [math]::Round((($vhdx | Measure-Object Length -Sum).Sum)/1GB,2) + ' GB. These disks grow but never shrink on their own: run wsl --shutdown, then compact them with Optimize-VHD (Hyper-V tools) or Docker Desktop > Troubleshoot > Clean / Purge data.') } else { Write-Output 'None found.' }"
    description_sk: "Nájde a zmeria zálohy iPhone/iPad z iTunes/Apple Devices a virtuálne disky WSL/Docker (.vhdx), ktoré často zaberajú desiatky GB mimo bežne kontrolovaných priečinkov. Len prehľad, nič nemaže - záloha môže byť jedinou kópiou dát z telefónu; disky WSL zmenšíte príkazmi wsl --shutdown a Optimize-VHD alebo v Docker Desktop."
    description_en: "Finds and sizes iPhone/iPad backups from iTunes/Apple Devices and WSL/Docker virtual disks (.vhdx), which often take tens of GB outside the usually checked folders. Report only, deletes nothing - a backup may be the phone's only copy; shrink WSL disks via wsl --shutdown plus Optimize-VHD, or in Docker Desktop."
    inactivity_timeout_sec: 600
