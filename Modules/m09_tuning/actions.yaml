module_id: m09_tuning
category: REPAIR
actions:
  - id: tune_power_plan_report
    label_sk: "Prehľad plánov napájania"
    label_en: "Power plan report"
    risk: SAFE
    command: "powercfg /list"
    description_sk: "Vypíše dostupné plány napájania a označí aktívny, nič nemení."
    description_en: "Lists available power plans and marks the active one, changes nothing."
  - id: tune_power_high_performance
    label_sk: "Prepnutie na vysoký výkon"
    label_en: "Switch to High Performance"
    risk: MODERATE
    command: "$target = '8c5e7fda-e8bf-4a96-9a85-a6e23a8c635c'; $exists = (powercfg /list) -match $target; if ($exists) { powercfg /setactive $target; Write-Output 'Switched to High Performance.' } else { Write-Output 'High Performance plan not available on this device (common on Modern Standby laptops) - no changes made.' }"
    undo_command: "powercfg /setactive 381b4222-f694-41f0-9685-ff5bb260df2e"
    description_sk: "Aktivuje plán napájania Vysoký výkon (ak je dostupný - na niektorých notebookoch s Modern Standby je skrytý alebo chýba). Undo vráti vyvážený plán (Balanced), nie pôvodný - ak ste používali vlastný plán, prepnite ho ručne."
    description_en: "Activates the High Performance power plan (if available - hidden/missing on some Modern Standby laptops). Undo restores the Balanced plan, not the previous one — if you used a custom plan, switch back manually."
  - id: tune_startup_apps_report
    label_sk: "Prehľad štartovacích aplikácií"
    label_en: "Startup applications report"
    risk: SAFE
    command: "Get-CimInstance Win32_StartupCommand | Select-Object Name,Command,Location,User | Format-List"
    description_sk: "Vypíše aplikácie spúšťané pri štarte systému, nič nemení."
    description_en: "Lists applications launched at system startup, changes nothing."
  - id: tune_visual_effects_performance
    label_sk: "Optimalizácia vizuálnych efektov na výkon"
    label_en: "Visual effects for performance"
    risk: MODERATE
    ops:
      - reg_set: {path: 'HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\VisualEffects', name: VisualFXSetting, type: DWord, value: 2}
      - reg_set: {path: 'HKCU\Control Panel\Desktop\WindowMetrics', name: MinAnimate, type: String, value: '0'}
      - reg_set: {path: 'HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced', name: TaskbarAnimations, type: DWord, value: 0}
      - reg_set: {path: 'HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced', name: ListviewAlphaSelect, type: DWord, value: 0}
      - reg_set: {path: 'HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced', name: ListviewShadow, type: DWord, value: 0}
      - reg_set: {path: 'HKCU\Software\Microsoft\Windows\DWM', name: EnableTransparency, type: DWord, value: 0}
    ops_message: "Visual effects set to best performance (animations, transparency, list-view effects disabled) - takes effect after sign-out/sign-in."
    description_sk: "Nastaví vizuálne efekty na najlepší výkon (vypne animácie, priehľadnosť okien, tiene v zoznamoch). Pred zmenou zachytí presný pôvodný stav (hodnotu a typ, alebo že hodnota či kľúč neexistovali) a undo ho presne obnoví - hodnoty a kľúče, ktoré predtým neexistovali, zmaže. Undo tak vráti presne predošlé nastavenie klienta, nie predvolené hodnoty Windows. HKCU je hive používateľa, pod ktorým PortableFix beží; undo spustené pod iným používateľom tieto hodnoty preskočí. Prejaví sa po odhlásení a opätovnom prihlásení."
    description_en: "Sets visual effects to best performance (disables animations, window transparency, list-view shadows). Captures the exact previous state first (value and type, or that the value or key did not exist) and undo restores exactly that - values and keys that did not exist before are deleted. Undo therefore returns the customer's own previous settings, not Windows defaults. HKCU is the hive of the user PortableFix runs as; an undo run as a different user skips these values. Takes effect after sign-out/sign-in."
  - id: tune_end_task_taskbar
    label_sk: "Ukončenie procesu pravým klikom na paneli úloh"
    label_en: "End Task with taskbar right-click"
    risk: MODERATE
    ops:
      - reg_set: {path: 'HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced\TaskbarDeveloperSettings', name: TaskbarEndTask, type: DWord, value: 1}
    ops_message: "End Task added to taskbar right-click menu (takes effect after Explorer restart/sign-in)."
    description_sk: "Pridá položku 'Ukončiť úlohu' do kontextového menu aplikácie na paneli úloh (pravý klik) - rýchly spôsob, ako ukončiť zamrznutú aplikáciu bez Task Manageru. Prejaví sa po reštarte Prieskumníka alebo po odhlásení. Pred zmenou zachytí presný pôvodný stav (hodnotu a typ, alebo že hodnota či kľúč neexistovali) a undo ho presne obnoví - hodnoty a kľúče, ktoré predtým neexistovali, zmaže. HKCU je hive používateľa, pod ktorým PortableFix beží; undo spustené pod iným používateľom tieto hodnoty preskočí."
    description_en: "Adds an 'End Task' item to the taskbar's right-click menu - a quick way to kill a frozen app without opening Task Manager. Takes effect after an Explorer restart/sign-in. Captures the exact previous state first (value and type, or that the value or key did not exist) and undo restores exactly that - values and keys that did not exist before are deleted. HKCU is the hive of the user PortableFix runs as; an undo run as a different user skips these values."
  - id: tune_sticky_keys_disable
    label_sk: "Vypnutie výzvy Sticky Keys (5x Shift)"
    label_en: "Disable Sticky Keys prompt (5x Shift)"
    risk: MODERATE
    ops:
      - reg_set: {path: 'HKCU\Control Panel\Accessibility\StickyKeys', name: Flags, type: String, value: '506'}
    ops_message: "Sticky Keys 5x-Shift prompt disabled."
    description_sk: "Vypne otravné vyskakovacie okno Sticky Keys, ktoré sa zobrazí po rýchlom 5x stlačení klávesu Shift (časté pri hraní hier). Samotnú funkciu Sticky Keys nemení, vypne len automatickú ponuku. Pôvodnú hodnotu zachytí pri každom behu zvlášť, takže undo (aj po opakovanom spustení) vráti presne nastavenie klienta. HKCU je hive používateľa, pod ktorým PortableFix beží; undo spustené pod iným používateľom tieto hodnoty preskočí."
    description_en: "Disables the annoying Sticky Keys popup triggered by pressing Shift 5 times quickly (common during gaming). Does not change Sticky Keys functionality itself, only the auto-prompt. The previous value is captured separately on every run, so undo (even after repeated runs) returns exactly the customer's setting. HKCU is the hive of the user PortableFix runs as; an undo run as a different user skips these values."
  - id: tune_classic_context_menu
    label_sk: "Obnovenie klasického kontextového menu (štýl Windows 10)"
    label_en: "Restore classic context menu (Windows 10 style)"
    risk: MODERATE
    ops:
      - reg_set: {path: 'HKCU\Software\Classes\CLSID\{86ca1aa0-34aa-4e8b-a509-50c905bae2a2}\InprocServer32', name: '(default)', type: String, value: ''}
    ops_message: "Classic full context menu restored (takes effect after Explorer restart/sign-in)."
    description_sk: "Vráti plné kontextové menu v štýle Windows 10 namiesto skráteného menu Windows 11 s položkou 'Zobraziť ďalšie možnosti'. Prejaví sa po reštarte Prieskumníka alebo po odhlásení. Undo odstráni kľúč, ktorý akcia vytvorila (len ak je prázdny), a vráti správanie Windows 11; ak kľúč existoval už predtým, vráti jeho pôvodnú hodnotu. HKCU je hive používateľa, pod ktorým PortableFix beží; undo spustené pod iným používateľom tieto hodnoty preskočí."
    description_en: "Restores the full (Windows 10-style) right-click context menu instead of Windows 11's shortened menu with 'Show more options'. Takes effect after an Explorer restart/sign-in. Undo removes the key the action created (only while empty), restoring Windows 11 behavior; if the key already existed, it restores its previous value. HKCU is the hive of the user PortableFix runs as; an undo run as a different user skips these values."
  - id: tune_ultimate_performance_power_plan
    label_sk: "Prepnutie na Ultimate Performance"
    label_en: "Switch to Ultimate Performance"
    risk: MODERATE
    command: "$gf = \"$env:ProgramData\\PortableFix\\ultimate_plan_guid.txt\"; New-Item -ItemType Directory -Force -Path (Split-Path $gf) | Out-Null; $guidRe = '[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}'; $guid = $null; if (Test-Path $gf) { $saved = [string](Get-Content $gf -Raw -EA SilentlyContinue); if ($saved -match $guidRe) { $saved = $Matches[0]; powercfg /query $saved 2>&1 | Out-Null; if ($LASTEXITCODE -eq 0) { $guid = $saved } } }; if (-not $guid) { $dup = powercfg -duplicatescheme e9a42b02-d5df-448d-aa00-03f14749eb61 2>&1 | Out-String; $new = [regex]::Matches($dup, $guidRe) | ForEach-Object { $_.Value } | Where-Object { $_ -ne 'e9a42b02-d5df-448d-aa00-03f14749eb61' } | Select-Object -First 1; if ($new) { $guid = $new; Set-Content -Path $gf -Value $guid -Encoding ASCII } }; if ($guid) { powercfg /setactive $guid; if ($LASTEXITCODE -ne 0) { Write-Output ('Could not activate the Ultimate Performance plan (' + $guid + ').'); exit 1 }; Write-Output ('Switched to Ultimate Performance plan (' + $guid + ').') } else { Write-Output 'Could not create/activate the Ultimate Performance plan - it may not be supported on this device.'; exit 1 }"
    undo_command: "powercfg /setactive 381b4222-f694-41f0-9685-ff5bb260df2e"
    description_sk: "Vytvorí (raz - GUID vytvoreného plánu uloží do $env:ProgramData\\PortableFix\\ultimate_plan_guid.txt a ďalšie behy ho znovu použijú, kým plán existuje, bez ohľadu na jazyk Windows) a aktivuje skrytý plán napájania Ultimate Performance - agresívnejší ako Vysoký výkon, vypína drobné úsporné mikrooptimalizácie v prospech stabilnejšieho výkonu. Prínos má hlavne na stolových počítačoch; na notebookoch zvýši spotrebu/teplotu bez merateľného zisku vo väčšine hier. Undo vráti vyvážený plán (Balanced), nie pôvodný."
    description_en: "Creates (once - the created plan's GUID is saved to $env:ProgramData\\PortableFix\\ultimate_plan_guid.txt and reused on later runs as long as that plan still exists, regardless of the Windows display language) and activates the hidden Ultimate Performance power plan - more aggressive than High Performance, disabling small power-saving micro-optimizations for more consistent performance. Mainly beneficial on desktops; on laptops it raises power draw/heat with no measurable gain in most games. Undo restores the Balanced plan, not the previous one."

  - id: tune_gpu_hardware_scheduling
    label_sk: "Hardvérovo akcelerované plánovanie GPU (HAGS)"
    label_en: "Hardware-accelerated GPU scheduling (HAGS)"
    risk: REQUIRES_REBOOT
    ops:
      - reg_set: {path: 'HKLM\SYSTEM\CurrentControlSet\Control\GraphicsDrivers', name: HwSchMode, type: DWord, value: 2}
    ops_message: "Hardware-accelerated GPU scheduling enabled - requires a reboot to take effect."
    description_sk: "Zapne hardvérovo akcelerované plánovanie GPU (HwSchMode=2) - presunie správu frontu GPU z ovládača na samotnú GPU; na podporovanom hardvéri (novšie GPU + ovládače) môže znížiť latenciu vstupu. Na nepodporovanom/staršom hardvéri nemá efekt alebo ho Windows potichu ignoruje. Prejaví sa až po reštarte. Pred zmenou zachytí presný pôvodný stav (hodnotu a typ, alebo že hodnota či kľúč neexistovali) a undo ho presne obnoví - hodnoty a kľúče, ktoré predtým neexistovali, zmaže."
    description_en: "Enables hardware-accelerated GPU scheduling (HwSchMode=2) - moves GPU queue management from the driver to the GPU itself; on supported hardware (newer GPU + drivers) this can reduce input latency. On unsupported/older hardware it has no effect or Windows silently ignores it. Requires a reboot to take effect. Captures the exact previous state first (value and type, or that the value or key did not exist) and undo restores exactly that - values and keys that did not exist before are deleted."
  - id: tune_foreground_priority
    label_sk: "Zvýhodnenie aktívneho okna (Win32PrioritySeparation)"
    label_en: "Foreground app priority boost (Win32PrioritySeparation)"
    risk: MODERATE
    ops:
      - reg_set: {path: 'HKLM\SYSTEM\CurrentControlSet\Control\PriorityControl', name: Win32PrioritySeparation, type: DWord, value: 38}
    ops_message: "Foreground app priority boost applied (short, fixed quantum favoring the active window) - takes effect for newly-started processes, sign-out/sign-in for full effect."
    description_sk: "Nastaví Win32PrioritySeparation na 38 (0x26) - klasická 'gaming' úprava registra, ktorá aktívnemu oknu (v popredí) pridelí kratšie a pevné časové kvantum CPU namiesto premenlivého, čím ho zvýhodní oproti procesom na pozadí. Efekt je jemný a sporný, nie zázračné zrýchlenie. Pred zmenou zachytí presný pôvodný stav (hodnotu a typ, alebo že hodnota či kľúč neexistovali) a undo ho presne obnoví - hodnoty a kľúče, ktoré predtým neexistovali, zmaže."
    description_en: "Sets Win32PrioritySeparation to 38 (0x26) - a classic 'gaming' registry tweak that gives the foreground (active) window a short, fixed CPU time quantum instead of a variable one, favoring it over background processes. The effect is subtle and debated, not a dramatic speedup. Captures the exact previous state first (value and type, or that the value or key did not exist) and undo restores exactly that - values and keys that did not exist before are deleted."
  - id: tune_disable_game_dvr
    label_sk: "Vypnutie nahrávania na pozadí v Xbox Game Bar (Game DVR)"
    label_en: "Disable Xbox Game Bar background recording (Game DVR)"
    risk: MODERATE
    ops:
      - reg_set: {path: 'HKCU\System\GameConfigStore', name: GameDVR_Enabled, type: DWord, value: 0}
      - reg_set: {path: 'HKCU\Software\Microsoft\Windows\CurrentVersion\GameDVR', name: AppCaptureEnabled, type: DWord, value: 0}
    ops_message: "Xbox Game Bar background capture (Game DVR) disabled - removes its recording overhead during games. Windows Game Mode itself is left on (it is generally beneficial, unlike background capture)."
    description_sk: "Vypne nahrávanie na pozadí cez Xbox Game Bar (Game DVR/AppCapture) - znižuje záťaž CPU/GPU a zápis na disk počas hrania. Samotný Game Mode ostáva zapnutý, pretože je všeobecne prospešný. Pred zmenou zachytí presný pôvodný stav (hodnotu a typ, alebo že hodnota či kľúč neexistovali) a undo ho presne obnoví - hodnoty a kľúče, ktoré predtým neexistovali, zmaže. HKCU je hive používateľa, pod ktorým PortableFix beží; undo spustené pod iným používateľom tieto hodnoty preskočí."
    description_en: "Disables background recording via Xbox Game Bar (Game DVR/AppCapture) - reduces CPU/GPU usage and disk writes while gaming, unlike Game Mode itself (left on, since it's generally beneficial). Captures the exact previous state first (value and type, or that the value or key did not exist) and undo restores exactly that - values and keys that did not exist before are deleted. HKCU is the hive of the user PortableFix runs as; an undo run as a different user skips these values."
  - id: tune_pause_background_services
    label_sk: "Dočasné pozastavenie služieb na pozadí (Search, SysMain)"
    label_en: "Temporarily pause background services (Search, SysMain)"
    risk: MODERATE
    command: "$svcs = 'WSearch','SysMain'; $stopped = @(); $failed = @(); foreach ($s in $svcs) { $svc = Get-Service -Name $s -EA SilentlyContinue; if ($svc -and $svc.Status -eq 'Running') { Stop-Service -Name $s -Force -EA SilentlyContinue; $svc.Refresh(); if ($svc.Status -eq 'Stopped') { $stopped += $s } else { $failed += $s } } }; if ($stopped) { Write-Output ('Paused: ' + ($stopped -join ', ') + ' (temporary - restarts automatically on next boot since startup type is unchanged).') }; if ($failed) { Write-Output ('Could not pause (needs administrator): ' + ($failed -join ', ')) }; if (-not $stopped -and -not $failed) { Write-Output 'Nothing to pause (already stopped or not present).' }; if ($failed -and -not $stopped) { exit 1 }"
    undo_command: "$restored = @(); $failed = @(); foreach ($s in 'WSearch','SysMain') { $svc = Get-Service -Name $s -EA SilentlyContinue; if ($svc -and $svc.Status -ne 'Running') { Start-Service -Name $s -EA SilentlyContinue; $svc.Refresh(); if ($svc.Status -eq 'Running') { $restored += $s } else { $failed += $s } } }; if ($restored) { Write-Output ('Restarted: ' + ($restored -join ', ')) }; if ($failed) { Write-Output ('Could not restart (needs administrator): ' + ($failed -join ', ')); exit 1 }; if (-not $restored -and -not $failed) { Write-Output 'Services already running.' }"
    description_sk: "Zastaví služby Windows Search (WSearch) a Superfetch/prefetch (SysMain), ak práve bežia - napr. na uvoľnenie CPU/disku počas náročnej úlohy. Vyžaduje administrátora. Mení sa iba stav bežiacich služieb, nie ich typ spustenia, preto sa pri najbližšom reštarte automaticky znovu spustia aj bez použitia undo. Undo ich spustí hneď."
    description_en: "Stops the Windows Search indexer (WSearch) and Superfetch/memory prefetch (SysMain) services if they are currently running - e.g. to free up CPU/disk during a demanding task. Needs administrator. Only running services are touched, not their startup type, so Windows restarts them automatically on the next boot even without running undo. Undo starts them right away."

  - id: tune_bluetooth_service_restart
    label_sk: "Reštart služby Bluetooth"
    label_en: "Restart Bluetooth service"
    risk: MODERATE
    command: "$svc = Get-Service -Name bthserv -EA SilentlyContinue; if (-not $svc) { Write-Output 'Bluetooth Support Service (bthserv) not found - no Bluetooth radio on this device.'; exit 1 }; Stop-Service -Name bthserv -Force -EA SilentlyContinue; $svc.Refresh(); Start-Service -Name bthserv -EA SilentlyContinue; $svc.Refresh(); if ($svc.Status -eq 'Running') { Write-Output 'Bluetooth Support Service restarted.' } else { Write-Output 'Could not restart Bluetooth Support Service (needs administrator).'; exit 1 }"
    description_sk: "Zastaví a znovu spustí službu Bluetooth Support Service (bthserv) - bežné riešenie, keď sa zariadenia nedajú spárovať alebo pripojiť. Vyžaduje administrátora. Bez undo."
    description_en: "Stops and restarts the Bluetooth Support Service (bthserv) - a common fix when Bluetooth devices won't pair/connect. Needs administrator. No undo."

  - id: tune_audio_service_restart
    label_sk: "Reštart zvukovej služby"
    label_en: "Restart audio service"
    risk: MODERATE
    command: "$names = 'AudioEndpointBuilder','Audiosrv'; Stop-Service -Name $names -Force -EA SilentlyContinue; Start-Service -Name $names -EA SilentlyContinue; $ok = @(); $failed = @(); foreach ($n in $names) { $s = Get-Service -Name $n -EA SilentlyContinue; if ($s -and $s.Status -eq 'Running') { $ok += $n } else { $failed += $n } }; if ($failed) { Write-Output ('Could not restart: ' + ($failed -join ', ') + ' (needs administrator).'); exit 1 } else { Write-Output ('Audio services restarted: ' + ($ok -join ', ')) }"
    description_sk: "Zastaví a znovu spustí služby Windows Audio Endpoint Builder a Windows Audio (Audiosrv) - bežné riešenie pri probléme 'žiadny zvuk' alebo pri chybách zvukového zariadenia. Vyžaduje administrátora. Bez undo."
    description_en: "Stops and restarts the Windows Audio Endpoint Builder and Windows Audio (Audiosrv) services - a common fix for 'no sound' or audio device errors. Needs administrator. No undo."

  - id: tune_camera_service_restart
    label_sk: "Reštart služby kamery (Frame Server)"
    label_en: "Restart camera service (Frame Server)"
    risk: MODERATE
    command: "$names = 'FrameServer','FrameServerMonitor'; $present = @($names | Where-Object { Get-Service -Name $_ -EA SilentlyContinue }); if (-not $present) { Write-Output 'Camera Frame Server services not found on this system.'; exit 1 }; Stop-Service -Name $present -Force -EA SilentlyContinue; Start-Service -Name $present -EA SilentlyContinue; $ok = @(); $failed = @(); foreach ($n in $present) { $s = Get-Service -Name $n -EA SilentlyContinue; if ($s -and $s.Status -eq 'Running') { $ok += $n } else { $failed += $n } }; if ($failed) { Write-Output ('Could not restart: ' + ($failed -join ', ') + ' (needs administrator).'); exit 1 } else { Write-Output ('Camera services restarted: ' + ($ok -join ', ')) }"
    description_sk: "Zastaví a znovu spustí služby Frame Server / Frame Server Monitor - rieši situáciu, keď aplikácia nedokáže získať obraz z kamery, hoci sú povolenia v Nastaveniach v poriadku. Vyžaduje administrátora. Bez undo."
    description_en: "Stops and restarts the Frame Server / Frame Server Monitor services - fixes apps unable to get camera frames even when Settings privacy permissions look correct. Needs administrator. No undo."

  - id: tune_memory_usage_report
    label_sk: "Prehľad využitia pamäte RAM"
    label_en: "Memory (RAM) usage report"
    risk: SAFE
    command: "$os = Get-CimInstance Win32_OperatingSystem; $totalMB = [math]::Round($os.TotalVisibleMemorySize/1024); $freeMB = [math]::Round($os.FreePhysicalMemory/1024); $usedMB = $totalMB - $freeMB; $pct = [math]::Round(($usedMB/$totalMB)*100,1); Write-Output ('Total: ' + $totalMB + ' MB | Used: ' + $usedMB + ' MB (' + $pct + '%) | Free: ' + $freeMB + ' MB')"
    description_sk: "Vypíše celkovú, použitú a voľnú fyzickú pamäť (RAM) v MB, nič nemení."
    description_en: "Lists total, used, and free physical memory (RAM) in MB, changes nothing."

  - id: tune_clear_working_sets
    label_sk: "Uvoľnenie nevyužitej pamäte procesov (working set)"
    label_en: "Trim unused process memory (working set)"
    risk: SAFE
    command: "$procs = Get-Process -EA SilentlyContinue; $before = [math]::Round((Get-CimInstance Win32_OperatingSystem).FreePhysicalMemory/1024); $trimmed = 0; $skipped = 0; foreach ($p in $procs) { try { $p.MinWorkingSet = $p.MinWorkingSet; $trimmed++ } catch { $skipped++ } }; Start-Sleep -Milliseconds 300; $after = [math]::Round((Get-CimInstance Win32_OperatingSystem).FreePhysicalMemory/1024); $freed = $after - $before; Write-Output ('Trimmed working set on ' + $trimmed + ' processes (' + $skipped + ' skipped - other users/system, needs administrator for those). Free memory: ' + $before + ' MB -> ' + $after + ' MB (' + $freed + ' MB change).')"
    description_sk: "Prinúti každý dostupný proces vrátiť nevyužitú fyzickú pamäť operačnému systému (orezanie working set cez triedu .NET Process - rovnaký princíp ako 'Empty working set' v nástrojoch tretích strán). Bez administrátorských práv sa týka len procesov aktuálneho používateľa; procesy iných používateľov a systémové procesy sa preskočia. Efekt je dočasný - procesy si pamäť podľa potreby postupne vezmú späť, nič sa natrvalo nemení. Bez undo (nie je potrebné)."
    description_en: "Forces every accessible process to return unused physical memory to the OS (working-set trim via the .NET Process class - same principle as the 'Empty working set' trick in third-party tools). Without administrator rights this only affects the current user's own processes; other users'/system processes are skipped. The effect is temporary - processes reclaim memory as needed, nothing is permanently changed. No undo (not needed)."

  - id: tune_path_sanity_report
    label_sk: "Kontrola premennej PATH"
    label_en: "PATH variable check"
    risk: SAFE
    command: "$m = @([Environment]::GetEnvironmentVariable('Path','Machine') -split ';' | Where-Object { $_ -and $_.Trim() }); $u = @([Environment]::GetEnvironmentVariable('Path','User') -split ';' | Where-Object { $_ -and $_.Trim() }); $all = $m + $u; $len = ($all -join ';').Length; Write-Output ('Machine PATH entries: ' + $m.Count + ' | User PATH entries: ' + $u.Count + ' | Combined length: ' + $len + ' chars'); if ($len -gt 2047) { Write-Output 'WARNING: combined PATH is longer than 2047 characters - some older tools and installers truncate it.' }; $seen = @{}; $problems = 0; foreach ($e in $all) { $x = [Environment]::ExpandEnvironmentVariables($e.Trim()).Trim('\"').TrimEnd('\\'); $key = $x.ToLower(); if ($seen.ContainsKey($key)) { Write-Output ('DUPLICATE: ' + $e); $problems++; continue }; $seen[$key] = $true; $ok = $false; try { $ok = Test-Path -LiteralPath ($x + '\\') -PathType Container } catch { $ok = $false }; if (-not $ok) { Write-Output ('MISSING: ' + $e); $problems++ } }; if ($problems -eq 0) { Write-Output 'All PATH entries exist and there are no duplicates.' } else { Write-Output ('' + $problems + ' problem entr(y/ies) found - clean them up in System Properties > Environment Variables. Nothing was changed.') }"
    description_sk: "Skontroluje systémovú aj používateľskú premennú PATH: počet položiek, celkovú dĺžku (upozorní, ak presahuje 2047 znakov - vtedy ju staršie inštalátory orežú), duplicitné a neexistujúce priečinky - častá príčina chyby 'príkaz sa nenašiel' po chybnej inštalácii či odinštalácii. Nič nemení."
    description_en: "Checks the system and user PATH variables: entry count, total length (warns above 2047 characters, where older installers truncate it), duplicate and non-existent folders - a common cause of 'command not found' after a bad install or uninstall. Changes nothing."
  # G31. Storage Sense keeps the PC clean after the technician leaves with
  # nothing of ours left running. StoragePolicy value names (01 on, 2048
  # cadence 0/1/7/30, 04 temp files, 08 Recycle Bin + 256 days, 32 Downloads
  # + 512 days) as used by kaspersmjohansen/StorageSense
  # (Configure-StorageSense.ps1) and the cyberdrain.com Storage Sense
  # monitoring script; Microsoft does not document them, so every other
  # value is printed raw as unknown. The policy values are Microsoft's
  # Policy CSP Storage settings (HKLM\SOFTWARE\Policies\Microsoft\Windows\
  # StorageSense) and win over the per-user ones.
  - id: storage_sense_report
    label_sk: "Storage Sense - prehľad nastavení"
    label_en: "Storage Sense - settings report"
    risk: SAFE
    command: "$k = 'HKCU:\\Software\\Microsoft\\Windows\\CurrentVersion\\StorageSense\\Parameters\\StoragePolicy'; $pk = 'HKLM:\\SOFTWARE\\Policies\\Microsoft\\Windows\\StorageSense'; $wu = $null; try { $wi = [Security.Principal.WindowsIdentity]::GetCurrent(); $wu = [pscustomobject]@{ Name = [string]$wi.Name; Sid = [string]$wi.User.Value } } catch { }; $ia = ''; try { $ia = [string](Get-CimInstance -ClassName Win32_ComputerSystem -EA Stop).UserName } catch { }; if ($wu -and $wu.Sid) { Write-Output ('HKCU = registry hive of ' + $wu.Name + ' (' + $wu.Sid + ') - the user PortableFix runs as.') } else { Write-Output 'HKCU = registry hive of the user PortableFix runs as (identity lookup failed, name unknown).' }; if ($ia -and $wu -and $wu.Name -and ($ia -ne $wu.Name)) { Write-Output ('WARNING: the signed-in user is ' + $ia + ', but PortableFix runs as ' + $wu.Name + ' (elevated with another account) - HKCU here is NOT the signed-in user''s hive.') }; $onoff = { param($x) $n = -1; $ok = [int]::TryParse([string]$x, [ref]$n); if ($ok -and ($n -eq 1)) { 'on' } elseif ($ok -and ($n -eq 0)) { 'off' } else { 'unknown (value ' + [string]$x + ')' } }; $days = { param($x) $n = -1; $ok = [int]::TryParse([string]$x, [ref]$n); if ($ok -and ($n -eq 0)) { 'never' } elseif ($ok -and ($n -gt 0)) { [string]$n + ' days' } else { 'unknown (value ' + [string]$x + ')' } }; $cadN = @{ 0 = 'when free disk space is low'; 1 = 'every day'; 7 = 'every week'; 30 = 'every month' }; $cad = { param($x) $n = -1; $ok = [int]::TryParse([string]$x, [ref]$n); if ($ok -and $cadN.ContainsKey($n)) { $cadN[$n] } else { 'unknown (value ' + [string]$x + ')' } }; $pol = Get-ItemProperty -LiteralPath $pk -EA SilentlyContinue; $polOn = $null; foreach ($pn in 'AllowStorageSenseGlobal', 'ConfigStorageSenseGlobalCadence', 'AllowStorageSenseTemporaryFilesCleanup', 'ConfigStorageSenseRecycleBinCleanupThreshold', 'ConfigStorageSenseDownloadsCleanupThreshold', 'ConfigStorageSenseCloudContentDehydrationThreshold') { if ($pol -and ($null -ne $pol.$pn)) { Write-Output ('Policy ' + $pk + '\\' + $pn + ' = ' + [string]$pol.$pn + ' (overrides the user setting)'); if ($pn -eq 'AllowStorageSenseGlobal') { $polOn = [string]$pol.$pn } } }; $v = @{}; $sub = 0; if (Test-Path -LiteralPath $k) { $it = Get-Item -LiteralPath $k; $sub = [int]$it.SubKeyCount; foreach ($n in @($it.GetValueNames())) { if ($n) { $v[$n] = $it.GetValue($n, $null, 'DoNotExpandEnvironmentNames') } } }; $lbl = [ordered]@{ '01' = @('Storage Sense', $onoff); '2048' = @('Runs', $cad); '04' = @('Delete temporary files apps are not using', $onoff); '08' = @('Delete Recycle Bin files', $onoff); '256' = @('Recycle Bin files older than', $days); '32' = @('Delete Downloads files', $onoff); '512' = @('Downloads files older than', $days) }; if ($v.Count -eq 0) { Write-Output ($k + ': no values - Storage Sense was never configured for this user, Windows defaults apply.') } else { Write-Output ($k + ':'); foreach ($n in $lbl.Keys) { if ($v.ContainsKey($n)) { Write-Output ('  ' + $n + ' ' + $lbl[$n][0] + ': ' + (& $lbl[$n][1] $v[$n])) } else { Write-Output ('  ' + $n + ' ' + $lbl[$n][0] + ': not set (Windows default)') } }; foreach ($n in @($v.Keys | Sort-Object)) { if (-not $lbl.Contains($n)) { $shown = $v[$n]; if ($shown -is [array]) { $shown = ($shown -join ',') }; Write-Output ('  ' + $n + ' = ' + [string]$shown + ' - unknown (not publicly documented)') } } }; if ($sub -gt 0) { Write-Output ('  Subkeys (per cloud provider, e.g. OneDrive): ' + $sub + ' - not decoded.') }; $d = { param($n) if ($v.ContainsKey($n)) { & $lbl[$n][1] $v[$n] } else { 'not set' } }; if ($polOn -eq '0') { Write-Output 'VERDICT: OFF BY POLICY - Group Policy/MDM turns Storage Sense off for every user; the per-user setting has no effect.' } elseif ($polOn -eq '1') { Write-Output 'VERDICT: ON BY POLICY - Group Policy/MDM turns Storage Sense on; the policy values above win over the per-user ones.' } elseif (-not $v.ContainsKey('01')) { Write-Output 'VERDICT: NOT CONFIGURED - Storage Sense has not been set up for this user.' } elseif ((& $onoff $v['01']) -eq 'on') { Write-Output ('VERDICT: ON - runs ' + (& $d '2048') + '; temporary files: ' + (& $d '04') + '; Recycle Bin: ' + (& $d '08') + ' (older than ' + (& $d '256') + '); Downloads: ' + (& $d '32') + ' (older than ' + (& $d '512') + ').') } elseif ((& $onoff $v['01']) -eq 'off') { Write-Output 'VERDICT: OFF - Storage Sense is turned off for this user.' } else { Write-Output ('VERDICT: UNKNOWN - value 01 = ' + [string]$v['01']) }"
    description_sk: "Dekóduje nastavenia Storage Sense (Senzor úložiska) používateľa v HKCU: či je zapnutý, ako často beží, či maže dočasné súbory, kôš a Stiahnuté súbory a po koľkých dňoch. Hodnoty, ktorých význam nie je verejne známy, vypíše ako neznáme. Ukáže aj politiky (GPO/MDM), ktoré nastavenia používateľa prebíjajú, a pod ktorým používateľom PortableFix beží. Nič nemení."
    description_en: "Decodes the user's Storage Sense settings in HKCU: whether it is on, how often it runs, whether it deletes temporary files, Recycle Bin and Downloads files and after how many days. Values whose meaning is not publicly known are printed as unknown. Also shows the policies (GPO/MDM) that override the user settings and which user PortableFix runs as. Changes nothing."
  # Monthly, temp files, Recycle Bin older than 30 days, Downloads off: the
  # customer's downloads are never deleted behind their back. Every value
  # it touches is saved first - existence, registry type and exact value -
  # so undo can put back values of any type and delete the ones that did not
  # exist before (and the StoragePolicy key if this action created it). The
  # backup folder gets the same icacls lock-down as m08/m10, so a standard
  # user cannot plant a backup the elevated undo would replay; the backup
  # names the user's SID and undo refuses to restore it into another
  # account's HKCU. Undo refuses without a backup instead of guessing
  # "defaults" - there is no documented default to go back to. A second
  # enable (batch re-run, double click) keeps the same user's existing
  # backup: rewriting it would store the already-enabled values and lose
  # the original state. The user comes from WindowsIdentity, not whoami.exe
  # text, whose code page could mangle a name like "Ján" and trip the
  # over-the-shoulder warning on every run. Remove-TypeData System.Array
  # before ConvertTo-Json: Windows PowerShell 5.1 otherwise writes a wrapped
  # array (a Binary value) as {"value": [...], "Count": n}, which undo
  # cannot turn back into bytes.
  - id: storage_sense_enable
    label_sk: "Storage Sense - zapnúť mesačné čistenie"
    label_en: "Storage Sense - turn on monthly cleanup"
    risk: MODERATE
    command: "$k = 'HKCU:\\Software\\Microsoft\\Windows\\CurrentVersion\\StorageSense\\Parameters\\StoragePolicy'; $pk = 'HKLM:\\SOFTWARE\\Policies\\Microsoft\\Windows\\StorageSense'; $want = [ordered]@{ '01' = 1; '2048' = 30; '04' = 1; '08' = 1; '256' = 30; '32' = 0 }; $kinds = @('DWord', 'QWord', 'String', 'ExpandString', 'Binary', 'MultiString'); $pol = Get-ItemProperty -LiteralPath $pk -EA SilentlyContinue; if ($pol -and ([string]$pol.AllowStorageSenseGlobal -eq '0')) { Write-Output ('Storage Sense is turned off by policy (' + $pk + '\\AllowStorageSenseGlobal = 0) - per-user settings would have no effect. Nothing was changed.'); exit 1 }; $wu = $null; try { $wi = [Security.Principal.WindowsIdentity]::GetCurrent(); $wu = [pscustomobject]@{ Name = [string]$wi.Name; Sid = [string]$wi.User.Value } } catch { }; $ia = ''; try { $ia = [string](Get-CimInstance -ClassName Win32_ComputerSystem -EA Stop).UserName } catch { }; if (-not ($wu -and $wu.Sid)) { Write-Output 'Could not identify the user PortableFix runs as (identity lookup failed) - the backup could not be tied to a user hive. Nothing was changed.'; exit 1 }; if ($wu -and $wu.Sid) { Write-Output ('HKCU = registry hive of ' + $wu.Name + ' (' + $wu.Sid + ') - the user PortableFix runs as.') } else { Write-Output 'HKCU = registry hive of the user PortableFix runs as (identity lookup failed, name unknown).' }; if ($ia -and $wu -and $wu.Name -and ($ia -ne $wu.Name)) { Write-Output ('WARNING: the signed-in user is ' + $ia + ', but PortableFix runs as ' + $wu.Name + ' (elevated with another account) - HKCU here is NOT the signed-in user''s hive.') }; $me = \"$env:USERDOMAIN\\$env:USERNAME\"; $root = \"$env:ProgramData\\PortableFix\"; New-Item -ItemType Directory -Force -Path $root | Out-Null; icacls $root /inheritance:r /grant:r \"*S-1-5-32-544:(OI)(CI)F\" /grant:r \"*S-1-5-18:(OI)(CI)F\" /grant:r \"${me}:(OI)(CI)F\" | Out-Null; $bk = \"$root\\storage_sense_backup.json\"; try { $existed = Test-Path -LiteralPath $k; $it = $null; $names = @(); if ($existed) { $it = Get-Item -LiteralPath $k -EA Stop; $names = @($it.GetValueNames()) }; $prev = @(); foreach ($n in $want.Keys) { if ($names -contains $n) { $kind = [string]$it.GetValueKind($n); if ($kinds -notcontains $kind) { Write-Output ('Value ' + $n + ' has registry type ' + $kind + ', which could not be restored exactly. Nothing was changed.'); exit 1 }; $prev += [pscustomobject]@{ Name = $n; Existed = $true; Kind = $kind; Value = $it.GetValue($n, $null, 'DoNotExpandEnvironmentNames') } } else { $prev += [pscustomobject]@{ Name = $n; Existed = $false; Kind = $null; Value = $null } } }; $keep = $false; if (Test-Path -LiteralPath $bk) { try { $ob = Get-Content -LiteralPath $bk -Raw -EA Stop | ConvertFrom-Json; if (([string]$ob.Key -eq $k) -and ([string]$ob.Sid -eq [string]$wu.Sid) -and ($null -ne $ob.Values) -and ($null -ne $ob.KeyExisted)) { $keep = $true } } catch { } }; if ($keep) { Write-Output ('An earlier backup of ' + $wu.Name + ' is kept in ' + $bk + ' - it holds the values before PortableFix first changed them, and undo restores those.') } else { Remove-TypeData -TypeName System.Array -EA SilentlyContinue; [pscustomobject]@{ User = $wu.Name; Sid = $wu.Sid; Key = $k; KeyExisted = $existed; Values = $prev } | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath $bk -Encoding UTF8 -EA Stop }; if (-not $existed) { New-Item -Path $k -Force -EA Stop | Out-Null }; foreach ($n in $want.Keys) { New-ItemProperty -LiteralPath $k -Name $n -Value $want[$n] -PropertyType DWord -Force -EA Stop | Out-Null }; $after = Get-Item -LiteralPath $k -EA Stop; $bad = @(); foreach ($n in $want.Keys) { if ([string]$after.GetValue($n, $null, 'DoNotExpandEnvironmentNames') -ne [string]$want[$n]) { $bad += $n } }; if ($bad.Count) { Write-Output ('Storage Sense values did not stick: ' + ($bad -join ', ') + '. Previous values are saved in ' + $bk + ' - undo restores them.'); exit 1 }; foreach ($p in $prev) { Write-Output ('  ' + $p.Name + ': ' + $(if ($p.Existed) { [string]$p.Value + ' (' + $p.Kind + ')' } else { 'absent' }) + ' -> ' + $want[$p.Name]) }; Write-Output ('Storage Sense turned on for ' + $wu.Name + ': runs every month, deletes temporary files apps are not using and Recycle Bin files older than 30 days; Downloads are left alone. ' + $(if ($keep) { 'Undo restores the values from the earlier backup ' + $bk + '.' } else { 'Previous values saved to ' + $bk + '.' })) } catch { Write-Output ('Could not configure Storage Sense (' + $_.FullyQualifiedErrorId + ', HRESULT 0x' + ('{0:X8}' -f $_.Exception.HResult) + '): ' + $_.Exception.Message); exit 1 }"
    undo_command: "$k = 'HKCU:\\Software\\Microsoft\\Windows\\CurrentVersion\\StorageSense\\Parameters\\StoragePolicy'; $bk = \"$env:ProgramData\\PortableFix\\storage_sense_backup.json\"; $ours = @('01', '2048', '04', '08', '256', '32'); $kinds = @('DWord', 'QWord', 'String', 'ExpandString', 'Binary', 'MultiString'); if (-not (Test-Path -LiteralPath $bk)) { Write-Output ('Cannot undo: the backup ' + $bk + ' is missing, so the previous Storage Sense values are not known. Nothing was changed - set Storage Sense by hand in Settings > System > Storage.'); exit 1 }; try { $b = Get-Content -LiteralPath $bk -Raw -EA Stop | ConvertFrom-Json } catch { Write-Output ('Cannot undo: the backup ' + $bk + ' could not be read. Nothing was changed.'); exit 1 }; if (([string]$b.Key -ne $k) -or ($null -eq $b.Values) -or ($null -eq $b.KeyExisted)) { Write-Output ('Cannot undo: the backup ' + $bk + ' is not a Storage Sense backup. Nothing was changed.'); exit 1 }; $wu = $null; try { $wi = [Security.Principal.WindowsIdentity]::GetCurrent(); $wu = [pscustomobject]@{ Name = [string]$wi.Name; Sid = [string]$wi.User.Value } } catch { }; if (-not ($wu -and $wu.Sid)) { Write-Output 'Cannot undo: could not identify the user PortableFix runs as (identity lookup failed). Nothing was changed.'; exit 1 }; if ([string]$b.Sid -ne [string]$wu.Sid) { Write-Output ('Cannot undo: the backup belongs to ' + $b.User + ' (' + $b.Sid + '), but PortableFix now runs as ' + $wu.Name + ' (' + $wu.Sid + ') - HKCU is a different user''s hive. Nothing was changed.'); exit 1 }; foreach ($p in @($b.Values)) { if (($ours -notcontains [string]$p.Name) -or ($p.Existed -and ($kinds -notcontains [string]$p.Kind))) { Write-Output ('Cannot undo: the backup holds an unexpected entry (' + [string]$p.Name + ', ' + [string]$p.Kind + '). Nothing was changed.'); exit 1 } }; try { $done = @(); foreach ($p in @($b.Values)) { $n = [string]$p.Name; if ($p.Existed) { $kind = [string]$p.Kind; $val = $p.Value; if ($kind -eq 'DWord') { $val = [int]$val } elseif ($kind -eq 'QWord') { $val = [int64]$val } elseif ($kind -eq 'Binary') { $val = [byte[]]@($val) } elseif ($kind -eq 'MultiString') { $val = [string[]]@($val) } else { $val = [string]$val }; if (-not (Test-Path -LiteralPath $k)) { New-Item -Path $k -Force -EA Stop | Out-Null }; New-ItemProperty -LiteralPath $k -Name $n -Value $val -PropertyType $kind -Force -EA Stop | Out-Null; $done += ($n + ' = ' + [string]$p.Value) } elseif (Test-Path -LiteralPath $k) { if (@((Get-Item -LiteralPath $k -EA Stop).GetValueNames()) -contains $n) { Remove-ItemProperty -LiteralPath $k -Name $n -EA Stop }; $done += ($n + ' removed') } }; if ((-not $b.KeyExisted) -and (Test-Path -LiteralPath $k)) { $it = Get-Item -LiteralPath $k -EA Stop; if ((@($it.GetValueNames()).Count -eq 0) -and ([int]$it.SubKeyCount -eq 0)) { Remove-Item -LiteralPath $k -EA Stop; $done += 'empty StoragePolicy key removed' } }; Remove-Item -LiteralPath $bk -Force -EA SilentlyContinue; Write-Output ('Storage Sense settings of ' + $wu.Name + ' restored to their values before PortableFix changed them: ' + ($done -join '; ') + '.') } catch { Write-Output ('Could not restore Storage Sense settings (' + $_.FullyQualifiedErrorId + ', HRESULT 0x' + ('{0:X8}' -f $_.Exception.HResult) + '): ' + $_.Exception.Message); exit 1 }"
    preview_command: "$k = 'HKCU:\\Software\\Microsoft\\Windows\\CurrentVersion\\StorageSense\\Parameters\\StoragePolicy'; $pk = 'HKLM:\\SOFTWARE\\Policies\\Microsoft\\Windows\\StorageSense'; $want = [ordered]@{ '01' = 1; '2048' = 30; '04' = 1; '08' = 1; '256' = 30; '32' = 0 }; $pol = Get-ItemProperty -LiteralPath $pk -EA SilentlyContinue; if ($pol -and ([string]$pol.AllowStorageSenseGlobal -eq '0')) { Write-Output ('Would refuse: Storage Sense is turned off by policy (' + $pk + '\\AllowStorageSenseGlobal = 0).'); exit 0 }; $wu = $null; try { $wi = [Security.Principal.WindowsIdentity]::GetCurrent(); $wu = [pscustomobject]@{ Name = [string]$wi.Name; Sid = [string]$wi.User.Value } } catch { }; $ia = ''; try { $ia = [string](Get-CimInstance -ClassName Win32_ComputerSystem -EA Stop).UserName } catch { }; if ($wu -and $wu.Sid) { Write-Output ('HKCU = registry hive of ' + $wu.Name + ' (' + $wu.Sid + ') - the user PortableFix runs as.') } else { Write-Output 'HKCU = registry hive of the user PortableFix runs as (identity lookup failed, name unknown).' }; if ($ia -and $wu -and $wu.Name -and ($ia -ne $wu.Name)) { Write-Output ('WARNING: the signed-in user is ' + $ia + ', but PortableFix runs as ' + $wu.Name + ' (elevated with another account) - HKCU here is NOT the signed-in user''s hive.') }; $names = @(); $it = $null; if (Test-Path -LiteralPath $k) { $it = Get-Item -LiteralPath $k; $names = @($it.GetValueNames()) }; foreach ($n in $want.Keys) { $cur = $(if ($names -contains $n) { [string]$it.GetValue($n, $null, 'DoNotExpandEnvironmentNames') } else { 'absent' }); Write-Output ('  ' + $n + ': ' + $cur + ' -> ' + $want[$n]) }; $bk = \"$env:ProgramData\\PortableFix\\storage_sense_backup.json\"; $keep = $false; if ($wu -and $wu.Sid -and (Test-Path -LiteralPath $bk)) { try { $ob = Get-Content -LiteralPath $bk -Raw -EA Stop | ConvertFrom-Json; if (([string]$ob.Key -eq $k) -and ([string]$ob.Sid -eq [string]$wu.Sid)) { $keep = $true } } catch { } }; if ($keep) { Write-Output ('Would keep the earlier backup ' + $bk + ' (the values before PortableFix first changed them) and set:') } else { Write-Output ('Would save these previous values to ' + $bk + ' and set:') }; Write-Output '  every month, temporary files on, Recycle Bin files older than 30 days, Downloads off (undo restores the exact previous values).'"
    description_sk: "Zapne Storage Sense (Senzor úložiska) - súčasť Windows, ktorá udržiava disk čistý aj po odchode technika, bez nášho agenta: beží raz mesačne, maže dočasné súbory, ktoré aplikácie nepoužívajú, a súbory v koši staršie ako 30 dní. Priečinok Stiahnuté nechá na pokoji. Presné predošlé hodnoty (aj to, či vôbec existovali) uloží do %ProgramData%\\PortableFix\\storage_sense_backup.json (priečinok prístupný len administrátorom) a undo ich presne obnoví - hodnoty, ktoré predtým neexistovali, zmaže. Opakované spustenie ponechá prvú zálohu toho istého používateľa. Bez zálohy undo nič nezmení. Nastavenie patrí používateľovi, pod ktorým PortableFix beží (vypíše ho); ak sa technik prihlásil ako administrátor vlastným účtom, zmena sa zapíše jemu, nie zákazníkovi - akcia na to upozorní. Ak Storage Sense vypína politika, nič nemení."
    description_en: "Turns on Storage Sense - the Windows feature that keeps the disk clean after the technician leaves, with no agent of ours: it runs once a month, deletes temporary files apps are not using and Recycle Bin files older than 30 days. The Downloads folder is left alone. The exact previous values (including whether they existed at all) are saved to %ProgramData%\\PortableFix\\storage_sense_backup.json (a folder only administrators can write) and undo restores them exactly, deleting values that did not exist before. Running it again keeps the same user's first backup. Without the backup, undo changes nothing. The setting belongs to the user PortableFix runs as (it is printed); if the technician elevated with their own admin account, the change lands in their profile, not the customer's - the action warns about it. Changes nothing if a policy turns Storage Sense off."
