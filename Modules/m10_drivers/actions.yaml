module_id: m10_drivers
category: DRIVER_UPDATES
actions:
  - id: drv_problem_devices
    label_sk: "Zariadenia s problémami"
    label_en: "Problem devices"
    risk: SAFE
    command: "Get-PnpDevice -PresentOnly | Where-Object { $_.Status -ne 'OK' } | ForEach-Object { $_ | Add-Member -NotePropertyName ProblemCode -NotePropertyValue (Get-PnpDeviceProperty -InstanceId $_.InstanceId -KeyName 'DEVPKEY_Device_ProblemCode' -EA SilentlyContinue).Data -PassThru } | Select-Object Status,Class,FriendlyName,ProblemCode,InstanceId | Format-Table -AutoSize -Wrap"
    description_sk: "Vypíše pripojené zariadenia, ktoré nehlásia stav OK, vrátane kódu problému (napr. 28=chýbajú ovládače, 43=zlyhanie zariadenia), nič nemení."
    description_en: "Lists currently connected devices not reporting OK status, including the problem code (e.g. 28=drivers missing, 43=device failure), changes nothing."
    problem_keywords:
      - "Error"
    recommended_action_ids:
      - drv_restart_problem_devices
  - id: drv_third_party_list
    label_sk: "Ovládače tretích strán"
    label_en: "Third-party drivers"
    risk: SAFE
    command: "pnputil /enum-drivers"
    description_sk: "Vypíše všetky nainštalované ovládače tretích strán (ktoré nie sú súčasťou Windows), nič nemení."
    description_en: "Lists all installed third-party (non-inbox) drivers, changes nothing."
  - id: drv_export_backup
    label_sk: "Záloha všetkých ovládačov"
    label_en: "Back up all drivers"
    risk: SAFE
    command: "$me = \"$env:USERDOMAIN\\$env:USERNAME\"; $root = \"$env:ProgramData\\PortableFix\"; New-Item -ItemType Directory -Force -Path $root | Out-Null; icacls $root /inheritance:r /grant:r \"*S-1-5-32-544:(OI)(CI)F\" /grant:r \"*S-1-5-18:(OI)(CI)F\" /grant:r \"${me}:(OI)(CI)F\" | Out-Null; $dest = \"$root\\DriverBackup_$(Get-Date -Format 'yyyyMMdd_HHmmss')\"; New-Item -ItemType Directory -Force -Path $dest | Out-Null; icacls $dest /inheritance:r /grant:r \"*S-1-5-32-544:(OI)(CI)F\" /grant:r \"*S-1-5-18:(OI)(CI)F\" /grant:r \"${me}:(OI)(CI)F\" | Out-Null; $out = & pnputil /export-driver * $dest 2>&1; $exitCode = $LASTEXITCODE; if ($exitCode -eq 0) { Write-Output ('Driver backup saved to: ' + $dest); Write-Output ('Driver packages exported: ' + @(Get-ChildItem $dest -Directory).Count) } else { Write-Output ('Driver export failed (needs administrator): ' + (($out | Select-Object -Last 3) -join ' ')) }; if ($exitCode -eq 0) { exit 0 } else { exit 1 }"
    description_sk: "Exportuje všetky nainštalované ovládače (pnputil /export-driver) do priečinka prístupného len aktuálnemu používateľovi, SYSTEM a administrátorom - vhodné pred resetom/reinštaláciou systému, najmä pre ovládače tretích strán/OEM, ktoré by sa inak ťažko hľadali znovu. V systéme nič nemení, len ukladá súbory."
    description_en: "Exports every installed driver (pnputil /export-driver) into a folder only the current user, SYSTEM, and administrators can read - before a system reset/reinstall, especially third-party/OEM drivers that would otherwise be hard to find again. Changes nothing in the system, only saves files."
  - id: drv_stale_report
    label_sk: "Staré ovládače (2+ roky)"
    label_en: "Stale drivers (2+ years)"
    risk: SAFE
    command: "$cutoff = (Get-Date).AddYears(-2); $old = Get-CimInstance Win32_PnpSignedDriver | ForEach-Object { if ($_.DriverDate) { try { $parsed = [Management.ManagementDateTimeConverter]::ToDateTime($_.DriverDate) } catch { return }; $_ | Add-Member -NotePropertyName ParsedDate -NotePropertyValue $parsed -PassThru } } | Where-Object { $_.ParsedDate -lt $cutoff }; if ($old) { $old | Sort-Object ParsedDate | Select-Object DeviceName, DriverVersion, @{N='DriverDate';E={$_.ParsedDate.ToString('yyyy-MM-dd')}} | Format-Table -AutoSize -Wrap } else { Write-Output 'No drivers older than 2 years found.' }"
    description_sk: "Vypíše nainštalované ovládače staré viac ako 2 roky, zoradené podľa dátumu. Nič nemení."
    description_en: "Lists installed drivers older than 2 years, sorted by date. Changes nothing."
  - id: drv_restore_backup
    label_sk: "Obnovenie zálohy ovládačov"
    label_en: "Restore driver backup"
    risk: MODERATE
    command: "$root = \"$env:ProgramData\\PortableFix\"; $latest = Get-ChildItem $root -Directory -Filter 'DriverBackup_*' -EA SilentlyContinue | Sort-Object Name -Descending | Select-Object -First 1; if ($latest) { & pnputil /add-driver \"$($latest.FullName)\\*.inf\" /subdirs /install 2>&1 | Out-Null; if ($LASTEXITCODE -eq 0) { Write-Output ('Restored drivers from: ' + $latest.FullName) } else { Write-Output ('Driver restore failed (needs administrator): exit code ' + $LASTEXITCODE); exit 1 } } else { Write-Output 'No driver backup found (run \"Back up all drivers\" first).'; exit 1 }"
    description_sk: "Nájde najnovšiu zálohu vytvorenú akciou 'Záloha všetkých ovládačov' (priečinok DriverBackup_* v $env:ProgramData\\PortableFix) a nainštaluje z nej ovládače cez pnputil /add-driver. Bez univerzálneho undo (neexistuje všeobecný spôsob, ako sa vrátiť k pôvodným/starším ovládačom)."
    description_en: "Finds the most recent backup made by the 'Back up all drivers' action (a DriverBackup_* folder under $env:ProgramData\\PortableFix) and installs drivers from it via pnputil /add-driver. No generic undo (there's no universal way to roll back to the previous/older drivers)."
    exclude_from_select_all: true
  - id: drv_duplicate_packages_report
    label_sk: "Duplicitné balíky ovládačov"
    label_en: "Duplicate driver packages"
    risk: SAFE
    command: "$out = pnputil /enum-drivers; $text = ($out -join \"`n\"); $blocks = $text -split \"(?:`r?`n){2,}\" | Where-Object { $_.Trim() }; $groups = @{}; foreach ($b in $blocks) { $lines = $b -split \"`r?`n\" | Where-Object { $_.Trim() }; if ($lines.Count -ge 2) { $orig = ($lines[1] -split ':', 2)[1].Trim(); if ($orig) { if (-not $groups.ContainsKey($orig)) { $groups[$orig] = 0 }; $groups[$orig]++ } } }; $dupes = $groups.GetEnumerator() | Where-Object { $_.Value -gt 1 }; if ($dupes) { foreach ($d in $dupes) { Write-Output ('--- ' + $d.Key + ' (' + $d.Value + ' versions published) ---') }; Write-Output 'Review with \"pnputil /enum-drivers\" for full details; remove old ones manually with \"pnputil /delete-driver <oemN.inf> /uninstall\" if you are sure they are unused.' } else { Write-Output 'No duplicate driver package versions found.' }"
    description_sk: "Iba nahlási balíky ovládačov s viacerými publikovanými verziami pre ten istý pôvodný názov (možné zvyšky po aktualizáciách). Výstup pnputil spracúva podľa pevnej pozície riadkov, nie podľa textu popisov, takže funguje bez ohľadu na jazyk zobrazenia Windows. Nič neodstraňuje - ak sa niektorý balík nepoužíva, odstráňte ho sami príkazom 'pnputil /delete-driver <oemN.inf> /uninstall' po overení cez 'pnputil /enum-drivers'."
    description_en: "Only reports driver packages with multiple published versions for the same original name (possible leftovers from updates). Parses pnputil's output by fixed line position, not label text, so it works regardless of the Windows display language. Removes nothing - if one is unused, delete it yourself with 'pnputil /delete-driver <oemN.inf> /uninstall' after checking with 'pnputil /enum-drivers'."
  - id: drv_install_updates
    label_sk: "Inštalácia aktualizácií ovládačov"
    label_en: "Install driver updates"
    risk: REQUIRES_REBOOT
    command: "try { $session = New-Object -ComObject Microsoft.Update.Session; $searcher = $session.CreateUpdateSearcher(); $result = $searcher.Search(\"IsInstalled=0 and Type='Driver'\"); if ($result.Updates.Count -eq 0) { Write-Output 'No optional driver updates found via Windows Update.'; exit 0 }; $toInstall = New-Object -ComObject Microsoft.Update.UpdateColl; foreach ($u in $result.Updates) { if (-not $u.EulaAccepted) { $u.AcceptEula() | Out-Null }; $toInstall.Add($u) | Out-Null; Write-Output ('Found: ' + $u.Title) }; $downloader = $session.CreateUpdateDownloader(); $downloader.Updates = $toInstall; $downloader.Download() | Out-Null; $installer = $session.CreateUpdateInstaller(); $installer.Updates = $toInstall; $installResult = $installer.Install(); Write-Output ('Install result code: ' + $installResult.ResultCode + ' (2=Succeeded, 3=SucceededWithErrors, 4=Failed, 5=Cancelled)'); if ($installResult.RebootRequired) { Write-Output 'A reboot is required to finish installing the driver update(s).' }; if ($installResult.ResultCode -eq 4) { exit 1 } } catch { Write-Output ('Driver update via Windows Update failed: ' + $_.Exception.Message + ' (needs administrator).'); exit 1 }"
    description_sk: "Vyhľadá voliteľné aktualizácie ovládačov ponúkané cez Windows Update (rovnaký zdroj ako Nastavenia > Windows Update > Voliteľné aktualizácie), stiahne ich a nainštaluje cez oficiálne rozhranie Windows Update Agent API. Vyžaduje administrátora, môže vyžadovať reštart. Bez univerzálneho undo - ak ovládač spôsobí problém, odinštalujte ho cez Správcu zariadení."
    description_en: "Finds and installs optional driver updates offered via Windows Update (the same source as Settings > Windows Update > Optional updates), downloads and installs them through the official Windows Update Agent API. Needs administrator, may require a reboot. No generic undo - uninstall the driver via Device Manager if it causes a problem."
  - id: drv_unsigned_report
    label_sk: "Nepodpísané ovládače"
    label_en: "Unsigned drivers"
    risk: SAFE
    command: "$unsigned = Get-CimInstance Win32_PnpSignedDriver | Where-Object { $_.IsSigned -eq $false -and $_.DeviceName }; if ($unsigned) { $unsigned | Select-Object DeviceName, DriverVersion, Manufacturer | Format-Table -AutoSize -Wrap } else { Write-Output 'No unsigned drivers found.' }"
    description_sk: "Vypíše nainštalované ovládače, ktoré nie sú digitálne podpísané. Nič nemení."
    description_en: "Lists installed drivers that are not digitally signed. Changes nothing."
  - id: drv_restart_problem_devices
    label_sk: "Reštart zariadení s chybou"
    label_en: "Restart failed devices"
    risk: MODERATE
    command: "if ([Environment]::OSVersion.Version.Build -lt 19041) { Write-Output 'pnputil /restart-device needs Windows 10 2004 or newer - restart the device from Device Manager instead.'; exit 1 }; $skip = 'System','Processor','Computer','DiskDrive','HDC','SCSIAdapter','Volume','VolumeSnapshot'; $devs = @(Get-PnpDevice -PresentOnly -Status ERROR -EA SilentlyContinue | Where-Object { $skip -notcontains $_.Class } | ForEach-Object { $code = (Get-PnpDeviceProperty -InstanceId $_.InstanceId -KeyName 'DEVPKEY_Device_ProblemCode' -EA SilentlyContinue).Data; if ($code -ne 22 -and $code -ne 29) { $_ | Add-Member -NotePropertyName ProblemCode -NotePropertyValue $code -PassThru -Force } }); if (-not $devs) { Write-Output 'No failed devices to restart (devices disabled on purpose - code 22/29 - and storage/system devices are skipped).'; exit 0 }; $fail = 0; foreach ($d in $devs) { $out = & pnputil /restart-device $d.InstanceId 2>&1; if ($LASTEXITCODE -eq 0) { Write-Output ('Restarted: ' + $d.FriendlyName + ' (problem code was ' + $d.ProblemCode + ')') } elseif ($LASTEXITCODE -eq 3010) { Write-Output ('Restart scheduled, reboot required: ' + $d.FriendlyName) } else { $fail++; Write-Output ('Could not restart: ' + $d.FriendlyName + ' - ' + (($out | Select-Object -Last 1) -join ' ') + ' (needs administrator)') } }; & pnputil /scan-devices 2>&1 | Out-Null; Write-Output 'Hardware rescan done (pnputil /scan-devices). Run \"Problem devices\" again to check the result.'; if ($fail -gt 0) { exit 1 }"
    description_sk: "Reštartuje (pnputil /restart-device) pripojené zariadenia v chybovom stave - napr. kód 10 alebo 43 - a potom znovu prehľadá hardvér (pnputil /scan-devices), čo často pomôže aj pri kóde 28. Zámerne zakázané zariadenia (kód 22/29), disky, radiče úložiska a systémové zariadenia preskočí. Vyžaduje administrátora a Windows 10 2004 alebo novší. Bez undo (reštart zariadenia nemení žiadne nastavenia)."
    description_en: "Restarts (pnputil /restart-device) connected devices in an error state - e.g. code 10 or 43 - then rescans hardware (pnputil /scan-devices), which often also helps with code 28. Skips devices disabled on purpose (code 22/29), disks, storage controllers and system devices. Needs administrator and Windows 10 2004 or newer. No undo (restarting a device changes no settings)."
    inactivity_timeout_sec: 180
  - id: drv_network_adapter_versions
    label_sk: "Verzie ovládačov sieťových adaptérov"
    label_en: "Network adapter driver versions"
    risk: SAFE
    command: "$a = @(Get-NetAdapter -Physical -EA SilentlyContinue); if ($a) { $a | Sort-Object Name | Select-Object Name,InterfaceDescription,Status,LinkSpeed,DriverVersion,DriverDate,DriverProvider | Format-Table -AutoSize -Wrap | Out-String -Width 250 } else { Write-Output 'No physical network adapters found (or the NetAdapter module is unavailable).' }"
    description_sk: "Vypíše fyzické sieťové adaptéry (Wi-Fi, Ethernet) so stavom, rýchlosťou pripojenia, verziou, dátumom a poskytovateľom ovládača - na porovnanie s najnovšou verziou od výrobcu, keď Wi-Fi/LAN vypadáva. Nič nemení."
    description_en: "Lists physical network adapters (Wi-Fi, Ethernet) with status, link speed, driver version, date and provider - to compare against the vendor's latest release when Wi-Fi/LAN keeps dropping. Changes nothing."
  - id: drv_gpu_info
    label_sk: "Grafická karta a jej ovládač"
    label_en: "Graphics card and driver"
    risk: SAFE
    command: "$gpus = @(Get-CimInstance Win32_VideoController -EA SilentlyContinue); if (-not $gpus) { Write-Output 'No display adapters found.'; exit 0 }; $vram = @{}; Get-ItemProperty -Path 'HKLM:\\SYSTEM\\CurrentControlSet\\Control\\Class\\{4d36e968-e325-11ce-bfc1-08002be10318}\\0*' -EA SilentlyContinue | ForEach-Object { $q = $_.'HardwareInformation.qwMemorySize'; if ($q -is [byte[]]) { $q = [BitConverter]::ToUInt64($q, 0) }; if ($q -and $_.DriverDesc) { $vram[$_.DriverDesc] = [math]::Round([double]$q / 1GB, 1) } }; $gpus | ForEach-Object { [PSCustomObject]@{ Name = $_.Name; Status = $_.Status; ErrorCode = $_.ConfigManagerErrorCode; DriverVersion = $_.DriverVersion; DriverDate = $(if ($_.DriverDate) { $_.DriverDate.ToString('yyyy-MM-dd') } else { 'n/a' }); VRAM_GB = $(if ($vram.ContainsKey($_.Name)) { $vram[$_.Name] } elseif ($_.AdapterRAM) { [math]::Round($_.AdapterRAM / 1GB, 1) } else { 'n/a' }); Resolution = $(if ($_.CurrentHorizontalResolution) { '' + $_.CurrentHorizontalResolution + 'x' + $_.CurrentVerticalResolution + ' @ ' + $_.CurrentRefreshRate + ' Hz' } else { 'inactive' }) } } | Format-List | Out-String -Width 250; if ($gpus | Where-Object { $_.Name -like '*Basic Display*' }) { Write-Output 'WARNING: Microsoft Basic Display Adapter is active - no proper GPU driver is installed (low resolution, no acceleration).' }"
    description_sk: "Vypíše grafické adaptéry s verziou a dátumom ovládača, veľkosťou pamäte VRAM (číta sa z registra, pretože WMI vráti najviac 4 GB), aktuálnym rozlíšením a kódom chyby - obdoba karty Obrazovka v dxdiag. Upozorní, ak beží len Microsoft Basic Display Adapter (chýba ovládač). Nič nemení."
    description_en: "Lists display adapters with driver version and date, VRAM (read from the registry, since WMI caps at 4 GB), current resolution and error code - like dxdiag's Display tab. Warns when only the Microsoft Basic Display Adapter is running (driver missing). Changes nothing."
    problem_keywords:
      - "Microsoft Basic Display Adapter is active"
    recommended_action_ids:
      - drv_install_updates
