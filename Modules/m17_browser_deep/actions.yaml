module_id: m17_browser_deep
category: REPAIR
actions:
  - id: browser_extensions_report
    label_sk: "Prehľad rozšírení prehliadačov"
    label_en: "Browser extensions report"
    risk: SAFE
    command: "foreach ($b in @(@{N='Chrome';P=\"$env:LOCALAPPDATA\\Google\\Chrome\\User Data\"},@{N='Edge';P=\"$env:LOCALAPPDATA\\Microsoft\\Edge\\User Data\"})) { $pref = Join-Path $b.P 'Default\\Secure Preferences'; if (-not (Test-Path $pref)) { $pref = Join-Path $b.P 'Default\\Preferences' }; if (Test-Path $pref) { try { $j = Get-Content $pref -Raw | ConvertFrom-Json; $ext = $j.extensions.settings.PSObject.Properties | ForEach-Object { [PSCustomObject]@{ Name = $_.Value.manifest.name; Enabled = ($_.Value.state -eq 1) } }; Write-Output ('--- ' + $b.N + ' (' + $ext.Count + ' extensions) ---'); $ext | Format-Table -AutoSize } catch { Write-Output ($b.N + ': could not parse preferences file.') } } }; $ffDir = \"$env:APPDATA\\Mozilla\\Firefox\\Profiles\"; if (Test-Path $ffDir) { $ffProfile = Get-ChildItem $ffDir -Filter *.default* -Directory -EA SilentlyContinue | Select-Object -First 1 } else { $ffProfile = $null }; if ($ffProfile) { $extJson = Join-Path $ffProfile.FullName 'extensions.json'; if (Test-Path $extJson) { try { $j = Get-Content $extJson -Raw | ConvertFrom-Json; Write-Output ('--- Firefox (' + $j.addons.Count + ' extensions) ---'); $j.addons | Select-Object @{N='Name';E={$_.defaultLocale.name}},active | Format-Table -AutoSize } catch { Write-Output 'Firefox: could not parse extensions.json.' } } }"
    description_sk: "Vypíše nainštalované rozšírenia v Chrome/Edge/Firefox (len profil Default). Formát interného konfiguračného súboru sa medzi verziami prehliadača mení, výsledok berte ako orientačný. Nič nemení."
    description_en: "Lists installed extensions in Chrome/Edge/Firefox (Default profile only). The internal config file format shifts between browser versions, treat as best-effort. Changes nothing."

  - id: browser_policy_report
    label_sk: "Firemné pravidlá prehliadačov (policy)"
    label_en: "Browser enterprise policy report"
    risk: SAFE
    command: "Write-Output '--- Chrome policy (HKLM) ---'; Get-ItemProperty 'HKLM:\\SOFTWARE\\Policies\\Google\\Chrome' -EA SilentlyContinue | Format-List; Write-Output '--- Chrome policy (HKCU) ---'; Get-ItemProperty 'HKCU:\\SOFTWARE\\Policies\\Google\\Chrome' -EA SilentlyContinue | Format-List; Write-Output '--- Edge policy (HKLM) ---'; Get-ItemProperty 'HKLM:\\SOFTWARE\\Policies\\Microsoft\\Edge' -EA SilentlyContinue | Format-List; Write-Output '--- Edge policy (HKCU) ---'; Get-ItemProperty 'HKCU:\\SOFTWARE\\Policies\\Microsoft\\Edge' -EA SilentlyContinue | Format-List; Write-Output '--- End ---'"
    description_sk: "Zobrazí vynútené policy nastavenia Chrome/Edge (povinne inštalované rozšírenia, domovská stránka a pod.) - rozhranie prehliadača ich zobrazuje len ako 'spravované organizáciou', bez možnosti zmeny. Nič nemení."
    description_en: "Shows enforced Chrome/Edge policy settings (forced extension, homepage, etc.) - the browser UI only shows these as 'managed by your organization' with no way to change them. Changes nothing."

  - id: browser_homepage_search_report
    label_sk: "Kontrola domovskej stránky a vyhľadávania"
    label_en: "Homepage/search hijack check"
    risk: SAFE
    command: "$goodHosts = @('google.com','bing.com','duckduckgo.com','msn.com'); $c = Get-Content \"$env:LOCALAPPDATA\\Google\\Chrome\\User Data\\Default\\Preferences\" -Raw -EA SilentlyContinue | ConvertFrom-Json -EA SilentlyContinue; if ($c) { $hp = $c.homepage; $sp = $c.default_search_provider.name; Write-Output (\"Chrome homepage: $hp\"); Write-Output (\"Chrome default search: $sp\") }; $e = Get-Content \"$env:LOCALAPPDATA\\Microsoft\\Edge\\User Data\\Default\\Preferences\" -Raw -EA SilentlyContinue | ConvertFrom-Json -EA SilentlyContinue; if ($e) { Write-Output (\"Edge homepage: \" + $e.homepage); Write-Output (\"Edge default search: \" + $e.default_search_provider.name) }; Write-Output '--- End ---'"
    description_sk: "Zobrazí aktuálnu domovskú stránku a predvolený vyhľadávač Chrome/Edge - klasický príznak únosu prehliadača (adware/PUA). Nič nemení."
    description_en: "Shows the current homepage and default search provider for Chrome/Edge - a classic browser-hijack (adware/PUA) signal. Changes nothing."

  - id: browser_reset_chrome_profile
    label_sk: "Reset profilu Chrome"
    label_en: "Reset Chrome profile"
    risk: MODERATE
    command: "Stop-Process -Name chrome -Force -EA SilentlyContinue; Start-Sleep -Seconds 2; $ts = Get-Date -Format 'yyyyMMdd_HHmmss'; $src = \"$env:LOCALAPPDATA\\Google\\Chrome\\User Data\\Default\"; $dst = \"$env:LOCALAPPDATA\\Google\\Chrome\\User Data\\Default.bak-$ts\"; if (Test-Path $src) { try { Rename-Item -Path $src -NewName (Split-Path $dst -Leaf) -EA Stop; Write-Output ('Chrome profile reset. Old profile saved as ' + $dst) } catch { Write-Output ('Failed to reset Chrome profile (it may still be running): ' + $_.Exception.Message); exit 1 } } else { Write-Output 'Chrome default profile not found.' }"
    description_sk: "Zatvorí Chrome bez varovania a jeho profil (nastavenia, rozšírenia, uložené heslá) odloží premenovaním - Chrome si pri ďalšom štarte vytvorí nový. Záloha ostane na disku, ale bez automatického undo (bezpečne sa dá vrátiť len pred ďalším spustením Chrome)."
    description_en: "Closes Chrome without asking and renames its profile (settings, extensions, saved passwords) aside - Chrome creates a fresh one on next launch. The old profile stays on disk but there's no automatic undo (only safely reversible before Chrome is relaunched)."

  - id: browser_reset_edge_profile
    label_sk: "Reset profilu Edge"
    label_en: "Reset Edge profile"
    risk: MODERATE
    command: "Stop-Process -Name msedge -Force -EA SilentlyContinue; Start-Sleep -Seconds 2; $ts = Get-Date -Format 'yyyyMMdd_HHmmss'; $src = \"$env:LOCALAPPDATA\\Microsoft\\Edge\\User Data\\Default\"; $dst = \"$env:LOCALAPPDATA\\Microsoft\\Edge\\User Data\\Default.bak-$ts\"; if (Test-Path $src) { try { Rename-Item -Path $src -NewName (Split-Path $dst -Leaf) -EA Stop; Write-Output ('Edge profile reset. Old profile saved as ' + $dst) } catch { Write-Output ('Failed to reset Edge profile (it may still be running): ' + $_.Exception.Message); exit 1 } } else { Write-Output 'Edge default profile not found.' }"
    description_sk: "Rovnaký princíp ako reset profilu Chrome, ale pre Edge (proces msedge). Záloha ostane, bez automatického undo."
    description_en: "Same approach as the Chrome reset, targeting Edge (msedge process). Backup kept, no automatic undo."

  - id: browser_clear_policy_keys
    label_sk: "Vymazanie policy kľúčov Chrome/Edge"
    label_en: "Clear Chrome/Edge policy keys"
    risk: DESTRUCTIVE
    command: "$dsreg = dsregcmd /status 2>$null | Out-String; $partOfDomain = (Get-CimInstance -ClassName Win32_ComputerSystem -EA SilentlyContinue).PartOfDomain; if ($dsreg -match 'AzureAdJoined\\s*:\\s*YES' -or $dsreg -match 'EnterpriseJoined\\s*:\\s*YES' -or $dsreg -match 'DomainJoined\\s*:\\s*YES' -or $partOfDomain) { Write-Output 'This machine appears to be domain-joined or MDM-enrolled - refusing to remove browser policy keys, they may be centrally managed.'; exit 1 }; $bk = \"$env:ProgramData\\PortableFix\\browser_policy_backup.reg\"; New-Item -ItemType Directory -Force -Path (Split-Path $bk) | Out-Null; reg export 'HKLM\\SOFTWARE\\Policies\\Google\\Chrome' $bk /y 2>$null | Out-Null; reg export 'HKLM\\SOFTWARE\\Policies\\Microsoft\\Edge' \"$bk.edge\" /y 2>$null | Out-Null; Remove-Item 'HKLM:\\SOFTWARE\\Policies\\Google\\Chrome' -Recurse -Force -EA SilentlyContinue; Remove-Item 'HKLM:\\SOFTWARE\\Policies\\Microsoft\\Edge' -Recurse -Force -EA SilentlyContinue; $chromeGone = -not (Test-Path 'HKLM:\\SOFTWARE\\Policies\\Google\\Chrome'); $edgeGone = -not (Test-Path 'HKLM:\\SOFTWARE\\Policies\\Microsoft\\Edge'); if ($chromeGone -and $edgeGone) { Write-Output 'Chrome/Edge policy keys removed (backups exported as .reg files).' } else { $remaining = @(); if (-not $chromeGone) { $remaining += 'Chrome' }; if (-not $edgeGone) { $remaining += 'Edge' }; Write-Output ('Failed to remove policy keys for: ' + ($remaining -join ', ') + ' (needs administrator).'); exit 1 }"
    undo_command: "reg import \"$env:ProgramData\\PortableFix\\browser_policy_backup.reg\"; reg import \"$env:ProgramData\\PortableFix\\browser_policy_backup.reg.edge\""
    description_sk: "POZOR: odstráni policy kľúče Chrome/Edge z registra (adware ich často zneužíva, ale na firemnom/spravovanom PC môžu byť legitímne). Akcia sama skontroluje pripojenie k doméne a registráciu v MDM (dsregcmd) a na spravovanom počítači odmietne pokračovať. Vyžaduje administrátora, po odstránení overí, či kľúče naozaj zmizli. Kľúče zálohuje ako súbory .reg, undo ich importuje späť."
    description_en: "WARNING: removes Chrome/Edge policy registry keys (often abused by adware, but can be legitimate on a domain/MDM-managed machine). The action itself checks domain join and MDM enrollment (dsregcmd) and refuses to run on a managed machine. Needs administrator; verifies the keys are actually gone afterward. Backed up as .reg files, undo re-imports them."
