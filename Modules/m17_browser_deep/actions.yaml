module_id: m17_browser_deep
category: REPAIR
actions:
  - id: browser_extensions_report
    label_sk: "Prehľad rozšírení prehliadačov"
    label_en: "Browser extensions report"
    risk: SAFE
    command: "function Test-PfRealDir([string]$Base, [string]$Rel) { $p = $Base; $segs = @('') + @(\"$Rel\".Split('\\') | Where-Object { $_ }); foreach ($s in $segs) { if ($s) { $p = Join-Path $p $s }; $i = Get-Item -LiteralPath $p -Force -EA SilentlyContinue; if (-not $i) { return '' }; if ($i.Attributes -band [IO.FileAttributes]::ReparsePoint) { return ('LINK:' + $i.FullName) }; if (-not $i.PSIsContainer) { return '' } }; return $i.FullName }; function Get-PfProfiles([string]$Root, [bool]$Opera) { $rp = [IO.FileAttributes]::ReparsePoint; $out = @(); if ($Opera -and (Test-Path -LiteralPath (Join-Path $Root 'Preferences') -PathType Leaf)) { $out += '' }; foreach ($d in @(Get-ChildItem -LiteralPath $Root -Directory -Force -EA SilentlyContinue)) { if ($d.Attributes -band $rp) { continue }; if ($d.Name -eq 'Default' -or (Test-Path -LiteralPath (Join-Path $d.FullName 'Preferences') -PathType Leaf)) { $out += $d.Name } }; if ($Opera) { $side = Test-PfRealDir $Root '_side_profiles'; if ($side -and $side -notlike 'LINK:*') { foreach ($d in @(Get-ChildItem -LiteralPath $side -Directory -Force -EA SilentlyContinue)) { if ($d.Attributes -band $rp) { continue }; if (Test-Path -LiteralPath (Join-Path $d.FullName 'Preferences') -PathType Leaf) { $out += ('_side_profiles\\' + $d.Name) } } } }; return $out }; $la = $env:LOCALAPPDATA; $ra = $env:APPDATA; $browsers = @(@{N='Chrome'; P='chrome'; B=$la; S='Google\\Chrome\\User Data'}, @{N='Edge'; P='msedge'; B=$la; S='Microsoft\\Edge\\User Data'}, @{N='Brave'; P='brave'; B=$la; S='BraveSoftware\\Brave-Browser\\User Data'}, @{N='Vivaldi'; P='vivaldi'; B=$la; S='Vivaldi\\User Data'}, @{N='Opera'; P='opera'; B=$ra; S='Opera Software\\Opera Stable'; L=$la; O=$true}, @{N='Opera GX'; P='opera'; B=$ra; S='Opera Software\\Opera GX Stable'; L=$la; O=$true}); $pfUserLocal = $env:LOCALAPPDATA; $pfUserRoaming = $env:APPDATA; $pfProfile = ''; if ($__pfUserSid) { $pfProfile = [string](Get-ItemProperty -Path ('Registry::HKEY_LOCAL_MACHINE\\SOFTWARE\\Microsoft\\Windows NT\\CurrentVersion\\ProfileList\\' + $__pfUserSid) -Name ProfileImagePath -EA SilentlyContinue).ProfileImagePath; if ($pfProfile) { $pfUserLocal = $pfProfile + '\\AppData\\Local'; $pfUserRoaming = $pfProfile + '\\AppData\\Roaming' } }; if ($pfProfile) { foreach ($b in $browsers) { if ($b.O) { $b.B = $pfUserRoaming; $b.L = $pfUserLocal } else { $b.B = $pfUserLocal } } }; foreach ($b in $browsers) { if (-not $b.B) { continue }; $root = Test-PfRealDir $b.B $b.S; if (-not $root -or $root -like 'LINK:*') { continue }; foreach ($rel in @(Get-PfProfiles $root ([bool]$b.O))) { $dir = Test-PfRealDir $root $rel; if (-not $dir -or $dir -like 'LINK:*') { continue }; $name = $b.N + ' / ' + $(if ($rel) { $rel } else { '(main)' }); $map = [ordered]@{}; $bad = $false; $any = $false; foreach ($f in @('Secure Preferences', 'Preferences')) { $pf = Join-Path $dir $f; if (-not (Test-Path -LiteralPath $pf -PathType Leaf)) { continue }; $any = $true; try { $j = Get-Content -LiteralPath $pf -Raw -Encoding UTF8 -EA Stop | ConvertFrom-Json -EA Stop; if ($j.extensions.settings) { foreach ($x in $j.extensions.settings.PSObject.Properties) { if (-not $map.Contains($x.Name) -or -not $map[$x.Name].manifest) { $map[$x.Name] = $x.Value } } } } catch { $bad = $true } }; if (-not $any) { continue }; if ($bad -and $map.Count -eq 0) { Write-Output ($name + ': could not parse preferences file.'); continue }; Write-Output ('--- ' + $name + ' (' + $map.Count + ' extensions) ---'); foreach ($id in $map.Keys) { $v = $map[$id]; $on = $(if ($null -ne $v.state) { $v.state -eq 1 } else { -not $v.disable_reasons }); $label = $(if ($v.manifest.name) { $v.manifest.name } else { '(' + $id + ')' }); Write-Output ('  ' + $(if ($on) { 'enabled ' } else { 'disabled' }) + '  ' + $label) } } }; $ffDir = $pfUserRoaming + '\\Mozilla\\Firefox\\Profiles'; $ffProfiles = @(); if ($pfUserRoaming) { if (Test-Path -LiteralPath $ffDir -PathType Container) { $ffProfiles = @(Get-ChildItem -LiteralPath $ffDir -Directory -Force -EA SilentlyContinue) } }; foreach ($ffProfile in $ffProfiles) { $extJson = Join-Path $ffProfile.FullName 'extensions.json'; if (Test-Path -LiteralPath $extJson -PathType Leaf) { try { $j = Get-Content -LiteralPath $extJson -Raw -Encoding UTF8 -EA Stop | ConvertFrom-Json -EA Stop; Write-Output ('--- Firefox / ' + $ffProfile.Name + ' (' + @($j.addons).Count + ' extensions) ---'); foreach ($a in @($j.addons)) { $label = $(if ($a.defaultLocale.name) { $a.defaultLocale.name } else { '(' + $a.id + ')' }); Write-Output ('  ' + $(if ($a.active) { 'enabled ' } else { 'disabled' }) + '  ' + $label) } } catch { Write-Output ('Firefox / ' + $ffProfile.Name + ': could not parse extensions.json.') } } }; Write-Output '--- End ---'"
    description_sk: "Vypíše nainštalované rozšírenia vo všetkých profiloch prehliadačov Chrome, Edge, Brave, Vivaldi, Opera, Opera GX a Firefox (profil = priečinok so súborom Preferences, napr. Default, Profile 2, Guest Profile; pri Opere hlavný profil aj _side_profiles). Prehliadače hľadá v priečinku prihláseného používateľa (podľa SID z prelude), nie technika. Formát interného konfiguračného súboru sa medzi verziami prehliadača mení, výsledok berte ako orientačný. Nič nemení."
    description_en: "Lists installed extensions in every profile of Chrome, Edge, Brave, Vivaldi, Opera, Opera GX and Firefox (a profile is a folder with a Preferences file, e.g. Default, Profile 2, Guest Profile; for Opera the main profile and _side_profiles) in the signed-in user's profile folder (resolved from the prelude SID), not the technician's. The internal config file format shifts between browser versions, treat as best-effort. Changes nothing."
    # Same profile enumeration as m02 browser_cache_sweep (test_m17_catalog keeps
    # the text identical). -Encoding UTF8: Windows PowerShell 5.1 reads a file
    # without BOM as ANSI, which garbles non-ASCII extension names.

  - id: browser_policy_report
    label_sk: "Firemné pravidlá prehliadačov (policy)"
    label_en: "Browser enterprise policy report"
    risk: SAFE
    # The same key set browser_clear_policy_keys removes, so report and fix agree.
    command: "$uh = if ($__pfUserHive) { $__pfUserHive } else { 'HKCU:' }; foreach ($e in @(@{ N = 'Chrome policy (HKLM)'; P = 'HKLM:\\SOFTWARE\\Policies\\Google\\Chrome' }, @{ N = 'Edge policy (HKLM)'; P = 'HKLM:\\SOFTWARE\\Policies\\Microsoft\\Edge' }, @{ N = 'Chrome policy (HKLM, 32-bit WOW6432Node)'; P = 'HKLM:\\SOFTWARE\\WOW6432Node\\Policies\\Google\\Chrome' }, @{ N = 'Edge policy (HKLM, 32-bit WOW6432Node)'; P = 'HKLM:\\SOFTWARE\\WOW6432Node\\Policies\\Microsoft\\Edge' }, @{ N = ('Chrome policy (user hive ' + $uh + ')'); P = ($uh + '\\SOFTWARE\\Policies\\Google\\Chrome') }, @{ N = ('Edge policy (user hive ' + $uh + ')'); P = ($uh + '\\SOFTWARE\\Policies\\Microsoft\\Edge') })) { Write-Output ('--- ' + $e.N + ' ---'); if (Test-Path -Path $e.P) { Get-ItemProperty -Path $e.P -EA SilentlyContinue | Format-List | Out-String -Width 200 | ForEach-Object { $_.TrimEnd() }; foreach ($s in @(Get-ChildItem -Path $e.P -Recurse -EA SilentlyContinue)) { Write-Output ('  subkey: ' + $s.PSChildName); Get-ItemProperty -Path $s.PSPath -EA SilentlyContinue | Format-List | Out-String -Width 200 | ForEach-Object { $_.TrimEnd() } } } else { Write-Output '  (absent)' } }; Write-Output '--- End ---'"
    description_sk: "Zobrazí vynútené policy nastavenia Chrome/Edge (povinne inštalované rozšírenia, domovská stránka a pod.) z HKLM, z 32-bitovej vetvy WOW6432Node aj z profilu prihláseného používateľa vrátane podkľúčov - rovnakú sadu kľúčov, ktorú odstraňuje akcia Vymazanie policy kľúčov Chrome/Edge. Rozhranie prehliadača ich zobrazuje len ako 'spravované organizáciou', bez možnosti zmeny. Nič nemení."
    description_en: "Shows enforced Chrome/Edge policy settings (forced extensions, homepage, etc.) from HKLM, the 32-bit WOW6432Node branch and the signed-in user's profile, subkeys included - the same key set the Clear Chrome/Edge policy keys action removes. The browser UI only shows these as 'managed by your organization' with no way to change them. Changes nothing."

  - id: browser_homepage_search_report
    label_sk: "Kontrola domovskej stránky a vyhľadávania"
    label_en: "Homepage/search hijack check"
    risk: SAFE
    command: "function Test-PfRealDir([string]$Base, [string]$Rel) { $p = $Base; $segs = @('') + @(\"$Rel\".Split('\\') | Where-Object { $_ }); foreach ($s in $segs) { if ($s) { $p = Join-Path $p $s }; $i = Get-Item -LiteralPath $p -Force -EA SilentlyContinue; if (-not $i) { return '' }; if ($i.Attributes -band [IO.FileAttributes]::ReparsePoint) { return ('LINK:' + $i.FullName) }; if (-not $i.PSIsContainer) { return '' } }; return $i.FullName }; function Get-PfProfiles([string]$Root, [bool]$Opera) { $rp = [IO.FileAttributes]::ReparsePoint; $out = @(); if ($Opera -and (Test-Path -LiteralPath (Join-Path $Root 'Preferences') -PathType Leaf)) { $out += '' }; foreach ($d in @(Get-ChildItem -LiteralPath $Root -Directory -Force -EA SilentlyContinue)) { if ($d.Attributes -band $rp) { continue }; if ($d.Name -eq 'Default' -or (Test-Path -LiteralPath (Join-Path $d.FullName 'Preferences') -PathType Leaf)) { $out += $d.Name } }; if ($Opera) { $side = Test-PfRealDir $Root '_side_profiles'; if ($side -and $side -notlike 'LINK:*') { foreach ($d in @(Get-ChildItem -LiteralPath $side -Directory -Force -EA SilentlyContinue)) { if ($d.Attributes -band $rp) { continue }; if (Test-Path -LiteralPath (Join-Path $d.FullName 'Preferences') -PathType Leaf) { $out += ('_side_profiles\\' + $d.Name) } } } }; return $out }; $la = $env:LOCALAPPDATA; $ra = $env:APPDATA; $browsers = @(@{N='Chrome'; P='chrome'; B=$la; S='Google\\Chrome\\User Data'}, @{N='Edge'; P='msedge'; B=$la; S='Microsoft\\Edge\\User Data'}, @{N='Brave'; P='brave'; B=$la; S='BraveSoftware\\Brave-Browser\\User Data'}, @{N='Vivaldi'; P='vivaldi'; B=$la; S='Vivaldi\\User Data'}, @{N='Opera'; P='opera'; B=$ra; S='Opera Software\\Opera Stable'; L=$la; O=$true}, @{N='Opera GX'; P='opera'; B=$ra; S='Opera Software\\Opera GX Stable'; L=$la; O=$true}); $pfUserLocal = $env:LOCALAPPDATA; $pfUserRoaming = $env:APPDATA; $pfProfile = ''; if ($__pfUserSid) { $pfProfile = [string](Get-ItemProperty -Path ('Registry::HKEY_LOCAL_MACHINE\\SOFTWARE\\Microsoft\\Windows NT\\CurrentVersion\\ProfileList\\' + $__pfUserSid) -Name ProfileImagePath -EA SilentlyContinue).ProfileImagePath; if ($pfProfile) { $pfUserLocal = $pfProfile + '\\AppData\\Local'; $pfUserRoaming = $pfProfile + '\\AppData\\Roaming' } }; if ($pfProfile) { foreach ($b in $browsers) { if ($b.O) { $b.B = $pfUserRoaming; $b.L = $pfUserLocal } else { $b.B = $pfUserLocal } } }; foreach ($b in $browsers) { if (-not $b.B) { continue }; $root = Test-PfRealDir $b.B $b.S; if (-not $root -or $root -like 'LINK:*') { continue }; foreach ($rel in @(Get-PfProfiles $root ([bool]$b.O))) { $dir = Test-PfRealDir $root $rel; if (-not $dir -or $dir -like 'LINK:*') { continue }; $name = $b.N + ' / ' + $(if ($rel) { $rel } else { '(main)' }); $pf = Join-Path $dir 'Preferences'; if (-not (Test-Path -LiteralPath $pf -PathType Leaf)) { continue }; try { $j = Get-Content -LiteralPath $pf -Raw -Encoding UTF8 -EA Stop | ConvertFrom-Json -EA Stop } catch { Write-Output ($name + ': could not parse preferences file.'); continue }; Write-Output ('--- ' + $name + ' ---'); Write-Output ('Homepage: ' + $j.homepage); $sn = $j.default_search_provider.name; if (-not $sn) { $sn = $j.default_search_provider_data.template_url_data.short_name }; Write-Output ('Default search: ' + $sn); Write-Output ('Search URL: ' + $j.default_search_provider_data.template_url_data.url); Write-Output ('Startup URLs: ' + (@($j.session.startup_urls) -join ', ')) } }; Write-Output '--- End ---'"
    description_sk: "Zobrazí domovskú stránku, predvolený vyhľadávač (názov aj URL) a stránky pri štarte vo všetkých profiloch prehliadačov Chrome, Edge, Brave, Vivaldi, Opera a Opera GX - klasický príznak únosu prehliadača (adware/PUA), ktorý sa často usadí len v jednom profile. Prehliadače hľadá v priečinku prihláseného používateľa (podľa SID z prelude). Nič nemení."
    description_en: "Shows the homepage, default search provider (name and URL) and startup pages in every profile of Chrome, Edge, Brave, Vivaldi, Opera and Opera GX in the signed-in user's profile folder (resolved from the prelude SID) - a classic browser-hijack (adware/PUA) signal that often sits in one profile only. Changes nothing."

  - id: browser_reset_chrome_profile
    label_sk: "Reset profilu Chrome"
    label_en: "Reset Chrome profile"
    risk: MODERATE
    command: "$running = @(Get-Process -EA SilentlyContinue | ForEach-Object { $_.ProcessName }); if ($running -contains 'chrome') { Write-Output 'Chrome is running - refusing to reset the profile (closing it would lose the open tabs and unsaved form data). Close Chrome completely, including background apps in the tray, and run the action again. Nothing was changed.'; exit 1 }; $pfUserLocal = $env:LOCALAPPDATA; $pfUserRoaming = $env:APPDATA; $pfProfile = ''; if ($__pfUserSid) { $pfProfile = [string](Get-ItemProperty -Path ('Registry::HKEY_LOCAL_MACHINE\\SOFTWARE\\Microsoft\\Windows NT\\CurrentVersion\\ProfileList\\' + $__pfUserSid) -Name ProfileImagePath -EA SilentlyContinue).ProfileImagePath; if ($pfProfile) { $pfUserLocal = $pfProfile + '\\AppData\\Local'; $pfUserRoaming = $pfProfile + '\\AppData\\Roaming' } }; $ts = Get-Date -Format 'yyyyMMdd_HHmmss'; $root = $pfUserLocal + '\\Google\\Chrome\\User Data'; $src = Join-Path $root 'Default'; $dst = Join-Path $root \"Default.bak-$ts\"; if (Test-Path -LiteralPath $src) { try { Rename-Item -LiteralPath $src -NewName (Split-Path $dst -Leaf) -EA Stop; Write-Output ('Chrome profile reset. Old profile saved as ' + $dst) } catch { Write-Output ('Failed to reset Chrome profile (it may still be running): ' + $_.Exception.Message); exit 1 }; $others = @(Get-ChildItem -LiteralPath $root -Directory -Force -EA SilentlyContinue | Where-Object { $_.Name -notlike 'Default.bak-*' -and (Test-Path -LiteralPath (Join-Path $_.FullName 'Preferences') -PathType Leaf) } | ForEach-Object { $_.Name }); if ($others.Count) { Write-Output ('Other profiles left unchanged: ' + ($others -join ', ')) } } else { Write-Output 'Chrome default profile not found.' }"
    description_sk: "Odloží profil Default prehliadača Chrome (nastavenia, rozšírenia, uložené heslá) premenovaním - Chrome si pri ďalšom štarte vytvorí nový. Ak Chrome beží (aj na pozadí v oblasti oznámení), akcia odmietne pokračovať a nič nezmení - Chrome nezatvára, aby klient neprišiel o otvorené karty a rozpísané formuláre; zatvorte ho a spustite akciu znova. Ostatné profily nemení, len ich vypíše. Profil hľadá v priečinku prihláseného používateľa (podľa SID z prelude cez ProfileList), takže aj keď PortableFix beží pod účtom technika, resetuje sa profil klienta. Záloha ostane na disku, ale bez automatického undo (bezpečne sa dá vrátiť len pred ďalším spustením Chrome)."
    description_en: "Renames Chrome's Default profile (settings, extensions, saved passwords) aside - Chrome creates a fresh one on next launch. The profile folder is the signed-in user's (resolved from the prelude SID via ProfileList), so the client's profile is reset even when PortableFix runs as the technician's account. If Chrome is running (including in the background in the tray) the action refuses and changes nothing - it never closes Chrome, so the client does not lose open tabs or unsaved forms; close it and run the action again. Other profiles are left unchanged and listed. The old profile stays on disk but there's no automatic undo (only safely reversible before Chrome is relaunched)."
    # Refuses while the browser runs instead of killing it (it used to
    # Stop-Process -Force): the action's job is the profile, not closing the
    # client's browser, and a kill discards open tabs and form input and can cut
    # a Preferences write in half. The rename would fail on the locked profile
    # anyway. Only Default is reset - other profiles are listed, never touched.

  - id: browser_reset_edge_profile
    label_sk: "Reset profilu Edge"
    label_en: "Reset Edge profile"
    risk: MODERATE
    command: "$running = @(Get-Process -EA SilentlyContinue | ForEach-Object { $_.ProcessName }); if ($running -contains 'msedge') { Write-Output 'Edge is running - refusing to reset the profile (closing it would lose the open tabs and unsaved form data). Close Edge completely, including background apps in the tray, and run the action again. If msedge keeps running with every Edge window closed, Startup boost is holding it: end the msedge processes in Task Manager or turn off Edge Settings > System and performance > Startup boost. Nothing was changed.'; exit 1 }; $pfUserLocal = $env:LOCALAPPDATA; $pfUserRoaming = $env:APPDATA; $pfProfile = ''; if ($__pfUserSid) { $pfProfile = [string](Get-ItemProperty -Path ('Registry::HKEY_LOCAL_MACHINE\\SOFTWARE\\Microsoft\\Windows NT\\CurrentVersion\\ProfileList\\' + $__pfUserSid) -Name ProfileImagePath -EA SilentlyContinue).ProfileImagePath; if ($pfProfile) { $pfUserLocal = $pfProfile + '\\AppData\\Local'; $pfUserRoaming = $pfProfile + '\\AppData\\Roaming' } }; $ts = Get-Date -Format 'yyyyMMdd_HHmmss'; $root = $pfUserLocal + '\\Microsoft\\Edge\\User Data'; $src = Join-Path $root 'Default'; $dst = Join-Path $root \"Default.bak-$ts\"; if (Test-Path -LiteralPath $src) { try { Rename-Item -LiteralPath $src -NewName (Split-Path $dst -Leaf) -EA Stop; Write-Output ('Edge profile reset. Old profile saved as ' + $dst) } catch { Write-Output ('Failed to reset Edge profile (it may still be running): ' + $_.Exception.Message); exit 1 }; $others = @(Get-ChildItem -LiteralPath $root -Directory -Force -EA SilentlyContinue | Where-Object { $_.Name -notlike 'Default.bak-*' -and (Test-Path -LiteralPath (Join-Path $_.FullName 'Preferences') -PathType Leaf) } | ForEach-Object { $_.Name }); if ($others.Count) { Write-Output ('Other profiles left unchanged: ' + ($others -join ', ')) } } else { Write-Output 'Edge default profile not found.' }"
    description_sk: "Rovnaký princíp ako reset profilu Chrome, ale pre profil Default prehliadača Edge (proces msedge). Ak Edge beží (aj cez zrýchlené spúšťanie na pozadí), akcia odmietne pokračovať a nič nezmení; Edge nezatvára. Ostatné profily len vypíše. Profil hľadá v priečinku prihláseného používateľa (podľa SID z prelude). Záloha ostane, bez automatického undo."
    description_en: "Same approach as the Chrome reset, targeting Edge's Default profile (msedge process) in the signed-in user's profile folder (resolved from the prelude SID). If Edge is running (including startup boost in the background) the action refuses and changes nothing; it never closes Edge. Other profiles are only listed. Backup kept, no automatic undo."

  - id: browser_clear_policy_keys
    label_sk: "Vymazanie policy kľúčov Chrome/Edge"
    label_en: "Clear Chrome/Edge policy keys"
    risk: DESTRUCTIVE
    # Per key: Test-Path -> reg export -> verify exit code + file -> remove.
    # reg export of an absent key fails and leaves no file (undo then imported
    # nothing/garbage). Covers the 32-bit WOW6432Node copies and the signed-in
    # user's hive ($uh / HKU\<sid> for reg.exe). browser_policy_report lists
    # the same set.
    command: "$dsreg = dsregcmd /status 2>$null | Out-String; $partOfDomain = (Get-CimInstance -ClassName Win32_ComputerSystem -EA SilentlyContinue).PartOfDomain; if ($dsreg -match 'AzureAdJoined\\s*:\\s*YES' -or $dsreg -match 'EnterpriseJoined\\s*:\\s*YES' -or $dsreg -match 'DomainJoined\\s*:\\s*YES' -or $partOfDomain) { Write-Output 'This machine appears to be domain-joined or MDM-enrolled - refusing to remove browser policy keys, they may be centrally managed.'; exit 1 }; $uh = if ($__pfUserHive) { $__pfUserHive } else { 'HKCU:' }; $ru = if ($__pfUserSid) { 'HKU\\' + $__pfUserSid } else { 'HKCU' }; $dir = \"$env:ProgramData\\PortableFix\\browser_policy\"; New-Item -ItemType Directory -Force -Path $dir | Out-Null; $keys = @(@{ N = 'chrome_hklm'; P = 'HKLM:\\SOFTWARE\\Policies\\Google\\Chrome'; R = 'HKLM\\SOFTWARE\\Policies\\Google\\Chrome' }, @{ N = 'edge_hklm'; P = 'HKLM:\\SOFTWARE\\Policies\\Microsoft\\Edge'; R = 'HKLM\\SOFTWARE\\Policies\\Microsoft\\Edge' }, @{ N = 'chrome_wow'; P = 'HKLM:\\SOFTWARE\\WOW6432Node\\Policies\\Google\\Chrome'; R = 'HKLM\\SOFTWARE\\WOW6432Node\\Policies\\Google\\Chrome' }, @{ N = 'edge_wow'; P = 'HKLM:\\SOFTWARE\\WOW6432Node\\Policies\\Microsoft\\Edge'; R = 'HKLM\\SOFTWARE\\WOW6432Node\\Policies\\Microsoft\\Edge' }, @{ N = 'chrome_user'; P = ($uh + '\\SOFTWARE\\Policies\\Google\\Chrome'); R = ($ru + '\\SOFTWARE\\Policies\\Google\\Chrome') }, @{ N = 'edge_user'; P = ($uh + '\\SOFTWARE\\Policies\\Microsoft\\Edge'); R = ($ru + '\\SOFTWARE\\Policies\\Microsoft\\Edge') }); $removed = @(); $failed = @(); foreach ($e in $keys) { if (-not (Test-Path -Path $e.P)) { continue }; $f = Join-Path $dir ($e.N + '.reg'); reg export $e.R $f /y 2>$null | Out-Null; if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $f)) { Write-Output ('Backup of ' + $e.R + ' to ' + $f + ' failed - not removing it. ' + $(if ($removed.Count) { 'Already removed: ' + ($removed -join ', ') + '.' } else { 'Nothing was changed.' })); exit 1 }; Remove-Item -Path $e.P -Recurse -Force -EA SilentlyContinue; if (Test-Path -Path $e.P) { $failed += $e.R } else { $removed += $e.R } }; if ($failed.Count) { Write-Output ('Failed to remove policy keys: ' + ($failed -join ', ') + ' (needs administrator). Removed: ' + $(if ($removed.Count) { $removed -join ', ' } else { 'none' }) + '.'); exit 1 }; if ($removed.Count) { Write-Output ('Removed browser policy keys: ' + ($removed -join ', ') + ' (backups in ' + $dir + ', undo imports them).') } else { Write-Output 'No Chrome/Edge policy keys present (HKLM, WOW6432Node, user hive) - nothing to remove.' }"
    undo_command: "$dir = \"$env:ProgramData\\PortableFix\\browser_policy\"; $restored = @(); foreach ($n in 'chrome_hklm', 'edge_hklm', 'chrome_wow', 'edge_wow', 'chrome_user', 'edge_user') { $f = Join-Path $dir ($n + '.reg'); if (-not (Test-Path -LiteralPath $f)) { continue }; reg import $f 2>$null | Out-Null; if ($LASTEXITCODE -eq 0) { $restored += $n } else { Write-Output ('reg import of ' + $f + ' failed (exit code ' + $LASTEXITCODE + ').') } }; if ($restored.Count) { Write-Output ('Browser policy keys restored from: ' + ($restored -join ', ') + '.') } else { Write-Output 'No browser policy backup found - nothing to restore.' }"
    description_sk: "POZOR: odstráni policy kľúče Chrome/Edge z registra - z HKLM, z 32-bitovej vetvy WOW6432Node aj z profilu prihláseného používateľa (adware ich často zneužíva, ale na firemnom/spravovanom PC môžu byť legitímne). Akcia sama skontroluje pripojenie k doméne a registráciu v MDM (dsregcmd) a na spravovanom počítači odmietne pokračovať. Vyžaduje administrátora. Každý existujúci kľúč najprv exportuje do súboru .reg a overí, že export prebehol - ak zlyhá, kľúč neodstráni a skončí chybou; po odstránení overí, či kľúče naozaj zmizli. Undo importuje späť len existujúce zálohy."
    description_en: "WARNING: removes the Chrome/Edge policy registry keys - from HKLM, the 32-bit WOW6432Node branch and the signed-in user's profile (often abused by adware, but can be legitimate on a domain/MDM-managed machine). The action itself checks domain join and MDM enrollment (dsregcmd) and refuses to run on a managed machine. Needs administrator. Every existing key is exported to a .reg file first and the export is verified - when it fails the key is left in place and the action fails; afterwards it verifies the keys are actually gone. Undo re-imports only the backups that exist."
