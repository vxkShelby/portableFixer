module_id: m04_integrity
category: REPAIR
actions:
  - id: dism_checkhealth
    label_sk: "Rychla kontrola uloziska komponentov"
    label_en: "Quick component store check"
    risk: SAFE
    command: "DISM /Online /Cleanup-Image /CheckHealth; if ($LASTEXITCODE -eq 3010) { Write-Output 'Check completed - restart required.'; exit 0 } else { exit $LASTEXITCODE }"
    description_sk: "Rychlo overi, ci je uloziste komponentov oznacene ako poskodene."
    description_en: "Quickly checks whether the component store is flagged as corrupted."
  - id: dism_scanhealth
    label_sk: "Hlbkova kontrola uloziska komponentov"
    label_en: "Deep component store scan"
    risk: SAFE
    command: "DISM /Online /Cleanup-Image /ScanHealth; if ($LASTEXITCODE -eq 3010) { Write-Output 'Scan completed - restart required.'; exit 0 } else { exit $LASTEXITCODE }"
    description_sk: "Dokladnejsie skenovanie uloziska komponentov (dlhsie trva)."
    description_en: "More thorough component store scan (takes longer)."
  - id: dism_restorehealth
    label_sk: "Oprava uloziska komponentov"
    label_en: "Repair component store"
    risk: REQUIRES_REBOOT
    command: "DISM /Online /Cleanup-Image /RestoreHealth; if ($LASTEXITCODE -eq 3010) { Write-Output 'Repair completed - restart required.'; exit 0 } else { exit $LASTEXITCODE }"
    description_sk: "Opravi uloziste komponentov cez Windows Update. Po dokonceni sa odporuca restart pred spustenim sfc /scannow."
    description_en: "Repairs the component store via Windows Update. A restart is recommended before running sfc /scannow afterward."
  - id: sfc_scannow
    label_sk: "System File Checker (oprava)"
    label_en: "System File Checker (repair)"
    risk: MODERATE
    command: "sfc /scannow"
    description_sk: "Skontroluje a opravi chranene systemove subory."
    description_en: "Scans and repairs protected system files."
  - id: sfc_verifyonly
    label_sk: "System File Checker (len overenie)"
    label_en: "System File Checker (verify only)"
    risk: SAFE
    command: "sfc /verifyonly"
    description_sk: "Len overi integritu systemovych suborov, nic nemeni."
    description_en: "Only verifies system file integrity, changes nothing."
  - id: appx_reregister
    label_sk: "Re-registracia Windows Store aplikacii"
    label_en: "Re-register Windows Store apps"
    risk: MODERATE
    command: "$pkgs = Get-AppXPackage -AllUsers | Where-Object { $_.InstallLocation }; $ok = 0; $failed = 0; foreach ($p in $pkgs) { try { Add-AppxPackage -DisableDevelopmentMode -Register \"$($p.InstallLocation)\\AppXManifest.xml\" -EA Stop } catch { $failed++; continue }; $ok++ }; Write-Output (\"Re-registered: \" + $ok + \", failed: \" + $failed)"
    description_sk: "Znova zaregistruje vsetky nainstalovane UWP aplikacie pre vsetkych pouzivatelov. Preskakuje baliky bez instalacnej cesty."
    description_en: "Re-registers all installed UWP apps for all users. Skips packages without an install path."
  - id: wmi_verify
    label_sk: "Overenie WMI repozitara"
    label_en: "Verify WMI repository"
    risk: SAFE
    command: "winmgmt /verifyrepository"
    description_sk: "Skontroluje konzistenciu WMI repozitara bez zmien."
    description_en: "Checks WMI repository consistency without making changes."
  - id: wmi_backup
    label_sk: "Zaloha WMI repozitara"
    label_en: "Back up WMI repository"
    risk: SAFE
    command: "$bk = \"$env:ProgramData\\PortableFix\\wmi_backup.bin\"; New-Item -ItemType Directory -Force -Path (Split-Path $bk) | Out-Null; winmgmt /backup $bk; if ($LASTEXITCODE -eq 0) { Write-Output ('WMI repository backed up to ' + $bk) } else { Write-Output 'WMI backup failed.'; exit 1 }"
    description_sk: "Vytvori zalohu WMI repozitara pred pripadnym zachranenim (Salvage). Odporucane spustit pred wmi_salvage."
    description_en: "Creates a backup of the WMI repository before a potential salvage. Recommended to run before wmi_salvage."
  - id: wmi_salvage
    label_sk: "Zachranenie WMI repozitara"
    label_en: "Salvage WMI repository"
    risk: DESTRUCTIVE
    command: "winmgmt /salvagerepository"
    undo_command: "$bk = \"$env:ProgramData\\PortableFix\\wmi_backup.bin\"; if (Test-Path $bk) { winmgmt /restore $bk 1; Write-Output 'WMI repository restored from backup.' } else { Write-Output 'No WMI backup found - nothing to restore.' }"
    description_sk: "Pokusi sa opravit poskodeny WMI repozitar. Robit len po zalohe (akcia wmi_backup), moze stratit vlastne WMI rozsirenia. Undo obnovi zo zalohy, ak existuje."
    description_en: "Attempts to repair a corrupted WMI repository. Only after a backup (the wmi_backup action) - may lose custom WMI extensions. Undo restores from the backup, if one exists."
