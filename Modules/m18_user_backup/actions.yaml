module_id: m18_user_backup
category: REPAIR
actions:
  - id: backup_user_folders
    label_sk: "Záloha používateľských priečinkov"
    label_en: "Back up user folders"
    risk: MODERATE
    preview_command: "$total = 0; $count = 0; foreach ($f in 'Desktop','Documents','Pictures','Favorites') { $p = Join-Path $env:USERPROFILE $f; if (Test-Path $p) { $items = Get-ChildItem $p -Recurse -File -Force -EA SilentlyContinue; $count += $items.Count; $total += ($items | Measure-Object Length -Sum).Sum } }; Write-Output ('Would back up ' + $count + ' file(s), ' + [math]::Round($total/1GB,2) + ' GB from Desktop/Documents/Pictures/Favorites')"
    command: "$me = \"$env:USERDOMAIN\\$env:USERNAME\"; $root = \"$env:ProgramData\\PortableFix\"; New-Item -ItemType Directory -Force -Path $root | Out-Null; icacls $root /inheritance:r /grant:r \"*S-1-5-32-544:(OI)(CI)F\" /grant:r \"*S-1-5-18:(OI)(CI)F\" /grant:r \"${me}:(OI)(CI)F\" | Out-Null; $ts = Get-Date -Format 'yyyyMMdd_HHmmss'; $dest = \"$root\\UserFileBackup\\$ts\"; New-Item -ItemType Directory -Force -Path $dest | Out-Null; icacls $dest /inheritance:r /grant:r \"*S-1-5-32-544:(OI)(CI)F\" /grant:r \"*S-1-5-18:(OI)(CI)F\" /grant:r \"${me}:(OI)(CI)F\" | Out-Null; $failed = $false; foreach ($f in 'Desktop','Documents','Pictures','Favorites') { $src = Join-Path $env:USERPROFILE $f; if (Test-Path $src) { robocopy $src (Join-Path $dest $f) /E /R:1 /W:1 /NFL /NDL /NJH /NJS | Out-Null; if ($LASTEXITCODE -ge 8) { $failed = $true } } }; if ($failed) { Write-Output ('Backup completed with errors: ' + $dest); exit 1 } else { Write-Output ('Backup complete: ' + $dest) }"
    undo_command: "$latest = Get-ChildItem \"$env:ProgramData\\PortableFix\\UserFileBackup\" -Directory -EA SilentlyContinue | Sort-Object Name -Descending | Select-Object -First 1; if ($latest) { $out = Join-Path $env:USERPROFILE ('Desktop\\RESTORED_' + $latest.Name); robocopy $latest.FullName $out /E /R:1 /W:1 /NFL /NDL /NJH /NJS | Out-Null; if ($LASTEXITCODE -ge 8) { Write-Output ('Restore completed with errors to: ' + $out); exit 1 } else { Write-Output ('Restored to ' + $out + ' (copied next to your files, nothing overwritten).') } } else { Write-Output 'No backup found.' }"
    description_sk: "Pred rizikovým zásahom zálohuje Desktop/Documents/Pictures/Favorites do $env:ProgramData\\PortableFix (na tom istom vnútornom disku - chráni pred chybou tohto nástroja, NIE pred zlyhaním fyzického disku). Priečinok so zálohou vidí len aktuálny používateľ, SYSTEM a administrátori (iné lokálne účty na zdieľanom PC ho nevidia). Undo skopíruje najnovšiu zálohu späť do nového priečinka na Ploche."
    description_en: "Backs up Desktop/Documents/Pictures/Favorites before a risky operation to $env:ProgramData\\PortableFix (same internal drive - protects against this tool's own mistakes, NOT a failing physical disk). Only the current user, SYSTEM, and administrators can read the backup folder (other local accounts on a shared PC can't). Undo copies the latest backup back to a new Desktop folder."

  - id: backup_list_existing
    label_sk: "Zoznam existujúcich záloh"
    label_en: "List existing backups"
    risk: SAFE
    command: "$root = \"$env:ProgramData\\PortableFix\\UserFileBackup\"; if (Test-Path $root) { Get-ChildItem $root -Directory | ForEach-Object { $size = (Get-ChildItem $_.FullName -Recurse -File -EA SilentlyContinue | Measure-Object Length -Sum).Sum; [PSCustomObject]@{ Backup = $_.Name; SizeGB = [math]::Round($size/1GB,2) } } | Format-Table -AutoSize } else { Write-Output ('No backups in ' + $root + '.') }; $loc = Get-Location; if ($loc.Provider.Name -eq 'FileSystem' -and $loc.Drive) { $ext = Join-Path ($loc.Drive.Name.ToUpper() + ':\\') 'PortableFix_Backups'; if (Test-Path -LiteralPath $ext -PathType Container) { Write-Output ('Backups on the PortableFix drive (' + $ext + '):'); Get-ChildItem -LiteralPath $ext -Directory | Sort-Object Name | ForEach-Object { $size = (Get-ChildItem -LiteralPath $_.FullName -Recurse -File -Force -EA SilentlyContinue | Measure-Object Length -Sum).Sum; [PSCustomObject]@{ Backup = $_.Name; SizeGB = [math]::Round($size/1GB,2); Manifest = (Test-Path -LiteralPath (Join-Path $_.FullName 'manifest-sha256.csv')) } } | Format-Table -AutoSize | Out-String -Width 200 } }"
    description_sk: "Vypíše všetky doterajšie zálohy používateľských súborov vytvorené týmto nástrojom aj s ich veľkosťou - v $env:ProgramData\\PortableFix aj v PortableFix_Backups na disku, z ktorého beží PortableFix (s informáciou, či má zálohu manifest). Nič nemení."
    description_en: "Lists every user-file backup this tool has created so far, with size - both in $env:ProgramData\\PortableFix and in PortableFix_Backups on the drive PortableFix runs from (with whether each has a manifest). Changes nothing."

  - id: backup_restore_latest
    label_sk: "Obnovenie poslednej zálohy"
    label_en: "Restore latest backup"
    risk: MODERATE
    command: "$latest = Get-ChildItem \"$env:ProgramData\\PortableFix\\UserFileBackup\" -Directory -EA SilentlyContinue | Sort-Object Name -Descending | Select-Object -First 1; if ($latest) { $out = Join-Path $env:USERPROFILE ('Desktop\\RESTORED_' + $latest.Name); robocopy $latest.FullName $out /E /R:1 /W:1 /NFL /NDL /NJH /NJS | Out-Null; if ($LASTEXITCODE -ge 8) { Write-Output ('Restore completed with errors to: ' + $out); exit 1 } else { Write-Output ('Restored to ' + $out + ' (copied next to your files, nothing overwritten).') } } else { Write-Output 'No backup found.' }"
    description_sk: "Samostatná akcia na obnovenie poslednej zálohy - dá sa použiť aj bez undo.ps1 príslušnej dávky (napr. pri inej návšteve u toho istého klienta)."
    description_en: "Standalone restore of the latest backup - usable even without that run's own undo.ps1 (e.g. on a different visit to the same client)."
    exclude_from_select_all: true

  - id: backup_user_data_external
    label_sk: "Záloha dát používateľa na iný disk (SHA-256 manifest)"
    label_en: "Back up user data to another drive (SHA-256 manifest)"
    risk: MODERATE
    # A copy never changes system state - a restore point would cover nothing.
    changes_system: false
    # Deliberate step: needs PortableFix on an external drive and can run for hours.
    exclude_from_select_all: true
    # One multi-GB file hashes silently for minutes over USB 2.
    inactivity_timeout_sec: 3600
    hard_cap_sec: 43200
    preview_command: "$refuse = $null; $dest = $null; $items = @(); $bytes = [long]0; $count = 0; $loc = Get-Location; if ($loc.Provider.Name -ne 'FileSystem' -or -not $loc.Drive) { $refuse = 'PortableFix is not running from a drive letter (' + $loc.ProviderPath + ') - start it from the external drive that should hold the backup.' } else { $drive = $loc.Drive.Name.ToUpper() + ':'; $sysDrive = ([string]$env:SystemDrive).TrimEnd('\\').ToUpper(); if (-not $sysDrive) { $sysDrive = 'C:' }; $pfBase = Join-Path ($drive + '\\') 'PortableFix_Backups'; $dest = Join-Path $pfBase ($env:COMPUTERNAME + '_' + (Get-Date -Format 'yyyyMMdd_HHmmss')); Write-Output ('Destination: ' + $dest); if ($drive -eq $sysDrive) { $refuse = 'The destination ' + $drive + ' is the system drive - run PortableFix from an external or second drive.' } else { $dn = $null; $sn = $null; try { $dn = (Get-Partition -DriveLetter $drive[0] -EA Stop | Select-Object -First 1).DiskNumber; $sn = (Get-Partition -DriveLetter $sysDrive[0] -EA Stop | Select-Object -First 1).DiskNumber } catch { $dn = $null }; if ($null -ne $dn -and $null -ne $sn -and $dn -eq $sn) { $refuse = 'Drive ' + $drive + ' is another partition of physical disk ' + $dn + ', the same disk as ' + $sysDrive + ' - a disk failure would take the backup with it.' } } }; if (-not $refuse) { $usf = Get-ItemProperty -Path 'HKCU:\\Software\\Microsoft\\Windows\\CurrentVersion\\Explorer\\User Shell Folders' -EA SilentlyContinue; foreach ($kf in @(@('Desktop', 'Desktop'), @('Documents', 'Personal'), @('Pictures', 'My Pictures'), @('Downloads', '{374DE290-123F-4565-9164-39C4925E467B}'), @('Favorites', 'Favorites'))) { $p = $null; if ($usf) { $p = $usf.($kf[1]) }; if ($p) { $p = [Environment]::ExpandEnvironmentVariables([string]$p) } else { $p = Join-Path $env:USERPROFILE $kf[0] }; if (Test-Path -LiteralPath $p -PathType Container) { $items += ,@($kf[0], $p, $null) } }; foreach ($b in @(@('Chrome', 'Google\\Chrome\\User Data'), @('Edge', 'Microsoft\\Edge\\User Data'), @('Brave', 'BraveSoftware\\Brave-Browser\\User Data'))) { $ud = Join-Path $env:LOCALAPPDATA $b[1]; if (Test-Path -LiteralPath $ud -PathType Container) { foreach ($pd in @(Get-ChildItem -LiteralPath $ud -Directory -EA SilentlyContinue)) { if (Test-Path -LiteralPath (Join-Path $pd.FullName 'Bookmarks') -PathType Leaf) { $items += ,@(('Bookmarks\\' + $b[0] + '\\' + $pd.Name), $pd.FullName, 'Bookmarks') } } } }; $ff = Join-Path $env:APPDATA 'Mozilla\\Firefox\\Profiles'; if (Test-Path -LiteralPath $ff -PathType Container) { foreach ($pd in @(Get-ChildItem -LiteralPath $ff -Directory -EA SilentlyContinue)) { $bb = Join-Path $pd.FullName 'bookmarkbackups'; if (Test-Path -LiteralPath $bb -PathType Container) { $items += ,@(('Bookmarks\\Firefox\\' + $pd.Name), $bb, $null) } } }; if (-not $items.Count) { $refuse = 'None of Desktop, Documents, Pictures, Downloads, Favorites or browser bookmarks exist for ' + $env:USERNAME + '.' } }; if (-not $refuse) { $destN = ([string]$dest).Replace('/', '\\'); foreach ($it in $items) { Write-Output ('Source: ' + $it[0] + ' = ' + $it[1]); if ($destN.StartsWith(([string]$it[1]).Replace('/', '\\').TrimEnd('\\') + '\\', [StringComparison]::OrdinalIgnoreCase)) { $refuse = 'The destination lies inside the source folder ' + $it[1] + '.' } } }; if (-not $refuse) { $sw = [Diagnostics.Stopwatch]::StartNew(); foreach ($it in $items) { if ($it[2]) { $f = Get-Item -LiteralPath (Join-Path $it[1] $it[2]) -Force -EA SilentlyContinue; if ($f) { $bytes += $f.Length; $count++ } } else { $stack = New-Object System.Collections.Stack; $stack.Push($it[1]); while ($stack.Count) { $d = $stack.Pop(); foreach ($e in @(Get-ChildItem -LiteralPath $d -Force -EA SilentlyContinue)) { if ($e.PSIsContainer) { if (-not $e.LinkType) { $stack.Push($e.FullName) } } elseif (-not ($e.Attributes -band [IO.FileAttributes]::Offline)) { $bytes += $e.Length; $count++ } }; if ($sw.Elapsed.TotalSeconds -ge 30) { $sw.Restart(); Write-Output ('  counted ' + $count + ' file(s) so far ...') } } } }; Write-Output ('Estimate: ' + $count + ' file(s), ' + [math]::Round($bytes / 1GB, 2) + ' GB'); $disk = Get-CimInstance -ClassName Win32_LogicalDisk -Filter (\"DeviceID='\" + $drive + \"'\") -EA SilentlyContinue | Select-Object -First 1; if (-not $disk -or $null -eq $disk.FreeSpace) { $refuse = 'Cannot read the free space of ' + $drive + '.' } else { $need = $bytes + 256MB; Write-Output ('Free space on ' + $drive + ' ' + [math]::Round([double]$disk.FreeSpace / 1GB, 2) + ' GB, needed about ' + [math]::Round($need / 1GB, 2) + ' GB'); if ([double]$disk.FreeSpace -lt $need) { $refuse = 'Not enough free space on ' + $drive + '.' } } }; if ($refuse) { Write-Output ('Would refuse: ' + $refuse) } else { Write-Output ('Would copy ' + $count + ' file(s) to ' + $dest + ' with robocopy /XJ (junctions skipped), then write manifest-sha256.csv. Nothing at the source is changed.') }"
    command: "$refuse = $null; $dest = $null; $items = @(); $bytes = [long]0; $count = 0; $loc = Get-Location; if ($loc.Provider.Name -ne 'FileSystem' -or -not $loc.Drive) { $refuse = 'PortableFix is not running from a drive letter (' + $loc.ProviderPath + ') - start it from the external drive that should hold the backup.' } else { $drive = $loc.Drive.Name.ToUpper() + ':'; $sysDrive = ([string]$env:SystemDrive).TrimEnd('\\').ToUpper(); if (-not $sysDrive) { $sysDrive = 'C:' }; $pfBase = Join-Path ($drive + '\\') 'PortableFix_Backups'; $dest = Join-Path $pfBase ($env:COMPUTERNAME + '_' + (Get-Date -Format 'yyyyMMdd_HHmmss')); Write-Output ('Destination: ' + $dest); if ($drive -eq $sysDrive) { $refuse = 'The destination ' + $drive + ' is the system drive - run PortableFix from an external or second drive.' } else { $dn = $null; $sn = $null; try { $dn = (Get-Partition -DriveLetter $drive[0] -EA Stop | Select-Object -First 1).DiskNumber; $sn = (Get-Partition -DriveLetter $sysDrive[0] -EA Stop | Select-Object -First 1).DiskNumber } catch { $dn = $null }; if ($null -ne $dn -and $null -ne $sn -and $dn -eq $sn) { $refuse = 'Drive ' + $drive + ' is another partition of physical disk ' + $dn + ', the same disk as ' + $sysDrive + ' - a disk failure would take the backup with it.' } } }; if (-not $refuse) { $usf = Get-ItemProperty -Path 'HKCU:\\Software\\Microsoft\\Windows\\CurrentVersion\\Explorer\\User Shell Folders' -EA SilentlyContinue; foreach ($kf in @(@('Desktop', 'Desktop'), @('Documents', 'Personal'), @('Pictures', 'My Pictures'), @('Downloads', '{374DE290-123F-4565-9164-39C4925E467B}'), @('Favorites', 'Favorites'))) { $p = $null; if ($usf) { $p = $usf.($kf[1]) }; if ($p) { $p = [Environment]::ExpandEnvironmentVariables([string]$p) } else { $p = Join-Path $env:USERPROFILE $kf[0] }; if (Test-Path -LiteralPath $p -PathType Container) { $items += ,@($kf[0], $p, $null) } }; foreach ($b in @(@('Chrome', 'Google\\Chrome\\User Data'), @('Edge', 'Microsoft\\Edge\\User Data'), @('Brave', 'BraveSoftware\\Brave-Browser\\User Data'))) { $ud = Join-Path $env:LOCALAPPDATA $b[1]; if (Test-Path -LiteralPath $ud -PathType Container) { foreach ($pd in @(Get-ChildItem -LiteralPath $ud -Directory -EA SilentlyContinue)) { if (Test-Path -LiteralPath (Join-Path $pd.FullName 'Bookmarks') -PathType Leaf) { $items += ,@(('Bookmarks\\' + $b[0] + '\\' + $pd.Name), $pd.FullName, 'Bookmarks') } } } }; $ff = Join-Path $env:APPDATA 'Mozilla\\Firefox\\Profiles'; if (Test-Path -LiteralPath $ff -PathType Container) { foreach ($pd in @(Get-ChildItem -LiteralPath $ff -Directory -EA SilentlyContinue)) { $bb = Join-Path $pd.FullName 'bookmarkbackups'; if (Test-Path -LiteralPath $bb -PathType Container) { $items += ,@(('Bookmarks\\Firefox\\' + $pd.Name), $bb, $null) } } }; if (-not $items.Count) { $refuse = 'None of Desktop, Documents, Pictures, Downloads, Favorites or browser bookmarks exist for ' + $env:USERNAME + '.' } }; if (-not $refuse) { $destN = ([string]$dest).Replace('/', '\\'); foreach ($it in $items) { Write-Output ('Source: ' + $it[0] + ' = ' + $it[1]); if ($destN.StartsWith(([string]$it[1]).Replace('/', '\\').TrimEnd('\\') + '\\', [StringComparison]::OrdinalIgnoreCase)) { $refuse = 'The destination lies inside the source folder ' + $it[1] + '.' } } }; if (-not $refuse) { $sw = [Diagnostics.Stopwatch]::StartNew(); foreach ($it in $items) { if ($it[2]) { $f = Get-Item -LiteralPath (Join-Path $it[1] $it[2]) -Force -EA SilentlyContinue; if ($f) { $bytes += $f.Length; $count++ } } else { $stack = New-Object System.Collections.Stack; $stack.Push($it[1]); while ($stack.Count) { $d = $stack.Pop(); foreach ($e in @(Get-ChildItem -LiteralPath $d -Force -EA SilentlyContinue)) { if ($e.PSIsContainer) { if (-not $e.LinkType) { $stack.Push($e.FullName) } } elseif (-not ($e.Attributes -band [IO.FileAttributes]::Offline)) { $bytes += $e.Length; $count++ } }; if ($sw.Elapsed.TotalSeconds -ge 30) { $sw.Restart(); Write-Output ('  counted ' + $count + ' file(s) so far ...') } } } }; Write-Output ('Estimate: ' + $count + ' file(s), ' + [math]::Round($bytes / 1GB, 2) + ' GB'); $disk = Get-CimInstance -ClassName Win32_LogicalDisk -Filter (\"DeviceID='\" + $drive + \"'\") -EA SilentlyContinue | Select-Object -First 1; if (-not $disk -or $null -eq $disk.FreeSpace) { $refuse = 'Cannot read the free space of ' + $drive + '.' } else { $need = $bytes + 256MB; Write-Output ('Free space on ' + $drive + ' ' + [math]::Round([double]$disk.FreeSpace / 1GB, 2) + ' GB, needed about ' + [math]::Round($need / 1GB, 2) + ' GB'); if ([double]$disk.FreeSpace -lt $need) { $refuse = 'Not enough free space on ' + $drive + '.' } } }; if ($refuse) { Write-Output ('REFUSED: ' + $refuse); exit 1 }; $files = Join-Path $dest 'Files'; New-Item -ItemType Directory -Force -Path $files | Out-Null; $failed = @(); foreach ($it in $items) { $to = Join-Path $files $it[0]; Write-Output ('Copying ' + $it[0] + ' ...'); $ra = @($it[1], $to); if ($it[2]) { $ra += $it[2] } else { $ra += '/E' }; $ra += @('/COPY:DAT', '/R:1', '/W:1', '/XJ', '/XA:O', '/NDL', '/NJH', '/NJS', '/NC', '/NS'); $tick = Get-Date; robocopy @ra | ForEach-Object { if (((Get-Date) - $tick).TotalSeconds -ge 30) { $tick = Get-Date; Write-Output ('  still copying ' + $it[0] + ' ...') } }; $rc = $LASTEXITCODE; if ($rc -ge 8) { $failed += ($it[0] + ' (robocopy exit ' + $rc + ')') } }; $root = (Convert-Path -LiteralPath $files).TrimEnd('\\', '/'); $manifest = Join-Path $dest 'manifest-sha256.csv'; $rows = New-Object System.Collections.Generic.List[object]; $hashErr = @(); $tick = Get-Date; foreach ($f in @(Get-ChildItem -LiteralPath $files -Recurse -File -Force -EA SilentlyContinue -ErrorVariable walkErr)) { $rel = $f.FullName.Substring($root.Length).TrimStart('\\', '/'); $h = $null; try { $h = (Get-FileHash -LiteralPath $f.FullName -Algorithm SHA256 -EA Stop).Hash } catch { $hashErr += $rel }; $rows.Add([pscustomobject]@{ Path = $rel; Size = $f.Length; SHA256 = $h }); if (((Get-Date) - $tick).TotalSeconds -ge 30) { $tick = Get-Date; Write-Output ('  hashed ' + $rows.Count + ' file(s) ...') } }; if ($rows.Count) { $rows | Export-Csv -LiteralPath $manifest -NoTypeInformation -Encoding UTF8 } else { Set-Content -LiteralPath $manifest -Value '\"Path\",\"Size\",\"SHA256\"' -Encoding UTF8 }; Write-Output ('Manifest: ' + $manifest + ' (' + $rows.Count + ' file(s), manifest SHA-256 ' + (Get-FileHash -LiteralPath $manifest -Algorithm SHA256).Hash + ')'); Write-Output ('Estimated ' + $count + ' file(s), manifest ' + $rows.Count + ' file(s)'); if ($rows.Count -lt $count) { Write-Output ('WARN: ' + ($count - $rows.Count) + ' file(s) fewer in the backup than estimated - robocopy may have skipped a folder silently (a reparse point, a path too long); compare the source by hand.') }; foreach ($x in $failed) { Write-Output ('Copy failed: ' + $x) }; foreach ($x in $hashErr) { Write-Output ('Hash failed: ' + $x) }; if ($walkErr.Count) { Write-Output ('Unreadable backup folder(s): ' + $walkErr.Count) }; $ok = -not ($failed.Count -or $hashErr.Count -or $walkErr.Count); Set-Content -LiteralPath (Join-Path $dest 'backup-status.txt') -Value (@($(if ($ok) { 'RESULT=COMPLETE' } else { 'RESULT=INCOMPLETE' })) + @($failed | ForEach-Object { 'COPY_FAILED=' + $_ }) + @($hashErr | ForEach-Object { 'HASH_FAILED=' + $_ })) -Encoding UTF8; if (-not $ok) { Write-Output ('Backup INCOMPLETE: ' + $dest); exit 1 }; Write-Output ('Backup complete: ' + $dest + ' - run backup_verify_external to re-check it later.')"
    description_sk: "Skopíruje Desktop, Documents, Pictures, Downloads a Favorites aktuálneho používateľa (aj presmerované, napr. do OneDrive) a záložky Chrome, Edge, Brave a Firefox (bookmarkbackups) na disk, z ktorého beží PortableFix, do PortableFix_Backups\\<POČÍTAČ>_<čas>. Odmietne cieľ na systémovom disku aj na inej partícii toho istého fyzického disku a pred kopírovaním overí voľné miesto (odhad + 256 MB). Kopíruje robocopy /E /COPY:DAT /R:1 /W:1 /XJ /XA:O - nikdy nevojde do junction a nesťahuje súbory OneDrive, ktoré sú len online. Potom zapíše manifest-sha256.csv (relatívna cesta, veľkosť, SHA-256) a vypíše SHA-256 samotného manifestu do reportu; výsledok behu (COMPLETE/INCOMPLETE) uloží do backup-status.txt. Ak je v zálohe menej súborov ako v odhade, vypíše WARN (robocopy mohol potichu vynechať priečinok). Na zdroji nič nemaže ani nemení. Kontrola toho istého disku nerozpozná písmeno SUBST ani pripojený VHD(X) uložený na systémovom disku - také cieľové písmeno nepoužívajte. Záloha na disku nie je šifrovaná - disk s údajmi klienta držte pod zámkou. Ak bola appka spustená pod iným (admin) účtom, zálohuje profil toho účtu."
    description_en: "Copies the current user's Desktop, Documents, Pictures, Downloads and Favorites (redirected ones too, e.g. into OneDrive) and Chrome, Edge, Brave and Firefox (bookmarkbackups) bookmarks to the drive PortableFix runs from, into PortableFix_Backups\\<COMPUTER>_<time>. Refuses a destination on the system drive or on another partition of the same physical disk, and checks free space first (estimate + 256 MB). Copies with robocopy /E /COPY:DAT /R:1 /W:1 /XJ /XA:O - never walks into a junction and never downloads online-only OneDrive files. Then writes manifest-sha256.csv (relative path, size, SHA-256) and puts the SHA-256 of the manifest itself into the report; the run result (COMPLETE/INCOMPLETE) goes into backup-status.txt. If the backup holds fewer files than the estimate, it prints a WARN (robocopy may have left out a folder silently). Deletes or changes nothing at the source. The same-disk check cannot see through a SUBST drive letter or a mounted VHD(X) stored on the system drive - do not use such a letter as the destination. The backup is not encrypted - keep the drive with client data locked away. If the app was started under a different (admin) account, that account's profile is backed up."

  - id: backup_verify_external
    label_sk: "Overenie zálohy na inom disku (SHA-256)"
    label_en: "Verify backup on another drive (SHA-256)"
    risk: SAFE
    inactivity_timeout_sec: 3600
    hard_cap_sec: 43200
    command: "$loc = Get-Location; if ($loc.Provider.Name -ne 'FileSystem' -or -not $loc.Drive) { Write-Output ('VERDICT: NO BACKUP - PortableFix is not running from a drive letter (' + $loc.ProviderPath + ').'); exit 2 }; $pfBase = Join-Path ($loc.Drive.Name.ToUpper() + ':\\') 'PortableFix_Backups'; $latest = @(Get-ChildItem -LiteralPath $pfBase -Directory -EA SilentlyContinue | Where-Object { $_.Name -like ($env:COMPUTERNAME + '_*') } | Sort-Object Name -Descending) | Select-Object -First 1; if (-not $latest) { Write-Output ('VERDICT: NO BACKUP - no ' + $env:COMPUTERNAME + '_* backup in ' + $pfBase); exit 2 }; $manifest = Join-Path $latest.FullName 'manifest-sha256.csv'; $files = Join-Path $latest.FullName 'Files'; Write-Output ('Backup: ' + $latest.FullName); if (-not (Test-Path -LiteralPath $manifest -PathType Leaf)) { Write-Output 'VERDICT: FAIL - manifest-sha256.csv is missing (the backup never finished).'; exit 1 }; Write-Output ('Manifest SHA-256: ' + (Get-FileHash -LiteralPath $manifest -Algorithm SHA256).Hash); $rows = @(Import-Csv -LiteralPath $manifest); $listed = @{}; $missing = @(); $changed = @(); $unreadable = @(); $tick = Get-Date; $n = 0; foreach ($r in $rows) { $listed[([string]$r.Path).Replace('/', '\\')] = $true; $n++; if (((Get-Date) - $tick).TotalSeconds -ge 30) { $tick = Get-Date; Write-Output ('  checked ' + $n + ' of ' + $rows.Count + ' file(s) ...') }; $p = Join-Path $files $r.Path; if (-not (Test-Path -LiteralPath $p -PathType Leaf)) { $missing += $r.Path; continue }; if ([string](Get-Item -LiteralPath $p -Force).Length -ne [string]$r.Size) { $changed += $r.Path; continue }; if (-not $r.SHA256) { $unreadable += $r.Path; continue }; $h = $null; try { $h = (Get-FileHash -LiteralPath $p -Algorithm SHA256 -EA Stop).Hash } catch { $unreadable += $r.Path; continue }; if ($h -ne $r.SHA256) { $changed += $r.Path } }; $extra = @(); if (Test-Path -LiteralPath $files -PathType Container) { $root = (Convert-Path -LiteralPath $files).TrimEnd('\\', '/'); $extra = @(Get-ChildItem -LiteralPath $files -Recurse -File -Force -EA SilentlyContinue | Where-Object { -not $listed.ContainsKey($_.FullName.Substring($root.Length).TrimStart('\\', '/').Replace('/', '\\')) }) }; foreach ($x in @($missing | Select-Object -First 20)) { Write-Output ('Missing: ' + $x) }; foreach ($x in @($changed | Select-Object -First 20)) { Write-Output ('Changed: ' + $x) }; foreach ($x in @($unreadable | Select-Object -First 20)) { Write-Output ('Unreadable: ' + $x) }; if ($extra.Count) { Write-Output ('Not in manifest (ignored): ' + $extra.Count + ' file(s)') }; $status = @(Get-Content -LiteralPath (Join-Path $latest.FullName 'backup-status.txt') -EA SilentlyContinue); $bad = $missing.Count + $changed.Count + $unreadable.Count; if (-not $bad -and $status -notcontains 'RESULT=COMPLETE') { Write-Output ('VERDICT: FAIL - all ' + $rows.Count + ' file(s) in the manifest match, but the backup run itself did not complete (copy or hash errors, or it was interrupted - see backup-status.txt).'); exit 1 }; if ($bad) { Write-Output ('VERDICT: FAIL - ' + $missing.Count + ' missing, ' + $changed.Count + ' changed, ' + $unreadable.Count + ' unreadable of ' + $rows.Count + ' file(s)'); exit 1 }; Write-Output ('VERDICT: OK - all ' + $rows.Count + ' file(s) match the manifest')"
    description_sk: "Nájde najnovšiu zálohu tohto počítača v PortableFix_Backups na disku, z ktorého beží PortableFix, znova zahashuje každý súbor a porovná ho s manifest-sha256.csv. Vypíše chýbajúce, zmenené a nečitateľné súbory a verdikt OK / FAIL (FAIL skončí chybou). FAIL dá aj vtedy, keď samotná záloha skončila s chybami alebo bola prerušená (backup-status.txt). Súbory navyše oproti manifestu iba spočíta. Keď zálohu nenájde (NO BACKUP), tiež skončí chybou, aby v reporte nevyzerala ako úspešne overená. Nič nemení."
    description_en: "Finds this computer's newest backup in PortableFix_Backups on the drive PortableFix runs from, re-hashes every file and compares it with manifest-sha256.csv. Lists missing, changed and unreadable files and gives an OK / FAIL verdict (FAIL exits with an error). It is also FAIL when the backup run itself ended with errors or was interrupted (backup-status.txt). Files not in the manifest are only counted. When there is no backup to check (NO BACKUP) it also exits with an error, so the report never shows it as a successful verification. Changes nothing."
