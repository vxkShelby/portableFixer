module_id: m08_security
category: SECURITY
actions:
  - id: sec_defender_status
    label_sk: "Stav Windows Defender"
    label_en: "Windows Defender status"
    risk: SAFE
    command: "Get-MpComputerStatus | Select-Object AMServiceEnabled,RealTimeProtectionEnabled,AntivirusEnabled,AntivirusSignatureLastUpdated,QuickScanAge,FullScanAge | Format-List"
    description_sk: "Zobrazi stav ochrany Defendera a vek definicii, nic nemeni."
    description_en: "Shows Defender protection status and signature age, changes nothing."
  - id: sec_firewall_status
    label_sk: "Stav Windows Firewall"
    label_en: "Windows Firewall status"
    risk: SAFE
    command: "Get-NetFirewallProfile | Select-Object Name,Enabled,DefaultInboundAction,DefaultOutboundAction | Format-Table -AutoSize"
    description_sk: "Zobrazi stav vsetkych firewall profilov (Domain/Private/Public), nic nemeni."
    description_en: "Shows the status of all firewall profiles (Domain/Private/Public), changes nothing."
  - id: sec_defender_update
    label_sk: "Aktualizacia definicii Defendera"
    label_en: "Update Defender signatures"
    risk: MODERATE
    command: "Update-MpSignature"
    description_sk: "Stiahne najnovsie definicie hrozieb pre Windows Defender. Vyzaduje internet."
    description_en: "Downloads the latest threat definitions for Windows Defender. Requires internet access."
  - id: sec_defender_quickscan
    label_sk: "Rychly sken Defenderom"
    label_en: "Defender quick scan"
    risk: MODERATE
    command: "Start-MpScan -ScanType QuickScan"
    description_sk: "Spusti rychly antivirovy sken. Moze trvat niekolko minut a najdene hrozby presunie do karanteny."
    description_en: "Runs a quick antivirus scan. May take several minutes; detected threats are moved to quarantine."
  - id: sec_uac_status
    label_sk: "Stav kontroly pouzivatelskych uctov (UAC)"
    label_en: "User Account Control (UAC) status"
    risk: SAFE
    command: "$p = Get-ItemProperty -Path 'HKLM:\\Software\\Microsoft\\Windows\\CurrentVersion\\Policies\\System' -EA SilentlyContinue; $enableLua = if ($null -ne $p.EnableLUA) { $p.EnableLUA } else { 1 }; $behaviorAdmin = if ($null -ne $p.ConsentPromptBehaviorAdmin) { $p.ConsentPromptBehaviorAdmin } else { 5 }; $behaviorUser = if ($null -ne $p.ConsentPromptBehaviorUser) { $p.ConsentPromptBehaviorUser } else { 3 }; $secureDesktop = if ($null -ne $p.PromptOnSecureDesktop) { $p.PromptOnSecureDesktop } else { 1 }; $filterAdminToken = if ($null -ne $p.FilterAdministratorToken) { $p.FilterAdministratorToken } else { 0 }; Write-Output \"EnableLUA: $enableLua (1=UAC on [default], 0=UAC off)\"; Write-Output \"ConsentPromptBehaviorAdmin: $behaviorAdmin (0=no prompt,1=prompt for creds on secure desktop,2=prompt for consent,5=prompt for consent for non-Windows binaries [default])\"; Write-Output \"ConsentPromptBehaviorUser: $behaviorUser (0=auto deny,1=prompt for creds on secure desktop,3=prompt for creds [default])\"; Write-Output \"PromptOnSecureDesktop: $secureDesktop (1=secure desktop on [default], 0=off)\"; Write-Output \"FilterAdministratorToken: $filterAdminToken (1=Admin Approval Mode applies to built-in Administrator too, 0=exempt [default])\""
    problem_keywords:
      - "EnableLUA: 0"
      - "PromptOnSecureDesktop: 0"
    recommended_action_ids:
      - hard_uac_restore_default
    description_sk: "Zobrazi, ci je UAC zapnute a ako sa spravaju vyzvy na povolenie (aj neuvedene hodnoty ako predvolene Windows), nic nemeni."
    description_en: "Shows whether UAC is enabled and how elevation prompts behave (unset values shown as Windows defaults), changes nothing."

  - id: sec_defender_exclusions_list
    label_sk: "Vynimky Windows Defenderu"
    label_en: "Windows Defender exclusions"
    risk: SAFE
    command: "try { Get-MpPreference -EA Stop | Select-Object ExclusionPath,ExclusionExtension,ExclusionProcess,ExclusionIpAddress | Format-List } catch { Write-Output 'Could not read Defender preferences (Defender may be disabled by another antivirus).' }"
    description_sk: "Vypise vynimky Defenderu (cesty, procesy, pripony). Malware sa tam casto samo pridava, aby unikol detekcii. Nic nemeni."
    description_en: "Lists Defender exclusions (paths, processes, extensions). Malware often adds itself here to evade detection. Changes nothing."

  - id: sec_rdp_status
    label_sk: "Stav vzdialenej plochy (RDP)"
    label_en: "Remote Desktop (RDP) status"
    risk: SAFE
    command: "$v = (Get-ItemProperty -Path 'HKLM:\\System\\CurrentControlSet\\Control\\Terminal Server' -Name fDenyTSConnections -EA SilentlyContinue).fDenyTSConnections; $state = if ($null -eq $v) { 'unknown (default: RDP off)' } elseif ($v -eq 0) { 'ENABLED' } else { 'disabled' }; Write-Output ('RDP (Remote Desktop): ' + $state); $rules = Get-NetFirewallRule -DisplayGroup 'Remote Desktop' -EA SilentlyContinue; if ($rules) { $rules | Select-Object DisplayName,Enabled,Direction,Action | Format-Table -AutoSize } else { Write-Output 'No Remote Desktop firewall rules found.' }"
    description_sk: "Zobrazi, ci je povolena vzdialena plocha a stav jej firewall pravidiel, nic nemeni."
    description_en: "Shows whether Remote Desktop is enabled and its firewall rule status, changes nothing."

  - id: sec_autologon_check
    label_sk: "Kontrola automatickeho prihlasenia"
    label_en: "Autologon check"
    risk: SAFE
    command: "$w = 'HKLM:\\SOFTWARE\\Microsoft\\Windows NT\\CurrentVersion\\Winlogon'; $p = Get-ItemProperty -Path $w -EA SilentlyContinue; $autoLogon = if ($p.AutoAdminLogon -eq '1') { 'ENABLED' } else { 'disabled' }; Write-Output ('AutoAdminLogon: ' + $autoLogon); Write-Output ('DefaultUserName: ' + $p.DefaultUserName); Write-Output ('Plaintext password stored in registry: ' + [bool]$p.DefaultPassword)"
    description_sk: "Zisti, ci je zapnute automaticke prihlasenie a ci registry obsahuje ulozene heslo v ciston texte (heslo samotne nevypisuje). Nic nemeni."
    description_en: "Checks whether autologon is enabled and whether the registry stores a plaintext password (does not print the password itself). Changes nothing."

  - id: sec_listening_ports_audit
    label_sk: "Audit naslchajucich portov a procesov"
    label_en: "Listening ports and process audit"
    risk: SAFE
    command: "Get-NetTCPConnection -State Listen -EA SilentlyContinue | ForEach-Object { $proc = Get-Process -Id $_.OwningProcess -EA SilentlyContinue; [PSCustomObject]@{ LocalPort = $_.LocalPort; LocalAddress = $_.LocalAddress; PID = $_.OwningProcess; Process = $proc.ProcessName; Path = $proc.Path } } | Sort-Object LocalPort -Unique | Format-Table -AutoSize -Wrap"
    description_sk: "Spari kazdy naslchajuci TCP port s procesom, ktory ho drzi (meno + cesta k binarke) - standardny 'co komunikuje von' kontrolny bod. Nic nemeni."
    description_en: "Correlates every listening TCP port with the process holding it (name + binary path) - a standard 'what's phoning home' check. Changes nothing."

  - id: sec_root_cert_audit
    label_sk: "Audit dovernych root certifikatov"
    label_en: "Trusted root certificate audit"
    risk: SAFE
    command: "$roots = Get-ChildItem Cert:\\LocalMachine\\Root; Write-Output ('Total root CAs: ' + $roots.Count); $suspicious = $roots | Where-Object { $_.Subject -ne $_.Issuer }; if ($suspicious) { Write-Output '--- Subject != Issuer (unusual for a real root CA - can be legitimate anti-cheat/DRM software, but worth reviewing) ---'; $suspicious | Select-Object Subject,Issuer,Thumbprint | Format-List } else { Write-Output 'No structurally unusual root certs found.' }; $expired = $roots | Where-Object { $_.NotAfter -lt (Get-Date) }; if ($expired) { Write-Output ('--- Expired root certs still present (' + $expired.Count + ') ---'); $expired | Select-Object Subject,NotAfter,Thumbprint | Format-Table -AutoSize -Wrap }"
    description_sk: "Vypise pocet dovernych root CA certifikatov a oznaci tie, kde Subject != Issuer (nezvycajne pre skutocnu root CA - znamy vektor MITM/malware, ale caste aj u legitimneho anti-cheat/DRM softveru) a expirovane certifikaty stale v store. Nic nemeni."
    description_en: "Lists the count of trusted root CA certificates and flags any where Subject != Issuer (unusual for a real root CA - a known MITM/malware vector, but also common with legitimate anti-cheat/DRM software) plus expired certs still sitting in the store. Changes nothing."

  - id: hard_defender_clear_exclusions
    label_sk: "Vycistenie vynimiek Defenderu"
    label_en: "Clear Defender exclusions"
    risk: MODERATE
    command: "try { $p = Get-MpPreference -EA Stop; $bk = \"$env:ProgramData\\PortableFix\\defender_exclusions_backup.json\"; New-Item -ItemType Directory -Force -Path (Split-Path $bk) | Out-Null; [PSCustomObject]@{ Path = $p.ExclusionPath; Extension = $p.ExclusionExtension; Process = $p.ExclusionProcess; IpAddress = $p.ExclusionIpAddress } | ConvertTo-Json | Set-Content -Path $bk -Encoding UTF8; if ($p.ExclusionPath) { Remove-MpPreference -ExclusionPath $p.ExclusionPath }; if ($p.ExclusionExtension) { Remove-MpPreference -ExclusionExtension $p.ExclusionExtension }; if ($p.ExclusionProcess) { Remove-MpPreference -ExclusionProcess $p.ExclusionProcess }; if ($p.ExclusionIpAddress) { Remove-MpPreference -ExclusionIpAddress $p.ExclusionIpAddress }; Write-Output 'Defender exclusions cleared (backup saved).' } catch { Write-Output 'Could not modify Defender exclusions (Defender may be disabled by another antivirus).' }"
    undo_command: "$bk = \"$env:ProgramData\\PortableFix\\defender_exclusions_backup.json\"; if (Test-Path $bk) { $b = Get-Content $bk -Raw | ConvertFrom-Json; if ($b.Path) { Add-MpPreference -ExclusionPath $b.Path }; if ($b.Extension) { Add-MpPreference -ExclusionExtension $b.Extension }; if ($b.Process) { Add-MpPreference -ExclusionProcess $b.Process }; if ($b.IpAddress) { Add-MpPreference -ExclusionIpAddress $b.IpAddress }; Write-Output 'Defender exclusions restored from backup.' } else { Write-Output 'No backup found - nothing to restore.' }"
    description_sk: "Odstrani vsetky vynimky Defenderu (mozne skryvacky pre malware) po zalohovani aktualneho stavu do PortableFix\\defender_exclusions_backup.json - zaloha sa prepisuje pri kazdom behu, takze vzdy odraza stav tesne pred poslednym vycistenim a undo obnovi presne ten."
    description_en: "Removes all Defender exclusions (a common malware hiding spot) after backing up the current state to PortableFix\\defender_exclusions_backup.json - the backup is overwritten on every run, so it always reflects the state right before the most recent clear, and undo restores exactly that."

  - id: hard_uac_restore_default
    label_sk: "Obnovenie UAC na predvolene"
    label_en: "Restore UAC to default"
    risk: MODERATE
    command: "$k = 'HKLM:\\Software\\Microsoft\\Windows\\CurrentVersion\\Policies\\System'; $bk = \"$env:ProgramData\\PortableFix\\uac_backup.json\"; New-Item -ItemType Directory -Force -Path (Split-Path $bk) | Out-Null; Get-ItemProperty -Path $k -EA SilentlyContinue | Select-Object EnableLUA,ConsentPromptBehaviorAdmin,PromptOnSecureDesktop | ConvertTo-Json | Set-Content -Path $bk -Encoding UTF8; try { Set-ItemProperty -Path $k -Name EnableLUA -Value 1 -Type DWord -EA Stop; Set-ItemProperty -Path $k -Name ConsentPromptBehaviorAdmin -Value 5 -Type DWord -EA Stop; Set-ItemProperty -Path $k -Name PromptOnSecureDesktop -Value 1 -Type DWord -EA Stop; Write-Output 'UAC restored to Windows default (takes full effect after sign-out/restart).' } catch { Write-Output ('Failed to restore UAC (needs administrator): ' + $_.Exception.Message); exit 1 }"
    undo_command: "$k = 'HKLM:\\Software\\Microsoft\\Windows\\CurrentVersion\\Policies\\System'; $bk = \"$env:ProgramData\\PortableFix\\uac_backup.json\"; if (Test-Path $bk) { $b = Get-Content $bk -Raw | ConvertFrom-Json; try { if ($null -ne $b.EnableLUA) { Set-ItemProperty -Path $k -Name EnableLUA -Value $b.EnableLUA -Type DWord -EA Stop }; if ($null -ne $b.ConsentPromptBehaviorAdmin) { Set-ItemProperty -Path $k -Name ConsentPromptBehaviorAdmin -Value $b.ConsentPromptBehaviorAdmin -Type DWord -EA Stop }; if ($null -ne $b.PromptOnSecureDesktop) { Set-ItemProperty -Path $k -Name PromptOnSecureDesktop -Value $b.PromptOnSecureDesktop -Type DWord -EA Stop }; Write-Output 'UAC settings restored from backup.' } catch { Write-Output ('Failed to restore UAC settings (needs administrator): ' + $_.Exception.Message); exit 1 } } else { Write-Output 'No backup found - nothing to restore.' }"
    description_sk: "Nastavi UAC na standardne hodnoty Windows (zapnute, predvolene spravanie vyziev) po zalohe aktualneho stavu do PortableFix\\uac_backup.json - zaloha sa prepisuje pri kazdom behu, takze vzdy odraza stav tesne pred poslednou zmenou a undo obnovi presne ten. Vyzaduje administratora."
    description_en: "Sets UAC to standard Windows defaults (enabled, default prompt behavior) after backing up the current state to PortableFix\\uac_backup.json - the backup is overwritten on every run, so it always reflects the state right before the most recent change, and undo restores exactly that. Needs administrator."

  - id: sec_bootsector_check
    label_sk: "Kontrola boot sektora (MBR/VBR)"
    label_en: "Boot sector check (MBR/VBR)"
    risk: SAFE
    command: "$drives = Get-CimInstance Win32_DiskDrive -EA SilentlyContinue; $results = @(); foreach ($d in $drives) { $path = $d.DeviceID; try { $fs = New-Object System.IO.FileStream($path, [System.IO.FileMode]::Open, [System.IO.FileAccess]::Read); $buf = New-Object byte[] 512; $fs.Read($buf, 0, 512) | Out-Null; $fs.Close(); $sigOk = ($buf[510] -eq 0x55 -and $buf[511] -eq 0xAA); $hash = [System.BitConverter]::ToString([System.Security.Cryptography.SHA256]::Create().ComputeHash($buf)).Replace('-',''); $results += [PSCustomObject]@{ Drive = $path; Model = $d.Model; BootSignatureValid = $sigOk; SHA256 = $hash } } catch { $results += [PSCustomObject]@{ Drive = $path; Model = $d.Model; BootSignatureValid = ('N/A: ' + $_.Exception.Message); SHA256 = 'N/A' } } }; $results | Format-Table -AutoSize -Wrap; Write-Output 'This reads the first 512-byte sector of each physical drive and checks the standard 0x55AA boot signature plus its SHA256 hash - it does NOT compare against a database of known-clean or known-infected boot sectors (PortableFix has none). Record the hash now; if you suspect a bootkit later, re-run this and compare against this baseline, or an unexpectedly missing/invalid boot signature is itself worth investigating.'"
    inactivity_timeout_sec: 30
    description_sk: "Precita prvy 512-bajtovy sektor kazdeho fyzickeho disku, overi standardny boot signature (0x55AA na konci sektora) a vypocita jeho SHA256 hash. Nejde o skutocnu detekciu bootkitu - to by vyzadovalo databazu znamych cistych/infikovanych sektorov, ktoru appka nema. Sluzi ako zaznam pre neskorsie porovnanie (napr. po podozreni na infekciu) a na odhalenie chybajuceho/neplatneho boot signature. Vyzaduje administratora (priamy pristup k fyzickemu disku). Nic nemeni."
    description_en: "Reads the first 512-byte sector of each physical drive, checks the standard boot signature (0x55AA at the end of the sector), and computes its SHA256 hash. This is not real bootkit detection - that would require a database of known-clean/known-infected sectors, which this app does not have. It serves as a baseline to compare against later (e.g. after a suspected infection) and can catch a missing/invalid boot signature. Needs administrator (direct physical drive access). Changes nothing."

  - id: sec_hidden_process_heuristic
    label_sk: "Heuristika skrytych procesov (Win32 API vs WMI)"
    label_en: "Hidden process heuristic (Win32 API vs WMI)"
    risk: SAFE
    command: "$winApi = @(Get-Process -EA SilentlyContinue | Select-Object -ExpandProperty Id); $wmi = @(Get-CimInstance Win32_Process -EA SilentlyContinue | Select-Object -ExpandProperty ProcessId); $onlyWinApi = @($winApi | Where-Object { $wmi -notcontains $_ }); $onlyWmi = @($wmi | Where-Object { $winApi -notcontains $_ }); if ($onlyWinApi -or $onlyWmi) { if ($onlyWinApi) { Write-Output ('Visible via Win32 API but not WMI: ' + ($onlyWinApi -join ', ')) }; if ($onlyWmi) { Write-Output ('Visible via WMI but not Win32 API: ' + ($onlyWmi -join ', ')) }; Write-Output 'A mismatch is usually just a process that started or exited in the moment between the two checks - only a mismatch that repeats across several separate runs is worth investigating further. This does NOT detect real kernel-level rootkit hiding (SSDT/EPROCESS list manipulation defeats both APIs equally and needs a kernel driver to catch, which this app does not have).' } else { Write-Output ('No discrepancy - ' + $winApi.Count + ' processes visible identically via both Win32 API and WMI.') }"
    description_sk: "Porovna zoznam procesov ziskany cez Win32 API (Get-Process) s WMI (Win32_Process) - proces pritomny len v jednom zozname je slaba indicia, nie dokaz. Nezachyti skutocny kernel-level rootkit (ten oklame oba API rovnako, na to treba kernel driver, ktory appka nema). Casty falosny poplach je proces, ktory medzitym skoncil/nastartoval. Nic nemeni."
    description_en: "Compares the process list from the Win32 API (Get-Process) against WMI (Win32_Process) - a process present in only one list is a weak signal, not proof. Does not catch a real kernel-level rootkit (that fools both APIs equally; catching it needs a kernel driver, which this app does not have). A common false alarm is simply a process that started or exited between the two checks. Changes nothing."

  - id: sec_process_signature_audit
    label_sk: "Audit digitalnych podpisov bezicich procesov"
    label_en: "Running process signature audit"
    risk: SAFE
    command: "$flagged = @(); $checked = 0; foreach ($p in (Get-Process -EA SilentlyContinue)) { $path = $null; try { $path = $p.Path } catch {}; if (-not $path) { continue }; $checked++; try { $sig = Get-AuthenticodeSignature -FilePath $path -EA Stop; if ($sig.Status -ne 'Valid') { $flagged += [PSCustomObject]@{ PID = $p.Id; Name = $p.ProcessName; Status = $sig.Status; Path = $path } } } catch {} }; if ($flagged) { Write-Output ('Processes with a non-Valid Authenticode signature (' + $flagged.Count + ' of ' + $checked + ' checked):'); $flagged | Format-Table -AutoSize -Wrap } else { Write-Output ('All ' + $checked + ' checked running processes have a Valid Authenticode signature.') }; Write-Output 'NotSigned is common and often harmless (many legitimate dev tools and scripts are unsigned) - this is a lead to investigate, not proof of anything malicious.'"
    inactivity_timeout_sec: 90
    description_sk: "Skontroluje Authenticode podpis binarky za kazdym bezicim procesom a vypise tie, ktore nemaju platny podpis (nepodpisane, neplatny, alebo zmeneny po podpisani). Nepodpisany proces je bezny aj u legitimneho softveru (interne nastroje, skripty) - toto je vodidlo na dalsie preverenie, nie odsudok. Nic nemeni."
    description_en: "Checks the Authenticode signature of the binary behind every running process and lists those without a valid signature (unsigned, invalid, or tampered with after signing). An unsigned process is also common for legitimate software (internal tools, scripts) - this is a lead for further review, not a verdict. Changes nothing."

  - id: sec_restore_taskmgr_regedit
    label_sk: "Obnovenie zakazaneho Task Manageru a Editora registra"
    label_en: "Restore disabled Task Manager and Registry Editor"
    risk: MODERATE
    command: "$paths = 'HKCU:\\Software\\Microsoft\\Windows\\CurrentVersion\\Policies\\System','HKLM:\\Software\\Microsoft\\Windows\\CurrentVersion\\Policies\\System'; $bk = \"$env:ProgramData\\PortableFix\\taskmgr_regedit_backup.json\"; New-Item -ItemType Directory -Force -Path (Split-Path $bk) | Out-Null; $backup = @(foreach ($p in $paths) { [PSCustomObject]@{ Path = $p; DisableTaskMgr = (Get-ItemProperty -Path $p -Name DisableTaskMgr -EA SilentlyContinue).DisableTaskMgr; DisableRegistryTools = (Get-ItemProperty -Path $p -Name DisableRegistryTools -EA SilentlyContinue).DisableRegistryTools } }); $backup | ConvertTo-Json | Set-Content -Path $bk -Encoding UTF8; $cleared = @(); foreach ($p in $paths) { if (Test-Path $p) { Remove-ItemProperty -Path $p -Name DisableTaskMgr -EA SilentlyContinue; Remove-ItemProperty -Path $p -Name DisableRegistryTools -EA SilentlyContinue; $cleared += $p } }; Write-Output ('Task Manager and Registry Editor re-enabled (cleared DisableTaskMgr/DisableRegistryTools in: ' + ($cleared -join ', ') + ').')"
    undo_command: "$bk = \"$env:ProgramData\\PortableFix\\taskmgr_regedit_backup.json\"; if (Test-Path $bk) { $b = Get-Content $bk -Raw | ConvertFrom-Json; foreach ($i in $b) { if (-not (Test-Path $i.Path)) { continue }; if ($null -ne $i.DisableTaskMgr) { Set-ItemProperty -Path $i.Path -Name DisableTaskMgr -Value $i.DisableTaskMgr -Type DWord -EA SilentlyContinue }; if ($null -ne $i.DisableRegistryTools) { Set-ItemProperty -Path $i.Path -Name DisableRegistryTools -Value $i.DisableRegistryTools -Type DWord -EA SilentlyContinue } }; Write-Output 'Task Manager/Registry Editor policy values restored from backup.' } else { Write-Output 'No backup found - nothing to restore.' }"
    description_sk: "Odstrani DisableTaskMgr a DisableRegistryTools policy hodnoty z HKCU aj HKLM (Policies\\System) - klasicky sposob, akym malware zablokuje Task Manager a Editor registra, aby sa tazsie odstranovalo. Zaloha sa prepisuje pri kazdom behu, undo obnovi predoslu hodnotu (vratane pripadu, ked bola zablokovana zamerne cez firemnu politiku)."
    description_en: "Removes the DisableTaskMgr and DisableRegistryTools policy values from both HKCU and HKLM (Policies\\System) - the classic way malware locks out Task Manager and Registry Editor to make itself harder to remove. Backup is refreshed on every run; undo restores the previous value (including the case where it was disabled deliberately via corporate policy)."

  - id: sec_wpbt_disable
    label_sk: "Vypnutie WPBT (Windows Platform Binary Table)"
    label_en: "Disable WPBT (Windows Platform Binary Table)"
    risk: MODERATE
    command: "try { Set-ItemProperty -Path 'HKLM:\\SYSTEM\\CurrentControlSet\\Control\\Session Manager' -Name DisableWpbtExecution -Value 1 -Type DWord -EA Stop; Write-Output 'WPBT execution disabled.' } catch { Write-Output ('Could not disable WPBT: ' + $_.Exception.Message + ' (needs administrator).'); exit 1 }"
    undo_command: "Remove-ItemProperty -Path 'HKLM:\\SYSTEM\\CurrentControlSet\\Control\\Session Manager' -Name DisableWpbtExecution -EA SilentlyContinue; Write-Output 'WPBT setting removed (back to Windows default).'"
    description_sk: "Vypne WPBT (Windows Platform Binary Table) - mechanizmus, cez ktory vyrobca notebooku/PC moze spustit program hned pri starte Windows (napr. anti-theft softver), niekedy aj bez suhlasu pouzivatela. Znama cesta zneuzitia predinstalovanym OEM softverom. Undo nastavenie odstrani."
    description_en: "Disables WPBT (Windows Platform Binary Table) - the mechanism that lets a PC/laptop vendor auto-run a program at Windows boot (e.g. anti-theft software), sometimes without user consent. A known abuse vector for preinstalled OEM software. Undo removes the setting."
