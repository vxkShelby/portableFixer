module_id: m08_security
category: SECURITY
actions:
  - id: sec_defender_status
    label_sk: "Stav Windows Defender"
    label_en: "Windows Defender status"
    risk: SAFE
    command: "Get-MpComputerStatus | Select-Object AMServiceEnabled,RealTimeProtectionEnabled,AntivirusEnabled,AntivirusSignatureLastUpdated,QuickScanAge,FullScanAge | Format-List"
    description_sk: "Zobrazi stav ochrany Defendera a vek definicii, nic nemeni."
    description_en: "Shows Defender protection status and signature age, changes nothing."
  - id: sec_firewall_status
    label_sk: "Stav Windows Firewall"
    label_en: "Windows Firewall status"
    risk: SAFE
    command: "Get-NetFirewallProfile | Select-Object Name,Enabled,DefaultInboundAction,DefaultOutboundAction | Format-Table -AutoSize"
    description_sk: "Zobrazi stav vsetkych firewall profilov (Domain/Private/Public), nic nemeni."
    description_en: "Shows the status of all firewall profiles (Domain/Private/Public), changes nothing."
  - id: sec_defender_update
    label_sk: "Aktualizacia definicii Defendera"
    label_en: "Update Defender signatures"
    risk: MODERATE
    command: "Update-MpSignature"
    description_sk: "Stiahne najnovsie definicie hrozieb pre Windows Defender. Vyzaduje internet."
    description_en: "Downloads the latest threat definitions for Windows Defender. Requires internet access."
  - id: sec_defender_quickscan
    label_sk: "Rychly sken Defenderom"
    label_en: "Defender quick scan"
    risk: MODERATE
    command: "Start-MpScan -ScanType QuickScan"
    description_sk: "Spusti rychly antivirovy sken. Moze trvat niekolko minut a najdene hrozby presunie do karanteny."
    description_en: "Runs a quick antivirus scan. May take several minutes; detected threats are moved to quarantine."
  - id: sec_uac_status
    label_sk: "Stav kontroly pouzivatelskych uctov (UAC)"
    label_en: "User Account Control (UAC) status"
    risk: SAFE
    command: "$p = Get-ItemProperty -Path 'HKLM:\\Software\\Microsoft\\Windows\\CurrentVersion\\Policies\\System' -EA SilentlyContinue; $enableLua = if ($null -ne $p.EnableLUA) { $p.EnableLUA } else { 1 }; $behaviorAdmin = if ($null -ne $p.ConsentPromptBehaviorAdmin) { $p.ConsentPromptBehaviorAdmin } else { 5 }; $behaviorUser = if ($null -ne $p.ConsentPromptBehaviorUser) { $p.ConsentPromptBehaviorUser } else { 3 }; $secureDesktop = if ($null -ne $p.PromptOnSecureDesktop) { $p.PromptOnSecureDesktop } else { 1 }; $filterAdminToken = if ($null -ne $p.FilterAdministratorToken) { $p.FilterAdministratorToken } else { 0 }; Write-Output \"EnableLUA: $enableLua (1=UAC on [default], 0=UAC off)\"; Write-Output \"ConsentPromptBehaviorAdmin: $behaviorAdmin (0=no prompt,1=prompt for creds on secure desktop,2=prompt for consent,5=prompt for consent for non-Windows binaries [default])\"; Write-Output \"ConsentPromptBehaviorUser: $behaviorUser (0=auto deny,1=prompt for creds on secure desktop,3=prompt for creds [default])\"; Write-Output \"PromptOnSecureDesktop: $secureDesktop (1=secure desktop on [default], 0=off)\"; Write-Output \"FilterAdministratorToken: $filterAdminToken (1=Admin Approval Mode applies to built-in Administrator too, 0=exempt [default])\""
    description_sk: "Zobrazi, ci je UAC zapnute a ako sa spravaju vyzvy na povolenie (aj neuvedene hodnoty ako predvolene Windows), nic nemeni."
    description_en: "Shows whether UAC is enabled and how elevation prompts behave (unset values shown as Windows defaults), changes nothing."

  - id: sec_defender_exclusions_list
    label_sk: "Vynimky Windows Defenderu"
    label_en: "Windows Defender exclusions"
    risk: SAFE
    command: "try { Get-MpPreference -EA Stop | Select-Object ExclusionPath,ExclusionExtension,ExclusionProcess,ExclusionIpAddress | Format-List } catch { Write-Output 'Could not read Defender preferences (Defender may be disabled by another antivirus).' }"
    description_sk: "Vypise vynimky Defenderu (cesty, procesy, pripony). Malware sa tam casto samo pridava, aby unikol detekcii. Nic nemeni."
    description_en: "Lists Defender exclusions (paths, processes, extensions). Malware often adds itself here to evade detection. Changes nothing."

  - id: sec_rdp_status
    label_sk: "Stav vzdialenej plochy (RDP)"
    label_en: "Remote Desktop (RDP) status"
    risk: SAFE
    command: "$v = (Get-ItemProperty -Path 'HKLM:\\System\\CurrentControlSet\\Control\\Terminal Server' -Name fDenyTSConnections -EA SilentlyContinue).fDenyTSConnections; $state = if ($null -eq $v) { 'unknown (default: RDP off)' } elseif ($v -eq 0) { 'ENABLED' } else { 'disabled' }; Write-Output ('RDP (Remote Desktop): ' + $state); $rules = Get-NetFirewallRule -DisplayGroup 'Remote Desktop' -EA SilentlyContinue; if ($rules) { $rules | Select-Object DisplayName,Enabled,Direction,Action | Format-Table -AutoSize } else { Write-Output 'No Remote Desktop firewall rules found.' }"
    description_sk: "Zobrazi, ci je povolena vzdialena plocha a stav jej firewall pravidiel, nic nemeni."
    description_en: "Shows whether Remote Desktop is enabled and its firewall rule status, changes nothing."

  - id: sec_autologon_check
    label_sk: "Kontrola automatickeho prihlasenia"
    label_en: "Autologon check"
    risk: SAFE
    command: "$w = 'HKLM:\\SOFTWARE\\Microsoft\\Windows NT\\CurrentVersion\\Winlogon'; $p = Get-ItemProperty -Path $w -EA SilentlyContinue; $autoLogon = if ($p.AutoAdminLogon -eq '1') { 'ENABLED' } else { 'disabled' }; Write-Output ('AutoAdminLogon: ' + $autoLogon); Write-Output ('DefaultUserName: ' + $p.DefaultUserName); Write-Output ('Plaintext password stored in registry: ' + [bool]$p.DefaultPassword)"
    description_sk: "Zisti, ci je zapnute automaticke prihlasenie a ci registry obsahuje ulozene heslo v ciston texte (heslo samotne nevypisuje). Nic nemeni."
    description_en: "Checks whether autologon is enabled and whether the registry stores a plaintext password (does not print the password itself). Changes nothing."

  - id: hard_defender_clear_exclusions
    label_sk: "Vycistenie vynimiek Defenderu"
    label_en: "Clear Defender exclusions"
    risk: MODERATE
    command: "try { $p = Get-MpPreference -EA Stop; $bk = \"$env:ProgramData\\PortableFix\\defender_exclusions_backup.json\"; New-Item -ItemType Directory -Force -Path (Split-Path $bk) | Out-Null; if (-not (Test-Path $bk)) { [PSCustomObject]@{ Path = $p.ExclusionPath; Extension = $p.ExclusionExtension; Process = $p.ExclusionProcess; IpAddress = $p.ExclusionIpAddress } | ConvertTo-Json | Set-Content -Path $bk -Encoding UTF8 }; if ($p.ExclusionPath) { Remove-MpPreference -ExclusionPath $p.ExclusionPath }; if ($p.ExclusionExtension) { Remove-MpPreference -ExclusionExtension $p.ExclusionExtension }; if ($p.ExclusionProcess) { Remove-MpPreference -ExclusionProcess $p.ExclusionProcess }; if ($p.ExclusionIpAddress) { Remove-MpPreference -ExclusionIpAddress $p.ExclusionIpAddress }; Write-Output 'Defender exclusions cleared (backup saved).' } catch { Write-Output 'Could not modify Defender exclusions (Defender may be disabled by another antivirus).' }"
    undo_command: "$bk = \"$env:ProgramData\\PortableFix\\defender_exclusions_backup.json\"; if (Test-Path $bk) { $b = Get-Content $bk -Raw | ConvertFrom-Json; if ($b.Path) { Add-MpPreference -ExclusionPath $b.Path }; if ($b.Extension) { Add-MpPreference -ExclusionExtension $b.Extension }; if ($b.Process) { Add-MpPreference -ExclusionProcess $b.Process }; if ($b.IpAddress) { Add-MpPreference -ExclusionIpAddress $b.IpAddress }; Write-Output 'Defender exclusions restored from backup.' } else { Write-Output 'No backup found - nothing to restore.' }"
    description_sk: "Odstrani vsetky vynimky Defenderu (mozne skryvacky pre malware) po zalohovani do PortableFix\\defender_exclusions_backup.json (len pri prvom behu). Undo funguje spolahlivo len ak sa medzitym nespustila tato akcia druhy krat (zaloha je len jedna, z prveho behu)."
    description_en: "Removes all Defender exclusions (a common malware hiding spot) after backing them up to PortableFix\\defender_exclusions_backup.json (only on first run). Undo only works reliably if this action hasn't run a second time since (there's only one backup, from the first run)."

  - id: hard_uac_restore_default
    label_sk: "Obnovenie UAC na predvolene"
    label_en: "Restore UAC to default"
    risk: MODERATE
    command: "$k = 'HKLM:\\Software\\Microsoft\\Windows\\CurrentVersion\\Policies\\System'; $bk = \"$env:ProgramData\\PortableFix\\uac_backup.json\"; New-Item -ItemType Directory -Force -Path (Split-Path $bk) | Out-Null; if (-not (Test-Path $bk)) { Get-ItemProperty -Path $k -EA SilentlyContinue | Select-Object EnableLUA,ConsentPromptBehaviorAdmin,PromptOnSecureDesktop | ConvertTo-Json | Set-Content -Path $bk -Encoding UTF8 }; Set-ItemProperty -Path $k -Name EnableLUA -Value 1 -Type DWord; Set-ItemProperty -Path $k -Name ConsentPromptBehaviorAdmin -Value 5 -Type DWord; Set-ItemProperty -Path $k -Name PromptOnSecureDesktop -Value 1 -Type DWord; Write-Output 'UAC restored to Windows default (takes full effect after sign-out/restart).'"
    undo_command: "$k = 'HKLM:\\Software\\Microsoft\\Windows\\CurrentVersion\\Policies\\System'; $bk = \"$env:ProgramData\\PortableFix\\uac_backup.json\"; if (Test-Path $bk) { $b = Get-Content $bk -Raw | ConvertFrom-Json; if ($null -ne $b.EnableLUA) { Set-ItemProperty -Path $k -Name EnableLUA -Value $b.EnableLUA -Type DWord }; if ($null -ne $b.ConsentPromptBehaviorAdmin) { Set-ItemProperty -Path $k -Name ConsentPromptBehaviorAdmin -Value $b.ConsentPromptBehaviorAdmin -Type DWord }; if ($null -ne $b.PromptOnSecureDesktop) { Set-ItemProperty -Path $k -Name PromptOnSecureDesktop -Value $b.PromptOnSecureDesktop -Type DWord }; Write-Output 'UAC settings restored from backup.' } else { Write-Output 'No backup found - nothing to restore.' }"
    description_sk: "Nastavi UAC na standardne hodnoty Windows (zapnute, predvolene spravanie vyziev) po zalohe aktualneho stavu (len pri prvom behu). Undo funguje spolahlivo len ak sa medzitym nespustila tato akcia druhy krat (zaloha je len jedna, z prveho behu)."
    description_en: "Sets UAC to standard Windows defaults (enabled, default prompt behavior) after backing up the current state (only on first run). Undo only works reliably if this action hasn't run a second time since (there's only one backup, from the first run)."

  - id: sec_wpbt_disable
    label_sk: "Vypnutie WPBT (Windows Platform Binary Table)"
    label_en: "Disable WPBT (Windows Platform Binary Table)"
    risk: MODERATE
    command: "try { Set-ItemProperty -Path 'HKLM:\\SYSTEM\\CurrentControlSet\\Control\\Session Manager' -Name DisableWpbtExecution -Value 1 -Type DWord -EA Stop; Write-Output 'WPBT execution disabled.' } catch { Write-Output ('Could not disable WPBT: ' + $_.Exception.Message + ' (needs administrator).'); exit 1 }"
    undo_command: "Remove-ItemProperty -Path 'HKLM:\\SYSTEM\\CurrentControlSet\\Control\\Session Manager' -Name DisableWpbtExecution -EA SilentlyContinue; Write-Output 'WPBT setting removed (back to Windows default).'"
    description_sk: "Vypne WPBT (Windows Platform Binary Table) - mechanizmus, cez ktory vyrobca notebooku/PC moze spustit program hned pri starte Windows (napr. anti-theft softver), niekedy aj bez suhlasu pouzivatela. Znama cesta zneuzitia predinstalovanym OEM softverom. Undo nastavenie odstrani."
    description_en: "Disables WPBT (Windows Platform Binary Table) - the mechanism that lets a PC/laptop vendor auto-run a program at Windows boot (e.g. anti-theft software), sometimes without user consent. A known abuse vector for preinstalled OEM software. Undo removes the setting."
