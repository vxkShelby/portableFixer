module_id: m19_win_features
category: REPAIR
actions:
  - id: feature_list_report
    label_sk: "Prehľad voliteľných funkcií Windows"
    label_en: "Windows optional features report"
    risk: SAFE
    command: "try { Get-WindowsOptionalFeature -Online -EA Stop | Select-Object FeatureName,State | Sort-Object State -Descending | Format-Table -AutoSize } catch { Write-Output ('Could not read optional features: ' + $_.Exception.Message + ' (needs administrator).') }"
    description_sk: "Vypíše všetky voliteľné funkcie Windows (DISM) a ich stav (zapnuté/vypnuté). Nič nemení."
    description_en: "Lists every Windows optional feature (DISM) and its state (enabled/disabled). Changes nothing."

  - id: feature_legacy_insecure_report
    label_sk: "Zastarané/nebezpečné funkcie (SMB1, PowerShell v2...)"
    label_en: "Legacy/insecure features report (SMB1, PowerShell v2...)"
    risk: SAFE
    command: "$watch = 'MicrosoftWindowsPowerShellV2Root','MicrosoftWindowsPowerShellV2','SMB1Protocol','TelnetClient','TFTP'; try { Get-WindowsOptionalFeature -Online -EA Stop | Where-Object { $_.FeatureName -in $watch -and $_.State -eq 'Enabled' } | Select-Object FeatureName,State | Format-Table -AutoSize } catch { Write-Output ('Could not read optional features: ' + $_.Exception.Message + ' (needs administrator).') }"
    description_sk: "Označí zapnuté zastarané/rizikové funkcie: SMB1, PowerShell v2 (chýba AMSI/logovanie), klient Telnet a klient TFTP (nešifrované protokoly). Nič nemení."
    description_en: "Flags enabled legacy/risky features: SMB1, PowerShell v2 (lacks AMSI/script-block logging), Telnet and TFTP clients (plaintext protocols). Changes nothing."

  - id: feature_enable_dotnet35
    label_sk: "Zapnutie .NET Framework 3.5"
    label_en: "Enable .NET Framework 3.5"
    risk: REQUIRES_REBOOT
    command: "Enable-WindowsOptionalFeature -Online -FeatureName NetFx3 -All -NoRestart"
    undo_command: "Disable-WindowsOptionalFeature -Online -FeatureName NetFx3 -NoRestart"
    description_sk: "Zapne .NET Framework 3.5 (potrebuje ho niektorý starší/hobby softvér). Často zlyhá s chybou 0x800f0950, ak je politikou zakázané sťahovanie funkcií cez Windows Update alebo chýba pripojenie na internet - vtedy treba inštalačné médium Windows. Na úplné uplatnenie vyžaduje reštart; undo funkciu opäť vypne."
    description_en: "Enables .NET Framework 3.5 (needed by some older/hobby software). Frequently fails with error 0x800f0950 if feature restoration via Windows Update is disabled by policy or there's no internet - Windows installation media is then needed. Requires a restart to fully apply; undo disables the feature again."

  - id: feature_disable_powershell_v2
    label_sk: "Vypnutie PowerShell v2"
    label_en: "Disable PowerShell v2"
    risk: MODERATE
    command: "$me = \"$env:USERDOMAIN\\$env:USERNAME\"; $root = \"$env:ProgramData\\PortableFix\"; New-Item -ItemType Directory -Force -Path $root | Out-Null; icacls $root /inheritance:r /grant:r \"*S-1-5-32-544:(OI)(CI)F\" /grant:r \"*S-1-5-18:(OI)(CI)F\" /grant:r \"${me}:(OI)(CI)F\" | Out-Null; $bk = \"$root\\feature_disable_powershell_v2_backup.json\"; try { $f = Get-WindowsOptionalFeature -Online -FeatureName MicrosoftWindowsPowerShellV2Root -EA Stop; $prior = if ($f) { [string]$f.State } else { 'NotPresent' }; [PSCustomObject]@{ State = $prior } | ConvertTo-Json | Set-Content -Path $bk -Encoding UTF8 -EA Stop; if ($prior -eq 'Enabled' -or $prior -eq 'EnablePending') { $r = Disable-WindowsOptionalFeature -Online -FeatureName MicrosoftWindowsPowerShellV2Root -NoRestart -EA Stop; Write-Output ('PowerShell v2 disabled (restart needed: ' + $r.RestartNeeded + ').') } else { Write-Output ('PowerShell v2 is not enabled (state: ' + $prior + ') - nothing changed.') } } catch { Write-Output ('Could not disable PowerShell v2: ' + $_.Exception.Message + ' (needs administrator).'); exit 1 }"
    undo_command: "$bk = \"$env:ProgramData\\PortableFix\\feature_disable_powershell_v2_backup.json\"; if (Test-Path $bk) { try { $b = Get-Content $bk -Raw -EA Stop | ConvertFrom-Json; if ([string]$b.State -eq 'Enabled') { $r = Enable-WindowsOptionalFeature -Online -FeatureName MicrosoftWindowsPowerShellV2Root -All -NoRestart -EA Stop; Write-Output ('PowerShell v2 re-enabled - it was enabled before the run (restart needed: ' + $r.RestartNeeded + ').') } else { Write-Output ('PowerShell v2 was not enabled before the run (state: ' + $b.State + ') - left disabled.') } } catch { Write-Output ('Could not re-enable PowerShell v2: ' + $_.Exception.Message); exit 1 } } else { Write-Output 'No backup found - nothing changed.' }"
    description_sk: "Vypne zastaranú verziu PowerShell v2 (bez AMSI/logovania, známy spôsob obchádzania detekcie). Pôvodný stav funkcie uloží do PortableFix\\feature_disable_powershell_v2_backup.json (prepisuje sa pri každom behu); undo obnoví stav spred behu - PowerShell v2 znova zapne, len ak bol pred behom zapnutý. Na úplné uplatnenie vyžaduje reštart."
    description_en: "Disables the legacy PowerShell v2 engine (no AMSI/logging, a known detection-evasion downgrade vector). Saves the feature's prior state to PortableFix\\feature_disable_powershell_v2_backup.json (refreshed on every run); undo restores the state saved before the run - it re-enables PowerShell v2 only if it was enabled before. Requires a restart to fully apply."

  - id: feature_enable_sandbox
    label_sk: "Zapnutie Windows Sandbox"
    label_en: "Enable Windows Sandbox"
    risk: REQUIRES_REBOOT
    command: "try { Enable-WindowsOptionalFeature -Online -FeatureName 'Containers-DisposableClientVM' -All -NoRestart -EA Stop; Write-Output 'Windows Sandbox enabled - restart required.' } catch { Write-Output ('Could not enable Windows Sandbox: ' + $_.Exception.Message + ' (needs Windows 10/11 Pro or Enterprise, and virtualization enabled in firmware.)'); exit 1 }"
    undo_command: "try { Disable-WindowsOptionalFeature -Online -FeatureName 'Containers-DisposableClientVM' -NoRestart -EA Stop; Write-Output 'Windows Sandbox disabled.' } catch { Write-Output ('Could not disable Windows Sandbox: ' + $_.Exception.Message) }"
    description_sk: "Zapne Windows Sandbox (jednorazové izolované prostredie na otestovanie podozrivého súboru/inštalátora). Potrebuje edíciu Pro/Enterprise a zapnutú virtualizáciu vo firmvéri. Na úplné uplatnenie vyžaduje reštart; undo funkciu opäť vypne."
    description_en: "Enables Windows Sandbox (a disposable isolated environment for testing a suspicious file/installer). Needs a Pro/Enterprise edition and virtualization enabled in firmware. Requires a restart to fully apply; undo disables the feature again."
