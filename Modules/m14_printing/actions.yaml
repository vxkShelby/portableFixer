module_id: m14_printing
category: REPAIR
actions:
  - id: print_installed_printers_report
    label_sk: "Prehľad nainštalovaných tlačiarní"
    label_en: "Installed printers report"
    risk: SAFE
    command: "Get-Printer | Select-Object Name,DriverName,PortName,Shared,PrinterStatus | Format-Table -AutoSize; Write-Output '--- Print jobs ---'; Get-Printer | ForEach-Object { Get-PrintJob -PrinterName $_.Name -EA SilentlyContinue } | Select-Object PrinterName,DocumentName,JobStatus,SubmittedTime,Size | Format-Table -AutoSize"
    description_sk: "Vypíše nainštalované tlačiarne (port, ovládač, stav) a aktuálne tlačové úlohy. Nič nemení."
    description_en: "Lists installed printers (port, driver, status) and current print jobs. Changes nothing."

  - id: print_driver_store_report
    label_sk: "Prehľad ovládačov tlačiarní"
    label_en: "Printer driver store report"
    risk: SAFE
    command: "Get-PrinterDriver | Select-Object Name,Manufacturer,DriverVersion,PrinterEnvironment | Format-Table -AutoSize -Wrap; $inUse = (Get-Printer).DriverName; $orphaned = Get-PrinterDriver | Where-Object { $_.Name -notin $inUse }; Write-Output ('Orphaned driver packages (installed, no printer uses them): ' + $orphaned.Count); $orphaned | Select-Object Name | Format-Table -AutoSize"
    description_sk: "Vypíše nainštalované balíky ovládačov tlačiarní a označí tie, ktoré nepoužíva žiadna nainštalovaná tlačiareň. Nič nemení."
    description_en: "Lists installed printer driver packages and flags any not used by an installed printer. Changes nothing."

  - id: print_offline_ghost_printers_report
    label_sk: "Offline/chybové tlačiarne"
    label_en: "Offline/ghost printers report"
    risk: SAFE
    command: "Get-Printer | Where-Object { $_.PrinterStatus -eq 'Offline' -or $_.PrinterStatus -eq 'Error' } | Select-Object Name,DriverName,PortName,PrinterStatus | Format-Table -AutoSize"
    description_sk: "Označí tlačiarne v stave Offline alebo Error - často staré/odpojené zariadenia, ktoré mätú pri výbere tlačiarne. Nič nemení."
    description_en: "Flags printers in Offline or Error state - often stale/disconnected devices that confuse the printer picker. Changes nothing."

  # G26: MajorVersion 3/4 and the INF maker/provider decide the class - never
  # a localized name. A stopped spooler makes Get-Printer fail, so the report
  # exits 1 instead of claiming there are no printers. Provider=Microsoft is
  # not enough for WPP: ntprint.inf vendor drivers, the v4 PCL6 class drivers
  # and Generic / Text Only are Microsoft-provided but stop working under WPP,
  # so only the IPP class driver and Microsoft Print To PDF count as ready.
  - id: print_driver_class_report
    label_sk: "Triedy ovládačov tlačiarní a pripravenosť na WPP"
    label_en: "Printer driver classes and WPP readiness"
    risk: SAFE
    command: "$spool = Get-Service -Name Spooler -EA SilentlyContinue; if (-not $spool) { Write-Output 'Print Spooler service not found - printing is not available on this PC.'; exit 1 }; if ([string]$spool.Status -ne 'Running') { Write-Output ('Print Spooler is not running (status: ' + [string]$spool.Status + ') - printers, drivers and ports can only be listed while it runs. Start the Print Spooler service and run this report again.'); exit 1 }; try { $printers = @(Get-Printer -EA Stop); $drivers = @(Get-PrinterDriver -EA Stop); $ports = @(Get-PrinterPort -EA Stop) } catch { Write-Output ('Could not list printers, drivers or ports: ' + $_.Exception.Message); exit 1 }; function Get-PfVal([string]$Key, [string]$Name) { $i = Get-ItemProperty -LiteralPath $Key -Name $Name -EA SilentlyContinue; if ($i) { $i.$Name } else { $null } }; function Format-PfVer($v) { if ($null -eq $v -or [uint64]$v -eq 0) { return 'unknown' }; $u = [uint64]$v; '{0}.{1}.{2}.{3}' -f ($u -shr 48), (($u -shr 32) -band 0xFFFF), (($u -shr 16) -band 0xFFFF), ($u -band 0xFFFF) }; function Get-PfClass($d) { $mfr = [string]$d.Manufacturer -match '^Microsoft'; $v4 = [int]$d.MajorVersion -ge 4; if ($mfr -and $v4 -and [string]$d.Name -match 'IPP Class Driver|Mopria|PWG Raster|Universal Print') { 'Microsoft IPP class driver' } elseif ($mfr -and $v4 -and [string]$d.Name -match '^Microsoft Print To PDF$') { 'Microsoft virtual printer' } elseif ($mfr -or ([string]$d.Provider -match '^Microsoft')) { 'Microsoft-provided non-IPP driver' } else { 'third-party' } }; function Format-PfIso($d) { $v = Get-PfVal ('HKLM:\\SYSTEM\\CurrentControlSet\\Control\\Print\\Environments\\' + $d.PrinterEnvironment + '\\Drivers\\Version-' + $d.MajorVersion + '\\' + $d.Name) 'DriverIsolation'; if ($null -eq $v) { 'not declared (spooler default)' } elseif ([int]$v -eq 0) { '0 - runs inside the spooler' } elseif ([int]$v -eq 2) { '2 - supports isolation' } else { [string]$v } }; function Get-PfDriver([string]$Name) { $c = @($drivers | Where-Object { $_.Name -eq $Name }); if ($c.Count -gt 1) { $n = @($c | Where-Object { [string]$_.PrinterEnvironment -ne 'Windows NT x86' }); if ($n.Count -gt 0) { $c = $n } }; if ($c.Count -gt 0) { $c[0] } else { $null } }; $wppKey = 'HKLM:\\SOFTWARE\\Policies\\Microsoft\\Windows NT\\Printers\\WPP'; $wpp = ((Get-PfVal $wppKey 'WindowsProtectedPrintGroupPolicyState') -eq 1) -or ((Get-PfVal $wppKey 'WindowsProtectedPrintMode') -eq 1); $isoPol = Get-PfVal 'HKLM:\\SOFTWARE\\Policies\\Microsoft\\Windows NT\\Printers' 'PrintDriverIsolationExecutionPolicy'; Write-Output ('Windows Protected Print: ' + $(if ($wpp) { 'ENABLED - only the inbox IPP class driver is allowed' } else { 'not enabled' })); Write-Output ('Driver isolation policy (PrintDriverIsolationExecutionPolicy): ' + $(if ($null -eq $isoPol) { 'not set (isolation allowed)' } elseif ([int]$isoPol -eq 0) { '0 - isolation turned off, every driver runs inside the spooler' } else { [string]$isoPol })); Write-Output '--- Drivers ---'; foreach ($d in @($drivers | Sort-Object Name, PrinterEnvironment)) { $users = @($printers | Where-Object { $_.DriverName -eq $d.Name } | ForEach-Object { $_.Name }); Write-Output ('DRIVER: ' + $d.Name + ' [' + $d.PrinterEnvironment + '] - Type ' + $d.MajorVersion + ', version ' + (Format-PfVer $d.DriverVersion) + ', ' + (Get-PfClass $d) + ', isolation: ' + (Format-PfIso $d) + ', used by: ' + $(if ($users.Count) { $users -join ', ' } else { 'no printer' })) }; Write-Output '--- Printers ---'; $third = 0; $msOther = 0; foreach ($p in @($printers | Sort-Object Name)) { $d = Get-PfDriver $p.DriverName; $port = $ports | Where-Object { $_.Name -eq $p.PortName } | Select-Object -First 1; $portText = [string]$p.PortName; if ($port) { $portText += ' (monitor: ' + $(if ($port.PortMonitor) { $port.PortMonitor } else { 'unknown' }) + $(if ($port.PrinterHostAddress) { ', host: ' + $port.PrinterHostAddress } else { '' }) + ')' }; if (-not $d) { $drvText = $p.DriverName + ' (not in the driver list)'; $hint = 'UNKNOWN - driver not found' } else { $cls = Get-PfClass $d; $drvText = $p.DriverName + ' (Type ' + $d.MajorVersion + ', ' + $cls + ')'; if ($cls -eq 'third-party') { $third++; $hint = 'NOT READY - third-party Type ' + $d.MajorVersion + ' driver; with Windows Protected Print only the inbox IPP class driver works, so check that the device supports IPP / is Mopria-certified' } elseif ($cls -eq 'Microsoft IPP class driver') { $hint = 'READY - inbox IPP class driver' } elseif ($cls -eq 'Microsoft virtual printer') { $hint = 'READY - inbox Microsoft Print To PDF' } else { $msOther++; $hint = 'NOT READY - Microsoft-provided Type ' + $d.MajorVersion + ' driver, but not the IPP class driver; with Windows Protected Print only the inbox IPP class driver works, so check that the device supports IPP / is Mopria-certified' } }; Write-Output ('PRINTER: ' + $p.Name + ' - driver: ' + $drvText + ', port: ' + $portText + ', type: ' + [string]$p.Type + ', shared: ' + $(if ($p.Shared) { 'yes' } else { 'no' }) + ' - WPP: ' + $hint) }; $v3 = @($drivers | Where-Object { $_.MajorVersion -eq 3 }).Count; $v4 = @($drivers | Where-Object { $_.MajorVersion -eq 4 }).Count; Write-Output ('Printers: ' + $printers.Count + ', drivers: ' + $drivers.Count + ' (Type 3: ' + $v3 + ', Type 4: ' + $v4 + '), ports: ' + $ports.Count); if ($printers.Count -eq 0) { Write-Output 'VERDICT: NO PRINTERS - nothing to assess' } else { $bad = $third + $msOther; $split = ' (' + $third + ' on third-party drivers, ' + $msOther + ' on Microsoft-provided non-IPP drivers)'; if ($wpp -and $bad -gt 0) { Write-Output ('VERDICT: ATTENTION - Windows Protected Print is on, but ' + $bad + ' of ' + $printers.Count + ' printer(s) do not use the inbox IPP class driver' + $split + ' and cannot print until they do') } elseif ($bad -gt 0) { Write-Output ('VERDICT: ' + $bad + ' of ' + $printers.Count + ' printer(s) not ready for Windows Protected Print' + $split + '; Windows Update prefers the inbox IPP class driver from July 2026 and third-party drivers get security fixes only from July 2027') } else { Write-Output ('VERDICT: OK - all ' + $printers.Count + ' printer(s) use the inbox IPP class driver or Microsoft Print To PDF (ready for Windows Protected Print)') } }"
    description_sk: "Pre každý ovládač vypíše typ (Type 3 / Type 4), verziu, výrobcu, izoláciu a tlačiarne, ktoré ho používajú. Pre každú tlačiareň ukáže ovládač, port (monitor, adresa) a či je pripravená na Windows Protected Print (inbox IPP class driver / Mopria alebo Microsoft Print To PDF). Ovládače od Microsoftu pre konkrétne zariadenia (napr. PCL6 class driver, Generic / Text Only) pripravené nie sú. Na konci je riadok VERDICT: koľko tlačiarní nie je pripravených a koľko z nich závisí od ovládačov tretích strán. Údaje berie z Get-Printer, Get-PrinterDriver, Get-PrinterPort a registrov, nikdy z preloženého textu. Keď služba Zaraďovač tlače nebeží, skončí s chybou a vysvetlením. Nič nemení."
    description_en: "For every driver lists its type (Type 3 / Type 4), version, maker, isolation and the printers using it. For every printer shows the driver, the port (monitor, address) and whether it is ready for Windows Protected Print (inbox IPP class driver / Mopria or Microsoft Print To PDF). Microsoft-provided drivers for specific devices (e.g. the PCL6 class drivers, Generic / Text Only) are not ready. Ends with a VERDICT line: how many printers are not ready and how many of them depend on third-party drivers. Reads Get-Printer, Get-PrinterDriver, Get-PrinterPort and the registry, never localized text. If the Print Spooler is not running it fails with an explanation. Changes nothing."

  # G26: Start-Process instead of '& $path' keeps PrintBrm's progress on the
  # executor's stdout (the inactivity watchdog sees it) and gives a real exit
  # code. No undo_command: a restore re-adds every queue in the file, so the
  # technician runs the printed PrintBrm -R command deliberately.
  - id: print_backup_printbrm
    label_sk: "Záloha tlačiarní, ovládačov a portov (PrintBRM)"
    label_en: "Back up printers, drivers and ports (PrintBRM)"
    risk: MODERATE
    changes_system: false  # writes a backup file only - nothing a restore point would roll back
    preview_command: "$brm = \"$env:WINDIR\\System32\\spool\\tools\\PrintBrm.exe\"; $spool = Get-Service -Name Spooler -EA SilentlyContinue; $state = if ($spool) { [string]$spool.Status } else { 'not installed' }; Write-Output ('Would back up all printers, drivers, ports and queues with PrintBrm -B to ' + \"$env:ProgramData\\PortableFix\\printer_backups\\<date_time>.printerExport\" + ' (folder limited to administrators, SYSTEM and the current user).'); Write-Output ('PrintBrm.exe: ' + $(if (Test-Path -LiteralPath $brm) { 'found' } else { 'NOT FOUND at ' + $brm + ' - the backup would fail' })); Write-Output ('Print Spooler: ' + $state + $(if ($state -ne 'Running') { ' - the backup would fail, start the spooler first' } else { '' })); if ($state -eq 'Running') { Write-Output ('Printers now: ' + @(Get-Printer -EA SilentlyContinue).Count) }"
    command: "$me = \"$env:USERDOMAIN\\$env:USERNAME\"; $root = \"$env:ProgramData\\PortableFix\"; New-Item -ItemType Directory -Force -Path $root | Out-Null; icacls $root /inheritance:r /grant:r \"*S-1-5-32-544:(OI)(CI)F\" /grant:r \"*S-1-5-18:(OI)(CI)F\" /grant:r \"${me}:(OI)(CI)F\" | Out-Null; $dir = \"$root\\printer_backups\"; New-Item -ItemType Directory -Force -Path $dir | Out-Null; icacls $dir /inheritance:r /grant:r \"*S-1-5-32-544:(OI)(CI)F\" /grant:r \"*S-1-5-18:(OI)(CI)F\" /grant:r \"${me}:(OI)(CI)F\" | Out-Null; $brm = \"$env:WINDIR\\System32\\spool\\tools\\PrintBrm.exe\"; if (-not (Test-Path -LiteralPath $brm)) { Write-Output ('PrintBrm.exe not found at ' + $brm + ' - nothing was backed up.'); exit 1 }; $spool = Get-Service -Name Spooler -EA SilentlyContinue; if (-not $spool -or [string]$spool.Status -ne 'Running') { Write-Output ('Print Spooler is not running (status: ' + $(if ($spool) { [string]$spool.Status } else { 'not installed' }) + ') - PrintBrm exports through the spooler, so nothing was backed up. Start the Print Spooler service and run the backup again.'); exit 1 }; $file = Join-Path $dir ((Get-Date -Format 'yyyyMMdd_HHmmss') + '.printerExport'); Write-Output ('Backing up all printers, drivers, ports and queues with PrintBrm to ' + $file + ' - with many drivers this takes several minutes.'); try { $proc = Start-Process -FilePath $brm -ArgumentList @('-B', '-F', ('\"' + $file + '\"')) -NoNewWindow -Wait -PassThru -EA Stop; $code = $proc.ExitCode } catch { Write-Output ('Could not start PrintBrm: ' + $_.Exception.Message); exit 1 }; if ($code -eq 0 -and (Test-Path -LiteralPath $file)) { $kb = [math]::Ceiling((Get-Item -LiteralPath $file).Length / 1KB); Write-Output ('Printer backup saved to: ' + $file + ' (' + $kb + ' KB)'); Write-Output ('To restore (administrator Command Prompt, on this or another PC): %WINDIR%\\System32\\spool\\tools\\PrintBrm.exe -R -F \"' + $file + '\"'); Write-Output 'PortableFix never restores it automatically - a restore re-adds every printer, driver and port in the file.'; exit 0 }; Remove-Item -LiteralPath $file -Force -EA SilentlyContinue; Write-Output ('PrintBrm backup failed (exit code ' + $code + '; needs administrator) - no usable backup was written.'); exit 1"
    description_sk: "Zálohuje všetky tlačiarne, ovládače, porty a fronty nástrojom Windows PrintBrm.exe -B do %ProgramData%\\PortableFix\\printer_backups\\<dátum_čas>.printerExport (priečinok len pre administrátorov, SYSTEM a aktuálneho používateľa). Spustite ju pred odstránením ovládačov alebo resetom tlačového systému. Výstup ukáže príkaz na obnovu (PrintBrm -R -F <súbor>), ktorý technik spustí sám - automatické undo nie je, obnova by znovu pridala každú tlačiareň zo zálohy. Vyžaduje administrátora a bežiaci Zaraďovač tlače."
    description_en: "Backs up every printer, driver, port and queue with the Windows PrintBrm.exe -B tool to %ProgramData%\\PortableFix\\printer_backups\\<date_time>.printerExport (folder limited to administrators, SYSTEM and the current user). Run it before removing drivers or resetting the print system. The output shows the restore command (PrintBrm -R -F <file>) for the technician to run - there is no automatic undo, a restore would re-add every printer in the backup. Needs administrator and a running Print Spooler."

  # G26: read-only on purpose - relaxing SMB1, signing, guest logons or print
  # RPC protection to reach an old NAS is the device's problem to fix. Values
  # come from Get-Smb*Configuration with a registry fallback (no admin needed).
  - id: print_smb_compat_report
    label_sk: "Kompatibilita SMB a zdieľanej tlače (NAS, staré tlačiarne)"
    label_en: "SMB and print sharing compatibility (NAS, old printers)"
    risk: SAFE
    command: "function Get-PfVal([string]$Key, [string]$Name) { $i = Get-ItemProperty -LiteralPath $Key -Name $Name -EA SilentlyContinue; if ($i) { $i.$Name } else { $null } }; $ws = 'HKLM:\\SYSTEM\\CurrentControlSet\\Services\\LanmanWorkstation\\Parameters'; $wsPol = 'HKLM:\\SOFTWARE\\Policies\\Microsoft\\Windows\\LanmanWorkstation'; $srv = 'HKLM:\\SYSTEM\\CurrentControlSet\\Services\\LanmanServer\\Parameters'; $prnPol = 'HKLM:\\SOFTWARE\\Policies\\Microsoft\\Windows NT\\Printers'; $weak = New-Object System.Collections.Generic.List[string]; $needs = New-Object System.Collections.Generic.List[string]; $build = 0; [void][int]::TryParse([string](Get-PfVal 'HKLM:\\SOFTWARE\\Microsoft\\Windows NT\\CurrentVersion' 'CurrentBuild'), [ref]$build); if ($build -eq 0) { $build = [Environment]::OSVersion.Version.Build }; $is24h2 = $build -ge 26100; Write-Output ('Windows build: ' + $build); $spool = Get-Service -Name Spooler -EA SilentlyContinue; $spoolState = if ($spool) { [string]$spool.Status } else { 'not installed' }; Write-Output ('Print Spooler: ' + $spoolState); if ($spoolState -ne 'Running') { $needs.Add('The Print Spooler is not running - no local or shared printer works until it is started. The settings below are read from the registry and are still accurate.') }; try { $cc = Get-SmbClientConfiguration -EA Stop } catch { $cc = $null }; try { $sc = Get-SmbServerConfiguration -EA Stop } catch { $sc = $null }; if (-not $cc -or -not $sc) { Write-Output 'SMB configuration cmdlets unavailable - falling back to the registry values.' }; $c1 = Get-PfVal 'HKLM:\\SYSTEM\\CurrentControlSet\\Services\\mrxsmb10' 'Start'; $c1On = $null -ne $c1 -and [int]$c1 -ne 4; Write-Output ('SMB1 client (mrxsmb10): ' + $(if ($null -eq $c1) { 'not installed' } elseif ($c1On) { 'ENABLED (Start=' + $c1 + ')' } else { 'disabled (Start=4)' })); if ($c1On) { $weak.Add('SMB1 client is enabled - SMB1 has no protection against tampering and was the WannaCry/NotPetya entry point. Remove it once no device needs it.') } else { $needs.Add('A NAS or printer that only speaks SMB1 (typical for devices made before about 2015) cannot be reached from this PC. Fix it on the device: update its firmware or switch it to SMB2/SMB3. PortableFix never re-enables SMB1.') }; $s1 = if ($sc) { [bool]$sc.EnableSMB1Protocol } else { $v = Get-PfVal $srv 'SMB1'; if ($null -eq $v) { $null } else { [int]$v -ne 0 } }; Write-Output ('SMB1 server: ' + $(if ($null -eq $s1) { 'unknown (not set in the registry)' } elseif ($s1) { 'ENABLED' } else { 'disabled' })); if ($s1) { $weak.Add('SMB1 server is enabled - old devices can save to this PC over SMB1, but so can an attacker without message signing. Turn it off once the old scanner is replaced.') } elseif ($null -ne $s1) { $needs.Add('An old scanner or copier that saves to a shared folder on this PC (scan to folder) must support SMB2 or newer.') }; $csign = if ($cc) { [bool]$cc.RequireSecuritySignature } else { $v = Get-PfVal $ws 'RequireSecuritySignature'; if ($null -eq $v) { $null } else { [int]$v -ne 0 } }; $csignEff = if ($null -eq $csign) { $is24h2 } else { $csign }; Write-Output ('SMB signing required (outgoing): ' + $(if ($null -eq $csign) { 'not set - Windows default (' + $(if ($is24h2) { 'required on Windows 11 24H2 and newer' } else { 'not required before Windows 11 24H2' }) + ')' } elseif ($csign) { 'yes' } else { 'no' })); if ($csignEff) { $needs.Add('SMB signing is required for outgoing connections - an old NAS that cannot sign fails with access denied. Turn signing on in the NAS or update its firmware; do not turn it off on the PC.') } elseif ($is24h2 -and $csign -eq $false) { $weak.Add('The outgoing SMB signing requirement was turned off (RequireSecuritySignature=0) although Windows 11 24H2 requires it by default - traffic to shares can be tampered with.') }; $ssign = if ($sc) { [bool]$sc.RequireSecuritySignature } else { $v = Get-PfVal $srv 'RequireSecuritySignature'; if ($null -eq $v) { $null } else { [int]$v -ne 0 } }; Write-Output ('SMB signing required (incoming): ' + $(if ($null -eq $ssign) { 'not set - Windows default' } elseif ($ssign) { 'yes' } else { 'no' })); if ($ssign) { $needs.Add('This PC requires signing for incoming SMB connections - a device that saves scans to a shared folder here must support SMB signing.') }; $gPol = Get-PfVal $wsPol 'AllowInsecureGuestAuth'; $gSvc = Get-PfVal $ws 'AllowInsecureGuestAuth'; if ($null -ne $gPol) { $guest = [int]$gPol -ne 0; $gSrc = 'Group Policy' } elseif ($cc -and $null -ne $cc.EnableInsecureGuestLogons) { $guest = [bool]$cc.EnableInsecureGuestLogons; $gSrc = 'SMB client configuration' } elseif ($null -ne $gSvc) { $guest = [int]$gSvc -ne 0; $gSrc = 'LanmanWorkstation registry' } else { $guest = $null; $gSrc = 'Windows default' }; $gDefault = $guest -and $null -eq $gPol -and $null -eq $gSvc -and -not $is24h2; $weakDef = New-Object System.Collections.Generic.List[string]; Write-Output ('Insecure guest logons (AllowInsecureGuestAuth): ' + $(if ($null -eq $guest) { 'not set - ' + $(if ($is24h2) { 'blocked by default on Windows 11 24H2 and newer' } else { 'default depends on the edition (blocked on Enterprise/Education)' }) } elseif ($gDefault) { 'ALLOWED - default of this edition before Windows 11 24H2 (recommended: block)' } elseif ($guest) { 'ALLOWED' } else { 'blocked' }) + ' [' + $gSrc + ']'); if ($gDefault) { $weakDef.Add('Insecure guest logons are allowed by the default of this Windows edition (nobody relaxed it) - any device on the network can pose as the NAS. Recommended: block them (AllowInsecureGuestAuth=0) and use a user account on the NAS.') } elseif ($guest) { $weak.Add('Insecure guest logons are allowed - any device on the network can pose as the NAS and the PC sends data to it without authentication. Prefer a user account on the NAS.') } elseif ($guest -eq $false -or $is24h2) { $needs.Add('A NAS share that only allows guest (anonymous) access is refused. Create a user account on the NAS and connect with its name and password (Credential Manager).') }; $rp = Get-PfVal 'HKLM:\\SYSTEM\\CurrentControlSet\\Control\\Print' 'RpcAuthnLevelPrivacyEnabled'; Write-Output ('Print RPC privacy (RpcAuthnLevelPrivacyEnabled): ' + $(if ($null -eq $rp) { 'not set - enforced (default since January 2022)' } elseif ([int]$rp -eq 0) { 'DISABLED (0)' } else { 'enforced (' + $rp + ')' })); if ($null -ne $rp -and [int]$rp -eq 0) { $weak.Add('RpcAuthnLevelPrivacyEnabled=0 turns off the CVE-2021-1678 print RPC protection. Set it back to 1 once the old print server or client is gone.') } else { $needs.Add('Print RPC requires packet privacy (CVE-2021-1678) - an unpatched old print server or client cannot connect; update it instead of lowering this.') }; $pipe = Get-PfVal ($prnPol + '\\RPC') 'RpcUseNamedPipeProtocol'; $auth = Get-PfVal ($prnPol + '\\RPC') 'RpcAuthentication'; $proto = Get-PfVal ($prnPol + '\\RPC') 'RpcProtocols'; $port = Get-PfVal ($prnPol + '\\RPC') 'RpcTcpPort'; Write-Output ('Outgoing print RPC (RpcUseNamedPipeProtocol): ' + $(if ($null -eq $pipe -or [int]$pipe -eq 0) { 'RPC over TCP (default on Windows 11 22H2 and newer)' } else { 'RPC over named pipes (SMB) - policy ' + $pipe })); Write-Output ('Outgoing print RPC authentication (RpcAuthentication): ' + $(if ($null -eq $auth -or [int]$auth -eq 0) { 'default' } elseif ([int]$auth -eq 1) { 'enabled' } elseif ([int]$auth -eq 2) { 'DISABLED' } else { [string]$auth })); if ($null -ne $auth -and [int]$auth -eq 2) { $weak.Add('RpcAuthentication=2 sends print RPC to print servers without authentication.') }; Write-Output ('Incoming print RPC (RpcProtocols / RpcTcpPort): ' + $(if ($null -eq $proto) { 'default' } else { '0x' + ([int]$proto).ToString('X') }) + ' / ' + $(if ($null -eq $port -or [int]$port -eq 0) { 'dynamic port' } else { [string]$port })); $ra = Get-PfVal ($prnPol + '\\PointAndPrint') 'RestrictDriverInstallationToAdministrators'; Write-Output ('Printer driver install from print servers (RestrictDriverInstallationToAdministrators): ' + $(if ($null -eq $ra -or [int]$ra -ne 0) { 'administrators only (default since August 2021)' } else { 'ANY USER (0)' })); if ($null -ne $ra -and [int]$ra -eq 0) { $weak.Add('RestrictDriverInstallationToAdministrators=0 lets standard users install printer drivers from print servers (PrintNightmare, CVE-2021-34527).') } else { $needs.Add('Connecting to a shared printer whose driver is not yet on this PC needs an administrator once.') }; if ($weak.Count -gt 0) { Write-Output '--- Security relaxations found ---'; $weak | ForEach-Object { Write-Output ('RELAXED: ' + $_) } }; if ($weakDef.Count -gt 0) { Write-Output '--- Weak Windows defaults ---'; $weakDef | ForEach-Object { Write-Output ('WEAK DEFAULT: ' + $_) } }; Write-Output '--- What an old NAS or printer may need ---'; $needs | ForEach-Object { Write-Output ('NOTE: ' + $_) }; Write-Output 'PortableFix only reports these settings and never changes them.'; if ($weak.Count -gt 0) { Write-Output ('VERDICT: WEAKENED - ' + $weak.Count + ' setting(s) lower security (see RELAXED); keep them only while the old device is still in use') } elseif ($weakDef.Count -gt 0) { Write-Output ('VERDICT: WEAK DEFAULT - nothing was relaxed, but ' + $weakDef.Count + ' Windows default(s) of this edition are weaker than recommended (see WEAK DEFAULT)') } else { Write-Output 'VERDICT: SECURE - no SMB or print security setting is relaxed; an old NAS or printer that fails has to be fixed on the device side (see NOTE)' }"
    description_sk: "Keď nejde starý NAS alebo zdieľaná tlačiareň: vypíše stav klienta a servera SMB1, povinné podpisovanie SMB, prihlásenie hosťa (AllowInsecureGuestAuth), ochranu tlačového RPC (RpcAuthnLevelPrivacyEnabled, RPC politiky) a inštaláciu ovládačov z tlačových serverov. Ku každému nastaveniu vysvetlí, čo staré zariadenie potrebuje, a verdikt SECURE alebo WEAKENED povie, či je niektorá ochrana oslabená. Verdikt WEAK DEFAULT znamená, že nikto nič neoslabil, ale predvolené nastavenie edície (prihlásenie hosťa pred Windows 11 24H2) je slabšie, než sa odporúča. Nič nemení a bezpečnosť nikdy neznižuje - riešenie patrí na stranu zariadenia (firmvér, SMB2/3, používateľský účet na NAS)."
    description_en: "When an old NAS or shared printer stops working: reports the SMB1 client and server state, required SMB signing, guest logons (AllowInsecureGuestAuth), print RPC protection (RpcAuthnLevelPrivacyEnabled, RPC policies) and driver installation from print servers. Explains what an old device needs for each setting, and a SECURE or WEAKENED verdict says whether any protection is relaxed. A WEAK DEFAULT verdict means nothing was relaxed, but the edition default (guest logons before Windows 11 24H2) is weaker than recommended. Changes nothing and never lowers security - the fix belongs on the device (firmware, SMB2/3, a user account on the NAS)."

  - id: print_remove_offline_printers
    label_sk: "Odstránenie offline/chybových tlačiarní"
    label_en: "Remove offline/ghost printers"
    risk: MODERATE
    preview_command: "$p = Get-Printer | Where-Object { $_.PrinterStatus -in @('Offline','Error') }; Write-Output ('Would remove ' + $p.Count + ' offline/error printer object(s): ' + (($p | Select-Object -ExpandProperty Name) -join ', '))"
    command: "$bk = \"$env:ProgramData\\PortableFix\\printers_removed_backup.json\"; New-Item -ItemType Directory -Force -Path (Split-Path $bk) | Out-Null; $p = Get-Printer | Where-Object { $_.PrinterStatus -in @('Offline','Error') }; $p | Select-Object Name,DriverName,PortName | ConvertTo-Json | Set-Content -Path $bk -Encoding UTF8; $p | ForEach-Object { Remove-Printer -Name $_.Name -EA SilentlyContinue }; Write-Output ('Removed ' + $p.Count + ' offline/error printer(s), backup saved to ' + $bk)"
    undo_command: "$bk = \"$env:ProgramData\\PortableFix\\printers_removed_backup.json\"; if (Test-Path $bk) { Get-Content $bk -Raw | ConvertFrom-Json | ForEach-Object { try { Add-Printer -Name $_.Name -DriverName $_.DriverName -PortName $_.PortName -EA Stop } catch { Write-Output ('Could not recreate ' + $_.Name + ': ' + $_.Exception.Message) } } } else { Write-Output 'No backup found.' }"
    description_sk: "Odstráni všetky tlačiarne v stave Offline/Error, predtým zálohuje ich názov/ovládač/port. Undo sa ich pokúsi znovu vytvoriť (nemusí obnoviť ovládač, ktorý bol medzitým tiež odstránený)."
    description_en: "Removes all Offline/Error printers after backing up their name/driver/port. Undo attempts to recreate them (may not restore a driver that was also removed in the meantime)."

  - id: print_remove_orphaned_drivers
    label_sk: "Odstránenie nepoužívaných ovládačov tlačiarní"
    label_en: "Remove orphaned printer drivers"
    risk: DESTRUCTIVE
    command: "try { $inUse = @((Get-Printer -EA Stop).DriverName); $drivers = @(Get-PrinterDriver -EA Stop) } catch { Write-Output ('Could not list printers/drivers (Print Spooler not running?) - nothing removed, so no in-use driver can be mistaken for an orphan: ' + $_.Exception.Message); exit 1 }; $removed = 0; $failed = 0; $drivers | Where-Object { $_.Name -notin $inUse } | ForEach-Object { $name = $_.Name; $envName = $_.PrinterEnvironment; try { Remove-PrinterDriver -Name $name -PrinterEnvironment $envName -EA Stop; $removed++; Write-Output ('Removed driver: ' + $name + ' (' + $envName + ')') } catch { $failed++; Write-Output ('Failed to remove ' + $name + ' (' + $envName + '): ' + $_.Exception.Message) } }; if ($failed -gt 0) { Write-Output ('Removed ' + $removed + ' orphaned driver(s), ' + $failed + ' could not be removed.'); exit 1 }; Write-Output ('Removed ' + $removed + ' orphaned driver(s).')"
    description_sk: "Natrvalo odstráni balíky ovládačov tlačiarní, ktoré nepoužíva žiadna nainštalovaná tlačiareň. Nevratné - na opätovnú inštaláciu sú potrebné pôvodné súbory ovládača (INF), ktoré tento nástroj nemá. Predtým spustite Zálohu tlačiarní, ovládačov a portov (PrintBRM) - z nej sa dajú ovládače obnoviť."
    description_en: "Permanently removes printer driver packages not used by any installed printer. Irreversible - reinstalling needs the original driver (INF) files, which this tool does not have. Run Back up printers, drivers and ports (PrintBRM) first - the drivers can be restored from it."

  - id: print_reset_print_system
    label_sk: "Reset celého tlačového systému"
    label_en: "Reset entire print system"
    risk: DESTRUCTIVE
    command: "function Remove-PfSafe([string]$Path) { $n = 0; $i = Get-Item -LiteralPath $Path -Force -EA SilentlyContinue; if (-not $i) { return $n }; $ro = [IO.FileAttributes]::ReadOnly; $rp = [IO.FileAttributes]::ReparsePoint; $dir = [IO.FileAttributes]::Directory; $dirs = New-Object System.Collections.Generic.List[string]; $todo = New-Object System.Collections.Generic.Stack[string]; $todo.Push($i.FullName); while ($todo.Count -gt 0) { $p = $todo.Pop(); try { $a = [IO.File]::GetAttributes($p) } catch [IO.FileNotFoundException], [IO.DirectoryNotFoundException] { continue } catch { $n++; continue }; if (($a -band $dir) -and -not ($a -band $rp)) { $dirs.Add($p); try { foreach ($c in [IO.Directory]::GetFileSystemEntries($p)) { $todo.Push($c) } } catch { $n++ }; continue }; try { if ($a -band $rp) { if ($a -band $dir) { [IO.Directory]::Delete($p) } else { [IO.File]::Delete($p) } } else { if ($a -band $ro) { [IO.File]::SetAttributes($p, ($a -bxor $ro)) }; [IO.File]::Delete($p) } } catch { $n++ } }; for ($k = $dirs.Count - 1; $k -ge 0; $k--) { $d = $dirs[$k]; try { $a = [IO.File]::GetAttributes($d); if (($a -band $ro) -and -not ($a -band $rp)) { [IO.File]::SetAttributes($d, ($a -bxor $ro)) }; [IO.Directory]::Delete($d) } catch [IO.FileNotFoundException], [IO.DirectoryNotFoundException] { } catch { $left = 1; try { $left = @([IO.Directory]::GetFileSystemEntries($d)).Count } catch { }; if ($left -eq 0) { $n++ } } }; return $n }; try { Stop-Service -Name Spooler -Force -EA Stop } catch { Write-Output ('Failed to stop Print Spooler (needs administrator): ' + $_.Exception.Message); exit 1 }; Get-ChildItem -LiteralPath \"$env:WINDIR\\System32\\spool\\PRINTERS\" -Force -EA SilentlyContinue | ForEach-Object { $null = Remove-PfSafe $_.FullName }; try { Start-Service -Name Spooler -EA Stop } catch { Write-Output ('Cleared the spool queue but failed to restart Print Spooler (needs administrator) - no printers were removed: ' + $_.Exception.Message); exit 1 }; Get-Printer -EA SilentlyContinue | Remove-Printer -EA SilentlyContinue; try { $stillThere = @(Get-Printer -EA Stop) } catch { Write-Output ('Spool queue cleared, but the printer list could not be re-read to confirm the removal: ' + $_.Exception.Message); exit 1 }; if (@($stillThere).Count -gt 0) { Write-Output ('Print system reset, but ' + @($stillThere).Count + ' printer(s) could not be removed: ' + (@($stillThere).Name -join ', ')); exit 1 } else { Write-Output 'All printers removed and spool queue cleared. Every printer must be re-added/re-paired.' }"
    description_sk: "Posledná možnosť, ak je poškodený celý tlačový subsystém: odstráni VŠETKY tlačiarne (nielen nefunkčné) a vyčistí tlačovú frontu. Vyžaduje administrátora. Každú tlačiareň bude potrebné znovu nastaviť. Predtým spustite Zálohu tlačiarní, ovládačov a portov (PrintBRM), inak ich nebude z čoho obnoviť."
    description_en: "Last resort if the whole print subsystem is corrupted: removes EVERY printer (not just broken ones) and clears the queue. Needs administrator. Every printer must be set up again. Run Back up printers, drivers and ports (PrintBRM) first, otherwise there is nothing to restore them from."
