module_id: m01_diagnostics
actions:
  - id: os_info
    label_sk: "Informacie o operacnom systeme"
    label_en: "Operating system information"
    risk: SAFE
    command: "Get-CimInstance Win32_OperatingSystem | Select-Object Caption,Version,BuildNumber,InstallDate,LastBootUpTime | Format-List"
    description_sk: "Verzia, build, cas instalacie a posledny start."
    description_en: "Version, build, install date, last boot."

  - id: computer_info
    label_sk: "Informacie o pocitaci"
    label_en: "Computer information"
    risk: SAFE
    command: "Get-CimInstance Win32_ComputerSystem | Select-Object Manufacturer,Model,TotalPhysicalMemory,Domain | Format-List"
    description_sk: "Vyrobca, model, celkova RAM, domena."
    description_en: "Manufacturer, model, total RAM, domain."

  - id: bios_info
    label_sk: "Informacie o BIOSe"
    label_en: "BIOS information"
    risk: SAFE
    command: "Get-CimInstance Win32_BIOS | Format-List"
    description_sk: "Vyrobca a verzia BIOSu."
    description_en: "BIOS manufacturer and version."

  - id: cpu_info
    label_sk: "Procesor"
    label_en: "Processor"
    risk: SAFE
    command: "Get-CimInstance Win32_Processor | Select-Object Name,NumberOfCores,MaxClockSpeed | Format-List"
    description_sk: "Nazov, pocet jadier, frekvencia."
    description_en: "Name, core count, clock speed."

  - id: memory_info
    label_sk: "Pamatove moduly"
    label_en: "Memory modules"
    risk: SAFE
    command: "Get-CimInstance Win32_PhysicalMemory | Select-Object BankLabel,Capacity,Speed,Manufacturer | Format-Table"
    description_sk: "Kapacita a rychlost RAM modulov."
    description_en: "Capacity and speed of installed RAM modules."

  - id: volumes
    label_sk: "Diskove oddiely"
    label_en: "Volumes"
    risk: SAFE
    command: "Get-Volume | Select-Object DriveLetter,FileSystem,HealthStatus,SizeRemaining,Size | Format-Table"
    description_sk: "Stav a volne miesto na zvazkoch."
    description_en: "Health and free space per volume."

  - id: physical_disks
    label_sk: "Fyzicke disky"
    label_en: "Physical disks"
    risk: SAFE
    command: "Get-PhysicalDisk | Select-Object FriendlyName,MediaType,HealthStatus,OperationalStatus,Size | Format-Table"
    description_sk: "Typ media (SSD/HDD) a stav disku."
    description_en: "Media type (SSD/HDD) and disk health."

  - id: recent_hotfixes
    label_sk: "Posledne aktualizacie"
    label_en: "Recent updates"
    risk: SAFE
    command: "Get-HotFix | Sort-Object InstalledOn -Descending | Select-Object -First 20 | Format-Table"
    description_sk: "Poslednych 20 nainstalovanych aktualizacii."
    description_en: "Last 20 installed hotfixes."

  - id: defender_status
    label_sk: "Stav Windows Defenderu"
    label_en: "Windows Defender status"
    risk: SAFE
    command: "Get-MpComputerStatus | Format-List"
    description_sk: "Realtime ochrana, tamper protection, signatury."
    description_en: "Real-time protection, tamper protection, signatures."

  - id: top_cpu_processes
    label_sk: "Najvytazenejsie procesy (CPU)"
    label_en: "Top CPU-consuming processes"
    risk: SAFE
    command: "Get-Process | Sort-Object CPU -Descending | Select-Object -First 20 Name,Id,CPU,WS,Path | Format-Table"
    description_sk: "20 procesov s najvyssou spotrebou CPU."
    description_en: "20 processes with highest CPU usage."
