module_id: m01_diagnostics
category: DIAGNOSTICS
actions:
  - id: os_info
    label_sk: "Informacie o operacnom systeme"
    label_en: "Operating system information"
    risk: SAFE
    command: "$os = Get-CimInstance Win32_OperatingSystem; $os | Select-Object Caption,Version,BuildNumber,InstallDate,LastBootUpTime | Format-List; Write-Output ('Uptime: ' + ((Get-Date) - $os.LastBootUpTime))"
    description_sk: "Verzia, build, cas instalacie, posledny start a doba behu."
    description_en: "Version, build, install date, last boot, and uptime."

  - id: computer_info
    label_sk: "Informacie o pocitaci"
    label_en: "Computer information"
    risk: SAFE
    command: "Get-CimInstance Win32_ComputerSystem | Select-Object Manufacturer,Model,@{N='TotalPhysicalMemoryGB';E={[math]::Round($_.TotalPhysicalMemory/1GB,2)}},Domain | Format-List; Get-CimInstance Win32_Battery -EA SilentlyContinue | Select-Object Name,BatteryStatus,EstimatedChargeRemaining | Format-List"
    description_sk: "Vyrobca, model, celkova RAM (GB), domena a stav baterie (ak je notebook)."
    description_en: "Manufacturer, model, total RAM (GB), domain, and battery status (if a laptop)."

  - id: bios_info
    label_sk: "Informacie o BIOSe"
    label_en: "BIOS information"
    risk: SAFE
    command: "Get-CimInstance Win32_BIOS | Select-Object Manufacturer,Name,SMBIOSBIOSVersion,ReleaseDate,SerialNumber | Format-List"
    description_sk: "Vyrobca, verzia, datum vydania a seriove cislo BIOSu."
    description_en: "BIOS manufacturer, version, release date, and serial number."

  - id: cpu_info
    label_sk: "Procesor"
    label_en: "Processor"
    risk: SAFE
    command: "Get-CimInstance Win32_Processor | Select-Object Name,NumberOfCores,NumberOfLogicalProcessors,MaxClockSpeed,CurrentClockSpeed,LoadPercentage | Format-List"
    description_sk: "Nazov, pocet jadier/vlakien, frekvencia (nominalna aj aktualna) a zataz."
    description_en: "Name, core/thread count, clock speed (nominal and current), and load."

  - id: memory_info
    label_sk: "Pamatove moduly"
    label_en: "Memory modules"
    risk: SAFE
    command: "Get-CimInstance Win32_PhysicalMemory | Select-Object BankLabel,DeviceLocator,@{N='CapacityGB';E={[math]::Round($_.Capacity/1GB,2)}},Speed,ConfiguredClockSpeed,Manufacturer | Format-Table -AutoSize"
    description_sk: "Kapacita (GB) a rychlost RAM modulov."
    description_en: "Capacity (GB) and speed of installed RAM modules."

  - id: volumes
    label_sk: "Diskove oddiely"
    label_en: "Volumes"
    risk: SAFE
    command: "Get-Volume | Select-Object DriveLetter,FileSystem,HealthStatus,@{N='SizeRemainingGB';E={[math]::Round($_.SizeRemaining/1GB,2)}},@{N='SizeGB';E={[math]::Round($_.Size/1GB,2)}} | Format-Table -AutoSize"
    description_sk: "Stav a volne miesto na zvazkoch (GB)."
    description_en: "Health and free space per volume (GB)."

  - id: physical_disks
    label_sk: "Fyzicke disky"
    label_en: "Physical disks"
    risk: SAFE
    command: "Get-PhysicalDisk | Select-Object FriendlyName,MediaType,HealthStatus,OperationalStatus,@{N='SizeGB';E={[math]::Round($_.Size/1GB,2)}} | Format-Table -AutoSize"
    description_sk: "Typ media (SSD/HDD) a stav disku (GB)."
    description_en: "Media type (SSD/HDD) and disk health (GB)."

  - id: recent_hotfixes
    label_sk: "Posledne aktualizacie"
    label_en: "Recent updates"
    risk: SAFE
    command: "$session = New-Object -ComObject Microsoft.Update.Session; $searcher = $session.CreateUpdateSearcher(); $count = $searcher.GetTotalHistoryCount(); $searcher.QueryHistory(0, [Math]::Min($count, 100)) | Where-Object { $_.Title -and $_.ResultCode -eq 2 } | Sort-Object Date -Descending | Select-Object -First 20 Date,Title | Format-Table -AutoSize -Wrap"
    description_sk: "Poslednych 20 uspesne nainstalovanych aktualizacii (vratane kumulativnych, nielen legacy hotfixov)."
    description_en: "Last 20 successfully installed updates (including cumulative updates, not just legacy hotfixes)."

  - id: defender_status
    label_sk: "Stav Windows Defenderu"
    label_en: "Windows Defender status"
    risk: SAFE
    command: "try { Get-MpComputerStatus -EA Stop | Format-List } catch { Write-Output ('Windows Defender status unavailable: ' + $_.Exception.Message) }; Get-CimInstance -Namespace root\\SecurityCenter2 -ClassName AntiVirusProduct -EA SilentlyContinue | Select-Object displayName,productState | Format-Table -AutoSize"
    description_sk: "Realtime ochrana, tamper protection, signatury Defenderu a zoznam registrovanych antivirusov (aj tretich stran)."
    description_en: "Real-time protection, tamper protection, Defender signatures, and registered antivirus products (including third-party)."

  - id: top_cpu_processes
    label_sk: "Najvytazenejsie procesy (CPU cas)"
    label_en: "Top CPU-consuming processes (cumulative CPU time)"
    risk: SAFE
    command: "Get-Process | Sort-Object CPU -Descending | Select-Object -First 20 Name,Id,CPU,@{N='WorkingSetMB';E={[math]::Round($_.WS/1MB,1)}},Path | Format-Table -AutoSize -Wrap"
    description_sk: "20 procesov s najvyssim kumulativnym CPU casom od spustenia (nie okamzita zataz)."
    description_en: "20 processes with the highest cumulative CPU time since launch (not live/current load)."

  - id: pending_reboot
    label_sk: "Kontrola cakajuceho restartu"
    label_en: "Pending reboot check"
    risk: SAFE
    command: "$pending = @(); if (Test-Path 'HKLM:\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Component Based Servicing\\RebootPending') { $pending += 'Component Based Servicing' }; if (Test-Path 'HKLM:\\SOFTWARE\\Microsoft\\WindowsUpdate\\Auto Update\\RebootRequired') { $pending += 'Windows Update' }; if (Get-ItemProperty -Path 'HKLM:\\SYSTEM\\CurrentControlSet\\Control\\Session Manager' -Name PendingFileRenameOperations -EA SilentlyContinue) { $pending += 'Pending File Rename Operations' }; if ($pending.Count -gt 0) { Write-Output ('REBOOT PENDING: ' + ($pending -join ', ')) } else { Write-Output 'No reboot pending.' }"
    description_sk: "Zisti, ci system caka na restart (Windows Update, CBS, premenovanie suborov), nic nemeni."
    description_en: "Checks whether the system is waiting on a restart (Windows Update, CBS, pending file rename), changes nothing."

  - id: eventlog_critical_7d
    label_sk: "Kriticke chyby za poslednych 7 dni"
    label_en: "Critical/error events (last 7 days)"
    risk: SAFE
    command: "$events = Get-WinEvent -FilterHashtable @{LogName='System','Application'; Level=1,2; StartTime=(Get-Date).AddDays(-7)} -MaxEvents 50 -EA SilentlyContinue; if ($events) { $events | Select-Object TimeCreated,LogName,ProviderName,Id,LevelDisplayName,Message | Format-Table -AutoSize -Wrap } else { Write-Output 'No critical/error events in the last 7 days.' }"
    description_sk: "Vypise kriticke a chybove udalosti zo System a Application logov za poslednych 7 dni, nic nemeni."
    description_en: "Lists critical and error events from the System and Application logs over the last 7 days, changes nothing."

  - id: bsod_summary
    label_sk: "Prehlad padov systemu (BSOD)"
    label_en: "System crash (BSOD) summary"
    risk: SAFE
    command: "Write-Output '--- Minidump files ---'; Get-ChildItem -Path \"$env:SystemRoot\\Minidump\" -Filter *.dmp -EA SilentlyContinue | Select-Object Name,LastWriteTime,Length | Format-Table -AutoSize; Write-Output '--- Recent BugCheck/critical System events ---'; $events = Get-WinEvent -FilterHashtable @{LogName='System'; Id=1001,41} -MaxEvents 15 -EA SilentlyContinue; if ($events) { $events | Select-Object TimeCreated,Id,ProviderName,Message | Format-List } else { Write-Output 'No recent BugCheck events found.' }"
    description_sk: "Zobrazi ulozene minidump subory a nedavne udalosti BugCheck, nic nemeni."
    description_en: "Shows saved minidump files and recent BugCheck events, changes nothing."

  - id: disk_reliability_counters
    label_sk: "Spolahlivost diskov (SMART pocitadla)"
    label_en: "Disk reliability counters (SMART)"
    risk: SAFE
    command: "try { $counters = Get-PhysicalDisk | Get-StorageReliabilityCounter -EA Stop | Select-Object DeviceId,Temperature,Wear,ReadErrorsTotal,ReadErrorsUncorrected,WriteErrorsTotal,WriteErrorsUncorrected,PowerOnHours; if ($counters) { $counters | Format-Table -AutoSize } else { Write-Output 'No reliability counters available for the physical disks on this system.' } } catch { Write-Output 'Storage reliability counters not supported on this system.' }"
    description_sk: "Zobrazi teplotu, opotrebovanie a chybove pocitadla fyzickych diskov, ak su podporovane. Nic nemeni."
    description_en: "Shows temperature, wear, and error counters for physical disks, if supported. Changes nothing."

  - id: boot_time_breakdown
    label_sk: "Rozklad casu spustania (posledne starty)"
    label_en: "Startup time breakdown (recent boots)"
    risk: SAFE
    command: "$events = Get-WinEvent -FilterHashtable @{LogName='Microsoft-Windows-Diagnostics-Performance/Operational'; Id=100} -MaxEvents 5 -EA SilentlyContinue; if ($events) { foreach ($e in $events) { $xml = [xml]$e.ToXml(); $bootMs = ($xml.Event.EventData.Data | Where-Object { $_.Name -eq 'BootTime' }).'#text'; Write-Output ($e.TimeCreated.ToString('yyyy-MM-dd HH:mm:ss') + ' - total boot time: ' + [math]::Round([double]$bootMs/1000,1) + 's') } } else { Write-Output 'No boot performance events found (log empty, disabled, or needs administrator to read).' }"
    description_sk: "Zobrazi celkovy cas spustania z poslednych 5 startov (Windows uz tuto udalost sam zaznamenava, ID 100 v logu Diagnostics-Performance). Nic nemeni."
    description_en: "Shows total boot duration from the last 5 startups (Windows already records this itself, event ID 100 in the Diagnostics-Performance log). Changes nothing."

  - id: battery_health_report
    label_sk: "Zdravie baterie (design vs. realna kapacita)"
    label_en: "Battery health report (design vs. actual capacity)"
    risk: SAFE
    command: "$me = \"$env:USERDOMAIN\\$env:USERNAME\"; $root = \"$env:ProgramData\\PortableFix\"; New-Item -ItemType Directory -Force -Path $root | Out-Null; icacls $root /inheritance:r /grant:r \"*S-1-5-32-544:(OI)(CI)F\" /grant:r \"*S-1-5-18:(OI)(CI)F\" /grant:r \"${me}:(OI)(CI)F\" | Out-Null; $dest = \"$root\\BatteryReport_$(Get-Date -Format 'yyyyMMdd_HHmmss')\"; New-Item -ItemType Directory -Force -Path $dest | Out-Null; icacls $dest /inheritance:r /grant:r \"*S-1-5-32-544:(OI)(CI)F\" /grant:r \"*S-1-5-18:(OI)(CI)F\" /grant:r \"${me}:(OI)(CI)F\" | Out-Null; $reportPath = \"$dest\\BatteryReport.html\"; $out = & powercfg /batteryreport /output $reportPath /duration 14 2>&1; if (Test-Path $reportPath) { Write-Output ('Battery health report saved to: ' + $reportPath); Write-Output 'Open it in a browser to see design capacity vs full charge capacity and drain history.' } else { Write-Output ('Could not generate battery report: ' + ($out -join ' ')); exit 1 }"
    description_sk: "Vygeneruje Windows report o zdravi baterie (powercfg /batteryreport) - design kapacita vs. realna plna kapacita a historia vybijania za 14 dni - do priecinka pristupneho len aktualnemu poucivatelovi, SYSTEM a administratorom. Na pocitacoch bez baterie hlasi prazdny report. Nic nemeni, len ulozi HTML subor."
    description_en: "Generates the built-in Windows battery health report (powercfg /batteryreport) - design capacity vs. actual full charge capacity and 14-day drain history - into a folder only the current user, SYSTEM, and administrators can read. On desktops without a battery the report comes back empty. Changes nothing, only saves an HTML file."

  - id: eventlog_full_export
    label_sk: "Plny export event logov (.evtx)"
    label_en: "Full event log export (.evtx)"
    risk: SAFE
    command: "$me = \"$env:USERDOMAIN\\$env:USERNAME\"; $root = \"$env:ProgramData\\PortableFix\"; New-Item -ItemType Directory -Force -Path $root | Out-Null; icacls $root /inheritance:r /grant:r \"*S-1-5-32-544:(OI)(CI)F\" /grant:r \"*S-1-5-18:(OI)(CI)F\" /grant:r \"${me}:(OI)(CI)F\" | Out-Null; $dest = \"$root\\EventLogExport_$(Get-Date -Format 'yyyyMMdd_HHmmss')\"; New-Item -ItemType Directory -Force -Path $dest | Out-Null; icacls $dest /inheritance:r /grant:r \"*S-1-5-32-544:(OI)(CI)F\" /grant:r \"*S-1-5-18:(OI)(CI)F\" /grant:r \"${me}:(OI)(CI)F\" | Out-Null; $logs = 'System','Application','Security'; $exported = 0; foreach ($log in $logs) { & wevtutil epl $log \"$dest\\$log.evtx\" 2>$null | Out-Null; if ($LASTEXITCODE -eq 0) { $exported++ } }; Write-Output (\"Exported $exported/$($logs.Count) event log(s) to: $dest (Security needs administrator)\"); if ($exported -eq 0) { exit 1 } else { exit 0 }"
    description_sk: "Exportuje cele System/Application/Security logy do .evtx suborov (do priecinka pristupneho len aktualnemu pouzivatelovi, SYSTEM a administratorom) na neskorsiu analyzu v Event Vieweri inde (nie len poslednych 50 udalosti ako ine akcie). Security log vyzaduje administratora. Nic nemeni, len uklada subory."
    description_en: "Exports the full System/Application/Security logs to .evtx files (into a folder only the current user, SYSTEM, and administrators can read) for later analysis in Event Viewer elsewhere (not just the last 50 events like other actions). The Security log needs administrator. Changes nothing, only saves files."

  - id: installed_software
    label_sk: "Nainstalovany softver"
    label_en: "Installed software"
    risk: SAFE
    command: "$apps = Get-ItemProperty 'HKLM:\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Uninstall\\*','HKLM:\\SOFTWARE\\WOW6432Node\\Microsoft\\Windows\\CurrentVersion\\Uninstall\\*','HKCU:\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Uninstall\\*' -EA SilentlyContinue | Where-Object DisplayName | Select-Object DisplayName,DisplayVersion,Publisher,InstallDate | Sort-Object DisplayName; if ($apps) { $apps | Format-Table -AutoSize } else { Write-Output 'No installed software found in the registry uninstall keys.' }"
    description_sk: "Vypise nainstalovane programy zo systemoveho registra, nic nemeni."
    description_en: "Lists installed programs from the system registry, changes nothing."
