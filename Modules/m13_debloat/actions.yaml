module_id: m13_debloat
category: CLEANUP
actions:
  - id: debloat_list_installed
    label_sk: "Zoznam nainstalovanych AppX balikov"
    label_en: "List installed AppX packages"
    risk: SAFE
    command: "Get-AppxPackage | Where-Object { -not $_.IsFramework } | Sort-Object Name | Select-Object Name,Version | Format-Table -AutoSize"
    description_sk: "Vypise nainstalovane aplikacie z Microsoft Store formatu (AppX), nic nemeni."
    description_en: "Lists installed Store-format (AppX) applications, changes nothing."
  - id: debloat_remove_promo_apps
    label_sk: "Odstranenie predinstalovaneho balastu"
    label_en: "Remove preinstalled bloatware"
    risk: MODERATE
    command: "$apps = @('Microsoft.549981C3F5F10','Microsoft.BingNews','Microsoft.BingSearch','Microsoft.BingWeather','Microsoft.GetHelp','Microsoft.Getstarted','Microsoft.Microsoft3DViewer','Microsoft.MicrosoftOfficeHub','Microsoft.MicrosoftSolitaireCollection','Microsoft.MixedReality.Portal','Microsoft.People','Microsoft.PowerAutomateDesktop','Microsoft.SkypeApp','Microsoft.Todos','Microsoft.WindowsAlarms','Microsoft.WindowsFeedbackHub','Microsoft.WindowsMaps','Microsoft.YourPhone','Microsoft.ZuneMusic','Microsoft.ZuneVideo','Microsoft.XboxApp','Microsoft.GamingApp','Microsoft.XboxGameOverlay','Microsoft.XboxGamingOverlay','Microsoft.XboxSpeechToTextOverlay','Microsoft.Xbox.TCUI','MicrosoftTeams','MSTeams','Microsoft.OutlookForWindows','Clipchamp.Clipchamp','Microsoft.windowscommunicationsapps','king.com*','*CandyCrush*','*Spotify*','*TikTok*','*Facebook*','*Instagram*','*Twitter*','*Netflix*','*Disney*','Microsoft.BingFinance','Microsoft.BingFoodAndDrink','Microsoft.BingHealthAndFitness','Microsoft.BingSports','Microsoft.BingTranslator','Microsoft.BingTravel','Microsoft.Messaging','Microsoft.MicrosoftStickyNotes','Microsoft.NetworkSpeedTest','Microsoft.Print3D','Microsoft.OneConnect','Microsoft.WindowsSoundRecorder','Microsoft.MicrosoftFamily','Microsoft.Windows.DevHome'); $removed = 0; foreach ($a in $apps) { $pkgs = Get-AppxPackage -Name $a -EA SilentlyContinue; foreach ($p in $pkgs) { $p | Remove-AppxPackage -EA SilentlyContinue -ErrorVariable +errs; $removed++ } }; Write-Output (\"Removed packages: \" + $removed + \", errors: \" + $errs.Count)"
    description_sk: "Odstrani agresivny zoznam predinstalovanych aplikacii (Bing, Xbox, Teams, Solitaire, promo hry, socialne siete...) pre aktualneho pouzivatela. Da sa preinstalovat z Microsoft Store. Nedotyka sa Edge, OneDrive, Defenderu ani Store. Xbox Identity Provider ma samostatnu akciu (moze zablokovat prihlasenie do Minecraft/Game Pass)."
    description_en: "Removes an aggressive list of preinstalled apps (Bing, Xbox, Teams, Solitaire, promo games, social apps...) for the current user. Reinstallable from Microsoft Store. Does not touch Edge, OneDrive, Defender or the Store. Xbox Identity Provider has its own separate action (can break Minecraft/Game Pass sign-in)."
  - id: debloat_remove_provisioned
    label_sk: "Odstranenie balastu z provisioningu"
    label_en: "Remove bloatware from provisioning"
    risk: DESTRUCTIVE
    command: "$apps = @('Microsoft.549981C3F5F10','Microsoft.BingNews','Microsoft.BingSearch','Microsoft.BingWeather','Microsoft.GetHelp','Microsoft.Getstarted','Microsoft.Microsoft3DViewer','Microsoft.MicrosoftOfficeHub','Microsoft.MicrosoftSolitaireCollection','Microsoft.MixedReality.Portal','Microsoft.People','Microsoft.PowerAutomateDesktop','Microsoft.SkypeApp','Microsoft.Todos','Microsoft.WindowsAlarms','Microsoft.WindowsFeedbackHub','Microsoft.WindowsMaps','Microsoft.YourPhone','Microsoft.ZuneMusic','Microsoft.ZuneVideo','Microsoft.XboxApp','Microsoft.GamingApp','Microsoft.XboxGameOverlay','Microsoft.XboxGamingOverlay','Microsoft.XboxSpeechToTextOverlay','Microsoft.Xbox.TCUI','MicrosoftTeams','MSTeams','Microsoft.OutlookForWindows','Clipchamp.Clipchamp','Microsoft.windowscommunicationsapps','king.com*','*CandyCrush*','*Spotify*','*TikTok*','*Facebook*','*Instagram*','*Twitter*','*Netflix*','*Disney*','Microsoft.BingFinance','Microsoft.BingFoodAndDrink','Microsoft.BingHealthAndFitness','Microsoft.BingSports','Microsoft.BingTranslator','Microsoft.BingTravel','Microsoft.Messaging','Microsoft.MicrosoftStickyNotes','Microsoft.NetworkSpeedTest','Microsoft.Print3D','Microsoft.OneConnect','Microsoft.WindowsSoundRecorder','Microsoft.MicrosoftFamily','Microsoft.Windows.DevHome'); $removed = 0; $prov = Get-AppxProvisionedPackage -Online; foreach ($a in $apps) { foreach ($p in ($prov | Where-Object { $_.DisplayName -like $a })) { $p | Remove-AppxProvisionedPackage -Online -EA SilentlyContinue -ErrorVariable +errs | Out-Null; $removed++ } }; Write-Output (\"Removed provisioned packages: \" + $removed + \", errors: \" + $errs.Count)"
    description_sk: "Odstrani rovnaky zoznam aj z provisioningu - aplikacie sa uz nenainstaluju ziadnemu novemu pouzivatelovi. Tazko vratne (vyzaduje reinstalaciu balikov). Xbox Identity Provider ma samostatnu akciu."
    description_en: "Removes the same list from provisioning - the apps will no longer install for any new user. Hard to reverse (requires package reinstallation). Xbox Identity Provider has its own separate action."
  - id: debloat_disable_telemetry
    label_sk: "Obmedzenie telemetrie"
    label_en: "Reduce telemetry"
    risk: MODERATE
    command: "New-Item -Path 'HKLM:\\SOFTWARE\\Policies\\Microsoft\\Windows\\DataCollection' -Force | Out-Null; Set-ItemProperty -Path 'HKLM:\\SOFTWARE\\Policies\\Microsoft\\Windows\\DataCollection' -Name AllowTelemetry -Value 0 -Type DWord; Write-Output 'Telemetry policy set to 0 (Security/minimum).'"
    undo_command: "Remove-ItemProperty -Path 'HKLM:\\SOFTWARE\\Policies\\Microsoft\\Windows\\DataCollection' -Name AllowTelemetry -EA SilentlyContinue"
    description_sk: "Nastavi politiku telemetrie na najnizsiu moznu hodnotu (0). Windows Home/Pro tuto hodnotu automaticky obmedzi na 1 (Basic) - plne 0 funguje len na Enterprise/Education/IoT. Undo politiku odstrani a vrati predvoleny stav."
    description_en: "Sets the telemetry policy to the lowest available value (0). Windows Home/Pro silently clamps this to 1 (Basic) - full 0 only takes effect on Enterprise/Education/IoT. Undo removes the policy, restoring the default."
  - id: debloat_disable_suggestions
    label_sk: "Vypnutie navrhov a reklam v Starte"
    label_en: "Disable Start suggestions and ads"
    risk: MODERATE
    command: "$cdm = 'HKCU:\\Software\\Microsoft\\Windows\\CurrentVersion\\ContentDeliveryManager'; $names = 'SilentInstalledAppsEnabled','SystemPaneSuggestionsEnabled','SubscribedContent-338388Enabled','SubscribedContent-338389Enabled','SubscribedContent-310093Enabled','Start_IrisRecommendations','SoftLandingEnabled','ScoobeSystemSettingEnabled'; $bk = \"$env:ProgramData\\PortableFix\\start_suggestions_backup.json\"; New-Item -ItemType Directory -Force -Path (Split-Path $bk) | Out-Null; if (-not (Test-Path $bk)) { $orig = @{}; foreach ($n in $names) { $orig[$n] = (Get-ItemProperty -Path $cdm -Name $n -EA SilentlyContinue).$n }; $orig | ConvertTo-Json | Set-Content -Path $bk -Encoding UTF8 }; foreach ($n in $names) { Set-ItemProperty -Path $cdm -Name $n -Value 0 -Type DWord -EA SilentlyContinue }; Write-Output 'Start suggestions and promo content disabled.'"
    undo_command: "$cdm = 'HKCU:\\Software\\Microsoft\\Windows\\CurrentVersion\\ContentDeliveryManager'; $bk = \"$env:ProgramData\\PortableFix\\start_suggestions_backup.json\"; if (Test-Path $bk) { $b = Get-Content $bk -Raw | ConvertFrom-Json; foreach ($p in $b.PSObject.Properties) { if ($null -eq $p.Value) { Remove-ItemProperty -Path $cdm -Name $p.Name -EA SilentlyContinue } else { Set-ItemProperty -Path $cdm -Name $p.Name -Value $p.Value -Type DWord -EA SilentlyContinue } }; Write-Output 'Start suggestions settings restored from backup.' } else { Write-Output 'No backup found - nothing to restore.' }"
    description_sk: "Vypne tiche instalovanie navrhovanych aplikacii a reklamny obsah v Start menu, po zalohe povodnych hodnot (len pri prvom behu). Undo funguje spolahlivo len ak sa medzitym nespustila tato akcia druhy krat (zaloha je len jedna, z prveho behu)."
    description_en: "Disables silent installs of suggested apps and promo content in the Start menu, after backing up the original values (only on first run). Undo only works reliably if this action hasn't run a second time since (there's only one backup, from the first run)."
  - id: debloat_remove_onedrive
    label_sk: "Odinstalovanie OneDrive"
    label_en: "Uninstall OneDrive"
    risk: MODERATE
    command: "Stop-Process -Name OneDrive -Force -EA SilentlyContinue; $setup = @(\"$env:SystemRoot\\System32\\OneDriveSetup.exe\",\"$env:SystemRoot\\SysWOW64\\OneDriveSetup.exe\") | Where-Object { Test-Path $_ } | Select-Object -First 1; if ($setup) { Start-Process $setup -ArgumentList '/uninstall' -Wait; Write-Output 'OneDrive uninstaller finished.' } else { Write-Output 'OneDriveSetup.exe not found - possibly already removed.' }"
    description_sk: "Odinstaluje klienta OneDrive. Subory v priecinku OneDrive zostavaju na disku. Da sa preinstalovat z microsoft.com alebo Store."
    description_en: "Uninstalls the OneDrive client. Files in the OneDrive folder remain on disk. Reinstallable from microsoft.com or the Store."
  - id: debloat_disable_web_search
    label_sk: "Vypnutie webovych vysledkov v Starte"
    label_en: "Disable web results in Start search"
    risk: MODERATE
    command: "$bk = \"$env:ProgramData\\PortableFix\\web_search_backup.json\"; New-Item -ItemType Directory -Force -Path (Split-Path $bk) | Out-Null; if (-not (Test-Path $bk)) { [PSCustomObject]@{ DisableSearchBoxSuggestions = (Get-ItemProperty -Path 'HKLM:\\SOFTWARE\\Policies\\Microsoft\\Windows\\Explorer' -Name DisableSearchBoxSuggestions -EA SilentlyContinue).DisableSearchBoxSuggestions; BingSearchEnabled = (Get-ItemProperty -Path 'HKCU:\\Software\\Microsoft\\Windows\\CurrentVersion\\Search' -Name BingSearchEnabled -EA SilentlyContinue).BingSearchEnabled } | ConvertTo-Json | Set-Content -Path $bk -Encoding UTF8 }; New-Item -Path 'HKLM:\\SOFTWARE\\Policies\\Microsoft\\Windows\\Explorer' -Force | Out-Null; Set-ItemProperty -Path 'HKLM:\\SOFTWARE\\Policies\\Microsoft\\Windows\\Explorer' -Name DisableSearchBoxSuggestions -Value 1 -Type DWord; if (-not (Test-Path 'HKCU:\\Software\\Microsoft\\Windows\\CurrentVersion\\Search')) { New-Item -Path 'HKCU:\\Software\\Microsoft\\Windows\\CurrentVersion\\Search' -Force | Out-Null }; Set-ItemProperty -Path 'HKCU:\\Software\\Microsoft\\Windows\\CurrentVersion\\Search' -Name BingSearchEnabled -Value 0 -Type DWord; Write-Output 'Web results in Start search disabled (policy + per-user setting; takes effect after sign-out or Explorer restart).'"
    undo_command: "$bk = \"$env:ProgramData\\PortableFix\\web_search_backup.json\"; if (Test-Path $bk) { $b = Get-Content $bk -Raw | ConvertFrom-Json; if ($null -eq $b.DisableSearchBoxSuggestions) { Remove-ItemProperty -Path 'HKLM:\\SOFTWARE\\Policies\\Microsoft\\Windows\\Explorer' -Name DisableSearchBoxSuggestions -EA SilentlyContinue } else { Set-ItemProperty -Path 'HKLM:\\SOFTWARE\\Policies\\Microsoft\\Windows\\Explorer' -Name DisableSearchBoxSuggestions -Value $b.DisableSearchBoxSuggestions -Type DWord -EA SilentlyContinue }; if ($null -eq $b.BingSearchEnabled) { Remove-ItemProperty -Path 'HKCU:\\Software\\Microsoft\\Windows\\CurrentVersion\\Search' -Name BingSearchEnabled -EA SilentlyContinue } else { Set-ItemProperty -Path 'HKCU:\\Software\\Microsoft\\Windows\\CurrentVersion\\Search' -Name BingSearchEnabled -Value $b.BingSearchEnabled -Type DWord -EA SilentlyContinue }; Write-Output 'Web search settings restored from backup.' } else { Write-Output 'No backup found - nothing to restore.' }"
    description_sk: "Vyhladavanie v Starte prestane posielat dotazy na Bing a zobrazovat webove vysledky (masinova politika + pouzivatelske nastavenie), po zalohe povodnych hodnot (len pri prvom behu). Undo funguje spolahlivo len ak sa medzitym nespustila tato akcia druhy krat (zaloha je len jedna, z prveho behu)."
    description_en: "Start search stops sending queries to Bing and showing web results (machine policy + per-user setting), after backing up the original values (only on first run). Undo only works reliably if this action hasn't run a second time since (there's only one backup, from the first run)."
  - id: debloat_disable_copilot
    label_sk: "Vypnutie Copilota"
    label_en: "Disable Copilot"
    risk: MODERATE
    command: "New-Item -Path 'HKCU:\\Software\\Policies\\Microsoft\\Windows\\WindowsCopilot' -Force | Out-Null; Set-ItemProperty -Path 'HKCU:\\Software\\Policies\\Microsoft\\Windows\\WindowsCopilot' -Name TurnOffWindowsCopilot -Value 1 -Type DWord; Write-Output 'Windows Copilot disabled by policy.'"
    undo_command: "Remove-ItemProperty -Path 'HKCU:\\Software\\Policies\\Microsoft\\Windows\\WindowsCopilot' -Name TurnOffWindowsCopilot -EA SilentlyContinue"
    description_sk: "Vypne Windows Copilot politikou pre aktualneho pouzivatela. Undo politiku odstrani."
    description_en: "Disables Windows Copilot by policy for the current user. Undo removes the policy."
  - id: debloat_disable_widgets
    label_sk: "Vypnutie Widgetov"
    label_en: "Disable Widgets"
    risk: MODERATE
    command: "New-Item -Path 'HKLM:\\SOFTWARE\\Policies\\Microsoft\\Dsh' -Force | Out-Null; Set-ItemProperty -Path 'HKLM:\\SOFTWARE\\Policies\\Microsoft\\Dsh' -Name AllowNewsAndInterests -Value 0 -Type DWord; Write-Output 'Widgets disabled by policy (takes effect after restart).'"
    undo_command: "Remove-ItemProperty -Path 'HKLM:\\SOFTWARE\\Policies\\Microsoft\\Dsh' -Name AllowNewsAndInterests -EA SilentlyContinue"
    description_sk: "Vypne panel Widgetov (spravy a zaujmy) politikou. Prejavi sa po restarte. Undo politiku odstrani."
    description_en: "Disables the Widgets board (news and interests) by policy. Takes effect after restart. Undo removes the policy."
  - id: debloat_disable_advertising_id
    label_sk: "Vypnutie reklamneho ID"
    label_en: "Disable advertising ID"
    risk: MODERATE
    command: "$k = 'HKCU:\\Software\\Microsoft\\Windows\\CurrentVersion\\AdvertisingInfo'; $bk = \"$env:ProgramData\\PortableFix\\advertising_id_backup.json\"; New-Item -ItemType Directory -Force -Path (Split-Path $bk) | Out-Null; if (-not (Test-Path $bk)) { [PSCustomObject]@{ Enabled = (Get-ItemProperty -Path $k -Name Enabled -EA SilentlyContinue).Enabled } | ConvertTo-Json | Set-Content -Path $bk -Encoding UTF8 }; New-Item -Path $k -Force | Out-Null; Set-ItemProperty -Path $k -Name Enabled -Value 0 -Type DWord; Write-Output 'Advertising ID disabled.'"
    undo_command: "$k = 'HKCU:\\Software\\Microsoft\\Windows\\CurrentVersion\\AdvertisingInfo'; $bk = \"$env:ProgramData\\PortableFix\\advertising_id_backup.json\"; if (Test-Path $bk) { $b = Get-Content $bk -Raw | ConvertFrom-Json; if ($null -eq $b.Enabled) { Remove-ItemProperty -Path $k -Name Enabled -EA SilentlyContinue } else { Set-ItemProperty -Path $k -Name Enabled -Value $b.Enabled -Type DWord -EA SilentlyContinue }; Write-Output 'Advertising ID setting restored from backup.' } else { Write-Output 'No backup found - nothing to restore.' }"
    description_sk: "Vypne personalizovane reklamy cez reklamne ID pouzivatela, po zalohe povodnej hodnoty (len pri prvom behu). Undo funguje spolahlivo len ak sa medzitym nespustila tato akcia druhy krat (zaloha je len jedna, z prveho behu)."
    description_en: "Disables personalized ads via the user's advertising ID, after backing up the original value (only on first run). Undo only works reliably if this action hasn't run a second time since (there's only one backup, from the first run)."
  - id: debloat_remove_xbox_identity
    label_sk: "Odstranenie Xbox Identity Provider"
    label_en: "Remove Xbox Identity Provider"
    risk: MODERATE
    command: "$pkgs = Get-AppxPackage -Name 'Microsoft.XboxIdentityProvider' -EA SilentlyContinue; $removed = 0; foreach ($p in $pkgs) { $p | Remove-AppxPackage -EA SilentlyContinue -ErrorVariable +errs; $removed++ }; Write-Output (\"Removed packages: \" + $removed + \", errors: \" + $errs.Count)"
    description_sk: "Samostatne odstrani Xbox Identity Provider pre aktualneho pouzivatela. POZOR: tento balik pouziva prihlasovanie do hier ako Minecraft a Xbox Game Pass - jeho odstranenie moze zablokovat prihlasenie do tychto hier. Odstranovat len ak pouzivatel nehra hry vyzadujuce Xbox ucet."
    description_en: "Separately removes the Xbox Identity Provider for the current user. WARNING: this package is used for sign-in by games such as Minecraft and Xbox Game Pass - removing it can break sign-in for those games. Only remove it if the user doesn't play games requiring an Xbox account."

  - id: debloat_disable_diagtrack
    label_sk: "Vypnutie telemetrickych sluzieb (DiagTrack)"
    label_en: "Disable telemetry services (DiagTrack)"
    risk: MODERATE
    command: "$bk = \"$env:ProgramData\\PortableFix\\diagtrack_backup.json\"; New-Item -ItemType Directory -Force -Path (Split-Path $bk) | Out-Null; if (-not (Test-Path $bk)) { [PSCustomObject]@{ DiagTrack = (Get-Service -Name 'DiagTrack' -EA SilentlyContinue).StartType.ToString(); dmwappushservice = (Get-Service -Name 'dmwappushservice' -EA SilentlyContinue).StartType.ToString() } | ConvertTo-Json | Set-Content -Path $bk -Encoding UTF8 }; Stop-Service -Name 'DiagTrack' -Force -EA SilentlyContinue; Set-Service -Name 'DiagTrack' -StartupType Disabled -EA SilentlyContinue; Stop-Service -Name 'dmwappushservice' -Force -EA SilentlyContinue; Set-Service -Name 'dmwappushservice' -StartupType Disabled -EA SilentlyContinue; $diag = (Get-Service -Name 'DiagTrack').StartType; $dmwap = (Get-Service -Name 'dmwappushservice').StartType; Write-Output ('DiagTrack startup type: ' + $diag + '; dmwappushservice startup type: ' + $dmwap)"
    undo_command: "$bk = \"$env:ProgramData\\PortableFix\\diagtrack_backup.json\"; if (Test-Path $bk) { $b = Get-Content $bk -Raw | ConvertFrom-Json; Set-Service -Name 'DiagTrack' -StartupType $b.DiagTrack -EA SilentlyContinue; if ($b.DiagTrack -match 'Automatic') { Start-Service -Name 'DiagTrack' -EA SilentlyContinue }; Set-Service -Name 'dmwappushservice' -StartupType $b.dmwappushservice -EA SilentlyContinue; if ($b.dmwappushservice -match 'Automatic') { Start-Service -Name 'dmwappushservice' -EA SilentlyContinue }; Write-Output 'DiagTrack/dmwappushservice restored from backup.' } else { Write-Output 'No backup found - nothing to restore.' }"
    description_sk: "Zastavi a vypne sluzby Connected User Experiences and Telemetry (DiagTrack) a dmwappushservice, po zalohe ich povodneho typu spustania (len pri prvom behu). Undo funguje spolahlivo len ak sa medzitym nespustila tato akcia druhy krat (zaloha je len jedna, z prveho behu)."
    description_en: "Stops and disables the Connected User Experiences and Telemetry (DiagTrack) and dmwappushservice services, after backing up their original startup type (only on first run). Undo only works reliably if this action hasn't run a second time since (there's only one backup, from the first run)."

  - id: debloat_disable_ceip_tasks
    label_sk: "Vypnutie ulohy CEIP a Compatibility Appraiser"
    label_en: "Disable CEIP and Compatibility Appraiser tasks"
    risk: MODERATE
    command: "$taskNames = @('Microsoft Compatibility Appraiser','Microsoft Compatibility Appraiser Exp','ProgramDataUpdater','Consolidator','UsbCeip','DmClient','DmClientOnScenarioDownload'); $bk = \"$env:ProgramData\\PortableFix\\ceip_tasks_backup.json\"; New-Item -ItemType Directory -Force -Path (Split-Path $bk) | Out-Null; if (-not (Test-Path $bk)) { $orig = @{}; foreach ($n in $taskNames) { $t = Get-ScheduledTask -TaskName $n -EA SilentlyContinue; if ($t) { $orig[$n] = $t.State.ToString() } }; $orig | ConvertTo-Json | Set-Content -Path $bk -Encoding UTF8 }; $found = 0; $disabled = 0; foreach ($n in $taskNames) { $t = Get-ScheduledTask -TaskName $n -EA SilentlyContinue; if ($t) { $found++; Disable-ScheduledTask -TaskName $n -TaskPath $t.TaskPath -EA SilentlyContinue | Out-Null; $after = Get-ScheduledTask -TaskName $n -TaskPath $t.TaskPath -EA SilentlyContinue; if ($after.State -eq 'Disabled') { $disabled++ } } }; Write-Output ('Found ' + $found + ' task(s), disabled ' + $disabled + '.')"
    undo_command: "$bk = \"$env:ProgramData\\PortableFix\\ceip_tasks_backup.json\"; if (Test-Path $bk) { $b = Get-Content $bk -Raw | ConvertFrom-Json; $restored = 0; foreach ($p in $b.PSObject.Properties) { if ($p.Value -ne 'Disabled') { $t = Get-ScheduledTask -TaskName $p.Name -EA SilentlyContinue; if ($t) { Enable-ScheduledTask -TaskName $p.Name -TaskPath $t.TaskPath -EA SilentlyContinue | Out-Null; $restored++ } } }; Write-Output ('Restored ' + $restored + ' task(s) to their original enabled state.') } else { Write-Output 'No backup found - nothing to restore.' }"
    description_sk: "Vypne naplanovane ulohy zbierajuce udaje o kompatibilite a pouzivani (Compatibility Appraiser, CEIP, Diagnostic Data Viewer), po zalohe ich povodneho stavu (len pri prvom behu). Undo funguje spolahlivo len ak sa medzitym nespustila tato akcia druhy krat (zaloha je len jedna, z prveho behu)."
    description_en: "Disables scheduled tasks that collect compatibility and usage data (Compatibility Appraiser, CEIP, Diagnostic Data Viewer), after backing up their original state (only on first run). Undo only works reliably if this action hasn't run a second time since (there's only one backup, from the first run)."

  - id: debloat_disable_fast_startup
    label_sk: "Vypnutie rychleho spustania (Fast Startup)"
    label_en: "Disable Fast Startup"
    risk: MODERATE
    command: "New-ItemProperty -Path 'HKLM:\\SYSTEM\\CurrentControlSet\\Control\\Session Manager\\Power' -Name HiberbootEnabled -Value 0 -PropertyType DWord -Force -EA SilentlyContinue | Out-Null; $v = (Get-ItemProperty -Path 'HKLM:\\SYSTEM\\CurrentControlSet\\Control\\Session Manager\\Power' -Name HiberbootEnabled -EA SilentlyContinue).HiberbootEnabled; Write-Output ('HiberbootEnabled: ' + $v + ' (0=Fast Startup off)')"
    undo_command: "New-ItemProperty -Path 'HKLM:\\SYSTEM\\CurrentControlSet\\Control\\Session Manager\\Power' -Name HiberbootEnabled -Value 1 -PropertyType DWord -Force -EA SilentlyContinue | Out-Null; $v = (Get-ItemProperty -Path 'HKLM:\\SYSTEM\\CurrentControlSet\\Control\\Session Manager\\Power' -Name HiberbootEnabled -EA SilentlyContinue).HiberbootEnabled; Write-Output ('HiberbootEnabled: ' + $v + ' (1=Fast Startup on)')"
    description_sk: "Vypne Rychle spustanie (hybridny hibernacny start), casty zdroj problemov s ovladacmi a dual-bootom. Hibernaciu a spanok nemeni."
    description_en: "Disables Fast Startup (hybrid hiberboot), a common source of driver and dual-boot issues. Does not change hibernation or sleep."

  - id: debloat_disable_explorer_ads
    label_sk: "Vypnutie reklam v Prieskumnikovi a Starte"
    label_en: "Disable Explorer and Start ads"
    risk: MODERATE
    command: "$bk = \"$env:ProgramData\\PortableFix\\explorer_ads_backup.json\"; New-Item -ItemType Directory -Force -Path (Split-Path $bk) | Out-Null; if (-not (Test-Path $bk)) { [PSCustomObject]@{ HideRecommendedSection = (Get-ItemProperty -Path 'HKLM:\\SOFTWARE\\Policies\\Microsoft\\Windows\\Explorer' -Name HideRecommendedSection -EA SilentlyContinue).HideRecommendedSection; ShowSyncProviderNotifications = (Get-ItemProperty -Path 'HKCU:\\Software\\Microsoft\\Windows\\CurrentVersion\\Explorer\\Advanced' -Name ShowSyncProviderNotifications -EA SilentlyContinue).ShowSyncProviderNotifications } | ConvertTo-Json | Set-Content -Path $bk -Encoding UTF8 }; New-Item -Path 'HKLM:\\SOFTWARE\\Policies\\Microsoft\\Windows\\Explorer' -Force -EA SilentlyContinue | Out-Null; Set-ItemProperty -Path 'HKLM:\\SOFTWARE\\Policies\\Microsoft\\Windows\\Explorer' -Name HideRecommendedSection -Value 1 -Type DWord -EA SilentlyContinue; Set-ItemProperty -Path 'HKCU:\\Software\\Microsoft\\Windows\\CurrentVersion\\Explorer\\Advanced' -Name ShowSyncProviderNotifications -Value 0 -Type DWord; $hklmVal = (Get-ItemProperty -Path 'HKLM:\\SOFTWARE\\Policies\\Microsoft\\Windows\\Explorer' -Name HideRecommendedSection -EA SilentlyContinue).HideRecommendedSection; $hkcuVal = (Get-ItemProperty -Path 'HKCU:\\Software\\Microsoft\\Windows\\CurrentVersion\\Explorer\\Advanced' -Name ShowSyncProviderNotifications -EA SilentlyContinue).ShowSyncProviderNotifications; Write-Output ('HideRecommendedSection: ' + $hklmVal + '; ShowSyncProviderNotifications: ' + $hkcuVal)"
    undo_command: "$bk = \"$env:ProgramData\\PortableFix\\explorer_ads_backup.json\"; if (Test-Path $bk) { $b = Get-Content $bk -Raw | ConvertFrom-Json; if ($null -eq $b.HideRecommendedSection) { Remove-ItemProperty -Path 'HKLM:\\SOFTWARE\\Policies\\Microsoft\\Windows\\Explorer' -Name HideRecommendedSection -EA SilentlyContinue } else { Set-ItemProperty -Path 'HKLM:\\SOFTWARE\\Policies\\Microsoft\\Windows\\Explorer' -Name HideRecommendedSection -Value $b.HideRecommendedSection -Type DWord -EA SilentlyContinue }; if ($null -eq $b.ShowSyncProviderNotifications) { Remove-ItemProperty -Path 'HKCU:\\Software\\Microsoft\\Windows\\CurrentVersion\\Explorer\\Advanced' -Name ShowSyncProviderNotifications -EA SilentlyContinue } else { Set-ItemProperty -Path 'HKCU:\\Software\\Microsoft\\Windows\\CurrentVersion\\Explorer\\Advanced' -Name ShowSyncProviderNotifications -Value $b.ShowSyncProviderNotifications -Type DWord -EA SilentlyContinue }; Write-Output 'Explorer/Start ad settings restored from backup.' } else { Write-Output 'No backup found - nothing to restore.' }"
    description_sk: "Skryje sekciu Odporucane v Start menu (Win11) a vypne reklamne oznamenia o synchronizacii v Prieskumnikovi, po zalohe povodnych hodnot (len pri prvom behu). Undo funguje spolahlivo len ak sa medzitym nespustila tato akcia druhy krat (zaloha je len jedna, z prveho behu)."
    description_en: "Hides the Start menu Recommended section (Win11) and disables Explorer sync-provider ad notifications, after backing up the original values (only on first run). Undo only works reliably if this action hasn't run a second time since (there's only one backup, from the first run)."

  - id: debloat_block_app_reinstall
    label_sk: "Blokovanie automatickej reinstalacie Outlook/Dev Home"
    label_en: "Block Outlook/Dev Home auto-reinstall"
    risk: MODERATE
    command: "$keys = @('HKCU:\\Software\\Microsoft\\Windows\\CurrentVersion\\UScheduler_Oobe\\OutlookUpdate','HKCU:\\Software\\Microsoft\\Windows\\CurrentVersion\\UScheduler_Oobe\\DevHomeUpdate'); $marked = 0; foreach ($k in $keys) { if (Test-Path $k) { New-ItemProperty -Path $k -Name workCompleted -Value 1 -PropertyType DWord -Force | Out-Null; $marked++ } }; Write-Output ('Marked ' + $marked + ' auto-reinstall task(s) as completed.')"
    undo_command: "$keys = @('HKCU:\\Software\\Microsoft\\Windows\\CurrentVersion\\UScheduler_Oobe\\OutlookUpdate','HKCU:\\Software\\Microsoft\\Windows\\CurrentVersion\\UScheduler_Oobe\\DevHomeUpdate'); foreach ($k in $keys) { if (Test-Path $k) { Remove-ItemProperty -Path $k -Name workCompleted -EA SilentlyContinue } }; Write-Output 'Auto-reinstall block removed (Outlook/Dev Home may reinstall again).'"
    description_sk: "Oznaci orchestracne ulohy noveho Outlooku a Dev Home ako dokoncene, cim zabrani ich tichej opatovnej instalacii po odstraneni. Undo blok zrusi."
    description_en: "Marks the new Outlook and Dev Home orchestrator tasks as completed, preventing their silent reinstallation after removal. Undo lifts the block."

  - id: debloat_disable_recall_clicktodo
    label_sk: "Vypnutie Recall a Click to Do"
    label_en: "Disable Recall and Click to Do"
    risk: MODERATE
    command: "foreach ($hive in 'HKLM:','HKCU:') { $k = \"$hive\\Software\\Policies\\Microsoft\\Windows\\WindowsAI\"; New-Item -Path $k -Force -EA SilentlyContinue | Out-Null; foreach ($n in 'DisableAIDataAnalysis','AllowRecallEnablement','TurnOffSavingSnapshots','DisableClickToDo') { Set-ItemProperty -Path $k -Name $n -Value 1 -Type DWord -EA SilentlyContinue } }; Write-Output 'Recall and Click to Do disabled by policy (HKLM part needs administrator).'"
    undo_command: "foreach ($hive in 'HKLM:','HKCU:') { $k = \"$hive\\Software\\Policies\\Microsoft\\Windows\\WindowsAI\"; foreach ($n in 'DisableAIDataAnalysis','AllowRecallEnablement','TurnOffSavingSnapshots','DisableClickToDo') { Remove-ItemProperty -Path $k -Name $n -EA SilentlyContinue } }; Write-Output 'Recall/Click to Do policy removed (back to Windows default).'"
    description_sk: "Vypne Windows Recall (automaticke snimky obrazovky s AI vyhladavanim) a Click to Do politikou (HKLM aj HKCU). HKLM cast vyzaduje administratora. Undo politiku odstrani."
    description_en: "Disables Windows Recall (automatic AI-searchable screenshots) and Click to Do via policy (HKLM and HKCU). The HKLM part needs administrator. Undo removes the policy."
