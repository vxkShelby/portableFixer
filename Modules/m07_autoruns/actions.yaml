module_id: m07_autoruns
category: DIAGNOSTICS
actions:
  - id: autoruns_registry_run
    label_sk: "Programy spúšťané z registrov (Run)"
    label_en: "Registry autostart entries (Run)"
    risk: SAFE
    command: "foreach ($path in 'HKLM:\\Software\\Microsoft\\Windows\\CurrentVersion\\Run','HKLM:\\Software\\Microsoft\\Windows\\CurrentVersion\\RunOnce','HKLM:\\Software\\WOW6432Node\\Microsoft\\Windows\\CurrentVersion\\Run','HKLM:\\Software\\WOW6432Node\\Microsoft\\Windows\\CurrentVersion\\RunOnce','HKCU:\\Software\\Microsoft\\Windows\\CurrentVersion\\Run','HKCU:\\Software\\Microsoft\\Windows\\CurrentVersion\\RunOnce') { Write-Output ('=== ' + $path + ' ==='); Get-ItemProperty -Path $path -ErrorAction SilentlyContinue | Select-Object * -ExcludeProperty PS* | Format-List }"
    description_sk: "Vypíše programy naplánované na spustenie cez registrové kľúče Run/RunOnce (HKLM, WOW6432Node aj HKCU), nič nemení."
    description_en: "Lists programs scheduled to start via the Run/RunOnce registry keys (HKLM, WOW6432Node, and HKCU), changes nothing."
  - id: autoruns_startup_folder
    label_sk: "Položky v priečinku Startup"
    label_en: "Startup folder items"
    risk: SAFE
    command: "Get-ChildItem -Path \"$env:APPDATA\\Microsoft\\Windows\\Start Menu\\Programs\\Startup\",\"$env:ProgramData\\Microsoft\\Windows\\Start Menu\\Programs\\Startup\" -ErrorAction SilentlyContinue | Select-Object FullName,LastWriteTime | Format-Table -AutoSize"
    description_sk: "Vypíše súbory v používateľskom aj spoločnom Startup priečinku, nič nemení."
    description_en: "Lists files in both the per-user and common Startup folders, changes nothing."
  - id: autoruns_scheduled_tasks
    label_sk: "Aktívne naplánované úlohy"
    label_en: "Active scheduled tasks"
    risk: SAFE
    command: "Get-ScheduledTask | Where-Object { $_.State -ne 'Disabled' } | Select-Object TaskName,TaskPath,State,@{N='Action';E={($_.Actions | ForEach-Object { $_.Execute + ' ' + $_.Arguments }) -join '; '}} | Format-Table -AutoSize -Wrap"
    description_sk: "Vypíše všetky nezakázané naplánované úlohy vrátane toho, čo spúšťajú, nič nemení."
    description_en: "Lists all non-disabled scheduled tasks including what they actually run, changes nothing."
  - id: autoruns_autostart_services
    label_sk: "Automaticky spúšťané služby"
    label_en: "Automatic-start services"
    risk: SAFE
    command: "Get-CimInstance Win32_Service | Where-Object { $_.StartMode -eq 'Auto' } | Select-Object Name,DisplayName,State,StartName,PathName | Format-Table -AutoSize -Wrap"
    description_sk: "Vypíše služby nastavené na automatické spustenie vrátane cesty k binárke a účtu, nič nemení."
    description_en: "Lists services set to start automatically including their binary path and account, changes nothing."
  - id: autoruns_wmi_event_subscriptions
    label_sk: "WMI event subscriptions (fileless perzistencia)"
    label_en: "WMI event subscriptions (fileless persistence)"
    risk: SAFE
    command: "try { $filters = Get-CimInstance -Namespace root\\subscription -ClassName __EventFilter -EA Stop; $consumers = Get-CimInstance -Namespace root\\subscription -ClassName __EventConsumer -EA Stop; $bindings = Get-CimInstance -Namespace root\\subscription -ClassName __FilterToConsumerBinding -EA Stop; if (-not $filters -and -not $consumers -and -not $bindings) { Write-Output 'No WMI event subscriptions found (clean).' } else { Write-Output '--- Event Filters ---'; $filters | Select-Object Name,Query | Format-List; Write-Output '--- Event Consumers ---'; $consumers | Select-Object Name,@{N='Type';E={$_.CimClass.CimClassName}} | Format-Table -AutoSize; Write-Output '--- Filter-to-Consumer Bindings ---'; $bindings | Select-Object Filter,Consumer | Format-Table -AutoSize -Wrap } } catch { Write-Output ('Could not query WMI subscriptions: ' + $_.Exception.Message) }"
    description_sk: "Vypíše WMI event subscriptions (__EventFilter/__EventConsumer/__FilterToConsumerBinding) - známy spôsob fileless perzistencie malwaru, ktorý autostart cez registre/úlohy neodhalí. Poznámka: 'SCM Event Log Filter/Consumer' je legitímny vstavaný záznam Windows, nie hrozba. Nič nemení."
    description_en: "Lists WMI event subscriptions (__EventFilter/__EventConsumer/__FilterToConsumerBinding) - a known fileless malware persistence technique that registry/task-based autostart checks won't reveal. Note: an 'SCM Event Log Filter/Consumer' entry is a legitimate built-in Windows entry, not a threat. Changes nothing."
