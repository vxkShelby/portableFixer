module_id: m07_autoruns
category: DIAGNOSTICS
actions:
  - id: autoruns_registry_run
    label_sk: "Programy spúšťané z registra (Run)"
    label_en: "Registry autostart entries (Run)"
    risk: SAFE
    command: "foreach ($path in 'HKLM:\\Software\\Microsoft\\Windows\\CurrentVersion\\Run','HKLM:\\Software\\Microsoft\\Windows\\CurrentVersion\\RunOnce','HKLM:\\Software\\WOW6432Node\\Microsoft\\Windows\\CurrentVersion\\Run','HKLM:\\Software\\WOW6432Node\\Microsoft\\Windows\\CurrentVersion\\RunOnce','HKCU:\\Software\\Microsoft\\Windows\\CurrentVersion\\Run','HKCU:\\Software\\Microsoft\\Windows\\CurrentVersion\\RunOnce') { Write-Output ('=== ' + $path + ' ==='); Get-ItemProperty -Path $path -ErrorAction SilentlyContinue | Select-Object * -ExcludeProperty PS* | Format-List }"
    description_sk: "Vypíše programy naplánované na spustenie cez registrové kľúče Run/RunOnce (HKLM, WOW6432Node aj HKCU), nič nemení."
    description_en: "Lists programs scheduled to start via the Run/RunOnce registry keys (HKLM, WOW6432Node, and HKCU), changes nothing."
  - id: autoruns_startup_folder
    label_sk: "Položky v priečinku Startup"
    label_en: "Startup folder items"
    risk: SAFE
    command: "Get-ChildItem -Path \"$env:APPDATA\\Microsoft\\Windows\\Start Menu\\Programs\\Startup\",\"$env:ProgramData\\Microsoft\\Windows\\Start Menu\\Programs\\Startup\" -ErrorAction SilentlyContinue | Select-Object FullName,LastWriteTime | Format-Table -AutoSize"
    description_sk: "Vypíše súbory v používateľskom aj spoločnom priečinku Startup, nič nemení."
    description_en: "Lists files in both the per-user and common Startup folders, changes nothing."
  - id: autoruns_scheduled_tasks
    label_sk: "Aktívne naplánované úlohy"
    label_en: "Active scheduled tasks"
    risk: SAFE
    command: "Get-ScheduledTask | Where-Object { $_.State -ne 'Disabled' } | Select-Object TaskName,TaskPath,State,@{N='Action';E={($_.Actions | ForEach-Object { $_.Execute + ' ' + $_.Arguments }) -join '; '}} | Format-Table -AutoSize -Wrap"
    description_sk: "Vypíše všetky nezakázané naplánované úlohy vrátane toho, čo spúšťajú, nič nemení."
    description_en: "Lists all non-disabled scheduled tasks including what they actually run, changes nothing."
  - id: autoruns_autostart_services
    label_sk: "Automaticky spúšťané služby"
    label_en: "Automatic-start services"
    risk: SAFE
    command: "Get-CimInstance Win32_Service | Where-Object { $_.StartMode -eq 'Auto' } | Select-Object Name,DisplayName,State,StartName,PathName | Format-Table -AutoSize -Wrap"
    description_sk: "Vypíše služby nastavené na automatické spustenie vrátane cesty k spustiteľnému súboru a účtu, nič nemení."
    description_en: "Lists services set to start automatically including their binary path and account, changes nothing."
  - id: autoruns_wmi_event_subscriptions
    label_sk: "WMI event subscriptions (bezsúborová perzistencia)"
    label_en: "WMI event subscriptions (fileless persistence)"
    risk: SAFE
    command: "try { $filters = Get-CimInstance -Namespace root\\subscription -ClassName __EventFilter -EA Stop; $consumers = Get-CimInstance -Namespace root\\subscription -ClassName __EventConsumer -EA Stop; $bindings = Get-CimInstance -Namespace root\\subscription -ClassName __FilterToConsumerBinding -EA Stop; if (-not $filters -and -not $consumers -and -not $bindings) { Write-Output 'No WMI event subscriptions found (clean).' } else { Write-Output '--- Event Filters ---'; $filters | Select-Object Name,Query | Format-List; Write-Output '--- Event Consumers ---'; $consumers | Select-Object Name,@{N='Type';E={$_.CimClass.CimClassName}} | Format-Table -AutoSize; Write-Output '--- Filter-to-Consumer Bindings ---'; $bindings | Select-Object Filter,Consumer | Format-Table -AutoSize -Wrap } } catch { Write-Output ('Could not query WMI subscriptions: ' + $_.Exception.Message) }"
    description_sk: "Vypíše WMI event subscriptions (__EventFilter/__EventConsumer/__FilterToConsumerBinding) - známy spôsob bezsúborovej perzistencie malwaru, ktorý kontroly autostartu v registri/úlohách neodhalia. Poznámka: 'SCM Event Log Filter/Consumer' je legitímny vstavaný záznam Windows, nie hrozba. Nič nemení."
    description_en: "Lists WMI event subscriptions (__EventFilter/__EventConsumer/__FilterToConsumerBinding) - a known fileless malware persistence technique that registry/task-based autostart checks won't reveal. Note: an 'SCM Event Log Filter/Consumer' entry is a legitimate built-in Windows entry, not a threat. Changes nothing."
  - id: autoruns_ifeo_debuggers
    label_sk: "Únos spúšťania cez IFEO Debugger (backdoor)"
    label_en: "IFEO debugger hijacks (backdoor check)"
    risk: SAFE
    command: "$roots = 'HKLM:\\SOFTWARE\\Microsoft\\Windows NT\\CurrentVersion\\Image File Execution Options','HKLM:\\SOFTWARE\\WOW6432Node\\Microsoft\\Windows NT\\CurrentVersion\\Image File Execution Options'; $access = 'sethc.exe','utilman.exe','osk.exe','magnify.exe','narrator.exe','displayswitch.exe','atbroker.exe'; $hits = @(foreach ($r in $roots) { Get-ChildItem -Path $r -EA SilentlyContinue | ForEach-Object { $p = Get-ItemProperty -Path $_.PSPath -EA SilentlyContinue; if ($p.Debugger) { [PSCustomObject]@{ Executable = $_.PSChildName; Debugger = $p.Debugger; Verdict = $(if ($access -contains $_.PSChildName.ToLower()) { 'SUSPICIOUS - accessibility tool hijack (login-screen backdoor)' } else { 'review' }) } } } }); $spe = @(Get-ChildItem -Path 'HKLM:\\SOFTWARE\\Microsoft\\Windows NT\\CurrentVersion\\SilentProcessExit' -EA SilentlyContinue | ForEach-Object { $m = (Get-ItemProperty -Path $_.PSPath -EA SilentlyContinue).MonitorProcess; if ($m) { [PSCustomObject]@{ Executable = $_.PSChildName; MonitorProcess = $m } } }); Write-Output '--- IFEO Debugger values ---'; if ($hits) { $hits | Format-Table -AutoSize -Wrap | Out-String -Width 250 } else { Write-Output 'No IFEO Debugger entries found (clean).' }; Write-Output '--- SilentProcessExit MonitorProcess values ---'; if ($spe) { $spe | Format-Table -AutoSize -Wrap | Out-String -Width 250 } else { Write-Output 'No SilentProcessExit monitors found (clean).' }"
    description_sk: "Vypíše hodnoty Debugger v kľúči Image File Execution Options (aj WOW6432Node) a monitory SilentProcessExit - miesta, cez ktoré malware presmerováva spustenie programu na iný. Záznam pre sethc.exe/utilman.exe/osk.exe alebo iný nástroj zjednodušenia prístupu označí ako SUSPICIOUS (klasický backdoor z prihlasovacej obrazovky, ktorý kontroly kľúčov Run, úloh ani služieb neodhalia). Legitímne býva napr. nahradenie taskmgr.exe programom Process Explorer. Nič nemení."
    description_en: "Lists Debugger values under Image File Execution Options (including WOW6432Node) and SilentProcessExit monitors - places malware uses to redirect a program launch to something else. An entry on sethc.exe/utilman.exe/osk.exe or another accessibility tool is flagged SUSPICIOUS (the classic login-screen backdoor that the Run key, task and service checks cannot see). A legitimate example is Process Explorer replacing taskmgr.exe. Changes nothing."
  - id: autoruns_unquoted_service_paths
    label_sk: "Služby s cestou bez úvodzoviek (zraniteľnosť)"
    label_en: "Unquoted service paths (vulnerability)"
    risk: SAFE
    command: "$vuln = @(Get-CimInstance Win32_Service -EA SilentlyContinue | Where-Object { $_.PathName -and $_.PathName -notmatch '^\\s*\"' -and ($_.PathName -replace '(?i)(\\.exe).*$','$1') -match '\\s' }); if ($vuln) { $vuln | Select-Object Name,StartMode,StartName,PathName | Format-Table -AutoSize -Wrap | Out-String -Width 250; Write-Output ('Found ' + $vuln.Count + ' service(s) with an unquoted executable path containing spaces. Update the vendor software, or wrap the executable path in quotes in ImagePath under HKLM:\\SYSTEM\\CurrentControlSet\\Services\\<Name>.') } else { Write-Output 'No unquoted service paths with spaces found (clean).' }"
    description_sk: "Nájde služby, ktorých cesta k spustiteľnému súboru obsahuje medzeru a nie je v úvodzovkách (napr. C:\\Program Files\\Firma\\svc.exe) - známy spôsob eskalácie práv, ak útočník dokáže podstrčiť C:\\Program.exe. Argumenty za .exe ignoruje, takže nehlási falošné poplachy typu svchost.exe -k. Nič nemení - opravte aktualizáciou softvéru alebo doplnením úvodzoviek do hodnoty ImagePath služby."
    description_en: "Finds services whose executable path contains a space and is not quoted (e.g. C:\\Program Files\\Vendor\\svc.exe) - a well-known privilege-escalation path when an attacker can drop C:\\Program.exe. Ignores arguments after the .exe, so it does not flag svchost.exe -k style entries. Changes nothing - fix by updating the software or quoting the service's ImagePath."
  - id: autoruns_thirdparty_signed_view
    label_sk: "Autoštart bez položiek Microsoftu (podpis, SHA256)"
    label_en: "Autostart without Microsoft entries (signature, SHA256)"
    risk: SAFE
    command: "try { $sr = $env:SystemRoot; if (-not $sr) { $sr = $env:windir }; $fh = [Security.Cryptography.SHA256]::Create(); $sep = [string][IO.Path]::DirectorySeparatorChar; $entries = [System.Collections.Generic.List[object]]::new(); $regSkip = 'PSPath','PSParentPath','PSChildName','PSDrive','PSProvider'; $cats = 'Run','Startup','ScheduledTask','Service','Driver','Winlogon','AppInit','LSA','PrintMonitor','Winsock','BootExecute','IFEO','ActiveSetup'; function Add-AR([string]$Cat, [string]$Loc, [string]$Name, [string]$Cmd, [bool]$IsPath, [string]$Display, [bool]$Wow) { if (-not $Display) { $Display = $Cmd }; $entries.Add([pscustomobject]@{ Category = $Cat; Location = $Loc; Name = $Name; Cmd = $Cmd; IsPath = $IsPath; Display = $Display; Wow = $Wow }) }; function Get-ARValues([string]$k) { $o = Get-ItemProperty -LiteralPath $k -EA SilentlyContinue; if ($o) { foreach ($p in $o.PSObject.Properties) { if ($regSkip -notcontains $p.Name) { $p } } } }; function Get-ARValue([string]$k, [string]$n) { $o = Get-ItemProperty -LiteralPath $k -EA SilentlyContinue; if ($o -and $o.PSObject.Properties[$n]) { $o.PSObject.Properties[$n].Value } }; function Get-ARSubkeys([string]$k) { foreach ($c in @(Get-ChildItem -LiteralPath $k -EA SilentlyContinue)) { if ($c.PSChildName) { $k + '\\' + $c.PSChildName } } }; function Get-ARQualified([string]$x, [bool]$wow) { $x = $x.Trim().Trim('\"'); if (-not $x) { return $null }; if ($x -match '^\\\\\\?\\?\\\\') { $x = $x.Substring(4) }; if ($x -match '^\\\\SystemRoot\\\\') { $x = $sr + $x.Substring(11) }; $x = $x.Replace('\\', $sep); try { $s32 = [IO.Path]::Combine($sr, 'System32'); $sys = $s32; if ($wow) { $w = [IO.Path]::Combine($sr, 'SysWOW64'); if ([IO.Directory]::Exists($w)) { $sys = $w } }; if ([IO.Path]::IsPathRooted($x)) { if ($sys -ne $s32 -and $x.StartsWith($s32 + $sep, [StringComparison]::OrdinalIgnoreCase)) { $x = $sys + $x.Substring($s32.Length) }; $cand = @($x) } elseif ($x -match '^system32[\\\\/]') { $cand = @([IO.Path]::Combine($sys, $x.Substring(9))) } else { $cand = @([IO.Path]::Combine($sys, $x), [IO.Path]::Combine($sr, $x)) }; foreach ($c in $cand) { if ([IO.File]::Exists($c)) { return $c }; if (-not [IO.Path]::HasExtension($c) -and [IO.File]::Exists($c + '.exe')) { return $c + '.exe' } }; return $cand[0] } catch { return $null } }; function Resolve-AR([string]$cmd, [bool]$isPath, [bool]$wow) { $s = [Environment]::ExpandEnvironmentVariables($cmd).Trim(); if (-not $s) { return $null }; if ($isPath) { $q = Get-ARQualified $s $wow; return [pscustomobject]@{ Host = $q; Path = $q; Args = '' } }; $p = $null; $rest = ''; if ($s.StartsWith('\"')) { $e = $s.IndexOf('\"', 1); if ($e -lt 0) { $p = $s.Substring(1) } else { $p = $s.Substring(1, $e - 1); $rest = $s.Substring($e + 1) } } else { $cuts = @(@([regex]::Matches($s, '\\s') | ForEach-Object { $_.Index }) + $s.Length); foreach ($i in $cuts) { $q = Get-ARQualified $s.Substring(0, $i) $wow; if ($q -and [IO.File]::Exists($q)) { $p = $s.Substring(0, $i); $rest = $s.Substring($i); break } }; if (-not $p) { if ($s -match '^(.+?\\.(?:exe|dll|sys|com|bat|cmd|scr|cpl|ocx|ps1|vbs|js|jar|msc|lnk))(?=[\\s,]|$)') { $p = $Matches[1] } else { $p = ($s -split '[\\s,]')[0] }; $rest = $s.Substring($p.Length) } }; $path = Get-ARQualified $p $wow; $hostP = $path; if ($path -and [IO.Path]::GetFileName($path) -ieq 'rundll32.exe') { $a = $rest.Trim(); if ($a.StartsWith('\"')) { $a = ($a.Substring(1) -split '\"')[0] } else { $a = ($a -split '[,\\s]')[0] }; if ($a -and $a -notmatch '^-') { if (-not [IO.Path]::HasExtension($a)) { $a += '.dll' }; $path = Get-ARQualified $a $wow } }; [pscustomobject]@{ Host = $hostP; Path = $path; Args = $rest.Trim() } }; Write-Output 'Collecting autostart entries...'; $failedSrc = [System.Collections.Generic.List[string]]::new(); function Invoke-ARSource([string]$src, [scriptblock]$sb) { try { & $sb } catch { $failedSrc.Add($src); Write-Output ($src + ': cannot be read (' + $_.Exception.GetType().Name + ')') } }; Invoke-ARSource 'Run' { foreach ($r in 'HKLM:\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion','HKLM:\\SOFTWARE\\WOW6432Node\\Microsoft\\Windows\\CurrentVersion','HKCU:\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion') { foreach ($sub in 'Run','RunOnce','Policies\\Explorer\\Run') { $k = $r + '\\' + $sub; foreach ($v in @(Get-ARValues $k)) { if ($v.Value -is [string] -and $v.Value.Trim()) { Add-AR 'Run' $k $v.Name $v.Value $false } } } } }; $sh = $null; try { $sh = New-Object -ComObject WScript.Shell } catch {}; Invoke-ARSource 'Startup' { foreach ($base in @($env:ProgramData, $env:APPDATA)) { if (-not $base) { continue }; $d = [IO.Path]::Combine($base, 'Microsoft', 'Windows', 'Start Menu', 'Programs', 'Startup'); foreach ($f in @(Get-ChildItem -LiteralPath $d -File -Force -EA SilentlyContinue)) { if ($f.Name -ieq 'desktop.ini') { continue }; $cmd = $f.FullName; $isP = $true; if ($f.Extension -ieq '.lnk' -and $sh) { try { $l = $sh.CreateShortcut($f.FullName); if ($l.TargetPath) { $cmd = ('\"' + $l.TargetPath + '\" ' + $l.Arguments).Trim(); $isP = $false } } catch {} }; Add-AR 'Startup' $d $f.Name $cmd $isP } } }; Invoke-ARSource 'ScheduledTask' { foreach ($t in @(Get-ScheduledTask -EA Stop)) { if ([string]$t.State -eq 'Disabled') { continue }; $i = 0; foreach ($a in @($t.Actions)) { if (-not $a.Execute) { continue }; $i++; $exe = ([string]$a.Execute).Trim(); if (-not $exe.StartsWith('\"') -and $exe -match '\\s') { $exe = '\"' + $exe + '\"' }; $cmd = ($exe + ' ' + $a.Arguments).Trim(); $tn = [string]$t.TaskPath + $t.TaskName; if ($i -gt 1) { $tn += ' #' + $i }; Add-AR 'ScheduledTask' 'Task Scheduler' $tn $cmd $false } } }; Invoke-ARSource 'Service' { $svcRoot = 'HKLM:\\SYSTEM\\CurrentControlSet\\Services'; foreach ($k in @(Get-ARSubkeys $svcRoot)) { $o = Get-ItemProperty -LiteralPath $k -EA SilentlyContinue; if (-not $o -or $null -eq $o.Start -or $null -eq $o.Type -or [int]$o.Start -gt 2) { continue }; $name = $k.Substring($svcRoot.Length + 1); $isDrv = ([int]$o.Type -band 0x0F) -ne 0; $cat = 'Service'; if ($isDrv) { $cat = 'Driver' }; $img = [string]$o.ImagePath; if (-not $img.Trim()) { if ($isDrv) { $img = 'System32\\drivers\\' + $name + '.sys' } else { continue } }; $dll = $null; if ($img -match 'svchost\\.exe') { $pv = Get-ItemProperty -LiteralPath ($k + '\\Parameters') -EA SilentlyContinue; if ($pv -and $pv.ServiceDll) { $dll = [string]$pv.ServiceDll } elseif ($o.ServiceDll) { $dll = [string]$o.ServiceDll } }; if ($dll) { Add-AR $cat $svcRoot $name $dll $true ($img + ' [ServiceDll: ' + $dll + ']') } else { Add-AR $cat $svcRoot $name $img $isDrv } } }; Invoke-ARSource 'Winlogon' { foreach ($k in 'HKLM:\\SOFTWARE\\Microsoft\\Windows NT\\CurrentVersion\\Winlogon','HKCU:\\SOFTWARE\\Microsoft\\Windows NT\\CurrentVersion\\Winlogon') { foreach ($n in 'Shell','Userinit') { $v = Get-ARValue $k $n; if ($v -is [string]) { $j = 0; foreach ($part in ($v -split ',')) { if ($part.Trim()) { $j++; $nn = $n; if ($j -gt 1) { $nn += ' #' + $j }; Add-AR 'Winlogon' $k $nn $part.Trim() $false } } } } } }; Invoke-ARSource 'AppInit' { foreach ($k in 'HKLM:\\SOFTWARE\\Microsoft\\Windows NT\\CurrentVersion\\Windows','HKLM:\\SOFTWARE\\WOW6432Node\\Microsoft\\Windows NT\\CurrentVersion\\Windows') { $v = Get-ARValue $k 'AppInit_DLLs'; if ($v -is [string]) { foreach ($part in ($v -split '[\\s,]+')) { if ($part) { Add-AR 'AppInit' $k 'AppInit_DLLs' $part $true '' ($k -match 'WOW6432Node') } } } } }; Invoke-ARSource 'LSA' { foreach ($k in 'HKLM:\\SYSTEM\\CurrentControlSet\\Control\\Lsa','HKLM:\\SYSTEM\\CurrentControlSet\\Control\\Lsa\\OSConfig') { foreach ($n in 'Authentication Packages','Notification Packages','Security Packages') { foreach ($pkg in @(Get-ARValue $k $n)) { $pkg = ([string]$pkg).Trim().Trim('\"'); if ($pkg) { $f = $pkg; if (-not [IO.Path]::HasExtension($f)) { $f += '.dll' }; Add-AR 'LSA' $k $n $f $true $pkg } } } } }; Invoke-ARSource 'PrintMonitor' { $pm = 'HKLM:\\SYSTEM\\CurrentControlSet\\Control\\Print\\Monitors'; foreach ($k in @(Get-ARSubkeys $pm)) { $v = Get-ARValue $k 'Driver'; if ($v -is [string] -and $v.Trim()) { Add-AR 'PrintMonitor' $pm $k.Substring($pm.Length + 1) $v $true } } }; Invoke-ARSource 'Winsock' { $ws = 'HKLM:\\SYSTEM\\CurrentControlSet\\Services\\WinSock2\\Parameters'; foreach ($c in 'Protocol_Catalog9\\Catalog_Entries','Protocol_Catalog9\\Catalog_Entries64') { $cr = $ws + '\\' + $c; foreach ($k in @(Get-ARSubkeys $cr)) { $o = Get-ItemProperty -LiteralPath $k -EA SilentlyContinue; $b = $null; if ($o) { $b = $o.PackedCatalogItem }; if ($b -is [byte[]]) { $n = [Array]::IndexOf($b, [byte]0); if ($n -lt 0) { $n = $b.Length }; $p = [Text.Encoding]::Default.GetString($b, 0, $n); if ($p.Trim()) { Add-AR 'Winsock' $cr $k.Substring($cr.Length + 1) $p $true '' ($c -notmatch '64$') } } } } }; Invoke-ARSource 'Winsock' { $ws = 'HKLM:\\SYSTEM\\CurrentControlSet\\Services\\WinSock2\\Parameters'; foreach ($c in 'NameSpace_Catalog5\\Catalog_Entries','NameSpace_Catalog5\\Catalog_Entries64') { $cr = $ws + '\\' + $c; foreach ($k in @(Get-ARSubkeys $cr)) { $v = Get-ARValue $k 'LibraryPath'; if ($v -is [string] -and $v.Trim()) { Add-AR 'Winsock' $cr $k.Substring($cr.Length + 1) $v $true '' ($c -notmatch '64$') } } } }; Invoke-ARSource 'BootExecute' { $smk = 'HKLM:\\SYSTEM\\CurrentControlSet\\Control\\Session Manager'; foreach ($n in 'BootExecute','SetupExecute','Execute') { foreach ($line in @(Get-ARValue $smk $n)) { $line = ([string]$line).Trim(); if (-not $line) { continue }; $tok = @($line -split '\\s+'); $img = $tok[0]; if ($img -ieq 'autocheck' -and $tok.Count -gt 1) { $img = $tok[1] }; if (-not [IO.Path]::HasExtension($img)) { $img += '.exe' }; Add-AR 'BootExecute' $smk $n $img $true $line } } }; Invoke-ARSource 'IFEO' { foreach ($r in 'HKLM:\\SOFTWARE\\Microsoft\\Windows NT\\CurrentVersion\\Image File Execution Options','HKLM:\\SOFTWARE\\WOW6432Node\\Microsoft\\Windows NT\\CurrentVersion\\Image File Execution Options') { foreach ($k in @(Get-ARSubkeys $r)) { $v = Get-ARValue $k 'Debugger'; if ($v -is [string] -and $v.Trim()) { Add-AR 'IFEO' $r $k.Substring($r.Length + 1) $v $false } } } }; Invoke-ARSource 'ActiveSetup' { foreach ($r in 'HKLM:\\SOFTWARE\\Microsoft\\Active Setup\\Installed Components','HKLM:\\SOFTWARE\\WOW6432Node\\Microsoft\\Active Setup\\Installed Components') { foreach ($k in @(Get-ARSubkeys $r)) { $o = Get-ItemProperty -LiteralPath $k -EA SilentlyContinue; if ($o -and ([string]$o.StubPath).Trim() -and [string]$o.IsInstalled -ne '0') { Add-AR 'ActiveSetup' $r $k.Substring($r.Length + 1) ([string]$o.StubPath) $false } } } }; $cache = @{}; $inv = [Globalization.CultureInfo]::InvariantCulture; $msName = '(^|,\\s*)O=\"?Microsoft Corporation\"?(,|$)'; $whql = '^CN=\"?Microsoft Windows Hardware Compatibility Publisher'; function Get-ARFile([string]$p) { if (-not $p) { return [pscustomobject]@{ Exists = $false; Status = 'FileMissing'; Signer = ''; Microsoft = $false; Sha256 = ''; Modified = ''; Note = 'file missing' } }; $key = $p.ToLowerInvariant(); if ($cache.ContainsKey($key)) { return $cache[$key] }; $r = [pscustomobject]@{ Exists = $false; Status = 'FileMissing'; Signer = ''; Microsoft = $false; Sha256 = ''; Modified = ''; Note = 'file missing' }; if ([IO.File]::Exists($p)) { $r.Exists = $true; $r.Note = ''; $fi = [IO.FileInfo]::new($p); $r.Modified = $fi.LastWriteTime.ToString('yyyy-MM-dd HH:mm:ss', $inv); try { $sig = Get-AuthenticodeSignature -LiteralPath $p -EA Stop; $r.Status = [string]$sig.Status; $iss = ''; if ($sig.SignerCertificate) { $r.Signer = [string]$sig.SignerCertificate.Subject; $iss = [string]$sig.SignerCertificate.Issuer }; $r.Microsoft = ($r.Status -eq 'Valid') -and ($r.Signer -notmatch $whql) -and (($sig.IsOSBinary -eq $true) -or (($r.Signer -match $msName) -and ($iss -match $msName))) } catch { $r.Status = 'Unreadable' }; if ($r.Status -eq 'NotSigned' -and $sr -and $p.StartsWith($sr, [StringComparison]::OrdinalIgnoreCase)) { $r.Note = 'in the Windows folder - may be catalog-signed if the CryptSvc service is not running' }; if ($fi.Length -gt 200MB) { $r.Sha256 = 'skipped (larger than 200 MB)' } else { $fs = $null; try { $fs = [IO.File]::Open($p, 'Open', 'Read', 'ReadWrite'); $r.Sha256 = [BitConverter]::ToString($fh.ComputeHash($fs)).Replace('-', '') } catch { $r.Sha256 = 'unreadable' } finally { if ($fs) { $fs.Dispose() } } } }; $cache[$key] = $r; $r }; Write-Output ('Checking signatures of ' + $entries.Count + ' entries...'); $scriptHosts = 'powershell.exe','pwsh.exe','cmd.exe','wscript.exe','cscript.exe','mshta.exe','conhost.exe','forfiles.exe','pcalua.exe','wsl.exe','bash.exe','wmic.exe','msbuild.exe','installutil.exe','scriptrunner.exe','syncappvpublishingserver.exe'; $proxyHosts = 'rundll32.exe','regsvr32.exe','msiexec.exe','odbcconf.exe','cmstp.exe','regasm.exe','regsvcs.exe','hh.exe','control.exe','explorer.exe','certutil.exe','bitsadmin.exe'; $win = $sr + $sep; function Get-ARArgRef([string]$t, [string]$self) { foreach ($m in [regex]::Matches($t, '\"[^\"]*\"|[^\\s,;\"]+')) { $tok = $m.Value.Trim('\"'); if ($tok -match '^[/-][A-Za-z]+[:=](.+)$') { $tok = $Matches[1].Trim('\"') }; if (-not $tok) { continue }; if ($tok -match '^[A-Za-z][A-Za-z0-9+.-]+://' -or ($tok -match '^\\\\\\\\' -and $tok -notmatch '^\\\\\\\\[?.]\\\\')) { return ('load ' + $tok + ' from the network') }; $q = Get-ARQualified $tok $false; if ($q -and $q -ne $self -and [IO.File]::Exists($q) -and -not $q.StartsWith($win, [StringComparison]::OrdinalIgnoreCase)) { return ('name ' + $q + ' (' + (Get-ARFile $q).Status + ')') }; if ($tok -match '^[A-Za-z]:[\\\\/]' -and -not $tok.Replace('\\', $sep).StartsWith($win, [StringComparison]::OrdinalIgnoreCase)) { return ('name ' + $tok + ', outside the Windows folder') } }; $null }; $hasher = [Security.Cryptography.SHA256]::Create(); $rows = [System.Collections.Generic.List[object]]::new(); $done = 0; foreach ($e in $entries) { $done++; if ($done % 100 -eq 0) { Write-Output ('... ' + $done + ' / ' + $entries.Count) }; $path = $null; $hostP = $null; $argText = ''; try { $res = Resolve-AR $e.Cmd $e.IsPath $e.Wow; if ($res) { $path = $res.Path; $hostP = $res.Host; $argText = $res.Args }; $f = Get-ARFile $path } catch { $f = [pscustomobject]@{ Exists = $true; Status = 'Unreadable'; Signer = ''; Microsoft = $false; Sha256 = ''; Modified = ''; Note = 'could not be checked (' + $_.Exception.GetType().Name + ')' } }; $id = 'AR-' + ([BitConverter]::ToString($hasher.ComputeHash([Text.Encoding]::UTF8.GetBytes(($e.Location + '|' + $e.Name + '|' + $e.Display).ToLowerInvariant()))).Replace('-', '').Substring(0, 12).ToLowerInvariant()); if (-not $f.Exists) { $rank = 2 } elseif ($f.Status -eq 'Valid') { $rank = 3 } elseif ($f.Status -eq 'NotSigned') { $rank = 1 } else { $rank = 0 }; $note = $f.Note; $keep = $false; if ($e.Category -eq 'IFEO') { $keep = $true; $note = ('IFEO redirect - shown even when the target is signed by Microsoft. ' + $note).Trim() } elseif (-not $e.IsPath -and $hostP -and $scriptHosts -contains [IO.Path]::GetFileName($hostP).ToLowerInvariant()) { $keep = $true; $note = ('script host - what runs is in the command arguments. ' + $note).Trim() } elseif (-not $e.IsPath -and $hostP -and $argText -and $proxyHosts -contains [IO.Path]::GetFileName($hostP).ToLowerInvariant()) { try { $ref = Get-ARArgRef $argText $path } catch { $ref = 'could not be checked (' + $_.Exception.GetType().Name + ')' }; if ($ref) { $keep = $true; $note = ('proxy launcher ' + [IO.Path]::GetFileName($hostP).ToLowerInvariant() + ' - its arguments ' + $ref + '. ' + $note).Trim() } }; $rows.Add([pscustomobject]@{ Id = $id; Category = $e.Category; CatIndex = [Array]::IndexOf($cats, $e.Category); Location = $e.Location; Name = $e.Name; Command = $e.Display; Path = $path; Status = $f.Status; Signer = $f.Signer; Sha256 = $f.Sha256; Modified = $f.Modified; Note = $note; Rank = $rank; Hidden = ($f.Microsoft -and -not $keep) }) }; $shown = @($rows | Where-Object { -not $_.Hidden } | Sort-Object Rank, CatIndex, Location, Name, Id); Write-Output ''; Write-Output '=== Autostart entries not signed by Microsoft (unsigned and invalid first) ==='; if (-not $shown) { Write-Output 'No autostart entries outside Microsoft-signed ones found.' }; foreach ($x in $shown) { Write-Output ('[' + $x.Id + '] ' + $x.Status + ' | ' + $x.Category + ' | ' + $x.Location + ' | ' + $x.Name); Write-Output ('    Command:  ' + $x.Command); Write-Output ('    File:     ' + $(if ($x.Path) { $x.Path } else { '-' })); Write-Output ('    Signer:   ' + $(if ($x.Signer) { $x.Signer } else { '-' })); Write-Output ('    SHA256:   ' + $(if ($x.Sha256) { $x.Sha256 } else { '-' })); Write-Output ('    Modified: ' + $(if ($x.Modified) { $x.Modified } else { '-' })); if ($x.Note) { Write-Output ('    Note:     ' + $x.Note) } }; Write-Output ''; Write-Output '--- Per category (shown / inspected) ---'; foreach ($c in $cats) { $all = @($rows | Where-Object { $_.Category -eq $c }); $vis = @($all | Where-Object { -not $_.Hidden }); Write-Output ($c + ': ' + $vis.Count + ' / ' + $all.Count) }; $nInvalid = @($shown | Where-Object { $_.Rank -eq 0 }).Count; $nUnsigned = @($shown | Where-Object { $_.Rank -eq 1 }).Count; $nMissing = @($shown | Where-Object { $_.Rank -eq 2 }).Count; $nThird = @($shown | Where-Object { $_.Rank -eq 3 }).Count; Write-Output ''; Write-Output ('SUMMARY: ' + $rows.Count + ' entries inspected, ' + ($rows.Count - $shown.Count) + ' signed by Microsoft hidden, ' + $shown.Count + ' shown (invalid signature ' + $nInvalid + ', unsigned ' + $nUnsigned + ', file missing ' + $nMissing + ', valid signature ' + $nThird + ')'); if ($failedSrc.Count) { Write-Output ('INCOMPLETE: could not read ' + (@($failedSrc | Select-Object -Unique) -join ', ')); exit 1 }; exit 0 } catch { Write-Output ('ERROR: ' + $_.Exception.Message); exit 1 }"
    description_sk: "Jeden súpis všetkých miest autoštartu: Run/RunOnce (HKLM, HKCU, WOW6432Node), priečinky Startup (všetci používatelia aj aktuálny), zapnuté naplánované úlohy, automaticky spúšťané služby a ovládače (ImagePath, pri svchost ServiceDll), Winlogon Shell/Userinit, AppInit_DLLs, balíčky LSA, monitory tlače, poskytovatelia Winsock, BootExecute, IFEO Debugger a Active Setup. Pri každej položke nájde skutočný súbor (úvodzovky, argumenty, rundll32 x.dll,Vstup, %premenné%, cesty relatívne k System32, pri 32-bitových AppInit_DLLs a Winsock SysWOW64), zistí podpis Authenticode a podpisovateľa, SHA256 a čas poslednej zmeny súboru. Položky podpísané Microsoftom skryje (okrem IFEO presmerovaní, skriptovacích hostiteľov a spúšťačov ako powershell.exe, cmd.exe či conhost.exe, kde rozhodujú argumenty, hostiteľov ako rundll32, regsvr32 či msiexec, ktorých argumenty ukazujú mimo priečinka Windows alebo na sieť, a ovládačov tretích strán podpísaných Microsoftom cez WHQL), ostatné vypíše so stabilným ID - najprv s neplatným podpisom a nepodpísané, potom chýbajúce súbory a nakoniec s platným podpisom - s počtami podľa kategórie a súhrnným riadkom. Nepodpísaný súbor v priečinku Windows môže byť podpísaný katalógom, ak nebeží služba CryptSvc (poznámka pri položke). Súbory nad 200 MB nehašuje. Ak sa niektoré miesto nedá prečítať, vypíše zvyšok a skončí chybou. Nič nemení."
    description_en: "One inventory of every autostart location: Run/RunOnce (HKLM, HKCU, WOW6432Node), Startup folders (all users and current user), enabled scheduled tasks, automatic-start services and drivers (ImagePath, ServiceDll for svchost), Winlogon Shell/Userinit, AppInit_DLLs, LSA packages, print monitors, Winsock providers, BootExecute, IFEO Debugger and Active Setup. For every entry it finds the real file (quotes, arguments, rundll32 x.dll,Entry, %variables%, System32-relative paths, SysWOW64 for 32-bit AppInit_DLLs and Winsock) and reads its Authenticode status and signer, SHA256 and last write time. Entries signed by Microsoft are hidden (except IFEO redirects, script hosts and launchers such as powershell.exe, cmd.exe or conhost.exe, where the arguments are what matters, hosts such as rundll32, regsvr32 or msiexec whose arguments point outside the Windows folder or to the network, and third-party drivers Microsoft signed through WHQL); the rest are listed with a stable ID - invalid signatures and unsigned files first, then missing files, then validly signed ones - with counts per category and a summary line. An unsigned file in the Windows folder may be catalog-signed when the CryptSvc service is not running (noted on the entry). Files over 200 MB are not hashed. If a location cannot be read, the rest is still listed and the action ends with an error. Changes nothing."
  - id: autoruns_disable_items
    label_sk: "Vypnúť vybrané položky autoštartu (vratne)"
    label_en: "Disable selected autostart entries (reversible)"
    risk: MODERATE
    items_command: '$ErrorActionPreference = ''Stop''; $pfUser = ''Registry::HKEY_CURRENT_USER''; if ($__pfUserHive) { $pfUser = $__pfUserHive }; $pfHk = ''Registry::HKEY_LOCAL_MACHINE\SOFTWARE''; $pfSvc = ''Registry::HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Services''; $pfRun = @(@{ src = ''hklm''; key = ($pfHk + ''\Microsoft\Windows\CurrentVersion\Run''); off = ($pfHk + ''\PortableFix\AutorunsDisabled\Run'') }, @{ src = ''hklm32''; key = ($pfHk + ''\WOW6432Node\Microsoft\Windows\CurrentVersion\Run''); off = ($pfHk + ''\PortableFix\AutorunsDisabled\Run32'') }, @{ src = ''user''; key = ($pfUser + ''\Software\Microsoft\Windows\CurrentVersion\Run''); off = ($pfUser + ''\Software\PortableFix\AutorunsDisabled\Run'') }); function pfH([string]$s) { $a = [Security.Cryptography.SHA256]::Create(); [BitConverter]::ToString($a.ComputeHash([Text.Encoding]::UTF8.GetBytes($s.ToLowerInvariant()))).Replace(''-'', '''').Substring(0, 12).ToLowerInvariant() }; function pfKey([string]$p, [bool]$w) { $s = $p.Substring(10); $i = $s.IndexOf(''\''); $h = $s.Substring(0, $i); $r = $s.Substring($i + 1); if ($h -eq ''HKEY_LOCAL_MACHINE'') { $b = [Microsoft.Win32.Registry]::LocalMachine } elseif ($h -eq ''HKEY_CURRENT_USER'') { $b = [Microsoft.Win32.Registry]::CurrentUser } elseif ($h -eq ''HKEY_USERS'') { $b = [Microsoft.Win32.Registry]::Users } else { throw (''unsupported hive '' + $h) }; if ($w) { return $b.CreateSubKey($r) }; return $b.OpenSubKey($r) }; $pfEntries = New-Object System.Collections.ArrayList; foreach ($r in $pfRun) { $k = $null; try { $k = pfKey $r.key $false } catch { Write-Output (''Cannot read '' + $r.key + '': '' + $_.Exception.Message) }; if ($k) { try { foreach ($n in @($k.GetValueNames())) { if (-not $n) { continue }; $v = $k.GetValue($n, $null, ''DoNotExpandEnvironmentNames''); if ($v -isnot [string] -or -not $v.Trim()) { continue }; [void]$pfEntries.Add(@{ id = (''run-'' + (pfH ($r.src + ''|'' + $n))); kind = ''run''; src = $r.src; name = $n; run = $r; label = (''Run ('' + $r.src + ''): '' + $n); detail = $v }) } } finally { $k.Close() } } }; try { foreach ($t in @(Get-ScheduledTask)) { if ([string]$t.State -eq ''Disabled'' -or ([string]$t.TaskPath).StartsWith(''\Microsoft\'', [StringComparison]::OrdinalIgnoreCase)) { continue }; $full = [string]$t.TaskPath + [string]$t.TaskName; $a = @($t.Actions | Where-Object { $_.Execute }) | Select-Object -First 1; $d = ''''; if ($a) { $d = ([string]$a.Execute + '' '' + [string]$a.Arguments).Trim() }; [void]$pfEntries.Add(@{ id = (''task-'' + (pfH $full)); kind = ''task''; task = $t; path = [string]$t.TaskPath; name = [string]$t.TaskName; label = (''Task: '' + $full); detail = $d }) } } catch { Write-Output (''Cannot list scheduled tasks: '' + $_.Exception.Message) }; $pfWin = [string]$env:SystemRoot; try { foreach ($c in @(Get-ChildItem -LiteralPath $pfSvc)) { $n = [string]$c.PSChildName; if (-not $n) { continue }; $p = Get-ItemProperty -LiteralPath ($pfSvc + ''\'' + $n) -EA SilentlyContinue; if (-not $p -or $null -eq $p.Start -or $null -eq $p.Type) { continue }; if ([int]$p.Start -ne 2 -or ([int]$p.Type -band 0x30) -eq 0) { continue }; $img = [string]$p.ImagePath; if (-not $img.Trim()) { continue }; $exp = [Environment]::ExpandEnvironmentVariables($img).Trim().TrimStart([char]34); if ($pfWin -and $exp.StartsWith($pfWin, [StringComparison]::OrdinalIgnoreCase)) { continue }; $dn = [string]$p.DisplayName; if (-not $dn -or $dn.StartsWith(''@'')) { $dn = $n }; [void]$pfEntries.Add(@{ id = (''svc-'' + (pfH $n)); kind = ''svc''; name = $n; label = (''Service: '' + $dn + '' ('' + $n + '')''); detail = $img }) } } catch { Write-Output (''Cannot list services: '' + $_.Exception.Message) }; foreach ($e in $pfEntries) { Write-Output (ConvertTo-Json -Compress -InputObject ([ordered]@{ id = $e.id; label = $e.label; detail = [string]$e.detail; risk_hint = ''MODERATE'' })) }; Write-Output (''Autostart entries that can be disabled: '' + $pfEntries.Count)'
    command: '$ErrorActionPreference = ''Stop''; $pfUser = ''Registry::HKEY_CURRENT_USER''; if ($__pfUserHive) { $pfUser = $__pfUserHive }; $pfHk = ''Registry::HKEY_LOCAL_MACHINE\SOFTWARE''; $pfSvc = ''Registry::HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Services''; $pfRun = @(@{ src = ''hklm''; key = ($pfHk + ''\Microsoft\Windows\CurrentVersion\Run''); off = ($pfHk + ''\PortableFix\AutorunsDisabled\Run'') }, @{ src = ''hklm32''; key = ($pfHk + ''\WOW6432Node\Microsoft\Windows\CurrentVersion\Run''); off = ($pfHk + ''\PortableFix\AutorunsDisabled\Run32'') }, @{ src = ''user''; key = ($pfUser + ''\Software\Microsoft\Windows\CurrentVersion\Run''); off = ($pfUser + ''\Software\PortableFix\AutorunsDisabled\Run'') }); function pfH([string]$s) { $a = [Security.Cryptography.SHA256]::Create(); [BitConverter]::ToString($a.ComputeHash([Text.Encoding]::UTF8.GetBytes($s.ToLowerInvariant()))).Replace(''-'', '''').Substring(0, 12).ToLowerInvariant() }; function pfKey([string]$p, [bool]$w) { $s = $p.Substring(10); $i = $s.IndexOf(''\''); $h = $s.Substring(0, $i); $r = $s.Substring($i + 1); if ($h -eq ''HKEY_LOCAL_MACHINE'') { $b = [Microsoft.Win32.Registry]::LocalMachine } elseif ($h -eq ''HKEY_CURRENT_USER'') { $b = [Microsoft.Win32.Registry]::CurrentUser } elseif ($h -eq ''HKEY_USERS'') { $b = [Microsoft.Win32.Registry]::Users } else { throw (''unsupported hive '' + $h) }; if ($w) { return $b.CreateSubKey($r) }; return $b.OpenSubKey($r) }; if (-not $__pfItems) { Write-Output ''No items were given - nothing was changed.''; exit 1 }; $pfEntries = New-Object System.Collections.ArrayList; foreach ($r in $pfRun) { $k = $null; try { $k = pfKey $r.key $false } catch { Write-Output (''Cannot read '' + $r.key + '': '' + $_.Exception.Message) }; if ($k) { try { foreach ($n in @($k.GetValueNames())) { if (-not $n) { continue }; $v = $k.GetValue($n, $null, ''DoNotExpandEnvironmentNames''); if ($v -isnot [string] -or -not $v.Trim()) { continue }; [void]$pfEntries.Add(@{ id = (''run-'' + (pfH ($r.src + ''|'' + $n))); kind = ''run''; src = $r.src; name = $n; run = $r; label = (''Run ('' + $r.src + ''): '' + $n); detail = $v }) } } finally { $k.Close() } } }; try { foreach ($t in @(Get-ScheduledTask)) { if ([string]$t.State -eq ''Disabled'' -or ([string]$t.TaskPath).StartsWith(''\Microsoft\'', [StringComparison]::OrdinalIgnoreCase)) { continue }; $full = [string]$t.TaskPath + [string]$t.TaskName; $a = @($t.Actions | Where-Object { $_.Execute }) | Select-Object -First 1; $d = ''''; if ($a) { $d = ([string]$a.Execute + '' '' + [string]$a.Arguments).Trim() }; [void]$pfEntries.Add(@{ id = (''task-'' + (pfH $full)); kind = ''task''; task = $t; path = [string]$t.TaskPath; name = [string]$t.TaskName; label = (''Task: '' + $full); detail = $d }) } } catch { Write-Output (''Cannot list scheduled tasks: '' + $_.Exception.Message) }; $pfWin = [string]$env:SystemRoot; try { foreach ($c in @(Get-ChildItem -LiteralPath $pfSvc)) { $n = [string]$c.PSChildName; if (-not $n) { continue }; $p = Get-ItemProperty -LiteralPath ($pfSvc + ''\'' + $n) -EA SilentlyContinue; if (-not $p -or $null -eq $p.Start -or $null -eq $p.Type) { continue }; if ([int]$p.Start -ne 2 -or ([int]$p.Type -band 0x30) -eq 0) { continue }; $img = [string]$p.ImagePath; if (-not $img.Trim()) { continue }; $exp = [Environment]::ExpandEnvironmentVariables($img).Trim().TrimStart([char]34); if ($pfWin -and $exp.StartsWith($pfWin, [StringComparison]::OrdinalIgnoreCase)) { continue }; $dn = [string]$p.DisplayName; if (-not $dn -or $dn.StartsWith(''@'')) { $dn = $n }; [void]$pfEntries.Add(@{ id = (''svc-'' + (pfH $n)); kind = ''svc''; name = $n; label = (''Service: '' + $dn + '' ('' + $n + '')''); detail = $img }) } } catch { Write-Output (''Cannot list services: '' + $_.Exception.Message) }; $pfFailed = 0; foreach ($id in $__pfItems) { $e = $pfEntries | Where-Object { $_.id -eq $id } | Select-Object -First 1; if (-not $e) { Write-Output (''Not found any more (it changed since the list was made) - skipped: '' + $id); continue }; try { if ($e.kind -eq ''run'') { $o = pfKey $e.run.off $true; $r = pfKey $e.run.key $true; try { if (@($o.GetValueNames()) -contains $e.name) { throw (''a disabled copy named '' + $e.name + '' is already in '' + $e.run.off) }; $o.SetValue($e.name, $r.GetValue($e.name, $null, ''DoNotExpandEnvironmentNames''), $r.GetValueKind($e.name)); $r.DeleteValue($e.name) } finally { $o.Close(); $r.Close() }; $prior = [ordered]@{ src = $e.src; name = $e.name }; Write-Output (''Disabled '' + $e.label + '' - moved to '' + $e.run.off) } elseif ($e.kind -eq ''task'') { $e.task | Disable-ScheduledTask | Out-Null; $prior = [ordered]@{ path = $e.path; name = $e.name }; Write-Output (''Disabled '' + $e.label) } else { $p = Get-ItemProperty -LiteralPath ($pfSvc + ''\'' + $e.name); $dl = [bool]($p.DelayedAutostart -eq 1); $null = & sc.exe config $e.name start= disabled; if ($LASTEXITCODE -ne 0) { throw (''sc.exe config failed with exit code '' + $LASTEXITCODE) }; $prior = [ordered]@{ name = $e.name; start = [int]$p.Start; delayed = $dl }; Write-Output (''Disabled '' + $e.label + '' - it was start type '' + [int]$p.Start + ''; takes effect at the next start of Windows, the service is not stopped now'') }; Write-Output (''PFJSON:'' + (ConvertTo-Json -Compress -Depth 5 -InputObject @{ undo = [ordered]@{ id = $id; prior = $prior } })) } catch { $pfFailed++; Write-Output (''FAILED: '' + $e.label + '' ('' + $_.Exception.Message + '')'') } }; if ($pfFailed) { Write-Output ($pfFailed.ToString() + '' item(s) could not be disabled.''); exit 1 }; exit 0'
    undo_command: '$pfUser = ''Registry::HKEY_CURRENT_USER''; if ($__pfUserHive) { $pfUser = $__pfUserHive }; $pfHk = ''Registry::HKEY_LOCAL_MACHINE\SOFTWARE''; $pfSvc = ''Registry::HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Services''; $pfRun = @(@{ src = ''hklm''; key = ($pfHk + ''\Microsoft\Windows\CurrentVersion\Run''); off = ($pfHk + ''\PortableFix\AutorunsDisabled\Run'') }, @{ src = ''hklm32''; key = ($pfHk + ''\WOW6432Node\Microsoft\Windows\CurrentVersion\Run''); off = ($pfHk + ''\PortableFix\AutorunsDisabled\Run32'') }, @{ src = ''user''; key = ($pfUser + ''\Software\Microsoft\Windows\CurrentVersion\Run''); off = ($pfUser + ''\Software\PortableFix\AutorunsDisabled\Run'') }); function pfH([string]$s) { $a = [Security.Cryptography.SHA256]::Create(); [BitConverter]::ToString($a.ComputeHash([Text.Encoding]::UTF8.GetBytes($s.ToLowerInvariant()))).Replace(''-'', '''').Substring(0, 12).ToLowerInvariant() }; function pfKey([string]$p, [bool]$w) { $s = $p.Substring(10); $i = $s.IndexOf(''\''); $h = $s.Substring(0, $i); $r = $s.Substring($i + 1); if ($h -eq ''HKEY_LOCAL_MACHINE'') { $b = [Microsoft.Win32.Registry]::LocalMachine } elseif ($h -eq ''HKEY_CURRENT_USER'') { $b = [Microsoft.Win32.Registry]::CurrentUser } elseif ($h -eq ''HKEY_USERS'') { $b = [Microsoft.Win32.Registry]::Users } else { throw (''unsupported hive '' + $h) }; if ($w) { return $b.CreateSubKey($r) }; return $b.OpenSubKey($r) }; if ($__pfItem.StartsWith(''run-'')) { $m = @{ hklm = $pfRun[0]; hklm32 = $pfRun[1]; user = $pfRun[2] }; $pr = $m[[string]$__pfPrior.src]; $n = [string]$__pfPrior.name; if (-not $pr -or $__pfItem -ne (''run-'' + (pfH ([string]$__pfPrior.src + ''|'' + $n)))) { throw ''the recorded entry does not match the item id'' }; $o = pfKey $pr.off $true; $r = pfKey $pr.key $true; try { if (-not (@($o.GetValueNames()) -contains $n)) { throw (''the disabled copy of '' + $n + '' is not in '' + $pr.off + '' any more'') }; if (@($r.GetValueNames()) -contains $n) { Write-Output (''Run value '' + $n + '' is already back - the disabled copy stays in '' + $pr.off) } else { $r.SetValue($n, $o.GetValue($n, $null, ''DoNotExpandEnvironmentNames''), $o.GetValueKind($n)); $o.DeleteValue($n); Write-Output (''Restored Run value '' + $n + '' ('' + $pr.src + '')'') } } finally { $o.Close(); $r.Close() } } elseif ($__pfItem.StartsWith(''task-'')) { $tp = [string]$__pfPrior.path; $tn = [string]$__pfPrior.name; if ($__pfItem -ne (''task-'' + (pfH ($tp + $tn)))) { throw ''the recorded entry does not match the item id'' }; $t = @(Get-ScheduledTask | Where-Object { $_.TaskPath -eq $tp -and $_.TaskName -eq $tn }); if (-not $t) { throw (''task '' + $tp + $tn + '' does not exist any more'') }; $t[0] | Enable-ScheduledTask | Out-Null; Write-Output (''Restored task '' + $tp + $tn + '': enabled'') } elseif ($__pfItem.StartsWith(''svc-'')) { $n = [string]$__pfPrior.name; if ($__pfItem -ne (''svc-'' + (pfH $n))) { throw ''the recorded entry does not match the item id'' }; $st = $__pfPrior.start; if ($st -isnot [int] -and $st -isnot [long]) { throw ''invalid recorded start type'' }; $arg = @{ 0 = ''boot''; 1 = ''system''; 2 = ''auto''; 3 = ''demand''; 4 = ''disabled'' }[[int]$st]; if (-not $arg) { throw ''invalid recorded start type'' }; if ([int]$st -eq 2 -and $__pfPrior.delayed -eq $true) { $arg = ''delayed-auto'' }; $null = & sc.exe config $n start= $arg; if ($LASTEXITCODE -ne 0) { throw (''sc.exe config failed with exit code '' + $LASTEXITCODE) }; Write-Output (''Restored service '' + $n + '' start type: '' + $arg) } else { throw ''unknown item kind'' }'
    description_sk: "Vypne položky autoštartu, ktoré vyberiete zo zoznamu: hodnoty Run (HKLM, WOW6432Node a používateľa, pri inom prihlásenom používateľovi jeho profil) presunie do kľúča PortableFix\\AutorunsDisabled vedľa nich, zapnuté naplánované úlohy mimo \\Microsoft\\ vypne a automaticky spúšťaným službám mimo priečinka Windows nastaví typ spustenia Zakázané (prejaví sa pri ďalšom štarte, služba sa teraz nezastaví). Nič nie je vybrané vopred. Pre každú vypnutú položku zapíše do undo.ps1 presný návrat - hodnotu Run vráti s pôvodným typom a obsahom, úlohu zapne a službe vráti pôvodný typ spustenia (aj oneskorený štart). RunOnce, priečinky Startup a položky Microsoftu nemení."
    description_en: "Disables the autostart entries you pick from a list: Run values (HKLM, WOW6432Node and the user's - the signed-in user's profile when it is someone else) are moved to a PortableFix\\AutorunsDisabled key next to them, enabled scheduled tasks outside \\Microsoft\\ are disabled, and automatic-start services outside the Windows folder are set to Disabled (effective at the next start - the service is not stopped now). Nothing is picked beforehand. For every entry disabled, undo.ps1 gets the exact way back - the Run value with its original type and data, the task enabled again, the service's original start type (delayed start included). RunOnce, Startup folders and Microsoft entries are left alone."
