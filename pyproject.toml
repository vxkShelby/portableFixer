[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-ra --strict-markers"
# pytest-timeout kills a hung test; faulthandler dumps every thread's stack
# 20 s earlier without killing, so the log shows where it hung even if the
# kill's own dump is lost.
timeout = 120
timeout_method = "thread"
faulthandler_timeout = 100
markers = [
    "frozen_e2e: self-update of a PyInstaller-built probe; needs PF_E2E_V1/PF_E2E_V2 (CI job frozen-update-e2e)",
    "real_preflight_probes: run the real Windows pre-flight probes instead of the healthy test defaults (tests/conftest.py)",
]
